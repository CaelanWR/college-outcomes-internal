    function chartInfoItems(id, title) {
      const text = `${id || ''} ${title || ''}`.toLowerCase();
      const items = [];
      if (chartUsesSalaryDollars(id, title)) {
        items.push(`${SALARY_DOLLAR_NOTE} Salary charts use Revelio compensation observations weighted by the selected profile/outcome weights.`);
      }
      if (/\bmajor|cip|program/.test(text)) {
        items.push('Majors and programs use IPEDS CIP taxonomy at the selected CIP level. The default 4-digit CIP view keeps related programs together while avoiding overly noisy 6-digit cells.');
      }
      if (/\bemployer|company|companies/.test(text)) {
        items.push('Employers use Revelio normalized employer names. Unknown employers are removed, and school-as-employer rows are excluded unless the school-employer toggle is on.');
      }
      if (/\brole|treemap/.test(text)) {
        items.push('Roles use Revelio role taxonomies: K50 for broad role families and K150 when drilling deeper into detailed roles.');
      }
      if (/\bindustry|treemap/.test(text)) {
        items.push('Industries use Revelio normalized industry taxonomy. Treemaps show share of weighted alumni in each industry, with color reflecting available pay data when present.');
      }
      if (/\bgeograph|city|location/.test(text)) {
        items.push('Geography comes from normalized location fields on profile positions. Shares use the current weighted alumni slice; salary-by-city uses salary observations in those locations.');
      }
      if (/\bdemographic|gender|race|ethnicity|female/.test(text)) {
        items.push('Demographics use Revelio profile-level predicted gender and race/ethnicity fields. Unknown or empty values are dropped, so displayed shares are normalized across known values.');
      }
      if (/\bfurther education|postgrad|degree|law|mba|phd|masters|doctorate/.test(text)) {
        items.push('Further education is inferred from later education records after the selected degree. Plus-One Masters means a bachelor graduate completed a master’s at the same school within one year. Feeder-school views show the prior observed bachelor institution for graduate-degree slices. Other degree labels use IPEDS-aware categories such as Masters, MBA, LAW, MD, Research Doctorate, and Professional Doctorate.');
      }
      if (/\bcoverage|ipeds/.test(text)) {
        items.push('Coverage compares weighted Revelio education completions with IPEDS completions for the same school, degree, major, and graduation-year slice where IPEDS is available.');
      }
      if (/\binternship/.test(text)) {
        items.push('Internship rate is calculated for classes of 2020-2025 from positions classified as internships before or near graduation. It is a profile signal, so unreported internships are not counted.');
      }
      if (/\bcurrent student|student demand/.test(text)) {
        items.push('Current-student views use active education rows and projected graduation years. They are not earnings outcomes and do not have post-graduation salary data.');
      }
      if (/\bseniority|career stage|progression|launchpad|superstar/.test(text)) {
        items.push('Career stage uses Revelio seniority signals from profile positions and is weighted to the current slice.');
        items.push('Seniority rollup: Entry = numeric seniority under 2 / Entry I-II; Associate = 2-<4 / Mid I-II; Management = 4-<6 / Senior I-II; Senior Leadership = 6+ / Manager, Director, Director+, and Executive bands.');
      }
      if (!items.length) {
        items.push('This chart uses the current school, degree, major, cohort, demographic, further-education, and employer filters. Counts and shares are based on the dashboard analysis weights.');
      }
      if (!items.some(item => /weight/i.test(item))) {
        items.push('Counts, shares, and comparisons use weighted Revelio profile data for the selected slice.');

    async function dataUrlToBlob(dataUrl) {
      if (!dataUrl || typeof dataUrl !== 'string') {
        throw new Error('Plotly returned an empty image payload');
      }
      const match = dataUrl.match(/^data:([^;,]+)?(;base64)?,(.*)$/);
      if (!match) {
        const response = await fetch(dataUrl);
        const blob = await response.blob();
        if (!blob.size) throw new Error('Exported PNG is empty');
        return blob;
      }
      const mimeType = match[1] || 'image/png';
      const payload = match[3] || '';
      const bytes = match[2]
        ? Uint8Array.from(atob(payload), char => char.charCodeAt(0))
        : new TextEncoder().encode(decodeURIComponent(payload));
      const blob = new Blob([bytes], { type: mimeType });
      if (!blob.size) throw new Error('Exported PNG is empty');
      return blob;
    }

    function showExportTray(item, note = '') {
      if (note) exportTrayNote = note;
      if (item) {
        exportLinks.unshift(item);
        while (exportLinks.length > 12) {
          const stale = exportLinks.pop();
          if (stale?.url) URL.revokeObjectURL(stale.url);
        }
      }
      const tray = $('export-tray');
      if (!tray) return;
      if (!exportLinks.length) {
        tray.hidden = true;
        return;
      }
      tray.hidden = false;
      tray.innerHTML = `
        <div class="export-tray-head">
          <h3>PNG export ready</h3>
          <button type="button" class="export-tray-close" aria-label="Close export links">x</button>
        </div>
        <p>${escapeHtml(exportTrayNote || 'Use these direct file links if the browser did not save automatically.')}</p>
        <div class="export-link-list">
          ${exportLinks.map(link => `
            <div class="export-link-row">
              <span title="${escapeHtml(link.title)}">${escapeHtml(link.title)}</span>
              <a href="${link.url}" download="${escapeHtml(link.filename)}">Save</a>
              <a href="${link.url}" target="_blank" rel="noopener">Open</a>
            </div>
          `).join('')}
        </div>
      `;
    }

    function addExportLink(blob, filename, title, note = '') {
      const url = URL.createObjectURL(blob);
      showExportTray({ url, filename, title }, note);
      return url;
    }

    function downloadBlob(blob, filename, title) {
      const url = addExportLink(blob, filename, title, 'Use Save or Open below if your browser blocked the automatic download.');
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    async function writeBlobToFileHandle(blob, handle) {
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
    }

    function pngPickerTypes() {
      return [{
        description: 'PNG image',
        accept: { 'image/png': ['.png'] },
      }];
    }

    async function pickSinglePngDestination(filename) {
      if (!window.showSaveFilePicker) return null;
      try {
        return {
          kind: 'file',
          handle: await window.showSaveFilePicker({
            suggestedName: filename,
            types: pngPickerTypes(),
          }),
        };
      } catch (error) {
        if (error?.name === 'AbortError') return { canceled: true };
        console.warn('Native file picker unavailable', error);
        return null;
      }
    }

    async function pickPngDirectoryDestination() {
      if (!window.showDirectoryPicker) return null;
      try {
        return {
          kind: 'directory',
          handle: await window.showDirectoryPicker({ mode: 'readwrite' }),
        };
      } catch (error) {
        if (error?.name === 'AbortError') return { canceled: true };
        console.warn('Native directory picker unavailable', error);
        return null;
      }
    }

    async function savePngBlob(blob, filename, title, destination = null) {
      if (destination?.kind === 'file') {
        await writeBlobToFileHandle(blob, destination.handle);
        addExportLink(blob, filename, title, 'Saved with the browser file picker. Direct links are also available below.');
        return 'saved';
      }
      if (destination?.kind === 'directory') {
        const fileHandle = await destination.handle.getFileHandle(filename, { create: true });
        await writeBlobToFileHandle(blob, fileHandle);
        addExportLink(blob, filename, title, 'Saved to the folder you selected. Direct links are also available below.');
        return 'saved';
      }
      downloadBlob(blob, filename, title);
      return 'downloaded';
    }

    async function openPngBlob(blob, filename, title) {
      const url = addExportLink(blob, filename, title, 'Opened in a browser tab. Direct Save/Open links are also available below.');
      const opened = window.open(url, '_blank', 'noopener');
      return opened ? 'opened' : 'blocked';
    }

    async function copyPngBlob(blob, filename, title) {
      if (!navigator.clipboard?.write || !window.ClipboardItem) {
        addExportLink(blob, filename, title, 'This browser cannot copy PNGs directly. Use Save or Open below.');
        return 'unsupported';
      }
      await navigator.clipboard.write([new ClipboardItem({ [blob.type || 'image/png']: blob })]);
      addExportLink(blob, filename, title, 'Copied PNG to clipboard. Direct Save/Open links are also available below.');
      return 'copied';
    }

    function appendExportText(svg, text, x, y, options = {}) {
      if (!text) return;
      const node = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      node.setAttribute('x', String(x));
      node.setAttribute('y', String(y));
      node.setAttribute('fill', options.fill || THEME.navy);
      node.setAttribute('font-size', String(options.size || 15));
      node.setAttribute('font-weight', String(options.weight || 700));
      node.textContent = text;
      svg.appendChild(node);
    }

    function exportHeaderHeight(header) {
      if (!header) return 0;
      return header.detail ? 88 : 68;
    }

    function exportFooterHeight(header) {
      return header?.footnote ? 28 : 0;
    }

    function sourceSvgViewBox(sourceSvg, fallbackWidth, fallbackHeight) {
      const viewBox = sourceSvg.getAttribute('viewBox');
      if (viewBox) return viewBox;
      const width = Number.parseFloat(sourceSvg.getAttribute('width')) || fallbackWidth;
      const height = Number.parseFloat(sourceSvg.getAttribute('height')) || fallbackHeight;
      return `0 0 ${width} ${height}`;
    }

    function exportChartDimensions(plot) {
      const rect = plot.getBoundingClientRect();
      const liveWidth = Number(rect.width) || 0;
      const liveHeight = Number(rect.height) || 0;
      const width = Math.round(Math.min(1500, Math.max(1180, liveWidth || 1180)));
      const height = Math.round(Math.min(860, Math.max(660, liveHeight || 660)));
      return { width, height };
    }

    function chartSvgBlob(plot, width, height, header) {
      const sourceSvgs = Array.from(plot.querySelectorAll('.svg-container svg.main-svg, svg.main-svg'));
      if (!sourceSvgs.length) throw new Error('No SVG chart layer found');
      const headerHeight = exportHeaderHeight(header);
      const footerHeight = exportFooterHeight(header);
      const exportHeight = height + headerHeight + footerHeight;
      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      svg.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
      svg.setAttribute('width', String(width));
      svg.setAttribute('height', String(exportHeight));
      svg.setAttribute('viewBox', `0 0 ${width} ${exportHeight}`);
      svg.setAttribute('style', 'background:#fff;font-family:Source Sans Pro,Source Sans 3,Arial,sans-serif;');
      const style = document.createElementNS('http://www.w3.org/2000/svg', 'style');
      style.textContent = `
        text { font-family: "Source Sans Pro", "Source Sans 3", Arial, sans-serif; }
        .xtick text, .ytick text, .ztick text, .legendtext, .gtitle, .annotation-text,
        .bartext, .textpoint, .pielabel, .cbtitle, .colorbar text { fill: #2D426A; }
        .slicetext { fill: #fff; font-weight: 800; }
      `;
      const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      bg.setAttribute('x', '0');
      bg.setAttribute('y', '0');
      bg.setAttribute('width', String(width));
      bg.setAttribute('height', String(exportHeight));
      bg.setAttribute('fill', '#fff');
      svg.appendChild(style);
      svg.appendChild(bg);
      if (header) {
        appendExportText(svg, trimExportText(header.title, 88), 28, 31, { size: 23, weight: 900 });
        appendExportText(svg, trimExportText(header.school, 120), 28, 57, { size: 15, weight: 800, fill: THEME.navyMid });
        if (header.detail) appendExportText(svg, trimExportText(header.detail, 130), 28, 77, { size: 13, weight: 700, fill: THEME.muted });
        const rule = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        rule.setAttribute('x1', '28');
        rule.setAttribute('x2', String(width - 28));
        rule.setAttribute('y1', String(headerHeight - 8));
        rule.setAttribute('y2', String(headerHeight - 8));
        rule.setAttribute('stroke', THEME.border);
        rule.setAttribute('stroke-width', '1');
        svg.appendChild(rule);
      }
      sourceSvgs.forEach(sourceSvg => {
        const layer = sourceSvg.cloneNode(true);
        layer.setAttribute('x', '0');
        layer.setAttribute('y', String(headerHeight));
        layer.setAttribute('width', String(width));
        layer.setAttribute('height', String(height));
        layer.setAttribute('viewBox', sourceSvgViewBox(sourceSvg, width, height));
        layer.setAttribute('overflow', 'visible');
        layer.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        layer.removeAttribute('style');
        svg.appendChild(layer);
      });
      if (header?.footnote) {
        const y = headerHeight + height + 19;
        const rule = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        rule.setAttribute('x1', '28');
        rule.setAttribute('x2', String(width - 28));
        rule.setAttribute('y1', String(headerHeight + height + 1));
        rule.setAttribute('y2', String(headerHeight + height + 1));
        rule.setAttribute('stroke', '#edf2f7');
        rule.setAttribute('stroke-width', '1');
        svg.appendChild(rule);
        appendExportText(svg, trimExportText(header.footnote, 150), 28, y, { size: 11, weight: 700, fill: '#6b7c93' });
      }
      const serialized = new XMLSerializer().serializeToString(svg);
      return new Blob([`<?xml version="1.0" encoding="UTF-8"?>\n${serialized}`], {
        type: 'image/svg+xml;charset=utf-8',
      });
    }

    async function svgBlobToPngBlob(svgBlob, width, height) {
      const url = URL.createObjectURL(svgBlob);
      try {
        const image = new Image();
        await new Promise((resolve, reject) => {
          image.onload = resolve;
          image.onerror = () => reject(new Error('Could not rasterize chart SVG'));
          image.src = url;
        });
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = width * scale;
        canvas.height = height * scale;
        const context = canvas.getContext('2d');
        context.fillStyle = '#fff';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.scale(scale, scale);
        context.drawImage(image, 0, 0, width, height);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        if (!blob?.size) throw new Error('Canvas produced an empty PNG');
        return blob;
      } finally {
        URL.revokeObjectURL(url);
      }
    }

    function clonePlain(value) {
      try {
        return structuredClone(value);
      } catch {
        return JSON.parse(JSON.stringify(value || {}));
      }
    }

    async function pngHasVisibleInk(blob) {
      if (!window.createImageBitmap) return true;
      const bitmap = await createImageBitmap(blob);
      const canvas = document.createElement('canvas');
      canvas.width = Math.min(220, bitmap.width);
      canvas.height = Math.min(160, bitmap.height);
      const context = canvas.getContext('2d', { willReadFrequently: true });
      context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close?.();
      const pixels = context.getImageData(0, 0, canvas.width, canvas.height).data;
      let ink = 0;
      for (let i = 0; i < pixels.length; i += 16) {
        const alpha = pixels[i + 3];
        const distanceFromWhite = Math.abs(255 - pixels[i]) + Math.abs(255 - pixels[i + 1]) + Math.abs(255 - pixels[i + 2]);
        if (alpha > 20 && distanceFromWhite > 28) {
          ink += 1;
          if (ink > 40) return true;
        }
      }
      return false;
    }

    async function exportPlotCloneToPng(plot, width, height) {
      const exportNode = document.createElement('div');
      exportNode.style.cssText = [
        'position: fixed',
        'left: -12000px',
        'top: 0',
        `width: ${width}px`,
        `height: ${height}px`,
        'background: #fff',
        'pointer-events: none',
        'z-index: -1',
      ].join(';');
      document.body.appendChild(exportNode);
      try {
        const data = clonePlain(plot.data || []);
        const layout = {
          ...clonePlain(plot.layout || {}),
          width,
          height,
          autosize: false,
          paper_bgcolor: '#fff',
          plot_bgcolor: plot.layout?.plot_bgcolor || 'rgba(0,0,0,0)',
        };
        await Plotly.newPlot(exportNode, data, layout, {
          ...plotConfig,
          responsive: false,
          staticPlot: true,
        });
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const dataUrl = await Plotly.toImage(exportNode, {
          format: 'png',
          width,
          height,
          scale: 2,
        });
        return await dataUrlToBlob(dataUrl);
      } finally {
        try {
          Plotly.purge(exportNode);
        } catch {}
        exportNode.remove();
      }
    }

    async function exportPlotCloneSvgBlob(plot, width, height, header) {
      const exportNode = document.createElement('div');
      exportNode.style.cssText = [
        'position: fixed',
        'left: -12000px',
        'top: 0',
        `width: ${width}px`,
        `height: ${height}px`,
        'background: #fff',
        'pointer-events: none',
        'z-index: -1',
      ].join(';');
      document.body.appendChild(exportNode);
      try {
        const data = clonePlain(plot.data || []);
        const layout = {
          ...clonePlain(plot.layout || {}),
          width,
          height,
          autosize: false,
          paper_bgcolor: '#fff',
          plot_bgcolor: plot.layout?.plot_bgcolor || 'rgba(0,0,0,0)',
        };
        layout.margin = {
          ...clonePlain(plot.layout?.margin || {}),
          r: Math.max(28, Number(plot.layout?.margin?.r || 28)),
        };
        await Plotly.newPlot(exportNode, data, layout, {
          ...plotConfig,
          responsive: false,
          staticPlot: true,
        });
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        return chartSvgBlob(exportNode, width, height, header);
      } finally {
        try {
          Plotly.purge(exportNode);
        } catch {}
        exportNode.remove();
      }
    }

    async function chartPngBlob(chartId) {
      const plot = $(chartId);
      if (!plot || !plot._fullLayout) return null;
      const title = chartExportTitle(chartId);
      const filename = chartExportFilename(chartId);
      const { width, height } = exportChartDimensions(plot);
      const header = exportHeaderLines(chartId);
      const exportHeight = height + exportHeaderHeight(header) + exportFooterHeight(header);
      let blob = null;
      try {
        const svgBlob = await exportPlotCloneSvgBlob(plot, width, height, header);
        blob = await svgBlobToPngBlob(svgBlob, width, exportHeight);
      } catch (error) {
        console.warn('Isolated SVG chart export failed; falling back to live SVG export', error);
        try {
          blob = await svgBlobToPngBlob(chartSvgBlob(plot, width, height, header), width, exportHeight);
        } catch (fallbackError) {
          console.warn('Live SVG chart export failed; falling back to Plotly PNG export', fallbackError);
          blob = await exportPlotCloneToPng(plot, width, height);
        }
      }
      if (blob.size < 2048) {
        throw new Error(`Exported PNG is unexpectedly small (${blob.size} bytes)`);
      }
      if (!(await pngHasVisibleInk(blob))) {
        throw new Error('Exported PNG appears blank');
      }
      return { blob, filename, title };
    }

    async function downloadChart(chartId, mode = 'save') {
      const plot = $(chartId);
      if (!plot || !plot._fullLayout) {
        setStatus('bad', 'No chart available to export');
        return;
      }
      const button = Array.from(document.querySelectorAll('[data-save-chart-menu]'))
        .find(node => node.dataset.saveChartMenu === chartId);
      try {
        if (button) {
          button.disabled = true;
          button.textContent = 'Preparing';
        }
        const exportFile = await chartPngBlob(chartId);
        if (!exportFile) throw new Error('Chart is not ready');
        let result = 'downloaded';
        if (mode === 'open') {
          result = await openPngBlob(exportFile.blob, exportFile.filename, exportFile.title);
        } else if (mode === 'copy') {
          result = await copyPngBlob(exportFile.blob, exportFile.filename, exportFile.title);
        } else {
          result = await savePngBlob(exportFile.blob, exportFile.filename, exportFile.title);
        }
        const label = {
          copied: 'Copied',
          opened: 'Opened',
          saved: 'Saved',
          blocked: 'PNG ready',
          unsupported: 'PNG ready',
        }[result] || 'PNG ready';
        setStatus('ok', `${label}: ${exportFile.title}`);
      } catch (error) {
        console.error('PNG export failed', error);
        setStatus('bad', `PNG export failed for ${chartExportTitle(chartId)}`);
      } finally {
        if (button) {
          button.disabled = false;
          button.textContent = 'Save As';
        }
      }
    }

    async function downloadVisibleCharts() {
      const chartIds = Array.from(document.querySelectorAll('[data-download-chart]:not([hidden])'))
        .map(button => button.dataset.downloadChart)
        .filter((value, index, list) => value && list.indexOf(value) === index && $(value)?._fullLayout);
      if (!chartIds.length) {
        setStatus('bad', 'No visible charts to export');
        return;
      }
      setStatus('ok', `Preparing ${chartIds.length} PNGs...`);
      let saved = 0;
      for (const chartId of chartIds) {
        try {
          const exportFile = await chartPngBlob(chartId);
          if (!exportFile) continue;
          await savePngBlob(exportFile.blob, exportFile.filename, exportFile.title);
          saved += 1;
        } catch (error) {
          console.error('PNG export failed', chartId, error);
        }
        await new Promise(resolve => setTimeout(resolve, 180));
      }
      setStatus(saved ? 'ok' : 'bad', saved ? `Prepared ${saved} PNGs. Use the export tray if downloads are blocked.` : 'PNG export failed');
    }

    function isNoiseLabel(value) {
      if (value === null || value === undefined) return true;
      const text = String(value).trim().toLowerCase();
      return !text || text === 'unknown' || text === 'other' || text === 'empty';
    }

    function sumRows(rows, field) {
      return (rows || []).reduce((total, row) => total + Number(row[field] || 0), 0);
    }

    function samePath(a = [], b = []) {
      return a.length === b.length && a.every((value, idx) => String(value) === String(b[idx]));
    }

    function hierarchyTrail(path) {
      return (path || []).length ? path.join(' > ') : 'Top level';
    }

    function drillBack(kind) {
      if (kind === 'roleTree') state.roleTreePath = state.roleTreePath.slice(0, -1);
      if (kind === 'industryTree') state.industryTreePath = state.industryTreePath.slice(0, -1);
      if (kind === 'destinationLeft') {
        state.destinationLeftPath = state.destinationLeftPath.slice(0, -1);

        return;
      }
      if (kind === 'destinationRight') {

        return;
      }
      renderDestinations();
    }

    function hexToRgb(hex) {
      const normalized = String(hex || '').replace('#', '').trim();
      if (normalized.length !== 6) return [185, 196, 211];
      return [
        parseInt(normalized.slice(0, 2), 16),
        parseInt(normalized.slice(2, 4), 16),
        parseInt(normalized.slice(4, 6), 16),
      ];
    }

    function rgbToHex(rgb) {
      return `#${rgb.map(value => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0')).join('')}`;
    }

    function mixHex(a, b, t) {
      const rgbA = hexToRgb(a);
      const rgbB = hexToRgb(b);
      return rgbToHex(rgbA.map((value, idx) => value + ((rgbB[idx] - value) * t)));
    }

    function payColor(avgPay, domain) {
      if (!Array.isArray(domain) || domain.length !== 2 || !Number.isFinite(avgPay)) return '#B9C4D3';
      const [minPay, maxPay] = domain;
      if (!Number.isFinite(minPay) || !Number.isFinite(maxPay) || maxPay <= minPay) return '#48AFF4';
      const scaled = Math.max(0, Math.min(1, (avgPay - minPay) / (maxPay - minPay)));
      if (scaled <= 0.5) return mixHex('#D9ECFB', '#48AFF4', scaled / 0.5);
      return mixHex('#48AFF4', '#2D426A', (scaled - 0.5) / 0.5);
    }

    function updateTreemapLegend(id, domain) {
      const wrap = $(`${id}-legend`);
      const minEl = $(`${id}-legend-min`);
      const maxEl = $(`${id}-legend-max`);
      const captionEl = $(`${id}-legend-caption`);
      if (!wrap || !minEl || !maxEl || !captionEl) return;
      if (!Array.isArray(domain) || domain.length !== 2 || !Number.isFinite(domain[0]) || !Number.isFinite(domain[1]) || domain[1] <= domain[0]) {
        wrap.classList.add('is-hidden');
        return;
      }
      wrap.classList.remove('is-hidden');
      minEl.textContent = money(domain[0]);
      maxEl.textContent = money(domain[1]);
      captionEl.textContent = 'Color encodes mean pay for the visible tiles.';
    }

    function treemapPayDomain(nodes) {
      const salaryValues = (nodes || [])
        .filter(row => !row.isOther)
        .map(row => row.median_salary)
        .filter(value => value !== null && value !== undefined && Number.isFinite(Number(value)))
        .map(Number);
      if (salaryValues.length < 2) return null;
      const cmin = Math.min(...salaryValues);
      const cmax = Math.max(...salaryValues);
      return cmax > cmin ? [cmin, cmax] : null;
    }

    function filterRowsByHierarchyPath(rows, levels, path) {
      return (rows || []).filter(row => (path || []).every((value, idx) => String(row[levels[idx]] || '') === String(value)));
    }

    function visibleHierarchyRows(rows, levels, path, chartId = null) {
      const filtered = filterRowsByHierarchyPath(rows, levels, path);
      if ((path || []).length >= levels.length) {
        const label = (path || [])[levels.length - 1];
        if (isNoiseLabel(label) || !filtered.length) return [];
        const salaryWeight = sumRows(filtered, 'salary_weight');
        const salarySum = sumRows(filtered, 'salary_sum');
        return [{
          label,
          value: sumRows(filtered, 'n'),
          salaryWeight,
          salarySum,
          median_salary: salaryWeight > 0 ? salarySum / salaryWeight : null,
          drillable: false,
          selected: true,
        }];
      }
      const levelField = levels[(path || []).length];
      const nextField = levels[(path || []).length + 1];
      const groups = new Map();
      filtered.forEach(row => {
        const label = row[levelField];
        if (isNoiseLabel(label)) return;
        if (!groups.has(label)) {
          groups.set(label, { label, value: 0, salaryWeight: 0, salarySum: 0, drillable: false });
        }
        const group = groups.get(label);
        group.value += Number(row.n || 0);
        group.salaryWeight += Number(row.salary_weight || 0);
        group.salarySum += Number(row.salary_sum || 0);
        if (nextField && !isNoiseLabel(row[nextField]) && String(row[nextField]) !== String(label)) {
          group.drillable = true;
        }
      });
      const limit = topNFor(chartId);
      const ranked = [...groups.values()]
        .map(row => ({
          ...row,
          median_salary: row.salaryWeight > 0 ? row.salarySum / row.salaryWeight : null,
        }))
        .sort((a, b) => b.value - a.value);
      const visible = ranked.slice(0, limit);
      return visible;
    }

    function ensureVisibleHierarchyPath(rows, levels, path, chartId = null) {
      const next = [...(path || [])];
      while (next.length && !visibleHierarchyRows(rows, levels, next, chartId).length) next.pop();
      return next;
    }

    function compareDestinationRows(type, trend = false) {
      const prefix = state.selectionMode === 'major_compare' ? 'major' : 'school';
      if (type === 'employers') return state.data[`${prefix}_employer_${trend ? 'trend_' : ''}comparison`] || [];
      const rolePayload = state.data[`${prefix}_role_${trend ? 'trend_' : ''}comparison`] || {};
      if (type === 'industries') return rolePayload.industries || [];
      return rolePayload.roles || [];
    }

    function destinationCompareChartConfig(type, trend = false) {
      const entity = compareEntityLabel();
      const typeConfig = destinationTypeConfig(type);
      const label = typeConfig.label;
      const singular = { roles: 'Role', employers: 'Employer', industries: 'Industry' }[type] || label;
      const chartSlug = type === 'employers' ? 'employer' : (type === 'industries' ? 'industry' : 'role');
      return {
        id: `compare-destination-${chartSlug}${trend ? '-trend' : ''}`,
        title: trend ? `${label} by ${entity} Over Time` : `${label} Mix by ${entity}`,
        yTitle: singular,
        labelTransform: value => legendLabel(value, type === 'employers' ? 34 : 30),
        onClick: type === 'employers'
          ? point => openEmployerComparisonDrilldown(point)
          : point => openRoleIndustryComparisonDrilldown({
            ...point,
            kind: type === 'industries' ? 'industry' : 'role',
            chartId: `compare-destination-${chartSlug}`,
          }),
      };
    }

    function renderCompareDestinations() {
      const trend = state.viewMode === 'overtime';
      const leftType = state.destinationLeftType || 'roles';
      const rightType = state.destinationRightType || 'employers';
      const configs = [leftType, rightType].map(type => destinationCompareChartConfig(type, trend));
      $('content').innerHTML = [
        destinationToolbar(),
        ...configs.map(config => card(config.title, config.id, 6, true, { topControl: true })),
      ].join('');
      [leftType, rightType].forEach((type, idx) => {
        const config = configs[idx];
        const rows = compareDestinationRows(type, trend);
        if (trend) {
          drawCompareYearHeatmap(config.id, rows, {
            labelTransform: config.labelTransform,
            yTitle: config.yTitle,
          });
          return;
        }
        const drawOptions = {
          yTitle: config.yTitle,
          labelTransform: config.labelTransform,
          hoverLabel: `${config.yTitle} share`,
        };
        if (config.onClick) drawOptions.onClick = config.onClick;
        if (state.selectionMode === 'major_compare') drawMajorComparisonHeatmap(config.id, rows, drawOptions);
        else drawSchoolComparisonHeatmap(config.id, rows, drawOptions);
      });
    }

      const previousEmployer = state.selectedEmployer;
      const previousRole = state.selectedEmployerRole;
      state.selectedEmployer = employer;
      state.selectedEmployerRole = role;
      setChartLoading(chartId, role ? 'Loading detailed roles...' : 'Loading top roles...');
      try {
        const filters = dashboardFiltersForCurrentView({
          active_tab: 'employers',
          view_mode: state.viewMode || 'snapshot',
          selected_employer: employer,
          selected_employer_role: role,
          top_n: REQUEST_TOP_N,
        });
        const data = await fetchDashboard(filters);
        state.data = {
          ...state.data,
          ...data,
          employers: data.employers || state.data.employers,
          employer_trend: data.employer_trend || state.data.employer_trend,
          meta: data.meta || state.data.meta,
        };
        renderEmployers();
        setStatus('ok', `${state.data.meta?.data_version || 'Connected'} | employer detail loaded`);
      } catch (error) {
        state.selectedEmployer = previousEmployer;
        state.selectedEmployerRole = previousRole;
        renderEmployers();
        setStatus('bad', 'Employer detail failed');
        const node = $(chartId);
        if (node) node.innerHTML = `<div class="empty">Could not load employer detail.<br>${escapeHtml(error.message)}</div>`;
      }
    }

    function renderCareer() {
      const career = state.data.career || {};
      const mobility = career.mobility || {};
      const internshipSummary = career.internships?.summary || {};
      const internshipWindowLabel = internshipSummary.rate_window
        ? `classes of ${internshipSummary.rate_window}`
        : 'recent classes';
      const internshipRateTitle = `Internship Rate (${internshipWindowLabel})`;
      const comparing = state.selectionMode === 'compare' || state.selectionMode === 'major_compare';
      const metrics = comparing ? [] : [
        metric(internshipRateTitle, pct(internshipSummary.internship_rate_pct), 3),
        metric('Avg employers by 5 yrs', mobility.avg_employers_5yr ?? '—', 3),
        metric('First employer retention 5 yrs', pct(mobility.first_employer_retention_5yr_pct), 3),
        metric('Superstar paths', num((career.superstars || []).length), 3),
      ];
      if (state.viewMode === 'overtime') {
        $('content').innerHTML = [
          ...metrics,
          card('Earnings Over the First 15 Years', 'career-earnings', 6, true),
          card(comparing ? 'Average Career Stage by Years Since Graduation' : 'Career Stage by Years Since Graduation', 'career-seniority', 6, true),
          ...(comparing ? [] : [
            card('Employer Share by Years After Graduation', 'career-employer-share', 12, true, { topControl: true }),
          ]),
          ...(comparing ? [
            card(`${internshipRateTitle} Comparison`, 'career-internship-rates', 5, true, { topControl: true }),
            card('Recent Top Internship Companies by Comparison', 'career-internship-employers', 7, true, { topControl: true }),
          ] : []),
        ].join('');
        drawCareerEarnings('career-earnings');
        if (comparing) drawCareerAverageSeniority('career-seniority');
        else drawCareerSeniority('career-seniority');
        if (!comparing) drawCareerEmployerShare('career-employer-share');
        if (comparing) {
          drawCareerInternshipRates('career-internship-rates');
          drawCareerInternshipEmployers('career-internship-employers');
        }
      } else {
        $('content').innerHTML = [
          ...metrics,
          ...(comparing ? [
            card(`${internshipRateTitle} Comparison`, 'career-internship-rates', 5, true, { topControl: true }),
            card('Recent Top Internship Companies by Comparison', 'career-internship-employers', 7, true, { topControl: true }),
          ] : [
            card('Employer Pay and Progression', 'career-employer-tenure', 6, true, { topControl: true }),
            card('Superstar Alumni Paths', 'career-superstars', 6, false, { topControl: true, export: false }),
            card('Internships That Became Jobs', 'career-internships', 12, false, { topControl: true, export: false }),
          ]),
        ].join('');
        if (comparing) {
          drawCareerInternshipRates('career-internship-rates');
          drawCareerInternshipEmployers('career-internship-employers');
        } else {
          drawCareerEmployerTenure('career-employer-tenure');
          drawCareerSuperstars('career-superstars');
          drawCareerInternships('career-internships');
        }
      }
    }

    function drawCareerEarnings(id) {
      const rows = state.data.career?.earnings || [];
      if (!rows.length) return noData(id);
      const seriesNames = [...new Set(rows.map(row => row.series || 'Selected slice'))];
      const traces = [];
      if (seriesNames.length === 1) {
        const slice = rows.filter(row => (row.series || 'Selected slice') === seriesNames[0]);
        traces.push({
          type: 'scatter',
          mode: 'lines',
          name: 'P75',
          x: slice.map(row => row.years_since_grad),
          y: slice.map(row => row.p75_salary),
          line: { color: 'rgba(45, 66, 106, 0)', width: 0 },
          hoverinfo: 'skip',
          showlegend: false,
        });
        traces.push({
          type: 'scatter',
          mode: 'lines',
          name: 'P25-P75 range',
          x: slice.map(row => row.years_since_grad),
          y: slice.map(row => row.p25_salary),
          fill: 'tonexty',
          fillcolor: 'rgba(72, 175, 244, 0.18)',
          line: { color: 'rgba(45, 66, 106, 0)', width: 0 },
          hoverinfo: 'skip',
        });
        traces.push({
          type: 'scatter',
          mode: 'lines+markers',
          name: 'Median salary',
          x: slice.map(row => row.years_since_grad),
          y: slice.map(row => row.median_salary),
          customdata: slice.map(row => [row.n_alumni, row.salary_obs, row.p25_salary, row.p75_salary]),
          line: { color: COLORS[0], width: 4 },
          marker: { size: 7, color: COLORS[0] },
          hovertemplate: 'Year %{x}<br>Median %{y:$,.0f}<br>P25 %{customdata[2]:$,.0f}<br>P75 %{customdata[3]:$,.0f}<extra></extra>',
        });
      } else {
        seriesNames.forEach((series, i) => {
          const slice = rows.filter(row => (row.series || 'Selected slice') === series);
          traces.push({
            type: 'scatter',
            mode: 'lines+markers',
            name: legendLabel(series, 32),
            x: slice.map(row => row.years_since_grad),
            y: slice.map(row => row.median_salary),
            customdata: slice.map(row => [series, row.n_alumni, row.salary_obs]),
            line: { color: COLORS[i % COLORS.length], width: 3 },
            marker: { size: 6, color: COLORS[i % COLORS.length] },
            hovertemplate: '%{customdata[0]}<br>Year %{x}<br>Median %{y:$,.0f}<extra></extra>',
          });
        });
      }
      Plotly.newPlot(id, traces, {
        ...layoutBase,
        xaxis: { title: 'Years after graduation', dtick: 1, automargin: true, range: [-0.3, 15.3] },
        yaxis: { title: 'Median salary', tickprefix: '$', tickformat: ',', automargin: true, rangemode: 'tozero' },
        legend: { orientation: 'h', y: 1.12, itemwidth: 30 },
      }, plotConfig);
    }

    function drawEarlyCareerEarnings(id) {
      const rows = state.data.career?.earnings || [];
      const years = [1, 3, 5];
      const filtered = rows.filter(row => years.includes(Number(row.years_since_grad)) && row.median_salary !== null && row.median_salary !== undefined);
      if (!filtered.length) return noData(id);
      const seriesNames = [...new Set(filtered.map(row => row.series || 'Selected slice'))];
      const traces = [];
      if (seriesNames.length === 1) {
        const slice = years
          .map(year => filtered.find(row => Number(row.years_since_grad) === year))
          .filter(Boolean);
        traces.push({
          type: 'bar',
          name: 'Median salary',
          x: slice.map(row => `${row.years_since_grad} yr`),
          y: slice.map(row => row.median_salary),
          text: slice.map(row => money(row.median_salary)),
          textposition: 'outside',
          cliponaxis: false,
          customdata: slice.map(row => [row.p25_salary, row.p75_salary, row.salary_obs]),
          marker: { color: COLORS[0], opacity: 0.88 },
          error_y: {
            type: 'data',
            symmetric: false,
            array: slice.map(row => Math.max(0, Number(row.p75_salary || row.median_salary) - Number(row.median_salary || 0))),
            arrayminus: slice.map(row => Math.max(0, Number(row.median_salary || 0) - Number(row.p25_salary || row.median_salary))),
            color: 'rgba(45,66,106,0.38)',
            thickness: 1.3,
            width: 4,
          },
          hovertemplate: '%{x} after graduation<br>Median %{y:$,.0f}<br>P25 %{customdata[0]:$,.0f}<br>P75 %{customdata[1]:$,.0f}<extra></extra>',
        });
      } else {
        seriesNames.forEach((series, i) => {
          const slice = years
            .map(year => filtered.find(row => (row.series || 'Selected slice') === series && Number(row.years_since_grad) === year))
            .filter(Boolean);
          traces.push({
            type: 'scatter',
            mode: 'lines+markers',
            name: legendLabel(series, 28),
            x: slice.map(row => row.years_since_grad),
            y: slice.map(row => row.median_salary),
            customdata: slice.map(row => [series, row.salary_obs]),
            line: { color: COLORS[i % COLORS.length], width: 3 },
            marker: { size: 8, color: COLORS[i % COLORS.length] },
            hovertemplate: '%{customdata[0]}<br>%{x} years after graduation<br>Median %{y:$,.0f}<extra></extra>',
          });
        });
      }
      Plotly.newPlot(id, traces, {
        ...layoutBase,
        margin: { ...layoutBase.margin, l: 72, r: 38, t: 20, b: 58 },
        xaxis: seriesNames.length === 1
          ? { title: 'Years after graduation', automargin: true }
          : { title: 'Years after graduation', automargin: true, tickmode: 'array', tickvals: years, ticktext: years.map(year => `${year} yr`) },
        yaxis: { title: 'Median salary', tickprefix: '$', tickformat: '~s', automargin: true, rangemode: 'tozero' },
        legend: { orientation: 'h', y: 1.12, itemwidth: 30 },
      }, plotConfig);
    }

    function drawCareerSeniority(id) {
      const rows = state.data.career?.seniority || [];
      if (!rows.length) return noData(id);
      const years = [...new Set(rows.map(row => row.years_since_grad))].sort((a, b) => a - b);
      const stageOrder = label => ({
        'Entry level': 1,
        'Associate level': 2,
        'Mid level': 3,
        'Senior level': 4,
      }[label] || 9);
      const careerStageLabel = label => ({
        'Entry level': 'Entry',
        'Associate level': 'Associate',
        'Mid level': 'Management',
        'Senior level': 'Senior Leadership',
      }[label] || label || 'Other');
      const bands = [...new Set(rows.map(row => row.seniority_band))].sort((a, b) => stageOrder(a) - stageOrder(b));
      const traces = bands.map((band, i) => {
        const byYear = new Map(rows.filter(row => row.seniority_band === band).map(row => [row.years_since_grad, row]));
        return {
          type: 'bar',
          name: careerStageLabel(band),
          x: years,
          y: years.map(year => Number(byYear.get(year)?.share_pct || 0)),
          marker: { color: COLORS[i % COLORS.length] },
          customdata: years.map(year => [careerStageLabel(band), byYear.get(year)?.n_alumni || 0, byYear.get(year)?.mean_salary || null]),
          hovertemplate: '%{customdata[0]}<br>%{x} years after graduation<br>%{y:.1f}%<extra></extra>',
        };
      });
      Plotly.newPlot(id, traces, {
        ...layoutBase,
        barmode: 'stack',
        xaxis: { title: 'Years after graduation', dtick: 1, automargin: true },
        yaxis: { title: 'Share of alumni by career stage', ticksuffix: '%', range: [0, 100], automargin: true },
        legend: { orientation: 'h', y: 1.12, itemwidth: 30 },
      }, plotConfig);
    }

    function drawCareerAverageSeniority(id) {
      const rows = (state.data.career?.average_seniority || [])
        .filter(row => Number.isFinite(Number(row.years_since_grad)) && Number.isFinite(Number(row.avg_seniority)));
      if (!rows.length) return noData(id);
      const seriesNames = [...new Set(rows.map(row => row.series || 'Selected slice'))];
      const stageForScore = value => {
        const score = Number(value);
        if (!Number.isFinite(score)) return '';
        if (score < 1.5) return 'Entry';
        if (score < 2.5) return 'Associate';
        if (score < 3.5) return 'Management';
        return 'Senior Leadership';
      };
      const traces = seriesNames.map((series, i) => {
        const slice = rows
          .filter(row => (row.series || 'Selected slice') === series)
          .sort((a, b) => Number(a.years_since_grad) - Number(b.years_since_grad));
        const legendgroup = `${id}-seniority-${i}`;
        return {
          type: 'scatter',
          mode: 'lines+markers',
          name: legendLabel(series, 32),
          legendgroup,
          showlegend: false,
          x: slice.map(row => row.years_since_grad),
          y: slice.map(row => row.avg_seniority),
          customdata: slice.map(row => [series, row.n_alumni, stageForScore(row.avg_seniority), row.raw_avg_seniority]),
          line: { color: COLORS[i % COLORS.length], width: 3.5 },
          marker: { color: COLORS[i % COLORS.length], size: 6 },
          hovertemplate: '%{customdata[0]}<br>%{x} years after graduation<br>%{customdata[2]} average stage<extra></extra>',
        };
      });
      const legendTraces = seriesNames.map((series, i) => legendDotTrace(series, COLORS[i % COLORS.length], `${id}-seniority-${i}`));
      Plotly.newPlot(id, [...traces, ...legendTraces], {
        ...layoutBase,
        height: 420,
        margin: { ...layoutBase.margin, l: 78, r: 32, t: 22, b: 70 },
        xaxis: { title: 'Years after graduation', dtick: 1, automargin: true, range: [-0.3, 15.3] },
        yaxis: {
          title: 'Average career stage',
          tickmode: 'array',
          tickvals: [1, 2, 3, 4],
          ticktext: ['Entry', 'Associate', 'Management', 'Senior Leadership'],
          automargin: true,
          range: [0.65, 4.35],
        },
        shapes: [
          { type: 'rect', xref: 'paper', x0: 0, x1: 1, yref: 'y', y0: 0.65, y1: 1.5, fillcolor: 'rgba(93, 159, 213, 0.08)', line: { width: 0 }, layer: 'below' },
          { type: 'rect', xref: 'paper', x0: 0, x1: 1, yref: 'y', y0: 1.5, y1: 2.5, fillcolor: 'rgba(72, 169, 112, 0.08)', line: { width: 0 }, layer: 'below' },
          { type: 'rect', xref: 'paper', x0: 0, x1: 1, yref: 'y', y0: 2.5, y1: 3.5, fillcolor: 'rgba(139, 111, 214, 0.08)', line: { width: 0 }, layer: 'below' },
          { type: 'rect', xref: 'paper', x0: 0, x1: 1, yref: 'y', y0: 3.5, y1: 4.35, fillcolor: 'rgba(237, 125, 49, 0.08)', line: { width: 0 }, layer: 'below' },
          { type: 'line', xref: 'paper', x0: 0, x1: 1, yref: 'y', y0: 1.5, y1: 1.5, line: { color: 'rgba(45, 66, 106, 0.18)', width: 1, dash: 'dot' }, layer: 'below' },
          { type: 'line', xref: 'paper', x0: 0, x1: 1, yref: 'y', y0: 2.5, y1: 2.5, line: { color: 'rgba(45, 66, 106, 0.18)', width: 1, dash: 'dot' }, layer: 'below' },
          { type: 'line', xref: 'paper', x0: 0, x1: 1, yref: 'y', y0: 3.5, y1: 3.5, line: { color: 'rgba(45, 66, 106, 0.18)', width: 1, dash: 'dot' }, layer: 'below' },
        ],
        legend: { orientation: 'h', y: 1.16, x: 0, itemwidth: 30 },
      }, plotConfig).then(plot => bindLegendGroupToggles(plot));
    }

    function drawCareerEmployerTenure(id) {
      const rows = (state.data.career?.employer_tenure || []).slice(0, topNFor(id));
      if (!rows.length) return noData(id);
      Plotly.newPlot(id, [{
        type: 'scatter',
        mode: 'markers+text',
        x: rows.map(row => row.retained_5yr_pct),
        y: rows.map(row => row.avg_salary_5yr),
        text: rows.map(row => legendLabel(row.employer, 18)),
        textposition: 'top center',
        marker: {
          size: rows.map(row => Math.max(14, Math.min(42, Math.sqrt(Number(row.n_starters || 0)) * 1.5))),
          color: rows.map(row => row.avg_seniority_5yr),
          colorscale: [[0, THEME.bg], [0.55, COLORS[0]], [1, THEME.navy]],
          line: { color: '#fff', width: 1 },
          showscale: true,
          colorbar: { title: 'Career stage', thickness: 10 },
        },
        customdata: rows.map(row => [row.employer, row.n_starters, row.senior_plus_5yr_pct]),
        hovertemplate: '%{customdata[0]}<br>5-yr retention %{x:.1f}%<br>5-yr pay %{y:$,.0f}<br>Leadership share %{customdata[2]:.1f}%<extra></extra>',
      }], {
        ...layoutBase,
        xaxis: { title: 'Still at first employer after 5 years', ticksuffix: '%', automargin: true, rangemode: 'tozero' },
        yaxis: { title: 'Mean pay at 5 years', tickprefix: '$', tickformat: ',', automargin: true, rangemode: 'tozero' },
        margin: { ...layoutBase.margin, l: 78, r: 28, t: 20, b: 70 },
        showlegend: false,
      }, plotConfig);
    }

    function drawCareerEmployerShare(id) {
      const rows = (state.data.career?.employer_share || [])
        .filter(row => row.employer && Number.isFinite(Number(row.years_since_grad)) && row.share_pct !== null && row.share_pct !== undefined);
      if (!rows.length) return noData(id);
      const totals = new Map();
      rows.forEach(row => {
        const employer = row.employer;
        totals.set(employer, (totals.get(employer) || 0) + Number(row.n_alumni || 0));
      });
      const employers = [...totals.entries()]
        .sort((a, b) => b[1] - a[1])
        .slice(0, topNFor(id))
        .map(([employer]) => employer);
      const traces = employers.map((employer, i) => {
        const slice = rows
          .filter(row => row.employer === employer)
          .sort((a, b) => Number(a.years_since_grad) - Number(b.years_since_grad));
        const legendgroup = `${id}-employer-${i}`;
        return {
          type: 'scatter',
          mode: 'lines+markers',
          name: legendLabel(employer, 32),
          legendgroup,
          showlegend: false,
          x: slice.map(row => Number(row.years_since_grad)),
          y: slice.map(row => Number(row.share_pct || 0)),
          customdata: slice.map(row => [employer, row.n_alumni, row.mean_salary]),
          line: { color: COLORS[i % COLORS.length], width: 3.2 },
          marker: { color: COLORS[i % COLORS.length], size: 6 },
          hovertemplate: '%{customdata[0]}<br>%{x} years after graduation<br>%{y:.2f}% of alumni<extra></extra>',
        };
      });
      const legendTraces = employers.map((employer, i) => legendDotTrace(employer, COLORS[i % COLORS.length], `${id}-employer-${i}`));
      Plotly.newPlot(id, [...traces, ...legendTraces], {
        ...layoutBase,
        height: 460,
        margin: { ...layoutBase.margin, l: 82, r: 42, t: 26, b: 70 },
        xaxis: { title: 'Years after graduation', dtick: 1, automargin: true, range: [-0.3, 15.3] },
        yaxis: { title: 'Share of alumni', ticksuffix: '%', automargin: true, rangemode: 'tozero' },
        legend: { orientation: 'h', y: 1.18, x: 0, itemwidth: 30 },
      }, plotConfig).then(plot => bindLegendGroupToggles(plot));
    }

    function careerStep(employer, role, fallback = 'Not enough detail') {
      const parts = [employer, role].filter(Boolean).map(value => String(value).trim()).filter(Boolean);
      return parts.length ? parts.join(' · ') : fallback;
    }

    function careerSignalLabel(row) {
      const raw = row.archetype_signal || row.series || 'Career path';
      return String(raw)
        .replace(/_/g, ' ')
        .replace(/\b\w/g, chr => chr.toUpperCase());
    }

    function drawCareerModels(id) {
      const rows = (state.data.career?.archetypes || []).slice(0, topNFor(id));
      if (!rows.length) return noData(id);
      $(id).innerHTML = `
        <div class="career-model-grid">
          ${rows.map(row => `
            <div class="career-model-card">
              <h4>${escapeHtml(careerSignalLabel(row))}</h4>
              <div class="career-model-path">
                <div class="career-model-step"><span>Launch</span>${escapeHtml(careerStep(row.first_employer, row.first_role))}</div>
                <div class="career-model-step"><span>5 years</span>${escapeHtml(careerStep(row.employer_5yr, row.role_5yr))}</div>
                <div class="career-model-step"><span>10 years</span>${escapeHtml(careerStep(row.employer_10yr, row.role_10yr))}</div>
              </div>
              <div class="career-model-stats">
                <div><strong>${money(row.avg_salary_5yr)}</strong><span>5-yr pay</span></div>
                <div><strong>${row.avg_seniority_10yr ?? '—'}</strong><span>10-yr stage</span></div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function careerStageFromScore(value) {
      const score = Number(value);
      if (!Number.isFinite(score)) return '—';
      if (score < 2) return 'Entry';
      if (score < 4) return 'Associate';
      if (score < 6) return 'Management';
      return 'Senior Leadership';
    }

    function superstarReason(row) {
      const salary = Number(row.salary_10yr || row.salary_5yr || row.salary_1yr || 0);
      const seniority = Number(row.seniority_10yr || row.seniority_5yr || row.seniority_1yr || 0);
      const growth = row.salary_1yr && (row.salary_10yr || row.salary_5yr)
        ? Number(row.salary_10yr || row.salary_5yr) / Math.max(1, Number(row.salary_1yr))
        : 0;
      if (salary >= 300000 && seniority >= 6) return 'High pay + leadership role';
      if (growth >= 1.8) return 'Fast earnings growth';
      if (seniority >= 6) return 'Senior leadership path';
      if (salary >= 220000) return 'High-earning path';
      return 'Superstar outcome';
    }

    function drawCareerSuperstars(id) {
      const rows = (state.data.career?.superstars || []).slice(0, topNFor(id));
      if (!rows.length) return drawCareerModels(id);
      $(id).innerHTML = `
        <div class="career-model-grid">
          ${rows.map((row, idx) => `
            <div class="career-model-card">
              <h4>Anonymous superstar ${idx + 1}</h4>
              <div class="career-model-subtitle">${escapeHtml([row.major_title, row.grad_year ? `Class of ${row.grad_year}` : ''].filter(Boolean).join(' · '))}</div>
              <div class="career-model-path">
                <div class="career-model-step"><span>1 year</span>${escapeHtml(careerStep(row.employer_1yr, row.role_1yr))}</div>
                <div class="career-model-step"><span>5 years</span>${escapeHtml(careerStep(row.employer_5yr, row.role_5yr))}</div>
                <div class="career-model-step"><span>10 years</span>${escapeHtml(careerStep(row.employer_10yr, row.role_10yr))}</div>
              </div>
              <div class="career-model-stats">
                <div><strong>${money(row.salary_10yr || row.salary_5yr || row.salary_1yr)}</strong><span>Peak pay</span></div>
                <div><strong>${careerStageFromScore(row.seniority_10yr || row.seniority_5yr || row.seniority_1yr)}</strong><span>Stage</span></div>
                <div><strong>${escapeHtml(superstarReason(row))}</strong><span>Signal</span></div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function drawCareerInternshipRates(id) {
      const rows = (state.data.career?.internships?.rates || [])
        .filter(row => row.series && row.internship_rate_pct !== null && row.internship_rate_pct !== undefined)
        .slice(0, topNFor(id));
      if (!rows.length) return noData(id);
      const labels = rows.map(row => legendLabel(row.series, 34));
      Plotly.newPlot(id, [{
        type: 'bar',
        orientation: 'h',
        y: labels.map(label => wrapAxisLabel(label, 24, 2)),
        x: rows.map(row => Number(row.internship_rate_pct || 0)),
        text: rows.map(row => pct(row.internship_rate_pct)),
        textposition: 'outside',
        cliponaxis: false,
        marker: { color: rows.map((_, i) => COLORS[i % COLORS.length]) },
        customdata: rows.map(row => [row.series, row.n_interns, row.n_alumni, row.internship_positions, row.avg_internships_per_intern]),
        hovertemplate: '%{customdata[0]}<br>%{x:.1f}% internship rate<extra></extra>',
      }], {
        ...horizontalBarLayout(id, rows.map(row => ({ label: row.series })), '%', { rightMargin: 92, leftMargin: 190 }),
        xaxis: { ticksuffix: '%', rangemode: 'tozero', automargin: true, title: 'Share with internship signal' },
        showlegend: false,
      }, plotConfig);
    }

    function drawCareerInternshipEmployers(id) {
      const rows = (state.data.career?.internships?.employer_comparison || [])
        .filter(row => row.series && row.label && Number.isFinite(Number(row.share_pct)));
      if (!rows.length) return noData(id);
      const limit = Math.max(3, Number(topNFor(id)) || 8);
      const seriesNames = (state.data.career?.internships?.rates || [])
        .map(row => row.series)
        .filter(Boolean);
      for (const row of rows) {
        if (!seriesNames.includes(row.series)) seriesNames.push(row.series);
      }
      const totals = new Map();
      rows.forEach(row => totals.set(row.label, (totals.get(row.label) || 0) + Number(row.n || 0)));
      const employers = [...totals.entries()]
        .sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])))
        .slice(0, limit)
        .map(([label]) => label);
      const lookup = new Map(rows.map(row => [`${row.series}||${row.label}`, row]));
      const z = employers.map(label => seriesNames.map(series => {
        const row = lookup.get(`${series}||${label}`);
        return row ? Number(row.share_pct || 0) : null;
      }));
      const text = z.map(row => row.map(value => Number.isFinite(value) ? `${value.toFixed(1)}%` : ''));
      const customdata = employers.map(label => seriesNames.map(series => {
        const row = lookup.get(`${series}||${label}`) || {};
        return [series, label, row.n || 0, row.mean_salary || null];
      }));
      Plotly.newPlot(id, [{
        type: 'heatmap',
        x: seriesNames.map(series => legendLabel(series, 26)),
        y: employers.map(label => wrapAxisLabel(label, 26, 2)),
        z,
        text,
        texttemplate: '%{text}',
        textfont: { color: '#17314f', size: 12 },
        colorscale: [[0, THEME.bg], [0.5, '#9AD3F9'], [1, THEME.navy]],
        hoverongaps: false,
        customdata,
        hovertemplate: '%{customdata[0]}<br>%{customdata[1]}<br>%{z:.1f}% of internship positions<extra></extra>',
      }], {
        ...layoutBase,
        height: Math.max(340, 150 + employers.length * 34),
        margin: { ...layoutBase.margin, l: 220, r: 32, t: 16, b: 90 },
        xaxis: { automargin: true, side: 'bottom' },
        yaxis: { automargin: true, autorange: 'reversed' },
        showlegend: false,
      }, plotConfig);
    }

    function drawCareerInternships(id) {
      const internships = state.data.career?.internships || {};
      const summary = internships.summary || {};

    function destinationTypeConfig(type) {
      return DESTINATION_TYPES[type] || DESTINATION_TYPES.roles;
    }

    function normalizeDestinationTypes(changedSide = null, previousType = null) {
      state.destinationLeftType = validDestinationType(state.destinationLeftType) || 'roles';
      state.destinationRightType = validDestinationType(state.destinationRightType) || 'employers';
      if (state.destinationLeftType !== state.destinationRightType) return;
      if (changedSide === 'left') {
        state.destinationRightType = previousType && previousType !== state.destinationLeftType
          ? previousType
          : DESTINATION_TYPE_FALLBACKS[state.destinationLeftType] || 'employers';
      } else if (changedSide === 'right') {
        state.destinationLeftType = previousType && previousType !== state.destinationRightType
          ? previousType
          : DESTINATION_TYPE_FALLBACKS[state.destinationRightType] || 'roles';
      } else {
        state.destinationRightType = DESTINATION_TYPE_FALLBACKS[state.destinationLeftType] || 'employers';
      }
    }

    function activeDestinationRelationship() {
      normalizeDestinationTypes();
      const left = destinationTypeConfig(state.destinationLeftType);
      const right = destinationTypeConfig(state.destinationRightType);
      const usesEmployers = state.destinationLeftType === 'employers' || state.destinationRightType === 'employers';
      return {
        leftTitle: left.label,
        rightTitle: right.label,
        leftLevels: left.levels,
        rightLevels: right.levels,
        dataset: usesEmployers ? 'employer_hierarchy' : 'hierarchy',
      };
    }

    function destinationHorizonLabel() {
      if (state.destinationHorizon === 'all') return 'All years out';
      return HORIZON_OPTIONS.find(option => option.value === state.destinationHorizon)?.label || 'All years out';
    }

    function destinationToolbar() {
      const typeOptions = selectedValue => DESTINATION_TYPE_VALUES.map(value => (
        `<option value="${escapeHtml(value)}" ${value === selectedValue ? 'selected' : ''}>${escapeHtml(destinationTypeConfig(value).label)}</option>`
      )).join('');
      const horizonButtons = [
        { value: 'all', label: 'All time' },
        ...HORIZON_OPTIONS,
      ].map(option => (
        `<button type="button" class="btn ${option.value === state.destinationHorizon ? 'active' : ''}" data-destination-horizon="${option.value}">${escapeHtml(option.label)}</button>`
      )).join('');
      return `
        <div class="destination-toolbar span-12">
          <div class="destination-toolbar-group">
            <span class="destination-toolbar-label">Left treemap</span>
            <select class="destination-select" data-destination-type="left" aria-label="Left destination type">
              ${typeOptions(state.destinationLeftType)}
            </select>
          </div>
          <div class="destination-toolbar-group">
            <span class="destination-toolbar-label">Right treemap</span>
            <select class="destination-select" data-destination-type="right" aria-label="Right destination type">
              ${typeOptions(state.destinationRightType)}
            </select>
          </div>
          <div class="destination-toolbar-group">
            <span class="destination-toolbar-label">Years out</span>
            <span class="segmented">${horizonButtons}</span>
          </div>
        </div>
      `;
    }

    function destinationRows(config) {
      return state.data.roles?.[config.dataset] || [];
    }

    function destinationTrendRows(type) {
      return state.data.destination_trend?.[type] || [];
    }

    function destinationSubtitle(primaryTitle, primaryPath, contextTitle, contextPath) {
      if (contextPath.length) return `${hierarchyTrail(primaryPath)}. Filtered by ${contextTitle.toLowerCase()}: ${hierarchyTrail(contextPath)}`;
      return `${hierarchyTrail(primaryPath)}. ${destinationHorizonLabel()}.`;
    }

    function renderDestinations() {
      const config = activeDestinationRelationship();
      if (state.viewMode !== 'snapshot') {
        const leftRows = destinationTrendRows(state.destinationLeftType);
        const rightRows = destinationTrendRows(state.destinationRightType);
        $('content').innerHTML = [
          destinationToolbar(),
          treemapCard(`${config.leftTitle} Over Time`, 'destination-left-trend-tree', `Top ${config.leftTitle.toLowerCase()} by graduation year. ${destinationHorizonLabel()}.`, [], null, 6),
          treemapCard(`${config.rightTitle} Over Time`, 'destination-right-trend-tree', `Top ${config.rightTitle.toLowerCase()} by graduation year. ${destinationHorizonLabel()}.`, [], null, 6),
        ].join('');
        const leftNodes = trendTreemapNodes(leftRows, 'destination-left-trend-tree');
        const rightNodes = trendTreemapNodes(rightRows, 'destination-right-trend-tree');
        const sharedPayDomain = treemapPayDomain([...leftNodes, ...rightNodes]);
        drawTrendTreemap('destination-left-trend-tree', leftRows, { payDomain: sharedPayDomain });
        drawTrendTreemap('destination-right-trend-tree', rightRows, { payDomain: sharedPayDomain });
        return;
      }
      const rows = destinationRows(config);
      let changed = true;
      while (changed) {
        changed = false;
        const leftContext = filterRowsByHierarchyPath(rows, config.rightLevels, state.destinationRightPath);
        const nextLeftPath = ensureVisibleHierarchyPath(leftContext, config.leftLevels, state.destinationLeftPath, 'destination-left-tree');
        if (!samePath(nextLeftPath, state.destinationLeftPath)) {
          state.destinationLeftPath = nextLeftPath;
          changed = true;
        }
        const rightContext = filterRowsByHierarchyPath(rows, config.leftLevels, state.destinationLeftPath);
        const nextRightPath = ensureVisibleHierarchyPath(rightContext, config.rightLevels, state.destinationRightPath, 'destination-right-tree');
        if (!samePath(nextRightPath, state.destinationRightPath)) {
          state.destinationRightPath = nextRightPath;
          changed = true;
        }
      }
      const leftContextRows = filterRowsByHierarchyPath(rows, config.rightLevels, state.destinationRightPath);
      const rightContextRows = filterRowsByHierarchyPath(rows, config.leftLevels, state.destinationLeftPath);
      const leftNodes = visibleHierarchyRows(leftContextRows, config.leftLevels, state.destinationLeftPath, 'destination-left-tree');
      const rightNodes = visibleHierarchyRows(rightContextRows, config.rightLevels, state.destinationRightPath, 'destination-right-tree');
      const sharedPayDomain = treemapPayDomain([...leftNodes, ...rightNodes]);
      $('content').innerHTML = [
        destinationToolbar(),
        treemapCard(config.leftTitle, 'destination-left-tree', destinationSubtitle(config.leftTitle, state.destinationLeftPath, config.rightTitle, state.destinationRightPath), state.destinationLeftPath, 'destinationLeft', 6),
        treemapCard(config.rightTitle, 'destination-right-tree', destinationSubtitle(config.rightTitle, state.destinationRightPath, config.leftTitle, state.destinationLeftPath), state.destinationRightPath, 'destinationRight', 6),
      ].join('');
      drawHierarchyTreemap('destination-left-tree', leftContextRows, config.leftLevels, state.destinationLeftPath, node => {
        if (state.destinationLeftPath.length >= config.leftLevels.length) return;
        state.destinationLeftPath = [...state.destinationLeftPath, node.label];
        renderDestinations();
      }, { payDomain: sharedPayDomain });
      drawHierarchyTreemap('destination-right-tree', rightContextRows, config.rightLevels, state.destinationRightPath, node => {
        if (state.destinationRightPath.length >= config.rightLevels.length) return;
        state.destinationRightPath = [...state.destinationRightPath, node.label];
        renderDestinations();
      }, { payDomain: sharedPayDomain });
    }

    function renderRoles() {
      if (state.viewMode === 'snapshot') {
        const rows = state.data.roles?.hierarchy || [];
        const roleLevels = ['role_k50_v3', 'role_k150_v3'];
        const industryLevels = ['industry_k200', 'industry_k400'];
        let changed = true;
        while (changed) {
          changed = false;
          const roleContext = filterRowsByHierarchyPath(rows, industryLevels, state.industryTreePath);
          const nextRolePath = ensureVisibleHierarchyPath(roleContext, roleLevels, state.roleTreePath, 'role-tree');
          if (!samePath(nextRolePath, state.roleTreePath)) {
            state.roleTreePath = nextRolePath;
            changed = true;
          }
          const industryContext = filterRowsByHierarchyPath(rows, roleLevels, state.roleTreePath);
          const nextIndustryPath = ensureVisibleHierarchyPath(industryContext, industryLevels, state.industryTreePath, 'industry-tree');
          if (!samePath(nextIndustryPath, state.industryTreePath)) {
            state.industryTreePath = nextIndustryPath;
            changed = true;
          }
        }
        const roleContextRows = filterRowsByHierarchyPath(rows, industryLevels, state.industryTreePath);
        const industryContextRows = filterRowsByHierarchyPath(rows, roleLevels, state.roleTreePath);
        const roleNodes = visibleHierarchyRows(roleContextRows, roleLevels, state.roleTreePath, 'role-tree');
        const industryNodes = visibleHierarchyRows(industryContextRows, industryLevels, state.industryTreePath, 'industry-tree');
        const sharedPayDomain = treemapPayDomain([...roleNodes, ...industryNodes]);
        const roleSubtitle = state.industryTreePath.length
          ? `${hierarchyTrail(state.roleTreePath)}. Filtered by industry: ${hierarchyTrail(state.industryTreePath)}`
          : `${hierarchyTrail(state.roleTreePath)}. Click a role to zoom into K150 roles.`;
        const industrySubtitle = state.roleTreePath.length
          ? `${hierarchyTrail(state.industryTreePath)}. Filtered by role: ${hierarchyTrail(state.roleTreePath)}`
          : `${hierarchyTrail(state.industryTreePath)}. Click an industry to zoom.`;
        $('content').innerHTML = [
          treemapCard('Role Treemap', 'role-tree', roleSubtitle, state.roleTreePath, 'roleTree', 6),
          treemapCard('Industry Treemap', 'industry-tree', industrySubtitle, state.industryTreePath, 'industryTree', 6),
        ].join('');
        drawHierarchyTreemap('role-tree', roleContextRows, roleLevels, state.roleTreePath, node => {
          if (!node.drillable) return;
          state.roleTreePath = [...state.roleTreePath, node.label];
          renderRoles();
        }, { payDomain: sharedPayDomain });
        drawHierarchyTreemap('industry-tree', industryContextRows, industryLevels, state.industryTreePath, node => {
          if (!node.drillable) return;
          state.industryTreePath = [...state.industryTreePath, node.label];
          renderRoles();
        }, { payDomain: sharedPayDomain });
      } else {
        $('content').innerHTML = [
          card('Roles Over Time', 'role-trend', 6, true, { topControl: true }),
          card('Industries Over Time', 'industry-trend', 6, true, { topControl: true }),
        ].join('');
        drawTrendLines('role-trend', state.data.role_trend?.roles || [], 'label', 'share_pct', {
          yTitle: 'Share of alumni',
          suffix: '%',
          hover: '%{y:.1f}%',
        });
        drawTrendLines('industry-trend', state.data.role_trend?.industries || [], 'label', 'share_pct', {
          yTitle: 'Share of alumni',
          suffix: '%',
          hover: '%{y:.1f}%',
        });
      }
    }

    function renderPostgrad() {
      const selected = state.data.postgrad?.selected_degree || 'Selected path';
      const detailLabel = state.data.postgrad?.detail_degree || selected;
      const showPrograms = Boolean(state.data.postgrad?.show_program_detail && (state.data.postgrad?.programs || []).length);

      const selectedProgram = state.data.postgrad?.selected_program || null;
      const feederRows = state.data.postgrad?.feeders?.schools || [];
      const showFeeders = feederRows.length > 0;
      const schoolTitle = selectedProgram
        ? `Top Schools for ${escapeHtml(shortPostgradProgram(selectedProgram))}`
        : `Top Schools for ${escapeHtml(detailLabel)}`;
      const programTitle = selectedSchool
        ? `Top Programs at ${escapeHtml(shortPostgradSchool(selectedSchool))}`
        : `Top Programs for ${escapeHtml(detailLabel)}`;

        const total = (rows || []).reduce((sum, row) => sum + Number(row.n || 0), 0) || 0;

          ...row,
          derived_share_pct: total ? 100 * Number(row.n || 0) / total : null,
        }));

        ? 'share_pct'
        : 'derived_share_pct';
      if (state.viewMode === 'snapshot') {

            state.selectedPostgradProgram = null;
            refresh();

          layoutOptions: { leftMargin: 230, rightMargin: 86, yAutoMargin: false },

            refresh();

    function renderCoverage() {
      const coverage = state.data.coverage || {};
      const isSchoolCompare = state.selectionMode === 'compare';

          card('Grad Coverage by Graduation Year', 'coverage-trend-line', 4, true),

          yTitle: 'Grad coverage',
