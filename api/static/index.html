    function legendLabel(name, maxLength = 26) {
      const cleaned = String(name || '')
        .replace(', General', '')
        .replace('Political Science and Government', 'Political Science & Gov.')
        .replace('English Language and Literature', 'English Lang. & Lit.')
        .replace('Business Administration, Management and Operations', 'Business Admin.')
        .replace('Computer and Information Sciences', 'Computer & Info Sci.')
        .replace('Communication, Journalism, and Related Programs', 'Communications')
        .replace('Mathematics and Statistics', 'Math & Statistics')
        .replace('Economics, General', 'Economics')
        .replace(/\s+and\s+/g, ' & ')
        .replace(/\s+/g, ' ')
        .trim();
      return cleaned.length > maxLength ? `${cleaned.slice(0, maxLength - 3).trim()}...` : cleaned;
    }

    function legendDotTrace(name, color, legendgroup = null) {
      return {
        type: 'scatter',
        mode: 'markers',
        name: legendLabel(name),
        legendgroup,
        x: [null],
        y: [null],
        marker: { color, size: 9 },
        hoverinfo: 'skip',
        showlegend: true,
      };
    }

    function bindLegendGroupToggles(plot) {
      if (!plot || plot.__revelioLegendInteractionsBound) return plot;
      plot.__revelioLegendInteractionsBound = true;
      const isHidden = trace => trace?.visible === 'legendonly' || trace?.visible === false;
      const keyForTrace = (trace, idx) => trace?.legendgroup ? `group:${trace.legendgroup}` : `trace:${idx}`;
      const legendKeys = () => {
        const keys = [];
        (plot.data || []).forEach((trace, idx) => {
          if (trace?.showlegend === false) return;
          if (!trace?.name && trace?.showlegend !== true) return;
          const key = keyForTrace(trace, idx);
          if (!keys.includes(key)) keys.push(key);
        });
        return keys;
      };
      const indicesForKey = key => {
        if (!key) return [];
        if (key.startsWith('group:')) {
          const group = key.slice(6);
          return (plot.data || [])
            .map((trace, idx) => trace?.legendgroup === group ? idx : -1)
            .filter(idx => idx >= 0);
        }
        const idx = Number(key.slice(6));
        return Number.isInteger(idx) && idx >= 0 ? [idx] : [];
      };
      const indicesForKeys = keys => [...new Set(keys.flatMap(indicesForKey))];
      const clickedKey = event => {
        const idx = Number(event?.curveNumber);
        if (!Number.isInteger(idx) || !plot.data?.[idx]) return null;
        return keyForTrace(plot.data[idx], idx);
      };

      plot.on('plotly_legendclick', event => {
        const key = clickedKey(event);
        if (!key) return true;
        const indices = indicesForKey(key);
        const visible = indices.some(idx => !isHidden(plot.data[idx]));
        Plotly.restyle(plot, { visible: visible ? 'legendonly' : true }, indices);
        return false;
      });

      plot.on('plotly_legenddoubleclick', event => {
        const key = clickedKey(event);
        if (!key) return true;
        const keys = legendKeys();
        if (!keys.includes(key)) keys.push(key);
        const targetIndices = indicesForKey(key);
        const otherIndices = indicesForKeys(keys.filter(otherKey => otherKey !== key));
        const allIndices = indicesForKeys(keys);
        const isIsolated = targetIndices.some(idx => !isHidden(plot.data[idx]))
          && otherIndices.length
          && otherIndices.every(idx => isHidden(plot.data[idx]));

        if (isIsolated) {
          Plotly.restyle(plot, { visible: true }, allIndices);
        } else {
          if (otherIndices.length) Plotly.restyle(plot, { visible: 'legendonly' }, otherIndices);
          Plotly.restyle(plot, { visible: true }, targetIndices);
        }
        return false;
      });
      return plot;
    }

    function topSeriesLabels(rows, labelKey, limit) {
      return [...new Set((rows || []).map(row => row[labelKey]).filter(Boolean))]
        .sort((a, b) => {
          const totalA = rows.filter(row => row[labelKey] === a).reduce((sum, row) => sum + Number(row.n || row.alumni || row.salary_weight || 0), 0);
          const totalB = rows.filter(row => row[labelKey] === b).reduce((sum, row) => sum + Number(row.n || row.alumni || row.salary_weight || 0), 0);
          return totalB - totalA;
        })
        .slice(0, limit);
    }

    function drawTrendLines(id, rows, labelKey, valueKey, options = {}) {
      const cleanRows = (rows || []).filter(row => row.grad_year !== null && row.grad_year !== undefined && row[valueKey] !== null && row[valueKey] !== undefined);
      if (!cleanRows.length) return noData(id);
      const labels = options.fixedLabel
        ? [options.fixedLabel]
        : (options.limitSeries === false ? [...new Set(cleanRows.map(row => row[labelKey]).filter(Boolean))] : topSeriesLabels(cleanRows, labelKey, topNFor(id)));
      const traces = labels.map((label, i) => {
        const slice = options.fixedLabel ? cleanRows : cleanRows.filter(row => row[labelKey] === label);
        const displayLabel = options.labelTransform ? options.labelTransform(label) : label;
        const legendgroup = `${id}-series-${i}`;
        return {
          type: 'scatter',
          mode: 'lines+markers',
          name: displayLabel,
          legendgroup,
          x: slice.map(row => row.grad_year),
          y: slice.map(row => row[valueKey]),
          line: { color: COLORS[i % COLORS.length], width: 3 },
          marker: { size: 7 },
          showlegend: false,
          customdata: slice.map(() => label),
          hovertemplate: `${displayLabel}<br>Class of %{x}<br>${options.hover || '%{y:,.1f}'}<extra></extra>`,
        };
      });
      const legendTraces = labels.map((label, i) => legendDotTrace(options.labelTransform ? options.labelTransform(label) : label, COLORS[i % COLORS.length], `${id}-series-${i}`));
      Plotly.newPlot(id, [...traces, ...legendTraces], {
        ...layoutBase,
        height: options.height || 420,
        margin: { ...layoutBase.margin, l: 80, r: 36, t: 22, b: 62 },
        xaxis: { title: 'Graduation year', automargin: true, dtick: 5 },
        yaxis: {
          title: options.yTitle || '',
          tickprefix: options.prefix || '',
          ticksuffix: options.suffix || '',
          automargin: true,
          rangemode: 'tozero',
        },
        legend: { orientation: 'h', y: 1.18, x: 0, itemwidth: 30 },
      }, plotConfig).then(plot => {
        bindLegendGroupToggles(plot);
        if (!options.onClick) return;
        plot.on('plotly_click', event => {
          const point = event.points?.[0];
          const label = point?.customdata || point?.data?.name;
          if (label) options.onClick(label);
        });
      });
    }

    function drawCompareCategoryTrend(id, rows, options = {}) {
      const cleanRows = (rows || [])
        .filter(row => row.code && row.title && row.label && row.grad_year !== null && row.grad_year !== undefined && row.share_pct !== null && row.share_pct !== undefined);
      if (!cleanRows.length) return noData(id);
      const entityOrder = compareRows().map(row => String(row.code)).filter(Boolean);
      const entityLabels = new Map();
      cleanRows.forEach(row => {
        if (!entityLabels.has(String(row.code))) entityLabels.set(String(row.code), row.title);
      });
      const entityCodes = [
        ...entityOrder.filter(code => entityLabels.has(code)),
        ...[...entityLabels.keys()].filter(code => !entityOrder.includes(code)),
      ];
      const labelLimit = Math.max(1, Math.min(topNFor(id), options.maxLabels || 8));
      const labels = topSeriesLabels(cleanRows, 'label', labelLimit);
      const dashes = ['solid', 'dash', 'dot', 'dashdot', 'longdash', 'longdashdot'];
      const traces = [];
      const legendTraces = [];
      entityCodes.forEach((code, entityIdx) => {
        const entityLabel = options.entityLabelTransform
          ? options.entityLabelTransform(entityLabels.get(code))
          : (state.selectionMode === 'major_compare' ? legendLabel(entityLabels.get(code), 24) : shortSchool(entityLabels.get(code)));
        labels.forEach((label, labelIdx) => {
          const slice = cleanRows
            .filter(row => String(row.code) === code && row.label === label)
            .sort((a, b) => Number(a.grad_year) - Number(b.grad_year));
          if (!slice.length) return;
          const displayLabel = options.labelTransform ? options.labelTransform(label) : legendLabel(label, 24);
          const traceName = `${entityLabel} · ${displayLabel}`;
          const legendgroup = `${id}-${entityIdx}-${labelIdx}`;
          traces.push({
            type: 'scatter',
            mode: 'lines+markers',
            name: traceName,
            legendgroup,
            showlegend: false,
            x: slice.map(row => row.grad_year),
            y: slice.map(row => Number(row.share_pct || 0)),
            line: { color: COLORS[entityIdx % COLORS.length], width: 2.8, dash: dashes[labelIdx % dashes.length] },
            marker: { color: COLORS[entityIdx % COLORS.length], size: 6 },
            customdata: slice.map(row => [entityLabel, displayLabel, row.n, row.weighted_mean_salary]),
            hovertemplate: '%{customdata[0]}<br>%{customdata[1]}<br>Class of %{x}<br>%{y:.1f}%<extra></extra>',
          });
          legendTraces.push(legendDotTrace(traceName, COLORS[entityIdx % COLORS.length], legendgroup));
        });
      });
      if (!traces.length) return noData(id);
      Plotly.newPlot(id, [...traces, ...legendTraces], {
        ...layoutBase,
        height: options.height || 500,
        margin: { ...layoutBase.margin, l: 82, r: 38, t: 34, b: 68 },
        xaxis: { title: 'Graduation year', automargin: true, dtick: 5 },
        yaxis: { title: options.yTitle || 'Share of alumni', ticksuffix: '%', automargin: true, rangemode: 'tozero' },
        legend: { orientation: 'h', y: 1.18, x: 0, itemwidth: 30 },
      }, plotConfig).then(plot => bindLegendGroupToggles(plot));
    }

    function drawCompareYearHeatmap(id, rows, options = {}) {
      const cleanRows = (rows || [])
        .filter(row => row.code && row.label && row.grad_year !== null && row.grad_year !== undefined && row.share_pct !== null && row.share_pct !== undefined);
      if (!cleanRows.length) return noData(id);
      const availableCodes = new Set(cleanRows.map(row => String(row.code)));
      const fallbackTitles = new Map();
      cleanRows.forEach(row => {
        const code = String(row.code);
        if (!fallbackTitles.has(code)) fallbackTitles.set(code, row.title || code);
      });
      const entities = compareRows()
        .map(row => {
          const code = String(row.code || row.unitid || '');
          if (!code || !availableCodes.has(code)) return null;
          const title = row.title || row.school_name || fallbackTitles.get(code) || code;
          return {
            code,
            title,
            label: state.selectionMode === 'major_compare' ? legendLabel(title, 18) : legendLabel(shortSchool(title), 18),
          };
        })
        .filter(Boolean);
      if (!entities.length) return noData(id);
      const entityCodes = new Set(entities.map(entity => entity.code));
      const labelTotals = new Map();
      cleanRows.forEach(row => {
        if (!entityCodes.has(String(row.code))) return;
        const label = String(row.label || '');
        labelTotals.set(label, (labelTotals.get(label) || 0) + Number(row.n || 0));
      });
      const labels = [...labelTotals.entries()]
        .sort((a, b) => Number(b[1] || 0) - Number(a[1] || 0))
        .slice(0, topNFor(id))
        .map(([label]) => label);
      if (!labels.length) return noData(id);
      const years = [...new Set(cleanRows.map(row => Number(row.grad_year)).filter(Number.isFinite))]
        .sort((a, b) => a - b);
      if (!years.length) return noData(id);
      const lookup = new Map();
      cleanRows.forEach(row => {
        lookup.set(`${Number(row.grad_year)}||${String(row.code)}||${String(row.label)}`, row);
      });
      const payloadForYear = year => {
        const z = labels.map(label => entities.map(entity => Number(lookup.get(`${year}||${entity.code}||${label}`)?.share_pct || 0)));
        const customdata = labels.map(label => entities.map(entity => {
          const row = lookup.get(`${year}||${entity.code}||${label}`) || {};
          return [label, entity.title, Number(row.n || 0), row.weighted_mean_salary ?? null, year];
        }));
        return { z, customdata };
      };
      const initialYear = years[years.length - 1];
      const initial = payloadForYear(initialYear);
      const values = cleanRows
        .filter(row => entityCodes.has(String(row.code)) && labels.includes(String(row.label)))
        .map(row => Number(row.share_pct || 0))
        .filter(Number.isFinite);
      const zMax = Math.max(5, Math.ceil((Math.max(...values, 0) + 2) / 5) * 5);
      const frames = years.map(year => ({
        name: String(year),
        data: [payloadForYear(year)],
      }));
      Plotly.newPlot(id, [{
        type: 'heatmap',
        x: entities.map(entity => entity.label),
        y: labels.map(label => options.labelTransform ? options.labelTransform(label) : legendLabel(label, 30)),
        z: initial.z,
        zmin: 0,
        zmax: zMax,
        customdata: initial.customdata,
        colorscale: [[0, THEME.bg], [0.35, '#9AD3F9'], [0.7, COLORS[0]], [1, THEME.navy]],
        colorbar: { title: '%', thickness: 12 },
        hovertemplate: '%{customdata[0]}<br>%{customdata[1]}<br>Class of %{customdata[4]}<br>Share: %{z:.1f}%<br>Weighted alumni: %{customdata[2]:,.0f}<extra></extra>',
      }], {
        ...layoutBase,
        height: Math.max(420, Math.min(700, 240 + labels.length * 38)),
        margin: { ...layoutBase.margin, l: 172, r: 44, t: 24, b: 112 },
        xaxis: { title: compareEntityLabel(), automargin: true },
        yaxis: { title: options.yTitle || '', automargin: true },
        sliders: [{
          active: years.length - 1,
          currentvalue: { prefix: 'Class of ', font: { color: '#2D426A', size: 13 } },
          pad: { t: 22 },
          steps: years.map(year => ({
            label: String(year),
            method: 'animate',
            args: [[String(year)], {
              mode: 'immediate',
              frame: { duration: 0, redraw: true },
              transition: { duration: 0 },
            }],
          })),
        }],
      }, plotConfig).then(plot => {
        Plotly.addFrames(plot, frames);
      });
    }

    function orderedCompareEntities(cleanRows) {
      const entityOrder = compareRows().map(row => String(row.code)).filter(Boolean);
      const entityLabels = new Map();
      cleanRows.forEach(row => {
        if (!entityLabels.has(String(row.code))) entityLabels.set(String(row.code), row.title);
      });
      return [
        ...entityOrder.filter(code => entityLabels.has(code)),

    function paddedPctRange(values, minimumSpan = 18) {
      const finite = values.map(Number).filter(Number.isFinite);
      if (!finite.length) return [0, 100];
      let minValue = Math.min(...finite);
      let maxValue = Math.max(...finite);
      const mid = (minValue + maxValue) / 2;
      if (maxValue - minValue < minimumSpan) {
        minValue = mid - minimumSpan / 2;
        maxValue = mid + minimumSpan / 2;
      }
      return [
        Math.max(0, Math.floor((minValue - 3) / 5) * 5),
        Math.min(100, Math.ceil((maxValue + 3) / 5) * 5),
      ];
    }

    function drawCompareFemaleTrend(id, rows) {
      const cleanRows = (rows || [])
        .filter(row => row.code && row.title && row.label && row.grad_year !== null && row.grad_year !== undefined && row.share_pct !== null && row.share_pct !== undefined);
      if (!cleanRows.length) return noData(id);
      const entities = orderedCompareEntities(cleanRows);
      if (!entities.length) return noData(id);
      const byKey = new Map(cleanRows.map(row => [`${row.code}||${row.grad_year}||${String(row.label).toLowerCase()}`, row]));
      const traces = [];
      const values = [];
      entities.forEach((entity, idx) => {
        const years = [...new Set(cleanRows.filter(row => String(row.code) === entity.code).map(row => Number(row.grad_year)))]
          .filter(Number.isFinite)
          .sort((a, b) => a - b);
        const points = years.map(year => {
          const femaleRow = byKey.get(`${entity.code}||${year}||female`)
            || cleanRows.find(row => String(row.code) === entity.code && Number(row.grad_year) === year && /female|women|woman/i.test(String(row.label)));
          if (femaleRow) return { year, share: Number(femaleRow.share_pct || 0), n: Number(femaleRow.n || 0), source: 'Female' };
          const maleRow = byKey.get(`${entity.code}||${year}||male`)
            || cleanRows.find(row => String(row.code) === entity.code && Number(row.grad_year) === year && /^male$/i.test(String(row.label)));
          if (maleRow) return { year, share: Math.max(0, 100 - Number(maleRow.share_pct || 0)), n: null, source: 'Female estimate' };
          return null;
        }).filter(Boolean);
        if (!points.length) return;
        values.push(...points.map(point => point.share));
        const legendgroup = `${id}-${idx}`;
        traces.push({
          type: 'scatter',
          mode: 'lines+markers',
          name: entity.label,
          legendgroup,
          showlegend: false,
          x: points.map(point => point.year),
          y: points.map(point => point.share),
          line: { color: COLORS[idx % COLORS.length], width: 3.6 },
          marker: { color: COLORS[idx % COLORS.length], size: 7 },
          customdata: points.map(point => [entity.title, point.source, point.n]),
          hovertemplate: '%{customdata[0]}<br>Class of %{x}<br>Share female: %{y:.1f}%<extra></extra>',
        });
        traces.push(legendDotTrace(entity.label, COLORS[idx % COLORS.length], legendgroup));
      });
      if (!traces.length) return noData(id);
      Plotly.newPlot(id, traces, {
        ...layoutBase,
        height: 430,
        margin: { ...layoutBase.margin, l: 82, r: 38, t: 30, b: 68 },
        xaxis: { title: 'Graduation year', automargin: true, dtick: 5 },
        yaxis: { title: 'Share female', ticksuffix: '%', automargin: true, range: paddedPctRange(values, 18) },
        legend: { orientation: 'h', y: 1.18, x: 0, itemwidth: 30 },
      }, plotConfig).then(plot => bindLegendGroupToggles(plot));

    function demographicColor(label, idx) {
      const text = String(label || '').toLowerCase();
      if (text.includes('white')) return '#74D39B';
      if (text.includes('asian') || text === 'api') return '#61A9E8';
      if (text.includes('hispanic') || text.includes('latino')) return '#F28E5B';
      if (text.includes('black')) return '#8B6FD6';
      if (text.includes('two') || text.includes('multi')) return '#F4D35D';
      if (text.includes('native')) return '#E76A87';
      return COLORS[idx % COLORS.length];
    }

      const entityCodes = new Set(entities.map(entity => entity.code));

      cleanRows.forEach(row => {
        const code = String(row.code);
        if (!entityCodes.has(code)) return;
        const year = Number(row.grad_year);
        if (!Number.isFinite(year)) return;
        latestYearByEntity.set(code, Math.max(year, latestYearByEntity.get(code) || year));
      });
      const latestRows = cleanRows.filter(row => Number(row.grad_year) === latestYearByEntity.get(String(row.code)));
      const labelTotals = new Map();
      latestRows.forEach(row => {
        if (!entityCodes.has(String(row.code))) return;

      });
      const labels = [...labelTotals.entries()]
        .sort((a, b) => Number(b[1] || 0) - Number(a[1] || 0))
        .slice(0, topNFor(id))
        .map(([label]) => label);

          }),
          hovertemplate: '%{customdata[0]}<br>%{customdata[1]}<br>Latest class %{customdata[2]}<br>%{y:.1f}%<extra></extra>',
        });

      Plotly.newPlot(id, traces, {

    function drawComparePrimaryCategoryTrend(id, rows, options = {}) {

    function drawMajorTrend(id) {
      const trend = state.data.major_trend || {};
      const rows = [...(trend.series || []), ...(trend.current_series || [])];
      if (!rows.length) return noData(id);
      const codes = [...new Set(rows.map(r => r.code))]
        .sort((a, b) => {
          const totalA = rows.filter(row => row.code === a).reduce((sum, row) => sum + Number(row.n || 0), 0);
          const totalB = rows.filter(row => row.code === b).reduce((sum, row) => sum + Number(row.n || 0), 0);
          return totalB - totalA;
        })
        .slice(0, topNFor(id));
      const traces = codes.map((code, i) => {
        const historic = (trend.series || []).filter(r => r.code === code);
        const current = (trend.current_series || []).filter(r => r.code === code);
        const currentBridge = historic.length && current.length ? [historic[historic.length - 1], ...current] : current;
        const title = (historic[0] || current[0] || {}).title || code;
        const legendgroup = `${id}-major-${i}`;
        return [
          {
            type: 'scatter',
            mode: 'lines+markers',
            name: title,
            legendgroup,
            x: historic.map(r => r.grad_year),
            y: historic.map(r => r.share_pct),
            line: { color: COLORS[i % COLORS.length], width: 3 },
            marker: { size: 7 },
            showlegend: false,
            customdata: historic.map(r => [r.n, r.total_n]),
            hovertemplate: `${title}<br>Class of %{x}<br>%{y:.1f}%<extra></extra>`,
          },
          current.length ? {
            type: 'scatter',
            mode: 'lines+markers',
            name: `${title} current`,
            legendgroup,
            x: currentBridge.map(r => r.grad_year),
            y: currentBridge.map(r => r.share_pct),
            line: { color: COLORS[i % COLORS.length], width: 3, dash: 'dot' },
            marker: {
              size: currentBridge.map((_, idx) => historic.length && idx === 0 ? 0 : 9),
              symbol: 'diamond',
            },
            customdata: currentBridge.map(r => [r.n, r.total_n]),
            showlegend: false,
            hovertemplate: `${title}<br>Class of %{x}<br>%{y:.1f}%<extra></extra>`,
          } : null
        ].filter(Boolean);
      }).flat();
      const legendTraces = codes.map((code, i) => {
        const row = rows.find(r => r.code === code) || {};
        return legendDotTrace(row.title || code, COLORS[i % COLORS.length], `${id}-major-${i}`);
      });
      const shapes = trend.current_series?.length ? [{
        type: 'line', x0: 2025.5, x1: 2025.5, y0: 0, y1: 1, xref: 'x', yref: 'paper',
        line: { color: '#8091a7', dash: 'dot', width: 2 },
      }] : [];
      const annotations = trend.current_series?.length ? [{
        x: 2026.1, y: 1.04, xref: 'x', yref: 'paper', text: 'Current students', showarrow: false,
        font: { color: '#40556e', size: 14 },
      }] : [];
      Plotly.newPlot(id, [...traces, ...legendTraces], {
        ...layoutBase,
        margin: { ...layoutBase.margin, r: 90 },
        yaxis: { title: trend.current_series?.length ? 'Share of class' : 'Share of graduates', ticksuffix: '%', automargin: true },
        xaxis: { title: 'Graduation year', automargin: true, dtick: trend.current_series?.length ? 2 : 5 },
        legend: { orientation: 'h', y: 1.16, itemwidth: 30 },
        shapes,
        annotations,
      }, plotConfig).then(plot => bindLegendGroupToggles(plot));
    }

    function locationDistinctivenessScore(row) {
      const share = Math.max(0, Number(row.share_pct || 0));
      const baseline = Math.max(0, Number(row.baseline_share_pct || 0));
      const lift = Number(row.lift_pp || 0);
      if (!(share > 0) || !(lift > 0)) return 0;
      const baselineFloor = 1.25;
      const relativeLift = share / Math.max(baseline, baselineFloor);
      const commonCityPenalty = Math.sqrt(Math.max(baseline, baselineFloor));
      const support = Math.max(0, Number(row.n || 0));
      const supportFactor = support ? Math.min(1, Math.sqrt(support / 10)) : 0.75;
      return (lift * Math.log1p(relativeLift) * supportFactor) / commonCityPenalty;
    }

    function chooseDistinctiveLocations(entityRows, labels, lookup, options = {}) {
      const codeFor = options.codeFor || (row => String(row.code));
      const titleFor = options.titleFor || (row => row.title || row.label || codeFor(row));
      const codes = entityRows.map(row => codeFor(row));
      const maxRepeats = entityRows.length >= 5 ? 2 : 1;
      const candidateLists = entityRows.map(entity => {
        const code = codeFor(entity);
        const peers = codes.filter(peerCode => peerCode !== code);
        const candidates = labels.map(label => {
          const row = lookup.get(`${code}||${label}`) || {};
          const share = Number(row.share_pct || 0);
          const peerAvg = peers.length
            ? peers.reduce((sum, peerCode) => sum + Number(lookup.get(`${peerCode}||${label}`)?.share_pct || 0), 0) / peers.length
            : 0;
          const baseline = row.baseline_share_pct !== null && row.baseline_share_pct !== undefined
            ? Number(row.baseline_share_pct || 0)
            : peerAvg;
          const candidate = {
            code,
            title: titleFor(entity),
            label,
            share_pct: share,
            baseline_share_pct: baseline,
            lift_pp: share - baseline,
            n: Number(row.n || 0),
          };
          return { ...candidate, distinctiveness_score: locationDistinctivenessScore(candidate) };
        })
          .filter(row => row.share_pct >= 0.75 && row.lift_pp > 0 && row.distinctiveness_score > 0)
          .sort((a, b) => Number(b.distinctiveness_score || 0) - Number(a.distinctiveness_score || 0)
            || Number(b.lift_pp || 0) - Number(a.lift_pp || 0)
            || Number(b.share_pct || 0) - Number(a.share_pct || 0));
        return { entity, candidates };
      })
        .filter(item => item.candidates.length)
        .sort((a, b) => Number(b.candidates[0]?.distinctiveness_score || 0) - Number(a.candidates[0]?.distinctiveness_score || 0));

      const usedLabels = new Map();
      return candidateLists.map(item => {
        const pick = item.candidates.find(row => (usedLabels.get(row.label) || 0) < maxRepeats) || item.candidates[0];
        usedLabels.set(pick.label, (usedLabels.get(pick.label) || 0) + 1);
        return pick;
      });
    }

    function medianNumber(values) {
      const clean = values.map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      if (!clean.length) return null;
      const mid = Math.floor(clean.length / 2);
      return clean.length % 2 ? clean[mid] : (clean[mid - 1] + clean[mid]) / 2;
    }

    function salaryBinSpec(rows) {
      const clean = (rows || [])
        .map(row => ({
          start: Number(row.bin_start),
          end: Number(row.bin_end),
        }))
        .filter(row => Number.isFinite(row.start) && Number.isFinite(row.end) && row.end > row.start)
        .sort((a, b) => a.start - b.start);
      if (!clean.length) return null;
      const widths = clean.map(row => row.end - row.start).filter(width => width > 0);
      const startGaps = clean.slice(1).map((row, i) => row.start - clean[i].start).filter(width => width > 0);
      const width = medianNumber(widths) || medianNumber(startGaps) || 25000;
      const start = Math.min(...clean.map(row => row.start));
      const end = Math.max(...clean.map(row => row.end));
      return { start, end, width };
    }

    function smoothDistribution(values, radius = 4, sigma = 2.1) {
      const clean = values.map(value => Math.max(0, Number(value) || 0));
      const kernel = [];
      for (let offset = -radius; offset <= radius; offset += 1) {
        kernel.push(Math.exp(-(offset * offset) / (2 * sigma * sigma)));
      }
      const kernelTotal = kernel.reduce((sum, value) => sum + value, 0) || 1;
      const smoothed = clean.map((_, index) => {
        let total = 0;
        for (let offset = -radius; offset <= radius; offset += 1) {
          const sourceIndex = index + offset;
          if (sourceIndex >= 0 && sourceIndex < clean.length) {
            total += clean[sourceIndex] * kernel[offset + radius];
          }
        }
        return total / kernelTotal;
      });
      const rawTotal = clean.reduce((sum, value) => sum + value, 0);
      const smoothTotal = smoothed.reduce((sum, value) => sum + value, 0);
      const scale = rawTotal > 0 && smoothTotal > 0 ? rawTotal / smoothTotal : 1;
      return smoothed.map(value => value * scale);
    }

    function salaryDistributionPoints(rows, valueKey, spec = null) {
      const binSpec = spec || salaryBinSpec(rows);
      if (!binSpec) return [];
      const count = Math.max(1, Math.min(80, Math.ceil((binSpec.end - binSpec.start) / binSpec.width)));
      const bins = Array.from({ length: count }, (_, index) => {
        const start = binSpec.start + index * binSpec.width;
        const end = index === count - 1 ? binSpec.end : start + binSpec.width;
        return { start, end, x: (start + end) / 2, rawY: 0, rawN: 0 };
      });
      (rows || []).forEach(row => {
        const start = Number(row.bin_start);
        const end = Number(row.bin_end);
        if (!Number.isFinite(start) || !Number.isFinite(end) || !Number.isFinite(binSpec.width) || binSpec.width <= 0) return;
        const index = Math.max(0, Math.min(count - 1, Math.round((start - binSpec.start) / binSpec.width)));
        bins[index].rawY += Number(row[valueKey] || 0);
        bins[index].rawN += Number(row.n || 0);
      });
      const smoothed = smoothDistribution(bins.map(row => row.rawY));
      return bins.map((row, index) => ({ ...row, y: smoothed[index] || 0 }));
    }

    function salaryDistributionRange(points) {
      const starts = points.map(row => Number(row.start)).filter(Number.isFinite);
      const ends = points.map(row => Number(row.end)).filter(Number.isFinite);
      if (!starts.length || !ends.length) return undefined;
      const min = Math.min(...starts);
      const max = Math.max(...ends);
      if (!Number.isFinite(min) || !Number.isFinite(max)) return undefined;
      if (max <= min) return [Math.max(0, min - 1000), max + 1000];
      return [min, max];
    }

          });

      const baseRows = sourceRows || state.data.geography || [];
      const rows = baseRows.filter(r => metric !== 'median_salary' || r.median_salary).slice(0, topNFor(id)).reverse();

    function drawHierarchyTreemap(id, rows, levels, path, onDrill, options = {}) {
      const nodes = visibleHierarchyRows(rows, levels, path, id);
      if (!nodes.length) return noData(id);
      const plotNode = $(id);
      const plotHeight = Math.max(360, Math.round(plotNode?.clientHeight || 460));
      const plotWidth = Math.max(320, Math.round(plotNode?.clientWidth || 680));
      const domain = options.payDomain ?? treemapPayDomain(nodes);
      const rootTotal = sumRows(rows, 'n');
      const parentTotal = sumRows(filterRowsByHierarchyPath(rows, levels, path), 'n') || rootTotal;
      const tileShare = row => parentTotal ? (Number(row.value || 0) / parentTotal) * 100 : null;
      updateTreemapLegend(id, domain);
      Plotly.newPlot(id, [{
        type: 'treemap',
        branchvalues: 'remainder',
        ids: nodes.map(row => [...path, row.label].join(' > ')),
        labels: nodes.map(row => row.label),
        parents: nodes.map(() => ''),
        values: nodes.map(row => row.value),
        text: nodes.map(row => `${escapeHtml(legendLabel(row.label, 24))}<br>${pct(tileShare(row))}`),
        textinfo: 'text',
        texttemplate: '%{text}',
        marker: {
          colors: nodes.map(row => payColor(Number(row.median_salary), domain)),
          line: { width: 1.25, color: '#ffffff' },
        },
        customdata: nodes.map(row => [
          rootTotal ? (row.value / rootTotal) * 100 : null,
          tileShare(row),
          row.median_salary === null || row.median_salary === undefined ? 'Mean pay unavailable' : `Mean pay: ${money(row.median_salary)}`,
          row.selected ? 'Selected' : (row.drillable ? 'Click to drill' : 'Click to filter'),
        ]),
        hovertemplate: '<b>%{label}</b><br>%{customdata[1]:.1f}% of visible group<br>%{customdata[0]:.1f}% of total<br>%{customdata[2]}<br>%{customdata[3]}<extra></extra>',
        pathbar: { visible: false },
        tiling: { packing: 'squarify', squarifyratio: 1.1 },
      }], {
        ...layoutBase,
        paper_bgcolor: '#FFFFFF',
        plot_bgcolor: '#FFFFFF',
        font: { family: '"Source Sans Pro", "Source Sans 3", ui-sans-serif, system-ui, sans-serif', color: '#2D426A', size: 13 },
        width: plotWidth,
        height: plotHeight,
        margin: { l: 0, r: 0, t: 0, b: 0 },
        uniformtext: { minsize: 11, mode: 'hide' },
      }, plotConfig).then(plot => {
        plot.on('plotly_click', event => {
          const node = nodes[event.points?.[0]?.pointNumber];
          if (node && onDrill) onDrill(node);
        });
      });
    }

    function trendTreemapNodes(rows, id = null) {
      const cleanRows = (rows || [])
        .filter(row => row.grad_year !== null && row.grad_year !== undefined && row.label && Number(row.n || 0) > 0);
      const labels = topSeriesLabels(cleanRows, 'label', topNFor(id));
      const selected = new Set(labels.map(String));
      return cleanRows
        .filter(row => selected.has(String(row.label)))
        .map(row => ({
          label: row.label,
          value: Number(row.n || 0),
          median_salary: row.weighted_mean_salary,
        }));
    }

    function drawTrendTreemap(id, rows, options = {}) {
      const cleanRows = (rows || [])
        .filter(row => row.grad_year !== null && row.grad_year !== undefined && row.label && Number(row.n || 0) > 0);
      if (!cleanRows.length) return noData(id);
      const labels = topSeriesLabels(cleanRows, 'label', topNFor(id));
      if (!labels.length) return noData(id);
      const selected = new Set(labels.map(String));
      const years = [...new Set(cleanRows.map(row => Number(row.grad_year)).filter(Number.isFinite))].sort((a, b) => a - b);
      if (!years.length) return noData(id);
      const rowsByYearLabel = new Map();
      cleanRows.forEach(row => {
        if (!selected.has(String(row.label))) return;
        rowsByYearLabel.set(`${Number(row.grad_year)}||${row.label}`, row);
      });
      const domain = options.payDomain ?? treemapPayDomain(trendTreemapNodes(cleanRows, id));
      const payloadForYear = year => {
        const yearRows = labels
          .map(label => rowsByYearLabel.get(`${year}||${label}`))
          .filter(Boolean)
          .sort((a, b) => Number(b.n || 0) - Number(a.n || 0));
        const total = sumRows(yearRows, 'n');
        return {
          ids: yearRows.map(row => `${year} > ${row.label}`),
          labels: yearRows.map(row => row.label),
          parents: yearRows.map(() => ''),
          values: yearRows.map(row => Number(row.n || 0)),
          text: yearRows.map(row => `${escapeHtml(legendLabel(row.label, 24))}<br>${pct(row.share_pct)}`),
          marker: {
            colors: yearRows.map(row => payColor(Number(row.weighted_mean_salary), domain)),
            line: { width: 1.25, color: '#ffffff' },
          },
          customdata: yearRows.map(row => [
            row.share_pct,
            total ? (Number(row.n || 0) / total) * 100 : null,
            row.weighted_mean_salary === null || row.weighted_mean_salary === undefined ? 'Mean pay unavailable' : `Mean pay: ${money(row.weighted_mean_salary)}`,
            year,
          ]),
        };
      };
      const initialYear = years[years.length - 1];
      const initial = payloadForYear(initialYear);
      if (!initial.labels.length) return noData(id);
      const plotNode = $(id);
      const plotHeight = Math.max(360, Math.round(plotNode?.clientHeight || 460));
      const plotWidth = Math.max(320, Math.round(plotNode?.clientWidth || 680));
      updateTreemapLegend(id, domain);
      const frames = years.map(year => ({
        name: String(year),
        data: [payloadForYear(year)],
      }));
      Plotly.newPlot(id, [{
        type: 'treemap',
        branchvalues: 'remainder',
        textinfo: 'text',
        texttemplate: '%{text}',
        hovertemplate: '<b>%{label}</b><br>Class of %{customdata[3]}<br>%{customdata[0]:.1f}% of total<br>%{customdata[1]:.1f}% of visible top group<br>%{customdata[2]}<extra></extra>',
        pathbar: { visible: false },
        tiling: { packing: 'squarify', squarifyratio: 1.1 },
        ...initial,
      }], {
        ...layoutBase,
        paper_bgcolor: '#FFFFFF',
        plot_bgcolor: '#FFFFFF',
        font: { family: '"Source Sans Pro", "Source Sans 3", ui-sans-serif, system-ui, sans-serif', color: '#2D426A', size: 13 },
        width: plotWidth,
        height: plotHeight,
        margin: { l: 0, r: 0, t: 0, b: 58 },
        uniformtext: { minsize: 11, mode: 'hide' },
        sliders: [{
          active: years.length - 1,
          currentvalue: { prefix: 'Class of ', font: { color: '#2D426A', size: 13 } },
          pad: { t: 16 },
          steps: years.map(year => ({
            label: String(year),
            method: 'animate',
            args: [[String(year)], {
              mode: 'immediate',
              frame: { duration: 0, redraw: true },
              transition: { duration: 0 },
            }],
          })),
        }],
      }, plotConfig).then(plot => {
        Plotly.addFrames(plot, frames);
      });
    }

    function drawDemoStackedTrend(id, rows, yTitle, height = 420) {
      const cleanRows = (rows || []).filter(row => row.grad_year !== null && row.grad_year !== undefined && row.share_pct !== null && row.share_pct !== undefined);
      if (!cleanRows.length) return noData(id);
      const labels = [...new Set(cleanRows.map(row => row.label).filter(Boolean))]
        .sort((a, b) => {
          const totalA = cleanRows.filter(row => row.label === a).reduce((sum, row) => sum + Number(row.n || 0), 0);
          const totalB = cleanRows.filter(row => row.label === b).reduce((sum, row) => sum + Number(row.n || 0), 0);
          return totalB - totalA;
        });
      const years = [...new Set(cleanRows.map(row => row.grad_year))].sort((a, b) => a - b);
      const traces = labels.map((label, i) => {
        const byYear = new Map(cleanRows.filter(row => row.label === label).map(row => [row.grad_year, row]));
        return {
          type: 'bar',
          name: label,
          x: years,
          y: years.map(year => byYear.get(year)?.share_pct || 0),
          marker: { color: COLORS[i % COLORS.length] },
          customdata: years.map(year => {
            const row = byYear.get(year) || {};
            return [label, row.n || 0, row.weighted_mean_salary || null];
          }),
          hovertemplate: '%{customdata[0]}<br>Class of %{x}<br>%{y:.1f}%<extra></extra>',
        };
      });
      Plotly.newPlot(id, traces, {
        ...layoutBase,
        height,
        barmode: 'stack',
        margin: { ...layoutBase.margin, l: 70, r: 24, t: 18, b: 58 },
        yaxis: { title: yTitle, range: [0, 100], ticksuffix: '%', automargin: true },
        xaxis: { title: 'Graduation year', automargin: true, dtick: 5 },
        legend: { orientation: 'h', y: 1.14 },
        uniformtext: { mode: 'hide', minsize: 10 },
      }, plotConfig);
    }

    function drawPostgradFlows(id) {

      if (!rows.length) return noData(id);

    function drawSimpleBars(id, rows, metric = 'n', color = COLORS[0], options = {}) {
      if (!rows.length) return noData(id);
      const cleanRows = rows.filter(r => r.label).slice(0, topNFor(id));
      const displayLabels = cleanRows.map(row => options.labelTransform ? options.labelTransform(row.label) : row.label);
      const rawValues = cleanRows.map(r => Number(r[metric] || 0));
      const xValues = options.compressed
        ? rawValues.map(value => Math.sqrt(Math.max(0, value)))
        : rawValues;
      const layout = horizontalBarLayout(id, cleanRows, options.axisPrefix || '', options.layoutOptions || {});
      const xaxis = options.compressed
        ? { ...layout.xaxis, showticklabels: false, showgrid: false, title: '', zeroline: false }
        : layout.xaxis;
      if (options.axisSuffix && !options.compressed) xaxis.ticksuffix = options.axisSuffix;
      Plotly.newPlot(id, [{
        type: 'bar',
        orientation: 'h',
        y: displayLabels.map(label => options.noWrap ? escapeHtml(label) : wrapAxisLabel(label, options.maxLabelChars)),
        x: xValues,
        text: cleanRows.map((row, index) => options.valueFormatter ? options.valueFormatter(rawValues[index], row) : num(rawValues[index])),
        textposition: 'outside',
        cliponaxis: false,
        customdata: cleanRows.map((r, index) => [r.label, rawValues[index], wholePeople(r.n)]),
        marker: {
          color: options.activeLabel
            ? cleanRows.map(row => row.label === options.activeLabel ? '#f97316' : color)
            : color,
        },
        hovertemplate: options.hovertemplate || '%{customdata[0]}<br>%{customdata[1]:,.0f}<extra></extra>',
      }], { ...layout, xaxis }, plotConfig).then(plot => {
        if (!options.onClick) return;
        plot.on('plotly_click', event => {
          const label = event.points?.[0]?.customdata?.[0] || event.points?.[0]?.y;
          if (label) options.onClick(label);
        });
      });
    }

    function horizontalBarLayout(id, rows, prefix = '', options = {}) {
      return horizontalLayout(rows, prefix, { ...options, tall: options.tall ?? chartIsTall(id) });
    }

    function horizontalLayout(rows, prefix = '', options = {}) {
      const rowCount = Math.max(1, (rows || []).length);
      const longest = Math.max(12, ...(rows || []).map(r => labelText(r).length));
      const narrow = compactWindow();
      const leftMargin = options.leftMargin ?? (narrow
        ? Math.min(230, Math.max(112, longest * 4.8))
        : Math.min(360, Math.max(148, longest * 7)));
      const rightMargin = options.rightMargin ?? (narrow ? 42 : 96);
      const minHeight = options.tall ? (narrow ? 430 : 410) : (narrow ? 360 : 330);
      const dynamicHeight = Math.max(minHeight, Math.min(760, 142 + rowCount * (narrow ? 42 : 34)));
      return {
        ...layoutBase,
        height: options.height || dynamicHeight,
        margin: { l: leftMargin, r: rightMargin, t: 14, b: 52 },
        xaxis: {
          ...layoutBase.xaxis,
          tickprefix: prefix === '$' ? '$' : '',
          ticksuffix: prefix === '%' ? '%' : '',
          automargin: true,
          rangemode: 'tozero',
        },
        yaxis: {
          ...layoutBase.yaxis,
          automargin: options.yAutoMargin ?? true,
          tickfont: { ...layoutBase.yaxis.tickfont, size: narrow ? 12 : 13 },
        },
      };
    }

    function noData(id) {
      $(id).innerHTML = '<div class="empty">No data for the current filters. Try a broader major, school set, year range, or horizon.</div>';
    }

    function table(headers, rows, mapper) {
      if (!rows.length) return '<div class="empty">No rows for the current filters.</div>';
      const head = headers.map(h => `<th>${escapeHtml(h)}</th>`).join('');
      const body = rows.map(row => `<tr>${mapper(row).map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('');
      return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function shortSchool(name) {
      return String(name || '')
        .replace('University of California-', 'UC ')
        .replace('Columbia University in the City of New York', 'Columbia')
        .replace('University of Michigan-Ann Arbor', 'Michigan')
        .replace('Massachusetts Institute of Technology', 'MIT')
        .replace('Georgia Institute of Technology-Main Campus', 'Georgia Tech')
        .replace('University of California-Los Angeles', 'UCLA')
        .replace('University of Washington-Seattle Campus', 'Washington')
        .replace('University of Virginia-Main Campus', 'Virginia')
        .replace('University of North Carolina at Chapel Hill', 'UNC Chapel Hill');
    }

    function shortPostgradSchool(name) {
      return legendLabel(shortSchool(name)
        .replace('Columbia University in the City of New York', 'Columbia')
        .replace('Teachers College at Columbia University', 'Teachers College')
        .replace('University of Pennsylvania', 'Penn')
        .replace('Johns Hopkins University', 'Johns Hopkins')
        .replace('New York University', 'NYU')
        .replace('University of Southern California', 'USC')
        .replace('University of California-San Francisco', 'UCSF')
        .replace('University of California-Berkeley', 'UC Berkeley')
        .replace('University of California-Los Angeles', 'UCLA'), 28);
    }

    function shortPostgradProgram(name) {
      return legendLabel(String(name || '')
        .replace('Registered Nursing/Registered Nurse', 'Registered Nursing')
        .replace('Business Administration and Management, General', 'Business Admin.')
        .replace('International Relations and Affairs', "Int'l Relations")
        .replace('Electrical and Electronics Engineering', 'Electrical Eng.')
        .replace('Public Health, General', 'Public Health')
        .replace('Economics, General', 'Economics')
        .replace('English Language and Literature, General', 'English Lit.')
        .replace('Political Science and Government, General', 'Political Science')
        .replace(', General', ''), 28);
    }

    function shortLocationLabel(value) {
      return legendLabel(titleCase(value)
        .replace(/\s+Metropolitan Area\b/g, '')
        .replace(/\s+\(United States\)$/g, '')
        .replace(/\s+\(United Kingdom\)$/g, '')
        .replace(/\s+\(Canada\)$/g, '')
        .replace(/\s+\(France\)$/g, '')
        .replace(/\s+\(Germany\)$/g, '')
        .replace('New York City', 'New York')
        .replace('Washington, D.c.', 'Washington DC'), 24);
    }

    function setHiddenSelectValue(selectId, value, selected) {
      const select = $(selectId);
      const optionNode = Array.from(select.options).find(opt => String(opt.value) === String(value));
      if (optionNode) optionNode.selected = selected;
    }

    function refreshCompareSchoolPicker() {
      const primary = String($('school-select')?.value || '');
      const values = trimCompareSchools(selectedValues($('compare-school-select')), primary);
      Array.from($('compare-school-select').options).forEach(opt => {
        opt.selected = values.includes(String(opt.value));
      });
      storage.setItem('outcomes.compareSchools', JSON.stringify(values));
      renderCompareSchoolPicker(state.options?.schools || [], new Set(values));
      syncCompareStatus();
      setAdvancedOpen(true);
      scheduleCompareSchoolWarmup();
    }

    function refreshCompareMajorPicker() {
      const values = selectedValues($('compare-major-select')).map(String);
      storage.setItem('outcomes.compareMajors', JSON.stringify(values));
      renderCompareMajorPicker(state.options?.major_options || [], new Set(values));
      syncCompareStatus();
      setAdvancedOpen(true);
    }

    function syncCompareStatus(modeOverride = null) {
      const node = $('compare-status');
      if (!node) return;
      const mode = modeOverride || state.selectionMode || currentSelectionMode();
      if (mode === 'compare') {
        const primary = shortSchool(selectedOptionLabel('school-select', 'Base school'));
        const count = trimCompareSchools(selectedValues($('compare-school-select')), $('school-select')?.value || '').length;
        node.innerHTML = `<strong>School comparison</strong><span>${escapeHtml(primary)} + ${count} ${count === 1 ? 'school' : 'schools'}</span>`;
        return;
      }
      if (mode === 'major_compare') {
        const count = selectedValues($('compare-major-select')).length;
        const school = shortSchool(selectedOptionLabel('school-select', 'Selected school'));
        node.innerHTML = `<strong>Major comparison</strong><span>${escapeHtml(num(count))} majors at ${escapeHtml(school)}</span>`;
        return;
      }
      node.innerHTML = '<strong>Single school</strong><span>Open advanced options to compare</span>';
    }

    function titleCase(value) {
      return String(value || '')
        .replace(/\w\S*/g, word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
        .replace(/\bNon-metro\b/g, 'Non-Metro');
    }

    function bindEvents() {
      $('connect-btn').addEventListener('click', () => connect());
      $('auth-connect-btn').addEventListener('click', () => connect({ fromAuth: true }));
      $('drilldown-close').addEventListener('click', () => closeDrilldownModal());
      $('drilldown-modal').addEventListener('click', event => {
        if (event.target === $('drilldown-modal')) {
          closeDrilldownModal();
          return;
        }
        const school = event.target.closest('[data-drill-school]');
        const program = event.target.closest('[data-drill-program]');
        if (!school && !program) return;
        event.preventDefault();
        const context = state.activeDrilldownContext;
        if (!context) return;
        openPostgradDrilldown({
          ...context,
          selectedSchool: school ? school.dataset.drillSchool : null,
          selectedProgram: program ? program.dataset.drillProgram : null,
        });
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closeDrilldownModal();
      });
      ['auth-api-url', 'auth-api-password'].forEach(id => {
        $(id).addEventListener('keydown', event => {
          if (event.key === 'Enter') connect({ fromAuth: true });
        });
      });
      $('advanced-btn').addEventListener('click', () => {
        setAdvancedOpen(!$('advanced-panel').classList.contains('open'));
      });
      $('compare-status').addEventListener('click', () => setAdvancedOpen(true));
      $('advanced-reset-btn').addEventListener('click', () => resetAdvancedOptions());
      $('advanced-apply-btn').addEventListener('click', () => applyAdvancedOptions());
      $('download-visible-btn').addEventListener('click', () => downloadVisibleCharts());
      $('print-page-btn').addEventListener('click', () => window.print());
      $('tabs').addEventListener('click', event => {
        const tab = event.target.closest('.tab');
        if (!tab) return;
        state.tab = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(node => node.classList.toggle('active', node === tab));
        applyDefaultViewForTab(state.tab);
        syncViewToggle();
        refresh({ resetDrill: true });
      });

      $('view-toggle').addEventListener('click', event => {
        const button = event.target.closest('[data-view-mode]');
        if (!button) return;
        state.viewMode = button.dataset.viewMode;
        storage.setItem('outcomes.viewMode', state.viewMode);
        syncViewToggle();
        refresh();
      });

      $('selection-toggle').addEventListener('click', event => {
        const button = event.target.closest('[data-selection-mode]');
        if (!button) return;
        syncSelectionMode(button.dataset.selectionMode);
        setAdvancedOpen(true);
      });

      $('horizon-toggle').addEventListener('click', event => {
        const button = event.target.closest('[data-horizon]');
        if (!button) return;
        $('horizon-select').value = button.dataset.horizon;
        state.appliedAdvanced = { ...activeAdvancedControls(), horizon: button.dataset.horizon };
        syncHorizonToggle();
        refresh({ resetDrill: true });
      });

      ['school-select', 'degree-select'].forEach(id => {
        $(id).addEventListener('change', () => {
          if (id === 'school-select') clearDashboardCache();
          refresh({ reloadOptions: true, resetDrill: true });
        });
      });
      $('major-select').addEventListener('change', () => refresh({ resetDrill: true }));
      ['compare-school-select', 'compare-major-select', 'cip-level-select'].forEach(id => {
        $(id).addEventListener('change', () => {
          if (id === 'compare-school-select') {
            refreshCompareSchoolPicker();
          }
          if (id === 'compare-major-select') {
            refreshCompareMajorPicker();
          }
          setAdvancedOpen(true);
        });
      });
      $('compare-school-picker').addEventListener('click', event => {
        const add = event.target.closest('[data-add-compare-school]');
        const remove = event.target.closest('[data-remove-compare-school]');
        const clear = event.target.closest('[data-clear-compare-schools]');
        if (!add && !remove && !clear) return;
        event.preventDefault();
        if (clear) {
          Array.from($('compare-school-select').options).forEach(opt => { opt.selected = false; });
        } else {
          const value = add?.dataset.addCompareSchool || remove?.dataset.removeCompareSchool;
          setHiddenSelectValue('compare-school-select', value, Boolean(add));
        }
        refreshCompareSchoolPicker();
      });
      $('compare-major-picker').addEventListener('click', event => {
        const add = event.target.closest('[data-add-compare-major]');
        const remove = event.target.closest('[data-remove-compare-major]');
        const clear = event.target.closest('[data-clear-compare-majors]');
        if (!add && !remove && !clear) return;
        event.preventDefault();
        if (clear) {
          Array.from($('compare-major-select').options).forEach(opt => { opt.selected = false; });
        } else {
          const value = add?.dataset.addCompareMajor || remove?.dataset.removeCompareMajor;
          setHiddenSelectValue('compare-major-select', value, Boolean(add));
        }
        refreshCompareMajorPicker();
      });
      ['horizon-select', 'from-year-select', 'to-year-select', 'gender-select', 'race-select', 'later-degree-filter', 'no-further-select', 'current-select', 'school-employer-select'].forEach(id => {
        $(id).addEventListener('change', () => {
          if (id === 'later-degree-filter' && $('later-degree-filter').value) $('no-further-select').value = 'false';
          if (id === 'no-further-select' && $('no-further-select').value === 'true') $('later-degree-filter').value = '';
          setAdvancedOpen(true);
        });
      });
      $('content').addEventListener('change', event => {
        const destinationType = event.target.closest('[data-destination-type]');
        if (destinationType) {
          const side = destinationType.dataset.destinationType;
          const nextType = validDestinationType(destinationType.value);
          if (!nextType || !['left', 'right'].includes(side)) return;
          const previousType = side === 'left' ? state.destinationLeftType : state.destinationRightType;
          if (side === 'left') state.destinationLeftType = nextType;
          if (side === 'right') state.destinationRightType = nextType;
          normalizeDestinationTypes(side, previousType);
          state.destinationLeftPath = [];
          state.destinationRightPath = [];
          storage.setItem('outcomes.destinationLeftType', state.destinationLeftType);
          storage.setItem('outcomes.destinationRightType', state.destinationRightType);
          storage.removeItem('outcomes.destinationRelation');
          if (state.selectionMode === 'compare' || state.selectionMode === 'major_compare') renderComparePage();
          else renderDestinations();
          queuePlotResize();
          return;
        }
        const select = event.target.closest('[data-top-n-control]');
        if (!select) return;
        const value = validTopN(select.value);
        if (!value) return;
        const chartId = select.dataset.chartId || chartIdFromTopControl(select.id);
        state.topNByChart = { ...(state.topNByChart || {}), [chartId]: value };
        storage.setItem('outcomes.topNByChart', JSON.stringify(state.topNByChart));
        render();
        queuePlotResize();
      });
      $('content').addEventListener('click', event => {
        const destinationHorizon = event.target.closest('[data-destination-horizon]');
        if (destinationHorizon) {
          event.preventDefault();
          state.destinationHorizon = destinationHorizon.dataset.destinationHorizon || 'all';
          state.destinationLeftPath = [];
          state.destinationRightPath = [];
          storage.setItem('outcomes.destinationHorizon', state.destinationHorizon);
          refresh({ resetDrill: true });
          return;
        }
        const infoButton = event.target.closest('[data-chart-info-id]');
        if (infoButton) {
          event.preventDefault();
          document.querySelectorAll('[data-save-options]').forEach(node => { node.hidden = true; });
          openChartInfo(infoButton.dataset.chartInfoId, infoButton.dataset.chartInfoTitle);
          return;
        }
        const horizonButton = event.target.closest('[data-chart-horizon]');
        if (horizonButton) {
          event.preventDefault();
          const value = horizonButton.dataset.chartHorizon;
          if (!HORIZON_OPTIONS.some(option => option.value === value)) return;
          if ($('horizon-select')) $('horizon-select').value = value;
          state.appliedAdvanced = { ...activeAdvancedControls(), horizon: value };
          syncHorizonToggle();
          refresh({ resetDrill: true });
          return;
        }
        const saveMenuButton = event.target.closest('[data-save-chart-menu]');
        if (saveMenuButton && !saveMenuButton.hidden) {
          event.preventDefault();
          const menu = saveMenuButton.closest('[data-save-menu]')?.querySelector('[data-save-options]');
          const willOpen = menu?.hidden;
          document.querySelectorAll('[data-save-options]').forEach(node => { node.hidden = true; });
          if (menu) menu.hidden = !willOpen;
          return;
        }
        const button = event.target.closest('[data-download-chart]');
        if (!button) {
          document.querySelectorAll('[data-save-options]').forEach(node => { node.hidden = true; });
          return;
        }
        event.preventDefault();
        const menu = button.closest('[data-save-options]');
        if (menu) menu.hidden = true;
        downloadChart(button.dataset.downloadChart, button.dataset.saveMode || 'save');
      });
      $('export-tray').addEventListener('click', event => {
        const close = event.target.closest('.export-tray-close');
        if (!close) return;
        $('export-tray').hidden = true;
      });
    }

    function applyDefaultViewForTab(tab, selectionMode = state.selectionMode) {
      const nextMode = defaultViewForTab(tab, selectionMode);
      if (state.viewMode !== nextMode) {
        state.viewMode = nextMode;
        storage.setItem('outcomes.viewMode', state.viewMode);
      }
    }

    function syncViewToggle() {
      document.querySelectorAll('[data-view-mode]').forEach(button => {
        button.classList.toggle('active', button.dataset.viewMode === state.viewMode);
      });
    }

    function syncSelectionMode(mode = state.selectionMode) {
      const selectedMode = mode || 'single';
      document.body.classList.toggle('school-compare-mode', selectedMode === 'compare');
      document.body.classList.toggle('major-compare-mode', selectedMode === 'major_compare');
      document.querySelectorAll('[data-selection-mode]').forEach(button => {
        button.classList.toggle('active', button.dataset.selectionMode === selectedMode);
      });
      syncCompareStatus(selectedMode);
    }

    function syncHorizonToggle() {
      const horizon = $('horizon-select').value || '1yr';
      document.querySelectorAll('[data-horizon]').forEach(button => {
        button.classList.toggle('active', button.dataset.horizon === horizon);
      });
    }

    function init() {
      const configuredApiUrl = normalizeApiUrl(defaultApiUrl());
      const savedApiUrl = normalizeApiUrl(storage.getItem('outcomes.apiUrl'));
      const savedTopN = Number(storage.getItem('outcomes.topN'));
      $('api-url').value = configuredApiUrl || savedApiUrl;
      $('api-password').value = storage.getItem('outcomes.apiPassword') || '';
      syncAuthFieldsFromControls();
      if (TOP_N_OPTIONS.includes(savedTopN)) $('top-n-select').value = String(savedTopN);
      state.topNByChart = loadStoredTopNByChart();
      applyDefaultViewForTab(state.tab);
      syncViewToggle();
      syncSelectionMode();
      setAdvancedOpen(state.selectionMode === 'compare' || state.selectionMode === 'major_compare');
      syncHorizonToggle();
      bindEvents();
      showAuthModal($('api-password').value ? 'Connecting with saved credentials...' : '');
      if ($('api-url').value && $('api-password').value) connect();
      else setMessage('Enter the protected API URL and password to connect.');
    }

    init();
  </script>
</body>
</html>
