<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>College Outcomes Explorer</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="shortcut icon" href="./favicon.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700;900&family=Source+Sans+3:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.plot.ly" />
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    :root {
      --ink: #2D426A;
      --muted: #667791;
      --label: #8795A8;
      --line: #E4EBF3;
      --panel: #ffffff;
      --panel-soft: #F4F8FB;
      --bg: #F4F8FB;
      --navy: #2D426A;
      --navy-dark: #18263E;
      --navy-mid: #405B8C;
      --blue: #49C8FF;
      --blue-2: #2F83D0;
      --green: #48EB8F;
      --green-dim: #00A878;
      --cream: #FFF9D8;
      --cream-2: #FFFDF0;
      --glass: rgba(255,255,255,0.84);
      --cyan: #42B8DA;
      --gold: #D7A42B;
      --rose: #E33F46;
      --pink: #E783C4;
      --violet: #A77BDD;
      --tm-ink: #2D426A;
      --tm-muted: #7F8EA3;
      --tm-line: #E4EBF3;
      --tm-low: #F4F8FB;
      --tm-mid: #49C8FF;
      --tm-high: #2D426A;
      --tm-gray: #A8B5C4;
      --tm-shadow: 0 8px 24px rgba(45, 66, 106, 0.08);
      --shadow: 0 10px 30px rgba(45, 66, 106, 0.08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      font-size: 86%;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: 'Source Sans Pro', 'Source Sans 3', ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(circle at 8% 3%, rgba(255,249,216,0.78), transparent 26%),
        radial-gradient(circle at 10% 4%, rgba(73,200,255,0.13), transparent 24%),
        radial-gradient(circle at 92% 0%, rgba(72,235,143,0.12), transparent 26%),
        linear-gradient(180deg, #F8FAFC 0%, #EEF4F8 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      padding: 0 22px 16px;
      border-bottom: 1px solid rgba(45,66,106,0.10);
      background: rgba(255,255,255,0.86);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 12px 32px rgba(45,66,106,0.08);
      border-top: 3px solid var(--green);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 -22px 14px;
      padding: 22px 22px 20px;
      color: white;
      background:
        radial-gradient(circle at 86% 8%, rgba(73,200,255,0.20), transparent 28%),
        radial-gradient(circle at 8% 0%, rgba(72,235,143,0.18), transparent 26%),
        linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 68%, var(--navy-mid) 100%);
      border-bottom: 3px solid var(--green);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 2.2vw, 36px);
      letter-spacing: -0.02em;
      line-height: 1;
      font-family: 'Source Sans Pro', 'Source Sans 3', ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
    }

    .status {
      display: flex;
      gap: 10px;
      align-items: center;
      color: rgba(255,255,255,0.82);
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #b8c6d6;
      box-shadow: 0 0 0 5px rgba(184, 198, 214, 0.18);
    }

    .dot.ok { background: var(--green); box-shadow: 0 0 0 5px rgba(72, 235, 143, 0.18); }
    .dot.bad { background: var(--rose); box-shadow: 0 0 0 5px rgba(223, 77, 95, 0.16); }

    .connection, .filters {
      display: grid;
      grid-template-columns: minmax(300px, 1.1fr) minmax(220px, 0.8fr) auto;
      gap: 10px 12px;
      align-items: end;
    }

    .connection.connected {
      display: none;
    }

    .filters {
      grid-template-columns: minmax(310px, 1.5fr) minmax(180px, 0.72fr) max-content minmax(320px, 1.25fr) max-content auto;
      margin-top: 0;
      align-items: end;
      padding: 0 2px;
    }

    .advanced {
      display: none;
      grid-template-columns: minmax(240px, 1.4fr) repeat(7, minmax(130px, 1fr));
      gap: 12px 18px;
      margin-top: 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel-soft);
    }

    .advanced.open { display: grid; }

    .segmented {
      display: inline-flex;
      gap: 6px;
      flex-wrap: nowrap;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(245,248,252,0.96);
      min-height: 40px;
      align-items: center;
    }

    .segmented .btn {
      min-height: 34px;
      border-radius: 999px;
      padding: 6px 12px;
      border-color: transparent;
      background: transparent;
      box-shadow: none;
    }

    .segmented .btn.active {
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 100%);
      color: #fff;
      box-shadow: 0 8px 18px rgba(45,66,106,0.16), inset 0 -3px 0 rgba(72,235,143,0.42);
    }

    .refresh-state {
      position: fixed;
      inset: 0;
      z-index: 45;
      display: none;
      place-items: center;
      padding: 24px;
      pointer-events: none;
      isolation: isolate;
    }

    .refresh-state::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(circle at 50% 42%, rgba(72,235,143,0.11), transparent 22%),
        radial-gradient(circle at 50% 42%, rgba(45,66,106,0.08), transparent 34%),
        rgba(246,248,251,0.38);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .refresh-state.is-visible { display: grid; }

    .loading-card {
      position: relative;
      z-index: 1;
      width: auto;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #fff;
      box-shadow: none;
      overflow: visible;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    .loading-card::after {
      display: none;
    }

    .loading-brand {
      display: none;
    }

    .loading-brand img {
      width: 148px;
      max-width: 48%;
      height: auto;
      filter: brightness(0) invert(1);
    }

    .loading-brand span {
      color: rgba(255,255,255,0.72);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .loading-chart {
      position: relative;
      z-index: 1;
      height: auto;
      border: 0;
      border-radius: 50%;
      background: transparent;
      overflow: visible;
      display: grid;
      place-items: center;
    }

    .loading-pie-wrap {
      position: relative;
      width: 172px;
      height: 172px;
      display: grid;
      place-items: center;
      transform: translateZ(0);
      filter: drop-shadow(0 22px 42px rgba(20,44,65,0.28));
    }

    .loading-pie-wrap::before {
      content: '';
      position: absolute;
      inset: -24px;
      border-radius: 50%;
      background:
        conic-gradient(from 120deg, transparent 0deg 72deg, rgba(72,235,143,0.72) 72deg 118deg, transparent 118deg 360deg);
      -webkit-mask: radial-gradient(circle, transparent 0 72px, #000 73px 78px, transparent 79px);
      mask: radial-gradient(circle, transparent 0 72px, #000 73px 78px, transparent 79px);
      opacity: 0.95;
      animation: loading-pie-orbit 3.6s linear infinite;
    }

    .loading-data-dot {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 3;
      width: var(--dot-size, 9px);
      height: var(--dot-size, 9px);
      border-radius: 50%;
      background: var(--dot-color, var(--green));
      box-shadow: 0 0 0 4px rgba(255,255,255,0.22), 0 0 20px var(--dot-glow, rgba(72,235,143,0.62));
      opacity: 0;
      transform: translate(var(--from-x), var(--from-y)) scale(0.55);
      animation: loading-data-flow 2.35s cubic-bezier(0.44, 0, 0.18, 1) infinite;
      animation-delay: var(--delay, 0s);
      will-change: transform, opacity;
    }

    .loading-data-dot:nth-child(1) {
      --from-x: -156px; --from-y: -76px; --mid-x: -70px; --mid-y: -34px; --to-x: -22px; --to-y: -14px;
      --dot-color: #48EB8F; --dot-glow: rgba(72,235,143,0.66); --delay: 0s;
    }

    .loading-data-dot:nth-child(2) {
      --from-x: 142px; --from-y: -84px; --mid-x: 68px; --mid-y: -36px; --to-x: 21px; --to-y: -18px;
      --dot-color: #72AFF4; --dot-glow: rgba(114,175,244,0.62); --delay: 0.18s; --dot-size: 8px;
    }

    .loading-data-dot:nth-child(3) {
      --from-x: -170px; --from-y: 14px; --mid-x: -88px; --mid-y: 8px; --to-x: -30px; --to-y: 8px;
      --dot-color: #2D426A; --dot-glow: rgba(45,66,106,0.48); --delay: 0.36s; --dot-size: 10px;
    }

    .loading-data-dot:nth-child(4) {
      --from-x: 166px; --from-y: 22px; --mid-x: 84px; --mid-y: 8px; --to-x: 31px; --to-y: 10px;
      --dot-color: #48EB8F; --dot-glow: rgba(72,235,143,0.66); --delay: 0.54s;
    }

    .loading-data-dot:nth-child(5) {
      --from-x: -112px; --from-y: 132px; --mid-x: -48px; --mid-y: 58px; --to-x: -16px; --to-y: 28px;
      --dot-color: #72AFF4; --dot-glow: rgba(114,175,244,0.62); --delay: 0.72s; --dot-size: 8px;
    }

    .loading-data-dot:nth-child(6) {
      --from-x: 116px; --from-y: 124px; --mid-x: 52px; --mid-y: 58px; --to-x: 18px; --to-y: 28px;
      --dot-color: #48EB8F; --dot-glow: rgba(72,235,143,0.66); --delay: 0.9s; --dot-size: 10px;
    }

    .loading-data-dot:nth-child(7) {
      --from-x: -38px; --from-y: -162px; --mid-x: -18px; --mid-y: -76px; --to-x: -6px; --to-y: -30px;
      --dot-color: #F8FBFF; --dot-glow: rgba(255,255,255,0.58); --delay: 1.08s; --dot-size: 7px;
    }

    .loading-data-dot:nth-child(8) {
      --from-x: 44px; --from-y: -158px; --mid-x: 22px; --mid-y: -76px; --to-x: 8px; --to-y: -31px;
      --dot-color: #2D426A; --dot-glow: rgba(45,66,106,0.52); --delay: 1.26s; --dot-size: 7px;
    }

    .loading-pie {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 50%;
      background:
        conic-gradient(
          from -22deg,
          var(--green) 0deg 84deg,
          #72aff4 84deg 158deg,
          #ffffff 158deg 174deg,
          #87d6ad 174deg 236deg,
          #2d426a 236deg 310deg,
          rgba(255,255,255,0.16) 310deg 360deg
        );
      box-shadow: 0 0 0 12px rgba(255,255,255,0.16), 0 0 0 24px rgba(72,235,143,0.08);
      animation: loading-pie-spin 2.35s cubic-bezier(0.56, 0, 0.21, 1) infinite;
    }

    .loading-pie::before {
      content: '';
      position: absolute;
      inset: 28px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 48% 42%, rgba(255,255,255,0.14), transparent 34%),
        rgba(9,25,48,0.76);
      border: 1px solid rgba(255,255,255,0.14);
    }

    .loading-pie::after {
      content: '';
      position: absolute;
      inset: -13px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.16);
      animation: loading-ring-pulse 2.15s ease-in-out infinite;
    }

    .loading-pie-marker {
      position: absolute;
      inset: -7px;
      z-index: 4;
      border-radius: 50%;
      animation: loading-pie-marker-spin 2.35s cubic-bezier(0.56, 0, 0.21, 1) infinite;
    }

    .loading-pie-marker::after {
      content: '';
      position: absolute;
      top: -2px;
      left: calc(50% - 6px);
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 5px rgba(72,235,143,0.24), 0 0 22px rgba(72,235,143,0.72);
    }

    .loading-pie-core {
      position: relative;
      z-index: 5;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fbf8f0;
      box-shadow: 0 12px 28px rgba(0,0,0,0.20), inset 0 -3px 0 rgba(72,235,143,0.18), 0 0 0 2px rgba(255,255,255,0.70);
    }

    .loading-pie-core img {
      width: 39px;
      height: 39px;
    }

    .loading-copy {
      display: none;
    }

    .loading-copy strong {
      display: block;
      font-family: 'Source Sans Pro', 'Source Sans 3', ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(1.35rem, 2.5vw, 1.75rem);
      line-height: 1;
      letter-spacing: -0.02em;
    }

    .loading-copy span {
      display: block;
      margin-top: 4px;
      color: rgba(255,255,255,0.68);
      font-size: 0.82rem;
      font-weight: 800;
    }

    .loading-pulse {
      display: inline-flex;
      gap: 5px;
      padding: 8px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
    }

    .loading-pulse i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      opacity: 0.38;
      animation: loading-dot 1.1s ease-in-out infinite;
    }

    .loading-pulse i:nth-child(2) { animation-delay: 0.16s; }
    .loading-pulse i:nth-child(3) { animation-delay: 0.32s; }

    @keyframes loading-pie-spin {
      0% {
        transform: rotate(-18deg) scale(0.94);
        background: conic-gradient(from -22deg, var(--green) 0deg 84deg, #72aff4 84deg 158deg, #ffffff 158deg 174deg, #87d6ad 174deg 236deg, #2d426a 236deg 310deg, rgba(255,255,255,0.16) 310deg 360deg);
      }
      34% {
        transform: rotate(128deg) scale(1.04);
        background: conic-gradient(from -22deg, var(--green) 0deg 132deg, #72aff4 132deg 198deg, #ffffff 198deg 214deg, #87d6ad 214deg 258deg, #2d426a 258deg 328deg, rgba(255,255,255,0.16) 328deg 360deg);
      }
      68% {
        transform: rotate(252deg) scale(0.98);
        background: conic-gradient(from -22deg, var(--green) 0deg 58deg, #72aff4 58deg 172deg, #ffffff 172deg 190deg, #87d6ad 190deg 288deg, #2d426a 288deg 338deg, rgba(255,255,255,0.16) 338deg 360deg);
      }
      100% {
        transform: rotate(342deg) scale(0.94);
        background: conic-gradient(from -22deg, var(--green) 0deg 84deg, #72aff4 84deg 158deg, #ffffff 158deg 174deg, #87d6ad 174deg 236deg, #2d426a 236deg 310deg, rgba(255,255,255,0.16) 310deg 360deg);
      }
    }

    @keyframes loading-pie-marker-spin {
      0% { transform: rotate(0deg); }
      42% { transform: rotate(220deg); }
      68% { transform: rotate(292deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes loading-data-flow {
      0% {
        opacity: 0;
        transform: translate(var(--from-x), var(--from-y)) scale(0.45);
      }
      12% {
        opacity: 1;
        transform: translate(var(--from-x), var(--from-y)) scale(0.7);
      }
      52% {
        opacity: 0.96;
        transform: translate(var(--mid-x), var(--mid-y)) scale(1);
      }
      78% {
        opacity: 1;
        transform: translate(var(--to-x), var(--to-y)) scale(0.7);
      }
      100% {
        opacity: 0;
        transform: translate(0, 0) scale(0.18);
      }
    }

    @keyframes loading-pie-orbit {
      to { transform: rotate(360deg); }
    }

    @keyframes loading-ring-pulse {
      0%, 100% { opacity: 0.36; transform: scale(0.96); }
      46% { opacity: 0.82; transform: scale(1.04); }
    }

    @keyframes loading-dot {
      0%, 80%, 100% { opacity: 0.32; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-pie,
      .loading-pie::after,
      .loading-pie-wrap::before,
      .loading-pie-marker,
      .loading-data-dot,
      .loading-pulse i {
        animation: none;
      }
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .control-field {
      display: grid;
      gap: 6px;
      align-content: end;
    }

    .control-label {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(245,248,252,0.96);
      color: var(--ink);
      padding: 8px 12px;
      outline: none;
      font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--navy) 50%),
        linear-gradient(135deg, var(--navy) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) 50%,
        calc(100% - 12px) 50%;
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 34px;
    }

    select[multiple] {
      min-height: 72px;
      padding: 6px 10px;
      background-image: none;
    }

    input:focus, select:focus {
      border-color: rgba(72,235,143,0.52);
      box-shadow: 0 8px 18px rgba(45,66,106,0.08), inset 0 1px 0 rgba(255,255,255,0.92);
    }

    .btn {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 12px;
      color: var(--ink);
      background: rgba(245,248,252,0.96);
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
      white-space: nowrap;
    }

    .btn:hover, select:hover, input:hover {
      border-color: rgba(72,235,143,0.46);
      box-shadow: 0 8px 18px rgba(45,66,106,0.08), inset 0 1px 0 rgba(255,255,255,0.92);
    }

    .btn.secondary {
      background: rgba(255,255,255,0.9);
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .btn.active, #connect-btn {
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 100%);
      color: white;
      border-color: transparent;
      box-shadow: 0 10px 22px rgba(45,66,106,0.18), inset 0 -3px 0 rgba(72,235,143,0.42);
    }

    .tabs {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      width: min(1680px, calc(100vw - 44px));
      margin: 14px auto 10px;
      padding: 2px 2px 8px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.78);
      border-radius: 999px;
      padding: 11px 18px;
      color: var(--muted);
      font-weight: 900;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .tab:hover {
      transform: translateY(-1px);
      border-color: rgba(73,200,255,0.34);
      color: var(--navy);
      box-shadow: 0 10px 22px rgba(45,66,106,0.08), inset 0 1px 0 rgba(255,255,255,0.85);
    }

    .tab.active {
      color: white;
      border-color: transparent;
      background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy) 100%);
      box-shadow: inset 0 -3px 0 rgba(72,235,143,0.42);
    }

    .icon-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .tab-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: currentColor;
      opacity: 0.82;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tab.active .tab-icon {
      opacity: 1;
      color: var(--green);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: clamp(14px, 1.25vw, 22px);
    }

    .card, .metric {
      position: relative;

      border-top: 1px solid rgba(22,50,74,0.08);
    }

    .compare-stat-row span {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.035em;
      font-size: 0.64rem;
      font-weight: 800;
    }

    .compare-stat-row strong {
      color: var(--navy);
      font-size: 0.95rem;
      line-height: 1.12;
      font-weight: 850;
      text-align: right;
      overflow-wrap: normal;
      word-break: normal;
    }

    .no-data,
    .empty,
    .error {
      padding: 42px 18px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(22,50,74,0.12);
      border-radius: 18px;
      background: rgba(245,248,252,0.72);
    }

    .api-status {
      position: absolute;
      right: 24px;
      top: 18px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,0.86);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    @media (max-width: 1180px) {
      header { position: static; }
      .controls { position: relative; top: auto; }
      .connection, .filters, .advanced { grid-template-columns: repeat(2, minmax(260px, 1fr)); }
      .controls-main { grid-template-columns: repeat(2, minmax(280px, 1fr)); }
      .span-3, .span-4, .span-5, .span-6, .span-7, .span-8, .span-12 { grid-column: span 12; }
      .treemap-card.span-6 { grid-column: span 6; }
      .metric.span-3 { grid-column: span 6; }
      .metric.span-4 { grid-column: span 4; }
    }

    @media (max-width: 980px) {
      .treemap-card.span-6 { grid-column: span 12; }
    }

    @media (max-width: 720px) {
      .topline, .connection, .filters { grid-template-columns: 1fr; display: grid; }
      .advanced.open { grid-template-columns: 1fr; display: grid; }
      .controls { padding: 10px 12px; }
      .controls-main { display: flex; flex-wrap: wrap; gap: 10px; }
      .advanced-toggle { margin-left: 0; }
      .tabs { width: calc(100vw - 20px); margin-top: 10px; }
      .tab { padding: 10px 15px; }
      .content { padding: 14px 10px 34px; }
      .metric, .card { padding: 18px; }
      .salary-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .career-model-grid { grid-template-columns: 1fr; }
      .internship-panel,
      .internship-panel.with-conversions { grid-template-columns: 1fr; }
      select[multiple] { min-height: 92px; }
      .compare-picker-body { grid-template-columns: 1fr; }
      .advanced-actions { justify-content: flex-start; }
    }

    @media print {
      body {
        background: #fff;
      }

      .hero,
      .controls,
      .tabs,
      .api-status,
      .card-controls,
      .card-actions,
      .chart-download {
        display: none !important;
      }

      .content {
        width: 100%;
        max-width: none;
        padding: 0;
      }

      .content .grid {
        gap: 12px;
      }

      .card,
      .metric {
        break-inside: avoid;
        box-shadow: none;
        border-color: rgba(22,50,74,0.16);
      }
    }

    @media (max-width: 520px) {
      .metric.span-3, .metric.span-4 { grid-column: span 12; }
      .hero { padding: 34px 18px 24px; }
      .api-status {
        position: static;
        margin-top: 14px;
      }
    }
</style>

  <script>
    const COLORS = [
      '#49C8FF', '#00A878', '#E783C4', '#D7A42B',
      '#E33F46', '#2F83D0', '#48EB8F', '#A8B5C4',
      '#42B8DA', '#A77BDD', '#536176', '#CAD3DE'
    ];
    const THEME = {
      navy: '#2D426A',
      navyDark: '#18263E',
      navyMid: '#405B8C',
      green: '#48EB8F',
      greenDim: '#00A878',
      muted: '#667791',
      label: '#8795A8',
      border: '#E4EBF3',
      grid: '#EAF0F5',
      bg: '#F4F8FB'
    };
    const storage = window.localStorage;
    const DESTINATION_TYPE_VALUES = ['roles', 'employers', 'industries'];
    const DESTINATION_TYPE_FALLBACKS = {
      roles: 'employers',
      employers: 'roles',
      industries: 'roles',
    };
    const LEGACY_DESTINATION_RELATION_TYPES = {
      roles_employers: ['roles', 'employers'],
      employers_roles: ['employers', 'roles'],
      roles_industries: ['roles', 'industries'],
      industries_roles: ['industries', 'roles'],
      employers_industries: ['employers', 'industries'],
      industries_employers: ['industries', 'employers'],
    };
    const validDestinationType = value => DESTINATION_TYPE_VALUES.includes(value) ? value : null;
    function initialDestinationTypes() {
      const legacyPair = LEGACY_DESTINATION_RELATION_TYPES[storage.getItem('outcomes.destinationRelation')] || [];
      let leftType = validDestinationType(storage.getItem('outcomes.destinationLeftType')) || legacyPair[0] || 'roles';
      let rightType = validDestinationType(storage.getItem('outcomes.destinationRightType')) || legacyPair[1] || 'employers';
      if (leftType === rightType) rightType = DESTINATION_TYPE_FALLBACKS[leftType] || 'employers';
      return { leftType, rightType };
    }
    const destinationTypeInitial = initialDestinationTypes();
    const state = {
      apiUrl: '',
      password: '',
      options: null,
      data: null,
      tab: 'overview',
      viewMode: storage.getItem('outcomes.viewMode') || 'overtime',
      selectionMode: storage.getItem('outcomes.selectionMode') || 'single',
      selectedEmployer: null,
      selectedEmployerRole: null,
      selectedPostgradDegree: null,
      selectedPostgradSchool: null,
      selectedPostgradProgram: null,
      activeDrilldownContext: null,
      roleTreePath: [],
      industryTreePath: [],
      destinationLeftType: destinationTypeInitial.leftType,
      destinationRightType: destinationTypeInitial.rightType,
      destinationHorizon: storage.getItem('outcomes.destinationHorizon') || 'all',
      destinationLeftPath: [],
      destinationRightPath: [],
      topNByChart: {},
      appliedAdvanced: null,
      loading: false,
      pendingRefresh: null,
      dashboardCache: new Map(),
      dashboardRequests: new Map(),
      prefetchGeneration: 0,
      prefetchTimer: null,
    };

    const $ = id => document.getElementById(id);
    const fmt = new Intl.NumberFormat('en-US');
    const money = value => value === null || value === undefined ? 'No data' : `$${fmt.format(Math.round(value / 1000))}k`;
    const wholePeople = value => {
      if (value === null || value === undefined) return null;
      const n = Number(value);
      return Number.isFinite(n) ? Math.round(n) : null;
    };
    const people = value => {
      const n = wholePeople(value);
      return n === null ? 'No data' : fmt.format(n);
    };
    const num = value => {
      if (value === null || value === undefined) return 'No data';
      const n = Number(value);
      if (!Number.isFinite(n)) return 'No data';
      if (n > 0 && n < 1) return '<1';
      if (Math.abs(n) < 10 && !Number.isInteger(n)) return n.toFixed(1).replace(/\.0$/, '');
      return fmt.format(Math.round(n));
    };
    const pct = value => value === null || value === undefined ? 'No data' : `${Number(value).toFixed(1)}%`;
    const TOP_N_OPTIONS = [5, 8, 10, 12, 16, 20, 30, 50];
    const HORIZON_OPTIONS = [
      { value: '1yr', label: '1 yr' },
      { value: '5yr', label: '5 yr' },
      { value: '10yr', label: '10 yr' },
    ];
    const REQUEST_TOP_N = Math.max(...TOP_N_OPTIONS);
    const DASHBOARD_CACHE_LIMIT = 120;
    const TAB_ORDER = ['overview', 'destinations', 'career', 'earnings', 'geography', 'demographics', 'postgrad'];
    const DASHBOARD_VIEW_MODES = ['snapshot', 'overtime'];
    const MAX_COMPARE_SCHOOLS = 3;
    const DESTINATION_TYPES = {
      roles: {
        label: 'Roles',
        levels: ['role_k50_v3', 'role_k150_v3'],
      },
      employers: {
        label: 'Employers',
        levels: ['employer'],
      },
      industries: {
        label: 'Industries',
        levels: ['industry_k200', 'industry_k400'],
      },
    };
    let resizeTimer = null;
    let compareWarmupTimer = null;
    const exportLinks = [];
    let exportTrayNote = '';

    const layoutBase = {
      font: { family: '"Source Sans Pro", "Source Sans 3", ui-sans-serif, system-ui, sans-serif', color: THEME.navy, size: 13 },
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      margin: { l: 72, r: 28, t: 20, b: 62 },
      xaxis: {
        gridcolor: THEME.grid,
        linecolor: THEME.border,
        zerolinecolor: THEME.grid,
        tickfont: { color: THEME.navy, size: 12 },
        titlefont: { color: THEME.muted, size: 13 },
      },
      yaxis: {
        gridcolor: THEME.grid,
        linecolor: THEME.border,
        zeroline: false,
        tickfont: { color: THEME.navy, size: 12 },
        titlefont: { color: THEME.muted, size: 13 },
      },
      legend: {
        font: { color: THEME.navy, size: 12 },
        bgcolor: 'rgba(0,0,0,0)',
      },
      colorway: COLORS,
      hoverlabel: {
        bgcolor: '#FFFFFF',
        bordercolor: THEME.navy,
        font: { family: '"Source Sans Pro", "Source Sans 3", ui-sans-serif, system-ui, sans-serif', color: THEME.navy, size: 13 }
      },
    };
    const plotConfig = { responsive: true, displayModeBar: false };

    const nativePlotlyNewPlot = Plotly.newPlot.bind(Plotly);
    Plotly.newPlot = function patchedNewPlot(id, ...args) {
      const chartId = typeof id === 'string' ? id : id?.id;
      return Promise.resolve(nativePlotlyNewPlot(id, ...args)).then(plot => {
        markChartExportable(chartId || plot?.id);
        bindLegendGroupToggles(plot);
        return plot;
      });
    };

    function compactWindow() {
      return window.innerWidth < 820;
    }

    function labelText(row) {
      return String(row?.label || row?.title || row?.employer || row?.location || row?.school_name || row?.degree_type || row?.degree || row || '');
    }

    function wrapAxisLabel(value, maxChars = compactWindow() ? 20 : 28, maxLines = compactWindow() ? 3 : 2) {
      const text = String(value ?? '').trim();
      if (text.length <= maxChars) return escapeHtml(text);
      const words = text.split(/\s+/);
      const lines = [];
      let line = '';
      words.forEach(word => {
        if (!line) {
          line = word;
          return;
        }
        if ((line + ' ' + word).length <= maxChars) {
          line += ' ' + word;
        } else {
          lines.push(line);
          line = word;
        }
      });
      if (line) lines.push(line);
      const visible = lines.slice(0, maxLines);
      if (lines.length > maxLines) {
        visible[visible.length - 1] = `${visible[visible.length - 1].replace(/[,.]$/, '')}...`;
      }
      return visible.map(escapeHtml).join('<br>');
    }

    function wrappedLabels(rows, key) {
      return (rows || []).map(row => wrapAxisLabel(key ? row[key] : labelText(row)));
    }

    function queuePlotResize() {
      window.requestAnimationFrame(() => {
        document.querySelectorAll('.js-plotly-plot').forEach(plot => Plotly.Plots.resize(plot));
      });
    }

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(queuePlotResize, 140);
    });

    function setStatus(kind, text) {
      $('status-dot').className = `dot ${kind || ''}`;
      $('status-text').textContent = text;
    }

    function setMessage(html, isError = false) {
      $('message').style.display = 'block';
      $('message').className = isError ? 'error' : 'empty';
      $('message').innerHTML = html;
      $('content').style.display = 'none';
    }

    function showContent() {
      $('message').style.display = 'none';
      $('content').style.display = 'grid';
    }

    function setAuthMessage(html = '', isError = false) {
      const node = $('auth-message');
      node.className = `auth-message ${html ? (isError ? 'error' : 'info') : ''}`;
      node.innerHTML = html;
    }

    function syncAuthFieldsFromControls() {
      $('auth-api-url').value = $('api-url').value || normalizeApiUrl(defaultApiUrl());
      $('auth-api-password').value = $('api-password').value || '';
    }

    function syncControlsFromAuthFields() {
      $('api-url').value = normalizeApiUrl($('auth-api-url').value || $('api-url').value || defaultApiUrl());
      $('api-password').value = $('auth-api-password').value || '';
    }

    function showAuthModal(message = '', isError = false) {
      syncAuthFieldsFromControls();
      setAuthMessage(message, isError);
      $('auth-modal').classList.add('open');
      window.setTimeout(() => {
        ($('auth-api-password').value ? $('auth-connect-btn') : $('auth-api-password')).focus();
      }, 0);
    }

    function hideAuthModal() {
      $('auth-modal').classList.remove('open');
      setAuthMessage('');
    }

    function normalizeApiUrl(value) {
      return String(value || '')
        .trim()
        .replace(/\/+$/, '')
        .replace(/\/api\/(health|options|dashboard)$/i, '')
        .replace(/\/+$/, '');
    }

    function defaultApiUrl() {
      if (window.OUTCOMES_API_URL) return window.OUTCOMES_API_URL;
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return 'http://localhost:8000';
      return '';
    }

    async function apiFetch(path, body) {
      if (!state.apiUrl) throw new Error('Missing API URL.');
      const headers = { 'Content-Type': 'application/json' };
      if (state.password) headers['X-Outcomes-Password'] = state.password;
      let response;
      try {
        response = await fetch(`${state.apiUrl}${path}`, {
          method: 'POST',
          headers,
          body: JSON.stringify(body || currentFilters()),
        });
      } catch (error) {
        throw new Error(`Network/CORS error reaching ${state.apiUrl}. Confirm the URL starts with https:// and Render is live.`);
      }
      if (!response.ok) {
        const text = await response.text();
        const hint = response.status === 404
          ? ' Use the base API URL only, for example https://college-outcomes-api.onrender.com, not /api/health.'
          : '';
        throw new Error(`${response.status} ${response.statusText}: ${text.slice(0, 240)}${hint}`);
      }
      return response.json();
    }

    function selectedValues(select) {
      return Array.from(select.selectedOptions || []).map(option => option.value).filter(Boolean);
    }

    function draftSelectionMode() {
      return document.querySelector('#selection-toggle [data-selection-mode].active')?.dataset.selectionMode
        || state.selectionMode
        || 'single';
    }

    function setAdvancedOpen(open) {
      $('advanced-panel').classList.toggle('open', open);
      $('advanced-btn').textContent = open ? 'Hide Advanced Options' : 'Advanced Options';
    }

    function normalizeAdvancedControls() {
      if ($('later-degree-filter')?.value) $('no-further-select').value = 'false';
      if ($('no-further-select')?.value === 'true') $('later-degree-filter').value = '';
      const from = Number($('from-year-select')?.value || 0);
      const to = Number($('to-year-select')?.value || 0);
      if (from && to && from > to) {
        $('to-year-select').value = String(from);
      }
      syncHorizonToggle();
    }

    function readAdvancedControls() {
      return {
        selectionMode: draftSelectionMode(),
        compareSchools: selectedValues($('compare-school-select')).map(String),
        compareMajors: selectedValues($('compare-major-select')).map(String),
        cipLevel: $('cip-level-select')?.value || 'cip4',
        fromYear: $('from-year-select')?.value || '',
        toYear: $('to-year-select')?.value || '',
        horizon: $('horizon-select')?.value || '1yr',
        gender: $('gender-select')?.value || '',
        race: $('race-select')?.value || '',
        laterDegree: $('later-degree-filter')?.value || '',
        noFurther: $('no-further-select')?.value || '',
        currentStudents: $('current-select')?.value || 'true',
        schoolEmployer: $('school-employer-select')?.value || 'false',
      };
    }

    function activeAdvancedControls() {
      return state.appliedAdvanced || readAdvancedControls();
    }

    function initializeAppliedAdvancedControls() {
      if (state.appliedAdvanced) return;
      normalizeAdvancedControls();
      state.appliedAdvanced = readAdvancedControls();
      state.selectionMode = state.appliedAdvanced.selectionMode;
      syncSelectionMode(state.selectionMode);
    }

    function persistAdvancedControls(advanced) {
      storage.setItem('outcomes.selectionMode', advanced.selectionMode);
      storage.setItem('outcomes.compareSchools', JSON.stringify(advanced.compareSchools || []));
      storage.setItem('outcomes.compareMajors', JSON.stringify(advanced.compareMajors || []));
    }

    function advancedChangeNeedsOptionsReload(previous, next) {
      if (!previous) return false;
      return previous.cipLevel !== next.cipLevel;
    }

    function applyAdvancedOptions() {
      normalizeAdvancedControls();
      const previousAdvanced = state.appliedAdvanced ? { ...state.appliedAdvanced } : null;
      const advanced = readAdvancedControls();
      if (advanced.selectionMode === 'compare') {
        advanced.compareSchools = trimCompareSchools(advanced.compareSchools);
        Array.from($('compare-school-select').options).forEach(opt => {
          opt.selected = advanced.compareSchools.includes(String(opt.value));
        });
        renderCompareSchoolPicker(state.options?.schools || [], new Set(advanced.compareSchools));
      }
      state.appliedAdvanced = advanced;
      state.selectionMode = advanced.selectionMode;
      persistAdvancedControls(advanced);
      syncSelectionMode(advanced.selectionMode);
      applyDefaultViewForTab(state.tab, advanced.selectionMode);
      syncViewToggle();
      if (compareNeedsSelections(advanced)) {
        setAdvancedOpen(true);
        state.data = {
          overview: {},
          school_comparison: [],
          major_comparison: [],
          meta: state.options?.meta || {},
        };
        showContent();
        render();
        setStatus('ok', `${state.options?.meta?.data_version || 'Connected'} | pick comparison items`);
        return;
      }
      setAdvancedOpen(false);
      refresh({
        reloadOptions: advancedChangeNeedsOptionsReload(previousAdvanced, advanced),
        resetDrill: true,
      });
    }

    function resetAdvancedOptions() {
      clearTimeout(compareWarmupTimer);
      const previousAdvanced = state.appliedAdvanced ? { ...state.appliedAdvanced } : null;
      state.lastCompareWarmupKey = '';
      Array.from($('compare-school-select').options).forEach(opt => { opt.selected = false; });
      Array.from($('compare-major-select').options).forEach(opt => { opt.selected = false; });
      $('cip-level-select').value = 'cip4';
      const years = state.options?.grad_years || [];
      if (years.length) {
        $('from-year-select').value = String(years[0]);
        $('to-year-select').value = String(years[years.length - 1]);
      }
      if (Array.from($('horizon-select').options).some(opt => opt.value === '1yr')) {
        $('horizon-select').value = '1yr';
      }
      $('gender-select').value = '';
      $('race-select').value = '';
      $('later-degree-filter').value = '';
      $('no-further-select').value = '';
      $('current-select').value = 'true';
      $('school-employer-select').value = 'false';
      state.selectionMode = 'single';
      syncSelectionMode('single');
      syncHorizonToggle();
      renderCompareSchoolPicker(state.options?.schools || [], new Set());
      renderCompareMajorPicker(state.options?.major_options || [], new Set());
      state.appliedAdvanced = readAdvancedControls();
      persistAdvancedControls(state.appliedAdvanced);
      setAdvancedOpen(false);
      refresh({
        reloadOptions: advancedChangeNeedsOptionsReload(previousAdvanced, state.appliedAdvanced),
        resetDrill: true,
      });
    }

    function getSelectedSchools(advanced = activeAdvancedControls()) {
      const primary = $('school-select').value ? [$('school-select').value] : [];
      if (advanced.selectionMode !== 'compare') return primary;
      const compare = trimCompareSchools(advanced.compareSchools || [], primary[0] || '');
      return [...new Set([...primary, ...compare])].filter(Boolean);
    }

    function trimCompareSchools(values, primary = String($('school-select')?.value || '')) {
      const maxComparisonSchools = Math.max(0, MAX_COMPARE_SCHOOLS - (primary ? 1 : 0));
      return [...new Set((values || []).map(String))]
        .filter(value => value && value !== primary)
        .slice(0, maxComparisonSchools);
    }

    function getSelectedMajors(advanced = activeAdvancedControls()) {
      if (advanced.selectionMode === 'major_compare') return advanced.compareMajors || [];
      return $('major-select').value ? [$('major-select').value] : [];
    }

    function compareNeedsSelections(advanced = activeAdvancedControls()) {
      if (advanced.selectionMode === 'compare') return (advanced.compareSchools || []).length < 1;
      if (advanced.selectionMode === 'major_compare') return (advanced.compareMajors || []).length < 2;
      return false;
    }

    function defaultViewForTab(tab, selectionMode = state.selectionMode) {
      if (selectionMode === 'compare' || selectionMode === 'major_compare') {
        return tab === 'career' ? 'overtime' : 'snapshot';
      }
      if (tab === 'destinations') return 'snapshot';
      const overTimeTabs = new Set(['overview', 'earnings', 'career', 'geography', 'demographics']);
      return overTimeTabs.has(tab) ? 'overtime' : 'snapshot';
    }

    function yearRange(advanced = activeAdvancedControls()) {
      const all = state.options?.grad_years || [];
      const from = Number(advanced.fromYear || all[0]);
      const to = Number(advanced.toYear || all[all.length - 1]);
      return all.filter(year => year >= from && year <= to);
    }

    function activeHorizonLabel(compact = false) {
      const horizon = activeHorizonValue();
      const labels = {
        '1yr': compact ? '1 yr out' : '1 year after graduation',
        '5yr': compact ? '5 yrs out' : '5 years after graduation',
        '10yr': compact ? '10 yrs out' : '10 years after graduation',
        'early_2025': compact ? '2025 early' : '2025 early earnings',
      };
      return labels[horizon] || horizon;
    }

    function currentFilters(extra = {}) {
      const advanced = activeAdvancedControls();
      const noFurtherValue = advanced.noFurther;
      return {
        schools: getSelectedSchools(advanced),
        degree: $('degree-select').value || 'Bachelors',
        cip_level: advanced.cipLevel || 'cip4',
        majors: getSelectedMajors(advanced),
        grad_years: yearRange(advanced),
        horizon: advanced.horizon || '1yr',
        demographics: {
          gender: advanced.gender || null,
          race_ethnicity: advanced.race || null,
        },
        postgrad: {
          later_degree_type: advanced.laterDegree || null,
          no_further_education: noFurtherValue === '' ? null : noFurtherValue === 'true',
        },
        include_current_students: advanced.currentStudents === 'true',
        include_school_employers: advanced.schoolEmployer === 'true',
        compare_mode: advanced.selectionMode === 'compare' || advanced.selectionMode === 'major_compare',
        compare_dimension: advanced.selectionMode === 'major_compare' ? 'major' : 'school',
        active_tab: 'all',
        view_mode: 'all',
        selected_employer: state.selectedEmployer,
        selected_employer_role: state.selectedEmployerRole,
        selected_postgrad_degree: state.selectedPostgradDegree,
        selected_postgrad_school: state.selectedPostgradSchool,
        selected_postgrad_program: state.selectedPostgradProgram,
        top_n: REQUEST_TOP_N,
        ...extra,
      };
    }

    function dashboardFiltersForCurrentView(extra = {}) {
      const tab = state.tab || 'overview';
      const destinationExtra = tab === 'destinations'
        ? { horizon: state.destinationHorizon === 'all' ? '' : state.destinationHorizon }
        : {};
      return currentFilters({
        ...destinationExtra,
        active_tab: tab,
        view_mode: state.viewMode || defaultViewForTab(tab),
        ...extra,
      });
    }

    function dashboardCacheKey(filters) {
      return JSON.stringify(filters);
    }

    function getCachedDashboard(filters) {
      const key = dashboardCacheKey(filters);
      const cached = state.dashboardCache.get(key);
      if (!cached) return null;
      state.dashboardCache.delete(key);
      state.dashboardCache.set(key, cached);
      return cached;
    }

    function setCachedDashboard(filters, data) {
      const key = dashboardCacheKey(filters);
      state.dashboardCache.set(key, data);
      while (state.dashboardCache.size > DASHBOARD_CACHE_LIMIT) {
        state.dashboardCache.delete(state.dashboardCache.keys().next().value);
      }
    }

    async function fetchDashboard(filters) {
      const key = dashboardCacheKey(filters);
      const cached = getCachedDashboard(filters);
      if (cached) return cached;
      if (state.dashboardRequests.has(key)) return state.dashboardRequests.get(key);
      const request = apiFetch('/api/dashboard', filters)
        .then(data => {
          setCachedDashboard(filters, data);
          return data;
        })
        .finally(() => {
          state.dashboardRequests.delete(key);
        });
      state.dashboardRequests.set(key, request);
      return request;
    }

    function clearDashboardCache() {
      state.dashboardCache.clear();
      state.dashboardRequests.clear();
      state.prefetchGeneration += 1;
      clearTimeout(state.prefetchTimer);
    }

    function scheduleDashboardPrefetch(baseFilters) {
      if (!state.apiUrl || compareNeedsSelections()) return;
      clearTimeout(state.prefetchTimer);
      const generation = state.prefetchGeneration;
      state.prefetchTimer = window.setTimeout(() => {
        prefetchDashboardViews(baseFilters, generation);
      }, 75);
    }

    function canWarmFullSchoolSlice(filters, { allowWarmupHorizons = false } = {}) {
      return !filters.compare_mode
        && (allowWarmupHorizons || (filters.active_tab !== 'destinations' && Boolean(filters.horizon)))
        && !filters.selected_employer
        && !filters.selected_employer_role
        && !filters.selected_postgrad_degree
        && !filters.selected_postgrad_school
        && !filters.selected_postgrad_program;
    }

    function hydrateTabCachesFromFullDashboard(baseFilters, fullData) {
      TAB_ORDER.forEach(tab => {
        DASHBOARD_VIEW_MODES.forEach(viewMode => {
          setCachedDashboard({ ...baseFilters, active_tab: tab, view_mode: viewMode }, fullData);
        });
      });
    }

    function hydrateDestinationAllCaches(baseFilters, fullData) {
      DASHBOARD_VIEW_MODES.forEach(viewMode => {
        setCachedDashboard({ ...baseFilters, horizon: '', active_tab: 'destinations', view_mode: viewMode }, fullData);
      });
    }

    function hydrateFullSchoolCaches(baseFilters, fullData) {
      if (baseFilters.horizon === '') {
        hydrateDestinationAllCaches(baseFilters, fullData);
        return;
      }
      hydrateTabCachesFromFullDashboard(baseFilters, fullData);
    }

    function horizonWarmupValues(baseFilters, options = {}) {
      return [...new Set([
        baseFilters.horizon || '1yr',
        ...HORIZON_OPTIONS.map(option => option.value),
        ...(options.includeDestinationAll ? [''] : []),
      ])];
    }

    async function warmFullSchoolCaches(baseFilters, generation, options = {}) {
      const horizons = horizonWarmupValues(baseFilters, { includeDestinationAll: true });
      let warmed = 0;
      let latestData = null;
      for (const horizon of horizons) {
        if (horizon === options.skipHorizon) continue;
        if (generation !== state.prefetchGeneration) return { warmed, latestData };
        const horizonFilters = { ...baseFilters, horizon };
        const fullFilters = { ...horizonFilters, active_tab: 'all', view_mode: 'all' };
        const fullData = await fetchDashboard(fullFilters);
        if (generation !== state.prefetchGeneration) return { warmed, latestData };
        hydrateFullSchoolCaches(horizonFilters, fullData);
        warmed += 1;
        latestData = fullData;
      }
      return { warmed, latestData };
    }

    async function prefetchDashboardViews(baseFilters, generation) {
      if (generation !== state.prefetchGeneration || state.loading) return;
      if (canWarmFullSchoolSlice(baseFilters, { allowWarmupHorizons: true })) {
        try {
          const { warmed, latestData } = await warmFullSchoolCaches(baseFilters, generation);
          if (warmed === horizonWarmupValues(baseFilters, { includeDestinationAll: true }).length) {
            if (!state.loading) setStatus('ok', `${latestData?.meta?.data_version || 'Connected'} | all tabs and years ready`);
            return;
          }
        } catch {
          // Fall back to individual tab prefetching below if the full payload fails.
        }
      }
      if (generation !== state.prefetchGeneration || state.loading) return;
      const fallbackBaseFilters = baseFilters.horizon ? baseFilters : { ...baseFilters, horizon: '1yr' };
      const activeTab = state.tab || 'overview';
      const activeView = state.viewMode || defaultViewForTab(activeTab);
      const views = [];
      TAB_ORDER.forEach(tab => {
        DASHBOARD_VIEW_MODES.forEach(viewMode => {
          if (tab === activeTab && viewMode === activeView) return;
          views.push({ tab, viewMode });
        });
      });
      for (const view of views) {
        if (generation !== state.prefetchGeneration || state.loading) return;
        const filters = { ...fallbackBaseFilters, active_tab: view.tab, view_mode: view.viewMode };
        if (getCachedDashboard(filters) || state.dashboardRequests.has(dashboardCacheKey(filters))) continue;
        try {
          await fetchDashboard(filters);
        } catch {
          return;
        }
      }
    }

    function scheduleCompareSchoolWarmup(delay = 350) {
      clearTimeout(compareWarmupTimer);
      const primary = String($('school-select')?.value || '');
      const compare = trimCompareSchools(selectedValues($('compare-school-select')), primary);
      const schools = [...new Set([primary, ...compare])].filter(Boolean);
      if (!state.apiUrl || schools.length < 2 || schools.length > MAX_COMPARE_SCHOOLS) return;
      compareWarmupTimer = window.setTimeout(async () => {
        const key = JSON.stringify({ apiUrl: state.apiUrl, schools });
        if (state.lastCompareWarmupKey === key) return;
        try {
          state.lastCompareWarmupKey = key;
          setStatus('', 'Preparing selected schools');
          await apiFetch('/api/warm-cache', currentFilters({
            schools,
            compare_mode: true,
            compare_dimension: 'school',
            active_tab: 'overview',
            view_mode: 'overtime',
          }));
          if (!state.loading) setStatus('ok', 'Selected schools ready');
        } catch (error) {
          state.lastCompareWarmupKey = '';
          if (!state.loading) setStatus('bad', 'School cache prep failed');
        }
      }, delay);
    }

    function option(label, value, selected = false) {
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      opt.selected = selected;
      return opt;
    }

    function populateSelect(select, rows, getLabel, getValue, selectedValuesSet = new Set()) {
      select.innerHTML = '';
      rows.forEach(row => select.appendChild(option(getLabel(row), getValue(row), selectedValuesSet.has(String(getValue(row))))));
    }

    function comparePickerLabel(label, maxLength = 44) {
      return legendLabel(String(label || ''), maxLength);
    }

    function renderComparePicker({
      pickerId,
      selectId,
      rows,
      selectedSet = new Set(),
      getValue,
      getLabel,
      addAttr,
      removeAttr,
      clearAttr,
      selectedTitle = 'Selected',
      emptyText = 'Click items on the left to add them here.',
      baseLabel = '',
      maxSelections = Infinity,
      selectedCountLabel = '',
    }) {
      const picker = $(pickerId);
      if (!picker) return;
      const safeRows = rows || [];
      const selectedRows = safeRows.filter(row => selectedSet.has(String(getValue(row))));
      const availableRows = safeRows.filter(row => !selectedSet.has(String(getValue(row))));
      const count = selectedValues($(selectId)).length;
      const maxReached = Number.isFinite(maxSelections) && count >= maxSelections;
      const baseMarkup = baseLabel
        ? `<span class="compare-bead is-base"><span>Base: ${escapeHtml(comparePickerLabel(baseLabel, 34))}</span></span>`
        : '';
      const selectedMarkup = selectedRows.length
        ? selectedRows.map(row => {
          const value = String(getValue(row));
          const label = getLabel(row);
          return `
            <span class="compare-bead" title="${escapeHtml(label)}">
              <span>${escapeHtml(comparePickerLabel(label, 38))}</span>
              <button type="button" ${removeAttr}="${escapeHtml(value)}" aria-label="Remove ${escapeHtml(label)}">x</button>
            </span>
          `;
        }).join('')
        : `<div class="compare-empty">${escapeHtml(emptyText)}</div>`;
      picker.innerHTML = `
        <div class="compare-picker-head">
          <span>${escapeHtml(selectedCountLabel || `${num(count)} selected`)}</span>
          <button type="button" class="compare-picker-clear" ${clearAttr}>Clear</button>
        </div>
        <div class="compare-picker-body">
          <div class="compare-options">
            ${availableRows.length ? availableRows.map(row => {
              const value = String(getValue(row));
              const label = getLabel(row);
              return `
                <button type="button" class="compare-option" ${addAttr}="${escapeHtml(value)}" title="${escapeHtml(label)}" ${maxReached ? 'disabled' : ''}>
                  <span>${escapeHtml(comparePickerLabel(label, 58))}</span>
                </button>
              `;
            }).join('') : '<div class="compare-empty">Everything available is selected.</div>'}
          </div>
          <div class="compare-selected">
            <div class="compare-selected-title">${escapeHtml(selectedTitle)}</div>
            <div class="compare-beads">${baseMarkup}${selectedMarkup}</div>
          </div>
        </div>
      `;
    }

    function renderCompareSchoolPicker(rows, selectedSet = new Set()) {
      const currentSchool = state.options?.schools?.find(s => String(s.unitid) === String($('school-select')?.value));
      const currentUnitid = String(currentSchool?.unitid || $('school-select')?.value || '');
      const selectedValuesSet = new Set(trimCompareSchools([...selectedSet], currentUnitid));
      const totalSelected = (currentUnitid ? 1 : 0) + selectedValuesSet.size;
      renderComparePicker({
        pickerId: 'compare-school-picker',
        selectId: 'compare-school-select',
        rows: (rows || []).filter(row => String(row.unitid) !== currentUnitid),
        selectedSet: selectedValuesSet,
        getValue: row => row.unitid,
        getLabel: row => row.name,
        addAttr: 'data-add-compare-school',
        removeAttr: 'data-remove-compare-school',
        clearAttr: 'data-clear-compare-schools',
        selectedTitle: 'Comparison set',
        emptyText: 'Click schools to add them to the comparison.',
        baseLabel: currentSchool?.name || '',
        maxSelections: Math.max(0, MAX_COMPARE_SCHOOLS - (currentUnitid ? 1 : 0)),
        selectedCountLabel: `${num(totalSelected)} of ${MAX_COMPARE_SCHOOLS} schools selected`,
      });
    }

    function renderCompareMajorPicker(rows, selectedSet = new Set()) {
      renderComparePicker({
        pickerId: 'compare-major-picker',
        selectId: 'compare-major-select',
        rows,
        selectedSet,
        getValue: row => row.code,
        getLabel: row => `${row.title} (${row.code})`,
        addAttr: 'data-add-compare-major',
        removeAttr: 'data-remove-compare-major',
        clearAttr: 'data-clear-compare-majors',
        selectedTitle: 'Selected majors',
        emptyText: 'Click majors to build the comparison set.',
      });
    }

    function populateStaticControls(options) {
      const defaultSchool = options.schools.find(s => /Columbia University in the City of New York/i.test(s.name)) || options.schools[0];
      const existingPrimary = $('school-select').value || defaultSchool?.unitid || '';
      let savedCompare = [];
      try {
        savedCompare = JSON.parse(storage.getItem('outcomes.compareSchools') || '[]');
      } catch {
        savedCompare = [];
      }
      const currentCompare = selectedValues($('compare-school-select')).map(String);
      const existingCompare = new Set(trimCompareSchools(currentCompare.length ? currentCompare : savedCompare, String(existingPrimary)));
      populateSelect($('school-select'), options.schools, s => s.name, s => s.unitid, new Set([String(existingPrimary)]));
      populateSelect($('compare-school-select'), options.schools, s => s.name, s => s.unitid, existingCompare);
      renderCompareSchoolPicker(options.schools || [], existingCompare);

      const existingDegree = $('degree-select').value || 'Bachelors';
      populateSelect($('degree-select'), options.degrees, d => d.label, d => d.degree, new Set([existingDegree]));
      if (!$('degree-select').value) $('degree-select').value = 'Bachelors';

      populateSelect($('horizon-select'), options.horizons, h => h.label, h => h.value, new Set([$('horizon-select').value || '1yr']));
      if (!$('horizon-select').value) $('horizon-select').value = '1yr';
      syncHorizonToggle();

      const years = options.grad_years || [];
      populateSelect($('from-year-select'), years, y => y, y => y, new Set([String($('from-year-select').value || years[0] || '')]));
      populateSelect($('to-year-select'), years, y => y, y => y, new Set([String($('to-year-select').value || years[years.length - 1] || '')]));
      if (!$('from-year-select').value && years.length) $('from-year-select').value = years[0];
      if (!$('to-year-select').value && years.length) $('to-year-select').value = years[years.length - 1];

      const genders = options.demographics?.gender || [];
      const races = options.demographics?.race_ethnicity || [];
      const laterDegrees = options.later_degrees || [];
      const oldGender = $('gender-select').value;
      const oldRace = $('race-select').value;
      const oldLater = $('later-degree-filter').value;
      $('gender-select').innerHTML = '<option value="">All</option>';
      genders.forEach(value => $('gender-select').appendChild(option(value, value, value === oldGender)));
      $('race-select').innerHTML = '<option value="">All</option>';
      races.forEach(value => $('race-select').appendChild(option(value, value, value === oldRace)));
      $('later-degree-filter').innerHTML = '<option value="">All</option>';
      laterDegrees.forEach(value => $('later-degree-filter').appendChild(option(value, value, value === oldLater)));
    }

    function populateMajorOptions(options, preserve = true) {
      const previous = preserve ? $('major-select').value : '';
      const validCodes = new Set((options.major_options || []).map(row => String(row.code)));
      const keepPrevious = previous && validCodes.has(String(previous));
      let savedCompareMajors = [];
      try {
        savedCompareMajors = JSON.parse(storage.getItem('outcomes.compareMajors') || '[]');
      } catch {
        savedCompareMajors = [];
      }
      const currentCompareMajors = selectedValues($('compare-major-select')).map(String);
      const compareMajorValues = (currentCompareMajors.length ? currentCompareMajors : savedCompareMajors)
        .map(String)
        .filter(code => validCodes.has(code));
      const existingCompareMajors = new Set(compareMajorValues);
      $('major-select').innerHTML = '<option value="">All majors</option>';
      (options.major_options || []).forEach(row => {
        const label = `${row.title} (${row.code})`;
        $('major-select').appendChild(option(label, row.code, keepPrevious && previous === row.code));
      });
      populateSelect($('compare-major-select'), options.major_options || [], row => `${row.title} (${row.code})`, row => row.code, existingCompareMajors);
      renderCompareMajorPicker(options.major_options || [], existingCompareMajors);
      syncCompareStatus();
    }

    async function loadOptions(preserveMajor = true) {
      const filters = currentFilters({ majors: [] });
      const options = await apiFetch('/api/options', filters);
      state.options = options;
      populateStaticControls(options);
      populateMajorOptions(options, preserveMajor);
      initializeAppliedAdvancedControls();
      if (state.selectionMode === 'compare' || state.selectionMode === 'major_compare') {
        setAdvancedOpen(compareNeedsSelections());
      }
      setStatus('ok', `${options.meta?.data_version || 'Connected'} | positive-weight cells visible`);
    }

    async function connect({ fromAuth = false } = {}) {
      if (fromAuth) syncControlsFromAuthFields();
      state.apiUrl = normalizeApiUrl($('api-url').value || defaultApiUrl());
      state.password = $('api-password').value || '';
      if (!state.apiUrl) {
        setMessage('Enter the protected API URL first.', true);
        showAuthModal('Enter the protected API URL first.', true);
        return;
      }
      storage.setItem('outcomes.apiUrl', state.apiUrl);
      storage.setItem('outcomes.apiPassword', state.password);
      $('api-url').value = state.apiUrl;
      $('auth-api-url').value = state.apiUrl;
      $('auth-api-password').value = state.password;
      setStatus('', 'Connecting');
      setAuthMessage('Connecting...', false);
      setMessage('Connecting to the protected API...');
      try {
        await loadOptions(true);
        document.querySelectorAll('.api-connection').forEach(node => node.classList.add('connected'));
        hideAuthModal();
        await refresh();
      } catch (error) {
        setStatus('bad', 'Connection failed');
        const message = escapeHtml(error.message || 'Could not connect to the protected API.');
        setMessage(message, true);
        showAuthModal(message, true);
      }
    }

    async function refresh({ reloadOptions = false, resetDrill = false } = {}) {
      if (!state.apiUrl) {
        setMessage('Enter the protected API URL and password, then connect.');
        return;
      }
      state.prefetchGeneration += 1;
      clearTimeout(state.prefetchTimer);
      if (state.loading) {
        state.pendingRefresh = {
          reloadOptions: Boolean(state.pendingRefresh?.reloadOptions || reloadOptions),
          resetDrill: Boolean(state.pendingRefresh?.resetDrill || resetDrill),
        };
        return;
      }
      if (resetDrill) {
        state.selectedEmployer = null;
        state.selectedEmployerRole = null;
        state.selectedPostgradDegree = null;
        state.selectedPostgradSchool = null;
        state.selectedPostgradProgram = null;
        state.roleTreePath = [];
        state.industryTreePath = [];
        state.destinationLeftPath = [];
        state.destinationRightPath = [];
      }
      if (!reloadOptions && state.options && !compareNeedsSelections()) {
        const cachedFilters = dashboardFiltersForCurrentView();
        const cachedData = getCachedDashboard(cachedFilters);
        if (cachedData) {
          state.data = cachedData;
          showContent();
          render();
          setStatus('ok', `${state.data.meta?.data_version || 'Connected'} | loaded from cache`);
          scheduleDashboardPrefetch(cachedFilters);
          return;
        }
      }
      state.loading = true;
      document.body.classList.add('loading');
      $('refresh-state')?.classList.add('is-visible');
      setStatus('', 'Refreshing');
      try {
        if (reloadOptions || !state.options) await loadOptions(true);
        if (compareNeedsSelections()) {
          state.data = {
            overview: {},
            school_comparison: [],
            major_comparison: [],
            meta: state.options?.meta || {},
          };
          showContent();
          render();
          setStatus('ok', `${state.options?.meta?.data_version || 'Connected'} | pick comparison items`);
          return;
        }
        const filters = dashboardFiltersForCurrentView();
        const cached = getCachedDashboard(filters);
        if (cached) {
          state.data = cached;
        } else if (canWarmFullSchoolSlice(filters)) {
          const fullFilters = { ...filters, active_tab: 'all', view_mode: 'all' };
          state.data = await fetchDashboard(fullFilters);
          hydrateFullSchoolCaches(filters, state.data);
          setStatus('', 'Preparing all tabs and years');
          try {
            await warmFullSchoolCaches(filters, state.prefetchGeneration, { skipHorizon: filters.horizon || '1yr' });
          } catch {
            // Keep the active school usable even if a background horizon cache misses.
          }
        } else {
          state.data = await fetchDashboard(filters);
        }
        showContent();
        render();
        setStatus('ok', `${state.data.meta?.data_version || 'Connected'} | loaded ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`);
        scheduleDashboardPrefetch(filters);
      } catch (error) {
        setStatus('bad', 'Connection failed');
        setMessage(`<strong>Could not load data.</strong><br>${escapeHtml(error.message)}`, true);
      } finally {
        state.loading = false;
        document.body.classList.remove('loading');
        $('refresh-state')?.classList.remove('is-visible');
        if (state.pendingRefresh) {
          const pending = state.pendingRefresh;
          state.pendingRefresh = null;
          refresh(pending);
        }
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function closeDrilldownModal() {
      $('drilldown-modal')?.classList.remove('open');
      state.activeDrilldownContext = null;
    }

    function setDrilldownModal(title, subtitle, bodyHtml) {
      $('drilldown-title').textContent = title || 'Path detail';
      $('drilldown-subtitle').textContent = subtitle || '';
      $('drilldown-body').innerHTML = bodyHtml || '';
      $('drilldown-modal').classList.add('open');
    }

    function chartLoadingHtml(message = 'Loading chart detail...') {
      return `
        <div class="chart-local-loader" role="status" aria-live="polite">
          <span class="chart-local-pie" aria-hidden="true"></span>
          <span>${escapeHtml(message)}</span>
        </div>
      `;
    }

    function setChartLoading(id, message = 'Loading chart detail...') {
      const node = $(id);
      if (!node) return;
      node.innerHTML = chartLoadingHtml(message);
    }

    function drilldownBars(title, rows, color, clickAttr, activeLabel = '') {
      const cleanRows = (rows || []).filter(row => row.label).slice(0, 10);
      if (!cleanRows.length) {
        return `
          <div class="detail-panel">
            <h3>${escapeHtml(title)}</h3>
            <div class="empty">No detail available for this slice.</div>
          </div>
        `;
      }
      const total = cleanRows.reduce((sum, row) => sum + Number(row.n || 0), 0) || 0;
      const hasShare = cleanRows.some(row => row.share_pct !== null && row.share_pct !== undefined);
      const barValue = row => hasShare ? Number(row.share_pct || 0) : (total ? 100 * Number(row.n || 0) / total : 0);
      const maxValue = Math.max(1, ...cleanRows.map(row => barValue(row)));
      const rowHtml = cleanRows.map(row => {
        const value = barValue(row);
        const width = Math.max(3, 100 * value / maxValue);
        const label = String(row.label || '');
        const active = activeLabel && label === activeLabel;
        const attr = clickAttr ? ` ${clickAttr}="${escapeHtml(label)}"` : '';
        const valueLabel = pct(value);
        const titleText = valueLabel;
        return `
          <button class="detail-row ${active ? 'active' : ''}" type="button"${attr} title="${escapeHtml(titleText)}">
            <span class="detail-row-label">
              <span title="${escapeHtml(label)}">${escapeHtml(label)}</span>
              <span class="detail-bar-track"><span class="detail-bar-fill" style="width:${width}%; background:${color};"></span></span>
            </span>
            <span class="detail-row-value">${valueLabel}</span>
          </button>
        `;
      }).join('');
      return `
        <div class="detail-panel">
          <h3>${escapeHtml(title)}</h3>
          <div class="detail-list">${rowHtml}</div>
        </div>
      `;
    }

    function renderPostgradDrilldownBody(detail, context) {
      const schools = detail?.schools || [];
      const programs = detail?.programs || [];
      const showPrograms = Boolean(detail?.show_program_detail && programs.length);
      const schoolTitle = context.selectedProgram
        ? `Top schools for ${context.selectedProgram}`
        : `Top schools for ${context.degree}`;
      const programTitle = context.selectedSchool
        ? `Top programs at ${context.selectedSchool}`
        : `Top programs for ${context.degree}`;
      return `
        <div class="detail-grid ${showPrograms ? '' : 'single'}">
          ${drilldownBars(schoolTitle, schools, COLORS[0], 'data-drill-school', context.selectedSchool)}
          ${showPrograms ? drilldownBars(programTitle, programs, COLORS[1], 'data-drill-program', context.selectedProgram) : ''}
        </div>
        <div class="detail-hint">${showPrograms ? 'Click a school to narrow the program list, or click a program to see the schools behind it.' : 'Shares are within the selected later-degree path.'}</div>
      `;
    }

    function modalCompareEntities() {
      if (state.selectionMode === 'major_compare') {
        return (state.data.major_comparison || [])
          .filter(row => row.code)
          .map(row => ({ code: String(row.code), title: majorName(row) }));
      }
      return (state.data.school_comparison || [])
        .filter(row => row.unitid || row.code)
        .map(row => ({
          code: String(row.unitid || row.code),
          title: shortSchool(row.school_name || row.title || row.code),
        }));
    }

    function compareRowsForLabel(rows, label) {
      const lookup = new Map((rows || [])
        .filter(row => row.code && row.label)
        .map(row => [`${String(row.code)}||${String(row.label)}`, row]));
      return modalCompareEntities().map(entity => ({
        ...entity,
        ...(lookup.get(`${entity.code}||${String(label)}`) || {}),
        entity_title: entity.title,
      }));
    }

    function detailTableHtml(title, headers, rows, emptyText = 'No detail available for this slice.') {
      const bodyRows = (rows || []).filter(Boolean);
      if (!bodyRows.length) {
        return `
          <div class="detail-panel">
            <h3>${escapeHtml(title)}</h3>
            <div class="empty">${escapeHtml(emptyText)}</div>
          </div>
        `;
      }
      return `
        <div class="detail-panel">
          <h3>${escapeHtml(title)}</h3>
          <div class="detail-table-wrap">
            <table class="detail-table">
              <thead><tr>${headers.map(header => `<th class="${header.className || ''}">${escapeHtml(header.label)}</th>`).join('')}</tr></thead>
              <tbody>
                ${bodyRows.map(row => `
                  <tr>
                    ${headers.map(header => `<td class="${header.className || ''}">${escapeHtml(header.value(row))}</td>`).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function compareShareTable(title, rows, label, options = {}) {
      const comparisonRows = compareRowsForLabel(rows, label);
      const payLabel = options.payLabel || 'Avg pay';
      const headers = [
        { label: compareEntityLabel(), value: row => row.entity_title || row.title || row.code || '' },
        { label: options.shareLabel || 'Share', className: 'num', value: row => row.share_pct === null || row.share_pct === undefined ? '—' : pct(row.share_pct) },
      ];
      if (options.showPay !== false) {
        headers.push({
          label: payLabel,
          className: 'num',
          value: row => {
            const value = row.median_salary ?? row.weighted_mean_salary;
            return value === null || value === undefined ? '—' : money(value);
          },
        });
      }
      return detailTableHtml(title, headers, comparisonRows);
    }

    function comparePostgradRows() {
      return state.selectionMode === 'major_compare'
        ? (state.data.major_postgrad_comparison || [])
        : (state.data.school_postgrad_comparison || []);
    }

    function renderComparePostgradDestinationTable(detail, key, title, emptyLabel) {
      const rows = detail?.[key] || [];
      const groups = new Map();
      rows.forEach(row => {
        const code = String(row.code || '');
        if (!code) return;
        if (!groups.has(code)) groups.set(code, []);
        groups.get(code).push(row);
      });
      const entities = modalCompareEntities();
      const rowsByEntity = entities.map(entity => (groups.get(entity.code) || [])
        .sort((a, b) => Number(a.entity_rank || 99) - Number(b.entity_rank || 99))
        .slice(0, 8));
      const maxRows = Math.max(0, ...rowsByEntity.map(group => group.length));
      if (!maxRows) {
        return `
          <div class="detail-panel">
            <h3>${escapeHtml(title)}</h3>
            <div class="empty">No ${escapeHtml(emptyLabel)} detail for this path.</div>
          </div>
        `;
      }
      return `
        <div class="detail-panel">
          <h3>${escapeHtml(title)}</h3>
          <div class="destination-compare-wrap">
            <table class="destination-compare-table">
              <thead>
                <tr>
                  <th class="rank-col">#</th>
                  ${entities.map(entity => `<th>${escapeHtml(entity.title)}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${Array.from({ length: maxRows }, (_, idx) => `
                  <tr>
                    <td class="rank-col">${idx + 1}</td>
                    ${rowsByEntity.map(group => {
                      const row = group[idx];
                      if (!row) return '<td class="destination-cell muted">—</td>';
                      return `
                        <td class="destination-cell">
                          <div class="destination-name">${escapeHtml(row.label || '')}</div>
                          <div class="destination-share">${row.share_pct === null || row.share_pct === undefined ? '—' : pct(row.share_pct)}</div>
                        </td>
                      `;
                    }).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderComparePostgradDrilldownBody(detail, context) {
      const degree = detail?.detail_degree || context.degree;
      const schools = detail?.schools || [];
      const programs = detail?.programs || [];
      const sections = [];
      sections.push(`
        <div class="detail-hint">
          Destination shares are within the selected ${escapeHtml(degree)} path for each ${escapeHtml(compareEntityLabel().toLowerCase())}.
        </div>
      `);
      sections.push(renderComparePostgradDestinationTable(detail, 'schools', 'Destination schools', 'school'));
      if (detail?.show_program_detail && programs.length) {
        sections.push('<div class="detail-hint">Programs are shown separately for masters and research doctorate paths.</div>');
        sections.push(renderComparePostgradDestinationTable(detail, 'programs', 'Programs', 'program'));
      }
      if (!schools.length && !programs.length) {
        return '<div class="empty">No destination detail available for this path.</div>';
      }
      return sections.join('');
    }

        `Top roles and pay at ${employerLabel}`,

          {
            label: 'Avg pay',
            className: 'num',
            value: row => {
              const value = row.median_salary ?? row.weighted_mean_salary;
              return value === null || value === undefined ? '—' : money(value);

        ],

    function slug(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/&/g, 'and')
        .replace(/[^a-z0-9]+/g, '-')

    const SALARY_DOLLAR_NOTE = 'Salary figures are shown in 2026 dollars.';

    function chartUsesSalaryDollars(chartId, title = '') {
      const text = `${chartId || ''} ${title || ''}`.toLowerCase();
      return /\b(salary|salaries|earnings|pay)\b/.test(text);
