async function renderDemographics() {
  const fact = await loadOptionalFact('demographics');
  const panel = document.getElementById('panel-demographics');
  if (!fact) {
    panel.innerHTML = '<div class="no-data">Demographics fact not found in the current bundle. Rerun the notebook export after adding `school_demographics_fact`.</div>';
    return;
  }
  const rows = getFactMajorRows(fact);
  if (!rows.length) { panel.innerHTML = '<div class="no-data">No demographics data for current filters.</div>'; return; }

  const sexRows = cleanDemographicRows(rows.filter(r => r.demographic_type === 'sex'));
  const ethnicityRows = cleanDemographicRows(rows.filter(r => r.demographic_type === 'ethnicity'));
  const timeField = getTimeField();
  const timeLabel = getTimeLabel();
  const timeValues = getTimeValues(rows);

  const sexBreakdown = aggregateCountRows(sexRows, 'demographic_value', { countField: 'n_users', weightedFields: ['avg_prestige'] });
  const ethnicityBreakdown = aggregateCountRows(ethnicityRows, 'demographic_value', { countField: 'n_users', weightedFields: ['avg_prestige'] });
  const femaleShare = demographicShare(sexRows, ['Female', 'F']);
  const maleShare = demographicShare(sexRows, ['Male', 'M']);
  const topEthnicity = ethnicityBreakdown[0];
  const totalUsers = sum(rows, 'n_users');

  if (isCompareActive()) {
    const selectedUnitids = getSelectedUnitids();
    const rowsBySchool = schoolRowsByUnitid(rows);
    const schoolMetrics = selectedUnitids.map(unitid => {
      const schoolRows = rowsBySchool[String(unitid)] || [];
      const schoolSex = cleanDemographicRows(schoolRows.filter(r => r.demographic_type === 'sex'));
      const schoolEth = cleanDemographicRows(schoolRows.filter(r => r.demographic_type === 'ethnicity'));
      const topEth = aggregateCountRows(schoolEth, 'demographic_value', { countField: 'n_users' })[0];
      return {
        school: getSchoolLabel(unitid),
        femaleShare: demographicShare(schoolSex, ['Female', 'F']),
        maleShare: demographicShare(schoolSex, ['Male', 'M']),
        topEthnicity: topEth?.demographic_value || 'N/A',
        topEthnicityShare: topEth?.share_pct ?? null,
        observedUsers: sum(schoolRows, 'n_users'),
      };
    });
    if (state.viewMode === 'overtime') {
      panel.innerHTML = `
        <div class="row-2">
          <div class="card"><h3>Female Share by School and ${timeLabel}</h3><div id="demo-compare-line"></div></div>
          <div class="card"><h3>Current Demographics Table</h3>${renderSchoolSummaryTable([
            { label: 'School' },
            { label: 'Female %', className: 'num' },
            { label: 'Male %', className: 'num' },
            { label: 'Top Ethnicity' },
            { label: 'Observed Users', className: 'num' },
          ], schoolMetrics.map(r => `<tr><td>${r.school}</td><td class="num">${fmtPct(r.femaleShare)}</td><td class="num">${fmtPct(r.maleShare)}</td><td>${r.topEthnicity === 'N/A' ? 'N/A' : `${r.topEthnicity} (${fmtPct(r.topEthnicityShare)})`}</td><td class="num">${fmtNum(r.observedUsers)}</td></tr>`))}</div></div>
        </div>`;
      const sexBySchool = schoolRowsByUnitid(sexRows);
      Plotly.newPlot('demo-compare-line', lineSeriesBySchool(selectedUnitids, sexBySchool, timeValues, timeField, slice => demographicShare(slice, ['Female', 'F'])).map(s => ({ ...s, hovertemplate: `${s.name}<br>${timeLabel} %{x}<br>Female share %{y:.1f}%<extra></extra>` })), { ...plotLayout, height: 360, xaxis: { title: timeLabel, automargin: true }, yaxis: { title: 'Female share %', ticksuffix: '%', automargin: true }, legend: { orientation: 'h', y: 1.12 } }, plotConfig);
      return;
    }
    panel.innerHTML = `<div class="card"><h3>Demographics Comparison Table</h3><div class="subtle" style="margin-bottom:12px;">Demographics use predicted sex and ethnicity from the individual user table for the currently observed outcomes slice.</div>${renderSchoolSummaryTable([
      { label: 'School' },
      { label: 'Female %', className: 'num' },
      { label: 'Male %', className: 'num' },
      { label: 'Top Ethnicity' },
      { label: 'Observed Users', className: 'num' },
    ], schoolMetrics.map(r => `<tr><td>${r.school}</td><td class="num">${fmtPct(r.femaleShare)}</td><td class="num">${fmtPct(r.maleShare)}</td><td>${r.topEthnicity === 'N/A' ? 'N/A' : `${r.topEthnicity} (${fmtPct(r.topEthnicityShare)})`}</td><td class="num">${fmtNum(r.observedUsers)}</td></tr>`))}</div>`;
    return;
  }

  if (state.viewMode === 'snapshot') {
    panel.innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="value">${fmtPct(femaleShare)}</div><div class="label">Female Share</div></div>
        <div class="kpi"><div class="value">${fmtPct(maleShare)}</div><div class="label">Male Share</div></div>
        <div class="kpi"><div class="value">${topEthnicity ? topEthnicity.demographic_value : 'N/A'}</div><div class="label">Top Ethnicity</div></div>
        <div class="kpi"><div class="value">${fmtNum(totalUsers)}</div><div class="label">Observed Users</div></div>
      </div>
      <div class="row-2">
        <div class="card"><h3>Sex Composition</h3><div id="demo-sex"></div></div>
        <div class="card"><h3>Ethnicity Composition</h3><div id="demo-eth"></div></div>
      </div>`;
    Plotly.newPlot('demo-sex', [{
      type: 'bar',
      orientation: 'h',
      y: [...sexBreakdown].reverse().map(r => r.demographic_value),
      x: [...sexBreakdown].reverse().map(r => r.share_pct),
      customdata: [...sexBreakdown].reverse().map(r => r.n),
      marker: { color: COLORS[0] },
      hovertemplate: '%{y}<br>Share %{x:.1f}%<br>Users %{customdata:,}<extra></extra>',
    }], { ...plotLayout, height: 320, margin: { l: 160, r: 20, t: 10, b: 40 }, xaxis: { title: 'Share %', ticksuffix: '%', automargin: true }, yaxis: { automargin: true } }, plotConfig);
    Plotly.newPlot('demo-eth', [{
      type: 'bar',
      orientation: 'h',
      y: ethnicityBreakdown.slice(0, 8).reverse().map(r => r.demographic_value),
      x: ethnicityBreakdown.slice(0, 8).reverse().map(r => r.share_pct),
      customdata: ethnicityBreakdown.slice(0, 8).reverse().map(r => r.n),
      marker: { color: COLORS[2] },
      hovertemplate: '%{y}<br>Share %{x:.1f}%<br>Users %{customdata:,}<extra></extra>',
    }], { ...plotLayout, height: 320, margin: { l: 200, r: 20, t: 10, b: 40 }, xaxis: { title: 'Share %', ticksuffix: '%', automargin: true }, yaxis: { automargin: true } }, plotConfig);
    return;
  }

  const sexLabels = [...new Set(sexBreakdown.map(r => r.demographic_value))];
  const sexSeries = sexLabels.map((label, idx) => ({
    type: 'scatter',
    mode: 'lines+markers',
    name: label,
    x: timeValues,
    y: timeValues.map(t => {
      const slice = sexRows.filter(r => String(r[timeField]) === String(t));
      return demographicShare(slice, label);
    }),
    line: { color: COLORS[idx % COLORS.length], width: label === 'Female' ? 3 : 2 },
    marker: { size: 7 },
    hovertemplate: `${label}<br>${timeLabel} %{x}<br>Share %{y:.1f}%<extra></extra>`,
  }));
  const topEthnicityGroups = ethnicityBreakdown.slice(0, 5);
  const ethnicitySeries = topEthnicityGroups.map((group, idx) => ({
    type: 'bar',
    name: group.demographic_value,
    x: timeValues,
    y: timeValues.map(t => {
      const slice = ethnicityRows.filter(r => String(r[timeField]) === String(t));
      const total = sum(slice, 'n_users');
      const hit = sum(slice.filter(r => String(r.demographic_value) === String(group.demographic_value)), 'n_users');
      return total ? hit / total * 100 : 0;
    }),
    marker: { color: COLORS[idx % COLORS.length] },
    hovertemplate: `${group.demographic_value}<br>${timeLabel} %{x}<br>Share %{y:.1f}%<extra></extra>`,
  }));

  panel.innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="value">${fmtPct(femaleShare)}</div><div class="label">Female Share</div></div>
      <div class="kpi"><div class="value">${fmtPct(maleShare)}</div><div class="label">Male Share</div></div>
      <div class="kpi"><div class="value">${topEthnicity ? topEthnicity.demographic_value : 'N/A'}</div><div class="label">Top Ethnicity</div></div>
      <div class="kpi"><div class="value">${fmtNum(totalUsers)}</div><div class="label">Observed Users</div></div>
    </div>
    <div class="row-2">
      <div class="card"><h3>Sex Share by ${timeLabel}</h3><div id="demo-sex-trend"></div></div>
      <div class="card"><h3>Ethnicity Mix by ${timeLabel}</h3><div id="demo-eth-trend"></div></div>
    </div>`;
  Plotly.newPlot('demo-sex-trend', sexSeries, { ...plotLayout, height: 340, xaxis: { title: timeLabel, automargin: true }, yaxis: { title: 'Share %', ticksuffix: '%', automargin: true }, legend: { orientation: 'h', y: 1.12 } }, plotConfig);
  Plotly.newPlot('demo-eth-trend', ethnicitySeries, { ...plotLayout, height: 340, barmode: 'stack', xaxis: { title: timeLabel, automargin: true }, yaxis: { title: 'Share %', ticksuffix: '%', automargin: true }, legend: { orientation: 'h', y: 1.18 } }, plotConfig);
}

async function renderCoverage() {
  const coverageFact = await loadFact('coverage');
  const rows = coverageFact.filter(r => baseFilter(r, { allowNoHorizon: true }));
  const coverageScopeRows = coverageFact.filter(r => baseFilter(r, { allowNoHorizon: true, allowNoDegree: true, ignoreMajor: true }));
  const bachelorCoverageRows = coverageScopeRows.filter(r => degreeMatchesRow(r, 'Bachelors'));
  const panel = document.getElementById('panel-coverage');
  if (!rows.length && !coverageScopeRows.length) { panel.innerHTML = '<div class="no-data">No coverage data for current filters.</div>'; return; }
  const methodology = renderMethodologyDrawer('coverage');
  const coverageSample = rows[0] || coverageScopeRows[0] || {};
  const hasIpedsCoverage = 'observed_ipeds_completions' in coverageSample && 'ipeds_completions' in coverageSample;
  const timeField = getTimeField();
  const timeLabel = getTimeLabel();
  const timeValues = getTimeValues(rows);
  const trend = timeValues.map(t => {
    const slice = rows.filter(r => String(r[timeField]) === String(t));
    return {
      period: t,
      cipRate: coverageValue(slice),
      avgProb: weightedAvg(slice, 'avg_cip_prob', 'total_records'),
    };
  });
  const topMajorCoverage = aggregateCoverageRows(rows).slice(0, 20);
  const coverageTableLabel = coverageLabel(rows);
  if (isCompareActive()) {
    const selectedUnitids = getSelectedUnitids();
    const rowsBySchool = schoolRowsByUnitid(rows);
    const schoolMetrics = selectedUnitids.map(unitid => {
      const schoolRows = rowsBySchool[String(unitid)] || [];
      const completionCounts = completionTotals(schoolRows);
      return {
        unitid,
        school: getSchoolLabel(unitid),
        coverage: coverageValue(schoolRows),
        avgProb: weightedAvg(schoolRows, 'avg_cip_prob', 'total_records'),
        observed: hasIpedsCoverage ? completionCounts.observed : sum(schoolRows, 'total_records'),
        ipeds: hasIpedsCoverage ? completionCounts.ipeds : null,
      };
    }).filter(r => r.observed > 0);
    panel.innerHTML = `${methodology}
      <div class="row-2">
        <div class="card"><h3>${state.viewMode === 'overtime' ? `${coverageTableLabel} Trends by School` : (hasIpedsCoverage ? 'IPEDS vs Revelio Completions by School' : `${coverageTableLabel} by School`)}</h3><div id="cov-compare"></div></div>
        <div class="card"><h3>Coverage Comparison Table</h3>${renderSchoolSummaryTable([
          { label: 'School' },
          { label: hasIpedsCoverage ? 'Revelio Completions' : 'Observed Records', className: 'num' },
          ...(hasIpedsCoverage ? [{ label: 'IPEDS Completions', className: 'num' }] : []),
          { label: coverageTableLabel, className: 'num' },
          { label: 'Avg CIP Prob', className: 'num' },
        ], schoolMetrics.map(r => `<tr><td>${r.school}</td><td class="num">${fmtNum(r.observed)}</td>${hasIpedsCoverage ? `<td class="num">${fmtNum(r.ipeds)}</td>` : ''}<td class="num">${fmtPct(r.coverage)}</td><td class="num">${Number(r.avgProb || 0).toFixed(3)}</td></tr>`))}</div></div>
      </div>`;
    if (state.viewMode === 'overtime') {
      Plotly.newPlot('cov-compare', lineSeriesBySchool(selectedUnitids, rowsBySchool, timeValues, timeField, slice => coverageValue(slice)).map(s => ({ ...s, hovertemplate: `${s.name}<br>${timeLabel} %{x}<br>${coverageTableLabel} %{y:.1f}%<extra></extra>` })), { ...plotLayout, height: 360, xaxis: { title: timeLabel, automargin: true }, yaxis: { title: coverageTableLabel, ticksuffix: '%', automargin: true }, legend: { orientation: 'h', y: 1.12 } }, plotConfig);
    } else if (hasIpedsCoverage) {
      Plotly.newPlot('cov-compare', [
        {
          type: 'bar',
          name: 'IPEDS completions',
          x: schoolMetrics.map(r => r.school),
          y: schoolMetrics.map(r => r.ipeds),
          marker: { color: '#B9C4D3' },
          hovertemplate: '%{x}<br>IPEDS completions %{y:,}<extra></extra>'
        },
        {
          type: 'bar',
          name: 'Revelio completions',
          x: schoolMetrics.map(r => r.school),
          y: schoolMetrics.map(r => r.observed),
          customdata: schoolMetrics.map(r => r.coverage),
          marker: {
            color: schoolMetrics.map(r => (r.observed || 0) > (r.ipeds || 0) ? 'rgba(72, 175, 244, 0.58)' : 'rgba(72, 175, 244, 0.78)')
          },
          hovertemplate: '%{x}<br>Revelio completions %{y:,}<br>Share %{customdata:.1f}%<extra></extra>'

      ], { ...plotLayout, height: 360, barmode: 'overlay', xaxis: { automargin: true }, yaxis: { title: 'Completions', automargin: true }, legend: { orientation: 'h', y: 1.12 } }, plotConfig);
    } else {
      Plotly.newPlot('cov-compare', [{
        type: 'bar',
        x: schoolMetrics.map(r => r.school),
        y: schoolMetrics.map(r => r.coverage),
        marker: { color: schoolMetrics.map((_, idx) => COLORS[idx % COLORS.length]) },
        hovertemplate: '%{x}<br>Coverage %{y:.1f}%<extra></extra>'
      }], { ...plotLayout, height: 360, xaxis: { automargin: true }, yaxis: { title: coverageTableLabel, ticksuffix: '%', automargin: true } }, plotConfig);
    }
    return;
  }

        </table></div></div>
      </div>`;
    Plotly.newPlot('cov-degree-bars', [
      {
        type: 'bar',
        orientation: 'h',
        name: 'IPEDS',
        y: degreeBars.map(r => r.degree),
        x: degreeBars.map(r => r.ipeds_completions),
        marker: { color: '#B9C4D3' },
        hovertemplate: '%{y}<br>IPEDS %{x:,}<extra></extra>'
      },
      {
        type: 'bar',
        orientation: 'h',
        name: 'Revelio',
        y: degreeBars.map(r => r.degree),
        x: degreeBars.map(r => r.observed_ipeds_completions),
        customdata: degreeBars.map(r => r.coverage_rate),
        marker: { color: 'rgba(72, 175, 244, 0.78)' },
        hovertemplate: '%{y}<br>Revelio %{x:,}<br>Coverage %{customdata:.1f}%<extra></extra>'
      }
    ], {
      ...plotLayout,
      height: 360,
      barmode: 'overlay',
      margin: { l: 150, r: 18, t: 12, b: 44 },
      xaxis: { title: 'Completions', automargin: true },
      yaxis: { automargin: true },
      legend: { orientation: 'h', y: 1.12 }
    }, plotConfig);
    Plotly.newPlot('cov-bachelor-bars', [
      {
        type: 'bar',
        orientation: 'h',
        name: 'IPEDS',
        y: bachelorBars.map(r => wrapLabel(r.cip_title, 24, 2)),
        x: bachelorBars.map(r => r.ipeds_completions),
        marker: { color: '#B9C4D3' },
        hovertemplate: '%{y}<br>IPEDS %{x:,}<extra></extra>'
      },
      {
        type: 'bar',
        orientation: 'h',
        name: 'Revelio',
        y: bachelorBars.map(r => wrapLabel(r.cip_title, 24, 2)),
        x: bachelorBars.map(r => r.observed_ipeds_completions),
        customdata: bachelorBars.map(r => r.coverage_rate),
        marker: {
          color: bachelorBars.map(r => (r.observed_ipeds_completions || 0) > (r.ipeds_completions || 0) ? 'rgba(72, 175, 244, 0.58)' : 'rgba(72, 175, 244, 0.78)')
        },
        hovertemplate: '%{y}<br>Revelio %{x:,}<br>Coverage %{customdata:.1f}%<extra></extra>'
      }
    ], {
      ...plotLayout,
      height: 460,
      barmode: 'overlay',
      margin: { l: 260, r: 18, t: 12, b: 44 },
      xaxis: { title: 'Completions', automargin: true },
      yaxis: { automargin: true },
      legend: { orientation: 'h', y: 1.12 }
    }, plotConfig);
    return;
  }
  panel.innerHTML = `${methodology}
    <div class="row-2">
      <div class="card"><h3>${coverageTrendTitle(rows)}</h3><div id="cov-trend"></div></div>
      <div class="card"><h3>Coverage Table</h3><div class="table-wrap"><table>
        <thead><tr><th>Major</th><th class="num">Observed Records</th><th class="num">${coverageTableLabel}</th><th class="num">Avg CIP Prob</th></tr></thead>
        <tbody>${topMajorCoverage.map(r => `<tr><td>${r.cip_title}</td><td class="num">${fmtNum(r.total_records)}</td><td class="num">${fmtPct(r.coverage_rate)}</td><td class="num">${Number(r.avg_cip_prob || 0).toFixed(3)}</td></tr>`).join('')}</tbody>
      </table></div></div>
    </div>`;
  Plotly.newPlot('cov-trend', [
    { type: 'scatter', mode: 'lines+markers', x: trend.map(r => r.period), y: trend.map(r => r.cipRate), name: 'CIP rate', line: { color: COLORS[0], width: 3 } },
    { type: 'scatter', mode: 'lines+markers', x: trend.map(r => r.period), y: trend.map(r => r.avgProb), name: 'Avg CIP prob', yaxis: 'y2', line: { color: COLORS[5], width: 3 } }
  ], {
    ...plotLayout,
    height: 340,
    xaxis: { title: timeLabel, automargin: true },
    yaxis: { title: coverageTableLabel, ticksuffix: '%', automargin: true },
    yaxis2: { title: 'Avg CIP prob', overlaying: 'y', side: 'right', automargin: true },
    legend: { orientation: 'h', y: 1.1 }
  }, plotConfig);
}

async function init() {
  try {
    applyQueryOverrides();
    if (!QUERY.has('mode')) state.viewMode = defaultViewModeForTab(state.tab);
    await loadManifest();
    if (Array.isArray(DEMO_UNITIDS)) {
      META.schools = DEMO_UNITIDS.map(unitid => (META.schools || []).find(s => String(s.unitid) === unitid)).filter(Boolean);
      if (!META.schools.length) throw new Error("Demo schools missing from manifest");
    }
    await Promise.all([
      loadFact('overview'),
      loadFact('major_mix'),
      loadFact('majors'),
      loadReference('cip2_titles'),
      loadReference('cip4_titles'),
      loadReference('cip6_titles'),
    ]);
    await populateSchoolSelect();
    populateDegreeSelect();
    const requestedSchool = QUERY.get('school');
    if (requestedSchool) {
      const schoolMatch = META.schools.find(s => String(s.unitid) === requestedSchool || s.ipeds_name === requestedSchool);
      if (schoolMatch) {
        state.selectedSchool = String(schoolMatch.unitid);
        state.selectedSchools = [state.selectedSchool];
      }
    }
    ensureSchoolSelection();
    if (state.selectionMode === 'compare' && state.selectedSchools.length >= 2) state.compareChooserOpen = false;
    syncSelectedSchoolValues();
    const preloadPromise = preloadSelectedSchoolFacts();
    await populateCohortSelect();
    await populateMajorSelect();
    await preloadPromise;
    syncControlsToState();
    if (state.viewMode === 'overtime') document.getElementById('cohortSelect').value = 'All';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    await refresh();
  } catch (err) {
    document.getElementById('loading').innerHTML = `<div class="loading-card"><div style="font-weight:800;color:var(--rose);margin-bottom:8px;">Data not connected</div><div class="subtle">${err.message}</div><div class="subtle" style="margin-top:10px;">The public frontend must use the protected API. Do not publish raw data folders with GitHub Pages.</div></div>`;
  }
}

init();
</script>
</body>
</html>
