<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Outcomes Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
:root {
  --ink: #243b53;
  --muted: #6b7c93;
  --line: #dde6ef;
  --panel: #ffffff;
  --panel-soft: #f7fafc;
  --bg: #f3f7fb;
  --blue: #2f80ed;
  --green: #2bb673;
  --gold: #f4b740;
  --rose: #e55b7a;
  --violet: #8b6fd6;
  --shadow: 0 10px 30px rgba(36, 59, 83, 0.08);
  --tm-ink: #2D426A;
  --tm-muted: #899499;
  --tm-line: #E6EBF2;
  --tm-low: #D9ECFB;
  --tm-mid: #48AFF4;
  --tm-high: #2D426A;
  --tm-gray: #B9C4D3;
  --tm-shadow: 0 8px 24px rgba(45, 66, 106, 0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Source Sans 3', sans-serif; background: radial-gradient(circle at top left, rgba(46,116,215,0.08), transparent 28%), radial-gradient(circle at top right, rgba(33,166,117,0.08), transparent 24%), linear-gradient(180deg, #f4f8fb 0%, #edf3f8 100%); color: var(--ink); min-height: 100vh; }
.hero { position: relative; overflow: hidden; background: linear-gradient(135deg, #12344a 0%, #1e5677 58%, #3a7ca5 100%); color: white; padding: 44px 28px 30px; border-bottom: 1px solid rgba(255,255,255,0.14); }
.hero h1 { position: relative; z-index: 1; font-size: clamp(2rem, 4vw, 3rem); letter-spacing: -0.03em; margin-bottom: 8px; }
.hero p { position: relative; z-index: 1; opacity: 0.9; max-width: 720px; font-size: 1rem; line-height: 1.5; }
.hero::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at top right, rgba(255,255,255,0.22), transparent 32%), radial-gradient(circle at bottom left, rgba(255,255,255,0.12), transparent 26%); pointer-events: none; }
.controls { display: flex; flex-wrap: wrap; gap: 12px; padding: 16px 22px; background: rgba(255,255,255,0.86); backdrop-filter: blur(18px); border-bottom: 1px solid rgba(22,50,74,0.08); position: sticky; top: 0; z-index: 10; box-shadow: 0 12px 32px rgba(20,44,65,0.08); align-items: flex-start; }
.controls-main { display: grid; grid-template-columns: minmax(320px, 1.5fr) minmax(180px, 0.72fr) max-content minmax(320px, 1.2fr) max-content max-content; gap: 14px 16px; width: 100%; align-items: end; }
.control { display: flex; align-items: center; gap: 8px; min-width: 0; }
.controls-main > .control { flex-direction: column; align-items: flex-start; gap: 6px; }
.control-stack { flex-direction: column; align-items: flex-start; gap: 6px; }
.control-grow { flex: 1 1 320px; min-width: 280px; }
.control-major { min-width: 280px; }
.control-degree { min-width: 180px; }
.control-years .segmented, .control-view .segmented { flex-wrap: nowrap; }
.control-years .btn, .control-view .btn { white-space: nowrap; }
.controls-main .control > select { width: 100%; }
.controls-main .control > .segmented { width: auto; }
.controls-main .control label { min-height: 16px; line-height: 1; }
.control label { font-size: 0.76rem; text-transform: uppercase; color: var(--muted); font-weight: 700; letter-spacing: 0.04em; }
select, .btn { font: inherit; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: rgba(245,248,252,0.96); color: var(--ink); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85); transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease, background 140ms ease; }
.btn { cursor: pointer; font-weight: 700; }
.btn:hover, select:hover { border-color: rgba(39,76,119,0.24); box-shadow: 0 8px 18px rgba(20,44,65,0.08), inset 0 1px 0 rgba(255,255,255,0.92); transform: translateY(-1px); }
.btn.active { background: linear-gradient(135deg, #16324a 0%, #2e74d7 100%); color: white; border-color: transparent; box-shadow: 0 10px 20px rgba(22,50,74,0.16); }
#schoolSelect { min-width: 280px; }
#majorSelect { min-width: 280px; width: 100%; }
#cipDigitsSelect { min-width: 160px; }
.advanced-toggle { margin-left: auto; }
.advanced-panel { display: none; width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel-soft); }
.advanced-panel.is-open { display: block; }
.advanced-grid { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: flex-start; }
.select-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.school-note { max-width: 360px; }
.compare-school-panel { display: none; width: 100%; max-width: 420px; max-height: 160px; overflow: auto; padding: 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-soft); }
.compare-school-option { display: flex; align-items: center; gap: 8px; padding: 6px 2px; font-size: 0.95rem; }
.compare-school-option input { accent-color: var(--ink); }
.school-summary { display: none; width: 100%; max-width: 420px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel-soft); }
.school-summary-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.school-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.school-chip { display: inline-flex; align-items: center; padding: 6px 10px; border-radius: 999px; background: white; border: 1px solid var(--line); font-size: 0.88rem; font-weight: 700; color: var(--ink); }
.tabs { display: flex; gap: 8px; padding: 14px 22px 0; background: transparent; border-bottom: 0; overflow-x: auto; }
.tab { padding: 10px 16px; color: var(--muted); font-weight: 700; cursor: pointer; border: 1px solid transparent; border-radius: 999px; white-space: nowrap; background: rgba(255,255,255,0.62); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85); }
.tab.active { color: #ffffff; background: linear-gradient(135deg, #16324a 0%, #2e74d7 100%); border-color: transparent; }
.content { max-width: 1680px; margin: 0 auto; padding: 24px 22px 44px; }
.panel { display: none; }
.panel.active { display: block; }
.card { background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(247,250,252,0.94)); border: 1px solid rgba(22,50,74,0.08); border-radius: 22px; box-shadow: 0 12px 28px rgba(20,44,65,0.06); padding: 22px; margin-bottom: 18px; }
.card h3 { margin-bottom: 12px; font-size: 1.08rem; letter-spacing: -0.01em; line-height: 1.25; }
.overview-top-card { padding: 24px 24px 18px; }
.overview-top-card h3 { margin-bottom: 14px; font-size: 1.18rem; }
.major-toggle-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: -2px 0 14px; }
.major-toggle-label { color: var(--muted); font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 2px; }
.major-toggle-chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,0.94); color: var(--ink); padding: 6px 10px; font-size: 0.84rem; font-weight: 800; cursor: pointer; max-width: 250px; transition: opacity 140ms ease, transform 140ms ease, border-color 140ms ease; }
.major-toggle-chip:hover { transform: translateY(-1px); border-color: rgba(39,76,119,0.24); }
.major-toggle-chip.is-off { opacity: 0.42; text-decoration: line-through; }
.major-toggle-dot { width: 9px; height: 9px; border-radius: 999px; flex: 0 0 auto; box-shadow: 0 0 0 2px rgba(255,255,255,0.9); }
.major-toggle-reset { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 0.84rem; font-weight: 800; cursor: pointer; padding: 6px 4px; }
.major-toggle-reset:hover { color: var(--ink); }
.treemap-card { padding: 0; overflow: hidden; border: 1px solid var(--tm-line); border-radius: 20px; box-shadow: var(--tm-shadow); }
.treemap-card .card-head { padding: 18px 18px 0; }
.treemap-card .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.treemap-card .card-head h3 { margin: 0 0 5px; font-size: 22px; font-weight: 700; color: var(--tm-ink); }
.treemap-card .card-head p { margin: 0; font-size: 14px; color: var(--tm-muted); line-height: 1.4; }
.treemap-card .card-back { border: 1px solid var(--tm-line); background: white; color: var(--tm-ink); border-radius: 999px; padding: 7px 12px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.treemap-card .card-back.is-hidden { visibility: hidden; pointer-events: none; }
.treemap-body { padding: 0 12px 14px; }
.treemap-plot { height: clamp(420px, 58vh, 680px); }
.legend-wrap { margin: 6px 6px 0; display: grid; gap: 8px; }
.legend-wrap.is-hidden { display: none; }
.legend-bar { height: 14px; border-radius: 999px; background: linear-gradient(90deg, var(--tm-low) 0%, var(--tm-mid) 50%, var(--tm-high) 100%); border: 1px solid var(--tm-line); }
.legend-scale { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--tm-muted); font-weight: 700; }
.legend-caption { font-size: 12px; color: var(--tm-muted); line-height: 1.35; }
.subtle { color: var(--muted); font-size: 0.92rem; }
.badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-soft); color: var(--ink); font-size: 0.84rem; font-weight: 700; }
.badge.warn { border-color: #f4d38c; background: #fff7e2; color: #8a5a00; }
.badge.note { border-color: #bfd6ef; background: #edf5fd; color: #1b4f8a; }
.badge.soft { background: #f7fafc; color: var(--muted); }
.methodology-drawer { margin-bottom: 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: var(--shadow); overflow: hidden; }
.methodology-drawer summary { list-style: none; cursor: pointer; padding: 14px 18px; font-weight: 800; }
.methodology-drawer summary::-webkit-details-marker { display: none; }
.methodology-body { padding: 0 18px 18px; border-top: 1px solid var(--line); }
.methodology-body p { margin: 12px 0 10px; color: var(--muted); }
.methodology-body ul { margin: 0; padding-left: 18px; color: var(--ink); }
.methodology-body li { margin: 6px 0; }
.methodology-flow { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
.methodology-flow-title { font-size: 0.82rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 10px; }
.flowchart { display: flex; align-items: stretch; gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.flow-node { min-width: 180px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel-soft); box-shadow: inset 0 1px 0 rgba(255,255,255,0.65); }
.flow-node strong { display: block; font-size: 0.95rem; color: var(--ink); margin-bottom: 4px; }
.flow-node span { display: block; font-size: 0.84rem; color: var(--muted); line-height: 1.35; }
.flow-arrow { display: flex; align-items: center; justify-content: center; min-width: 22px; font-size: 1.15rem; font-weight: 800; color: var(--muted); }
.inline-controls { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.segmented { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.segmented .btn { border-radius: 999px; padding: 7px 12px; }
.flow-shell { display: grid; gap: 18px; }
.flow-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.flow-header h2 { font-size: 1.55rem; margin-bottom: 0; }
.flow-context { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.flow-chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-soft); color: var(--ink); font-size: 0.84rem; font-weight: 700; }
.flow-chip strong { color: var(--ink); }
.flow-kpis { margin-top: 12px; margin-bottom: 0; grid-template-columns: minmax(260px, 1.8fr) repeat(2, minmax(130px, 0.8fr)); gap: 10px; }
.flow-kpis .kpi { padding: 12px 14px; border-radius: 16px; }
.flow-kpis .kpi .label { font-size: 0.66rem; margin-top: 0; }
.flow-kpis .kpi .value { font-size: clamp(1rem, 1.5vw, 1.38rem); line-height: 1.08; }
.flow-kpis .kpi:first-child .value { font-size: clamp(0.98rem, 1.35vw, 1.2rem); }
.flow-kpis .kpi .meta { margin-top: 6px; font-size: 0.82rem; font-weight: 800; color: var(--ink); }
.flow-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(360px, 0.9fr); gap: 18px; align-items: start; }
.flow-card { min-height: 640px; }
.flow-card { position: relative; overflow: hidden; }
.flow-card::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at top left, rgba(72, 175, 244, 0.08), transparent 45%), radial-gradient(circle at top right, rgba(43, 182, 115, 0.05), transparent 40%); pointer-events: none; }
.flow-card > * { position: relative; z-index: 1; }
.flow-card .card-topline { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.flow-card .card-topline h3 { margin: 0 0 4px; }
.flow-plot { height: 540px; }
.flow-detail-plot { height: 280px; }
.flow-empty { padding: 26px; border: 1px dashed var(--line); border-radius: 16px; background: var(--panel-soft); color: var(--muted); }
.flow-legend { display: grid; gap: 7px; min-width: 220px; max-width: 340px; margin-top: 10px; }
.flow-legend-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 0.78rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
.flow-legend-bar { height: 12px; border-radius: 999px; border: 1px solid var(--tm-line); background: linear-gradient(90deg, var(--tm-low) 0%, var(--tm-mid) 52%, var(--tm-high) 100%); }
.flow-selected { padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(72, 175, 244, 0.08), rgba(255,255,255,0.95)); margin-bottom: 14px; }
.flow-selected .title { font-size: 1.08rem; font-weight: 800; color: var(--ink); line-height: 1.25; }
.flow-selected .meta { margin-top: 4px; color: var(--muted); font-size: 0.9rem; }
.postgrad-gap { margin-top: 16px; padding: 16px 18px; border-radius: 18px; border: 1px solid var(--line); background: linear-gradient(180deg, rgba(244, 248, 252, 0.94), rgba(255,255,255,0.98)); }
.postgrad-gap-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.postgrad-gap-title { font-size: 0.76rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.postgrad-gap-value { font-size: 1.5rem; font-weight: 800; color: var(--ink); white-space: nowrap; }
.postgrad-gap-bar { margin-top: 10px; height: 10px; border-radius: 999px; background: rgba(185,196,211,0.4); overflow: hidden; }
.postgrad-gap-fill { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #2D426A 0%, #48AFF4 100%); }
.mini-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
.mini-metric { padding: 12px 14px; border-radius: 14px; background: var(--panel-soft); border: 1px solid var(--line); }
.mini-metric .value { font-size: 1.15rem; font-weight: 800; }
.mini-metric .label { margin-top: 2px; font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { background: linear-gradient(180deg, #ffffff, #f5f9fd); border: 1px solid rgba(22,50,74,0.08); border-radius: 20px; padding: 18px; box-shadow: 0 12px 24px rgba(20,44,65,0.05); }
.kpi .value { font-size: clamp(1.45rem, 2.6vw, 2rem); font-weight: 800; letter-spacing: -0.03em; }
.kpi .label { color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.75rem; margin-top: 4px; font-weight: 700; }
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.row-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.table-wrap { overflow-x: auto; border-radius: 16px; border: 1px solid rgba(22,50,74,0.06); }
table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.72); }
th, td { padding: 11px 12px; border-bottom: 1px solid rgba(22,50,74,0.08); text-align: left; }
th { color: var(--muted); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.05em; background: rgba(245,248,252,0.92); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover { background: rgba(46,116,215,0.04); }
.js-plotly-plot .legend text { font-size: 11px !important; }
.js-plotly-plot .xtick text, .js-plotly-plot .ytick text { font-size: 11px !important; }
.loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #eef4f9 0%, #e6eef6 100%); z-index: 20; }
.loading-card { background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(247,250,252,0.96)); border: 1px solid rgba(22,50,74,0.08); border-radius: 22px; box-shadow: 0 18px 36px rgba(20,44,65,0.08); padding: 24px 30px; max-width: 620px; }
.no-data { padding: 42px 18px; text-align: center; color: var(--muted); border: 1px dashed rgba(22,50,74,0.12); border-radius: 18px; background: rgba(245,248,252,0.72); }
@media (max-width: 1340px) { .controls-main { grid-template-columns: minmax(280px, 1.35fr) minmax(170px, 0.8fr) max-content minmax(280px, 1.1fr); } .control-view, .advanced-toggle { justify-self: start; } }
@media (max-width: 1200px) { .row-3 { grid-template-columns: 1fr; } .controls-main { grid-template-columns: repeat(2, minmax(280px, 1fr)); } .control-years .segmented, .control-view .segmented { flex-wrap: wrap; } .flow-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 920px) { .row-2 { grid-template-columns: 1fr; } .row-3 { grid-template-columns: 1fr; } .flow-grid { grid-template-columns: 1fr; } .content { padding: 12px; } .controls { padding: 10px 12px; } .controls-main { display: flex; flex-wrap: wrap; gap: 10px; } .advanced-toggle { margin-left: 0; } .flow-plot { height: 460px; } .flow-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>
</head>
<body>
<div id="loading" class="loading">
  <div class="loading-card">
    <div style="font-weight:800;margin-bottom:8px;">Loading outcomes explorer…</div>
    <div class="subtle">Expect a small delay the first time each fact table is loaded.</div>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="hero">
    <h1>College Outcomes Explorer</h1>
      </div>

  <div class="controls">
    <div class="controls-main">
    <div class="control control-stack control-grow">
      <label>School</label>
      <select id="schoolSelect" onchange="onSchoolChange()"></select>
      <div id="compareSchoolPanel" class="compare-school-panel"></div>
      <div id="schoolSelectionSummary" class="school-summary"></div>
      <div class="select-actions" id="schoolSelectActions" style="display:none;">
        <button class="btn" type="button" onclick="selectDefaultCompareSchools()">All 3</button>
        <button class="btn" type="button" onclick="clearComparedSchools()">Clear</button>
      </div>
      <div class="subtle school-note" id="schoolSelectNote"></div>
    </div>
    <div class="control control-stack control-degree">
      <label>Degree</label>
      <select id="degreeSelect" onchange="onPrimaryFilterChange()"></select>
    </div>
    <div class="control control-stack control-years">
      <label>Years Out</label>
      <div class="segmented">
        <button class="btn" data-hz="1" onclick="setHorizon(1)">1yr</button>
        <button class="btn active" data-hz="5" onclick="setHorizon(5)">5yr</button>
        <button class="btn" data-hz="10" onclick="setHorizon(10)">10yr</button>
      </div>
    </div>
    <div class="control control-stack control-major">
      <label>Major</label>
      <select id="majorSelect" onchange="onMajorChange()"></select>
    </div>
    <div class="control control-stack control-view">
      <label>View</label>
      <div class="segmented">
        <button class="btn active" data-mode="snapshot" onclick="setViewMode('snapshot')">Snapshot</button>
        <button class="btn" data-mode="overtime" onclick="setViewMode('overtime')">Over Time</button>
      </div>
    </div>
    <div class="control control-stack advanced-toggle">
      <label>Options</label>
      <button class="btn" id="advancedOptionsToggle" type="button" onclick="toggleAdvancedOptions()">Advanced Options</button>
    </div>
    </div>
    <div id="advancedOptionsPanel" class="advanced-panel">
      <div class="advanced-grid">
    <div class="control">
      <label>Selection</label>
      <button class="btn active" data-selection="single" onclick="setSelectionMode('single')">Single</button>
      <button class="btn" data-selection="compare" onclick="setSelectionMode('compare')">Compare</button>
    </div>
    <div class="control">
      <label>Cohort</label>
      <select id="cohortSelect" onchange="onPrimaryFilterChange()"></select>
    </div>
    <div class="control">
      <label>CIP Level</label>
      <select id="cipDigitsSelect" onchange="onCipDigitsChange()">
        <option value="2" selected>2-digit CIP</option>
        <option value="4">4-digit CIP</option>
        <option value="6">6-digit CIP</option>
      </select>
    </div>
    <div class="control">
      <label>Current Students</label>
      <button class="btn" id="currentStudentsToggle" type="button" onclick="toggleCurrentStudents()">Show Current Students</button>
    </div>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="overview">Overview</div>
    <div class="tab" data-tab="earnings">Earnings</div>
    <div class="tab" data-tab="employers">Employers</div>

async function loadManifest() {
  const errors = [];
  const candidates = [];
  for (const dir of DATA_DIR_CANDIDATES) {
    try {
      const res = await fetch(`${dir}explorer_manifest.json`);
      if (!res.ok) {
        errors.push(`${dir} -> HTTP ${res.status}`);
        continue;
      }
      const manifest = await res.json();
      const hasSubtypeDoctorRows = await validateManifestCandidate(dir, manifest);
      candidates.push({
        dir,
        manifest,
        factCount: Object.keys(manifest?.facts || {}).length,
        refCount: Object.keys(manifest?.reference || {}).length,
        degreeSubtypeScore: hasSubtypeDoctorRows ? 1 : 0,
      });
    } catch (err) {
      errors.push(`${dir} -> ${err.message}`);
    }
  }
  if (candidates.length) {
    candidates.sort((a, b) => {
      if (b.degreeSubtypeScore !== a.degreeSubtypeScore) return b.degreeSubtypeScore - a.degreeSubtypeScore;
      if (b.factCount !== a.factCount) return b.factCount - a.factCount;
      if (b.refCount !== a.refCount) return b.refCount - a.refCount;
      return DATA_DIR_CANDIDATES.indexOf(a.dir) - DATA_DIR_CANDIDATES.indexOf(b.dir);
    });
    META = candidates[0].manifest;
    DATA_DIR = candidates[0].dir;
    return;

  }
  throw new Error(`Could not load explorer_manifest.json from any data directory: ${errors.join(' | ')}`);
}

async function loadFact(name) {

    overview: ['overview', 'earnings'],

    employer_roles: ['employer_roles'],

  if (!factKey) throw new Error(`Manifest missing fact for ${name}`);
  const spec = META.facts[factKey];
  const cacheKey = (spec && typeof spec === 'object' && spec.by_school)
    ? `${factKey}|${getSelectedUnitids().map(String).sort().join(',')}`
    : factKey;
  if (CACHE[cacheKey]) return CACHE[cacheKey];
  if (!DATA_DIR) throw new Error('Data directory not initialized');
  let files = [];
  if (Array.isArray(spec)) {
    files = spec;

    const unitids = getSelectedUnitids().map(String);
    files = unitids.map(unitid => spec.by_school[unitid]).filter(Boolean);

async function deriveReferenceRows(name) {

    const overview = await loadFact('overview');
    (overview || []).forEach(row => {
      const level = String(row?.cip_level || '').toUpperCase();
      const code = String(row?.cip_code || '').trim();
      const title = normalizeCipTitle(row?.cip_title);
      if (level !== config.levelKey || !code || code === 'ALL' || !title) return;
      if (!titles[code]) titles[code] = title;

    console.warn(`Could not derive ${name} from overview`, err);

  if (!Object.keys(titles).length) {
    try {
      const majors = await loadFact('majors');
      (majors || []).forEach(row => {
        const code = String(row?.[config.factField] || '').trim();
        if (!code || code === 'ALL') return;
        if (config.factField === 'cip_code') {

async function loadReference(name) {

async function populateMajorSelect() {
  const majors = await loadFact('majors');
  const selectedUnitids = getSelectedUnitids();
  const rows = majors.filter(r =>
    selectedUnitids.includes(String(r.unitid)) &&
    degreeMatchesRow(r, state.degree) &&
    (r.horizon == null || r.horizon === state.horizon) &&
    (state.cohortBand === 'All' || String(r.cohort_band) === String(state.cohortBand)) &&
    (r.n || 0) > 0
  );
  const byMajor = {};
  rows.forEach(r => {
    const code = getMajorCodeFromRow(r);
    const title = getMajorTitleFromRow(r);
    if (!code || code === 'ALL' || isNoiseLabel(title)) return;
    if (!byMajor[code]) byMajor[code] = { code, title, n: 0, schools: new Set() };
    byMajor[code].n += r.n || 0;
    byMajor[code].schools.add(String(r.unitid));

  const minSchools = 1;

    .filter(r => r.schools.size >= minSchools)
    .map(r => ({ code: r.code, title: r.title, n: r.n }))
    .sort((a, b) => b.n - a.n)
    .slice(0, 200);
  const sel = document.getElementById('majorSelect');

function buildPostgradDegreeSummary(flowRows, totalBachelors = null) {

    if (!groups[degree]) groups[degree] = { degree, users: 0, yearsNum: 0, yearsDen: 0 };

    groups[degree].users += users;
    if (r.avg_years_to_postgrad != null && users > 0) {

      groups[degree].yearsDen += users;

    .map(r => ({
      ...r,
      flow_pct: totalBachelors ? r.users / totalBachelors * 100 : null,
      avg_years_to_postgrad: r.yearsDen ? r.yearsNum / r.yearsDen : null,

function updateTreemapLegend(divId, domain) {
  const wrap = document.getElementById(`${divId}-legend`);
  const minEl = document.getElementById(`${divId}-legend-min`);
  const maxEl = document.getElementById(`${divId}-legend-max`);

async function renderHierarchyTreemap(divId, rows, levels, path, opts = {}) {
  const { labelFormatter = v => v } = opts;
  const nodes = visibleHierarchyRows(rows, levels, path).map(row => ({ ...row, label: labelFormatter(row.label) }));
  const salaryValues = nodes.map(r => r.median_salary).filter(v => v != null && !Number.isNaN(Number(v))).map(Number);
  const cmin = salaryValues.length ? Math.min(...salaryValues) : 0;
  const cmax = salaryValues.length ? Math.max(...salaryValues) : 0;
  const colorDomain = salaryValues.length && cmax > cmin ? [cmin, cmax] : null;
  const rootTotal = sum(rows, 'n') || sum(rows, 'value') || 0;
  const parentScopeRows = filterRowsByHierarchyPath(rows, levels, path);
  const parentTotal = sum(parentScopeRows, 'n') || sum(parentScopeRows, 'value') || rootTotal || 0;
  updateTreemapLegend(divId, colorDomain);
  await Plotly.newPlot(divId, [{
    type: 'treemap',
    branchvalues: 'remainder',
    ids: nodes.map(r => [...path, r.label].join(' > ')),
    labels: nodes.map(r => r.label),
    parents: nodes.map(() => ''),
    values: nodes.map(r => r.value),
    textinfo: 'label',
    marker: {
      colors: nodes.map(r => payColor(Number.isFinite(Number(r.median_salary)) ? Number(r.median_salary) : null, colorDomain)),
      line: { width: 1.2, color: '#ffffff' }
    },
    customdata: nodes.map(r => [
      rootTotal ? (r.value / rootTotal) * 100 : null,
      parentTotal ? (r.value / parentTotal) * 100 : null,
      r.median_salary == null ? 'Median pay unavailable' : `Median pay: ${fmtSalary(r.median_salary)}`,
      r.drillable ? 'Click to drill' : '',
    ]),
    hovertemplate: '<b>%{label}</b><br>Observed grads: %{value:,}<br>Share of total: %{customdata[0]:.1f}%<br>Share of block: %{customdata[1]:.1f}%<br>%{customdata[2]}<br>%{customdata[3]}<extra></extra>',
    pathbar: { visible: false },

  }], {
    ...plotLayout,

  }, plotConfig);

}

  if (DRILL_STATE.majorTrendCodes.length && DRILL_STATE.majorTrendCodes.every(code => DRILL_STATE.majorTrendHidden.has(String(code)))) {
    DRILL_STATE.majorTrendHidden.clear();
  }
  const plottedMajorTrendSeriesData = majorTrendSeriesData.filter(series => !DRILL_STATE.majorTrendHidden.has(String(series.major.code)));
  const majorToggleHtml = majorTrendSeriesData.length > 1 ? `
    <div class="major-toggle-row">
      <span class="major-toggle-label">Show</span>
      ${majorTrendSeriesData.map(series => {
        const isHidden = DRILL_STATE.majorTrendHidden.has(String(series.major.code));
        return `<button class="major-toggle-chip ${isHidden ? 'is-off' : ''}" type="button" data-major-toggle="${String(series.major.code)}">
          <span class="major-toggle-dot" style="background:${series.color};"></span>
          <span>${shortLabel(series.major.title, 30)}</span>
        </button>`;
      }).join('')}
      <button class="major-toggle-reset" type="button" data-major-toggle-reset>Show all</button>
    </div>` : '';
  const majorMixSeries = plottedMajorTrendSeriesData.map(series => ({
    name: series.major.title,
    type: 'scatter',
    mode: 'lines+markers',
    showlegend: false,
    connectgaps: false,
    x: series.points.map(p => p.x),
    y: series.points.map(p => p.y),
    line: { color: series.color, width: 3 },
    marker: {
      color: series.color,
      size: series.points.map(p => p.projected ? 9 : 7),
      symbol: series.points.map(p => p.projected ? 'diamond' : 'circle'),
    },
    customdata: series.points.map(p => [p.projected ? 'Current students' : 'Observed grads', p.n || 0]),
    hovertemplate: `${series.major.title}<br>${timeLabel} %{x}<br>Share %{y:.1f}%<br>%{customdata[0]}<br>Count %{customdata[1]:,}<extra></extra>`,
  }));
  const majorLabelAnnotations = state.viewMode === 'overtime'
    ? plottedMajorTrendSeriesData.map(series => {
        const lastPoint = [...series.points].reverse().find(p => p.y != null);
        if (!lastPoint) return null;
        const labelOffset = showFutureMajorYears ? 0.72 : 0.52;
        const labelLength = showFutureMajorYears ? 34 : 28;
        return {
          xref: 'x',
          yref: 'y',
          x: Number(lastPoint.x) + labelOffset,
          y: lastPoint.y,
          text: shortLabel(series.major.title, labelLength),
          showarrow: false,
          xanchor: 'left',
          yanchor: 'middle',
          font: { size: 12, color: series.color },
          bgcolor: 'rgba(255,255,255,0.82)',
          borderpad: 2,
        };
      }).filter(Boolean).sort((a, b) => Number(b.y) - Number(a.y))
    : [];
  for (let i = 1; i < majorLabelAnnotations.length; i += 1) {
    if (majorLabelAnnotations[i - 1].y - majorLabelAnnotations[i].y < 0.85) {
      majorLabelAnnotations[i].y = majorLabelAnnotations[i - 1].y - 0.85;
    }
  }
  const volumeTimeValues = showFutureMajorYears
    ? sortYears([...new Set([...timeValues, 2026, 2027, 2028, 2029])])
    : timeValues;
  const volumeTickValues = showFutureMajorYears
    ? volumeTimeValues.filter(t => t === 2005 || t === 2025 || t % 5 === 0 || (t > 2025 && t % 2 === 1))
    : volumeTimeValues;
  const volumeTrend = volumeTimeValues.map(t => {
    const countSlice = countSourceRows.filter(r => String(r[timeField]) === String(t));
    const currentStudents = sum(majorRows.filter(r => String(r[timeField]) === String(t) && Number(r.current_student_flag || 0) === 1), 'n');
    return {
      period: t,
      observed: sum(countSlice, countField) || null,
      currentStudents: currentStudents || null,
    };
  });
  const majorTrendTitle = showFutureMajorYears
    ? (state.major === 'ALL' ? 'Top Current Student Majors Over Time' : 'Selected Major Over Time + Current Students')
    : 'Top Majors Over Time';
  const overviewChartRow = `
    <div class="row-2">
      <div class="card overview-top-card"><h3>Salary Trend by ${timeLabel}</h3><div id="ov-trend"></div></div>
      <div class="card overview-top-card"><h3>${observedLabel} by ${timeLabel}</h3><div id="ov-volume"></div></div>
    </div>
    <div class="card overview-top-card overview-major-wide"><h3>${majorTrendTitle}</h3>${majorToggleHtml}<div id="ov-mix"></div></div>`;
  const majorTrendHeight = 520;

  panel.innerHTML = `${methodology}${qualityBadges}
    <div class="kpis">
      <div class="kpi"><div class="value">${fmtSalary(medianSalary)}</div><div class="label">Weighted Median Salary</div></div>
      <div class="kpi"><div class="value">${fmtNum(totalObservedCompletions)}</div><div class="label">${observedLabel}</div></div>
      <div class="kpi"><div class="value">${fmtNum(totalSalaryObservations)}</div><div class="label">Salary Observations</div></div>
    </div>
    ${overviewChartRow}`;

  Plotly.newPlot('ov-trend', [{
    type: 'scatter', mode: 'lines+markers',
    x: trend.map(r => r.period), y: trend.map(r => r.median),
    line: { color: COLORS[0], width: 3.5 }, marker: { size: 9 },
    hovertemplate: `${timeLabel} %{x}<br>Median %{y:$,.0f}<br>${observedLabel} %{text:,}<extra></extra>`,
    text: trend.map(r => r.observed)
  }], {
    ...plotLayout,
    height: 390,
    font: { ...plotLayout.font, size: 15 },
    xaxis: { title: timeLabel, automargin: true, tickfont: { size: 13 }, titlefont: { size: 14 } },
    yaxis: { tickprefix: '$', tickformat: ',', automargin: true, tickfont: { size: 13 }, titlefont: { size: 14 } }
  }, plotConfig);

  Plotly.newPlot('ov-volume', [
    {
      type: 'bar',
      name: observedLabel,
      x: volumeTrend.map(r => r.period),
      y: volumeTrend.map(r => r.observed),
      marker: { color: 'rgba(72, 175, 244, 0.78)' },
      hovertemplate: `${timeLabel} %{x}<br>${observedLabel} %{y:,}<extra></extra>`
    },
    ...(showFutureMajorYears ? [{
      type: 'bar',
      name: 'Current students',
      x: volumeTrend.map(r => r.period),
      y: volumeTrend.map(r => r.currentStudents),
      marker: { color: 'rgba(43, 182, 115, 0.76)' },
      hovertemplate: `${timeLabel} %{x}<br>Current students %{y:,}<extra></extra>`
    }] : [])
  ], {
    ...plotLayout,
    height: 390,
    font: { ...plotLayout.font, size: 15 },
    barmode: 'group',
    margin: { ...plotLayout.margin, t: 46 },
    xaxis: {
      title: timeLabel,
      automargin: true,
      tickfont: { size: 13 },
      titlefont: { size: 14 },
      ...(showFutureMajorYears ? {
        range: [Math.min(...volumeTimeValues) - 0.25, 2029.25],
        tickmode: 'array',
        tickvals: volumeTickValues,
      } : {}),
    },
    yaxis: { title: observedLabel, automargin: true, tickfont: { size: 13 }, titlefont: { size: 14 } },
    legend: { orientation: 'h', y: 1.12, font: { size: 12 } }
  }, plotConfig);

  Plotly.newPlot('ov-mix', majorMixSeries, {
    ...plotLayout,
    height: majorTrendHeight,
    font: { ...plotLayout.font, size: 15 },
    shapes: showFutureMajorYears ? [{
      type: 'line',
      xref: 'x',
      yref: 'paper',
      x0: 2025.5,
      x1: 2025.5,
      y0: 0,
      y1: 1,
      line: { color: '#7C8CA3', width: 2, dash: 'dot' },
    }] : [],
    annotations: [
      ...(showFutureMajorYears ? [{
      xref: 'x',
      yref: 'paper',
      x: 2025.65,
      y: 1.04,
      text: 'Current students',
      showarrow: false,
      xanchor: 'left',
      yanchor: 'bottom',
      font: { size: 13, color: '#31455F' },
      bgcolor: 'rgba(255,255,255,0.9)',
      borderpad: 3,
    }] : []),
      ...majorLabelAnnotations,
    ],
    xaxis: {
      title: timeLabel,
      automargin: true,
      tickfont: { size: 13 },
      titlefont: { size: 14 },
      tickangle: 0,
      ...(state.viewMode === 'overtime' ? {
        range: [Math.min(...majorTrendTimeValues) - 0.25, Math.max(...majorTrendTimeValues) + (showFutureMajorYears ? 3.2 : 2.8)],
        tickmode: 'array',
        tickvals: majorTrendTickValues,
      } : {}),
    },
    yaxis: { title: 'Share of total grads %', ticksuffix: '%', automargin: true, tickfont: { size: 13 }, titlefont: { size: 14 } },
    margin: { ...plotLayout.margin, r: state.viewMode === 'overtime' ? (showFutureMajorYears ? 260 : 210) : 18, t: 34 },
    legend: { orientation: 'h', y: 1.15, font: { size: 12 } }
  }, plotConfig);

}

async function renderEarnings() {
  const [earnings, majors] = await Promise.all([loadFact('earnings'), loadFact('majors')]);
  const earningsSourceRows = normalizeOverviewRows(earnings);
  const earningsHasMajorSlice = earningsSourceRows.some(r => {
    const code = getMajorCodeFromRow(r);
    return code && String(code) !== 'ALL';
  });
  const earningsRows = earningsSourceRows.filter(r => baseFilter(r, { ignoreMajor: state.major !== 'ALL' && !earningsHasMajorSlice }));
  const majorRows = majors.filter(r => baseFilter(r));
  const salaryRows = getSalaryRows(earningsRows, majorRows);
  const salaryWeightField = getSalaryWeightField();
  const panel = document.getElementById('panel-earnings');
  if (!earningsRows.length) { panel.innerHTML = '<div class="no-data">No data for current filters.</div>'; return; }

  const timeField = getTimeField();
  const timeLabel = getTimeLabel();
  const timeValues = getTimeValues(salaryRows.length ? salaryRows : earningsRows);
  const MIN_EARNINGS_MAJOR_N = 25;
  const pctRows = timeValues.map(t => {
    const rows = salaryRows.filter(r => String(r[timeField]) === String(t));
    return {
      period: t,
      p25: weightedAvg(rows, 'p25_salary', salaryWeightField),
      median: weightedAvg(rows, 'median_salary', salaryWeightField),
      p75: weightedAvg(rows, 'p75_salary', salaryWeightField),
    };
  });
  const topMajorRows = aggregateMajorRows(majorRows)
    .filter(r => (r.n || 0) >= MIN_EARNINGS_MAJOR_N && r.median != null)
    .sort((a, b) => (b.median || 0) - (a.median || 0))
    .slice(0, 12)
    .reverse();

  if (isCompareActive()) {
    const selectedUnitids = getSelectedUnitids();
    const rowsBySchool = schoolRowsByUnitid(salaryRows);
    const schoolMetrics = selectedUnitids.map(unitid => {
      const rows = rowsBySchool[String(unitid)] || [];
      return {
        unitid,
        school: getSchoolLabel(unitid),
        p25: weightedAvg(rows, 'p25_salary', salaryWeightField),
        median: weightedAvg(rows, 'median_salary', salaryWeightField),
        p75: weightedAvg(rows, 'p75_salary', salaryWeightField),
        salaryObs: getSalaryObsTotal(rows),
      };
    }).filter(r => r.salaryObs > 0 || r.median != null);
    if (!schoolMetrics.length) { panel.innerHTML = '<div class="no-data">No earnings data for selected comparison schools.</div>'; return; }
    panel.innerHTML = `
      <div class="row-2">
        <div class="card"><h3>${state.viewMode === 'overtime' ? 'Median Salary Trends by School' : 'Salary Benchmarks by School'}</h3><div id="earn-compare-main"></div></div>
        <div class="card"><h3>Current Slice Earnings Table</h3>${renderSchoolSummaryTable([
          { label: 'School' },
          { label: 'P25', className: 'num' },
          { label: 'Median', className: 'num' },
          { label: 'P75', className: 'num' },
          { label: 'Salary Obs', className: 'num' },
        ], schoolMetrics.map(r => `<tr><td>${r.school}</td><td class="num">${fmtSalary(r.p25)}</td><td class="num">${fmtSalary(r.median)}</td><td class="num">${fmtSalary(r.p75)}</td><td class="num">${fmtNum(r.salaryObs)}</td></tr>`))}</div></div>
      </div>`;
    if (state.viewMode === 'overtime') {
      Plotly.newPlot('earn-compare-main', lineSeriesBySchool(selectedUnitids, rowsBySchool, timeValues, timeField, slice => weightedAvg(slice, 'median_salary', salaryWeightField)).map(s => ({ ...s, hovertemplate: `${s.name}<br>${timeLabel} %{x}<br>Median %{y:$,.0f}<extra></extra>` })), { ...plotLayout, height: 380, xaxis: { title: timeLabel, automargin: true }, yaxis: { tickprefix: '$', tickformat: ',', automargin: true }, legend: { orientation: 'h', y: 1.12 } }, plotConfig);
    } else {
      Plotly.newPlot('earn-compare-main', [
        { type: 'bar', name: 'P25', x: schoolMetrics.map(r => r.school), y: schoolMetrics.map(r => r.p25), marker: { color: COLORS[4] } },
        { type: 'bar', name: 'Median', x: schoolMetrics.map(r => r.school), y: schoolMetrics.map(r => r.median), marker: { color: COLORS[0] } },
        { type: 'bar', name: 'P75', x: schoolMetrics.map(r => r.school), y: schoolMetrics.map(r => r.p75), marker: { color: COLORS[1] } },
      ], { ...plotLayout, height: 380, barmode: 'group', xaxis: { automargin: true }, yaxis: { tickprefix: '$', tickformat: ',', automargin: true }, legend: { orientation: 'h', y: 1.12 } }, plotConfig);
    }
    return;
  }

  if (state.viewMode === 'snapshot') {
    const p25 = weightedAvg(salaryRows, 'p25_salary', salaryWeightField);
    const median = weightedAvg(salaryRows, 'median_salary', salaryWeightField);
    const p75 = weightedAvg(salaryRows, 'p75_salary', salaryWeightField);
    panel.innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="value">${fmtSalary(p25)}</div><div class="label">P25 Salary</div></div>
        <div class="kpi"><div class="value">${fmtSalary(median)}</div><div class="label">Median Salary</div></div>
        <div class="kpi"><div class="value">${fmtSalary(p75)}</div><div class="label">P75 Salary</div></div>
        <div class="kpi"><div class="value">${fmtNum(getSalaryObsTotal(salaryRows))}</div><div class="label">Salary Observations</div></div>
      </div>
      <div class="row-2">
        <div class="card"><h3>Salary Distribution in Current Slice</h3><div id="earn-snapshot"></div></div>
        <div class="card"><h3>Top Majors by Median Salary</h3><div class="subtle" style="margin-top:-6px;margin-bottom:10px;">Filtered to majors with at least ${MIN_EARNINGS_MAJOR_N} alumni in the current slice.</div><div id="earn-major-bars"></div></div>
      </div>`;

    Plotly.newPlot('earn-snapshot', [{
      type: 'bar',
      x: ['P25', 'Median', 'P75'],
      y: [p25, median, p75],
      marker: { color: [COLORS[4], COLORS[0], COLORS[1]] },
      hovertemplate: '%{x}<br>%{y:$,.0f}<extra></extra>'
    }], { ...plotLayout, height: 340, xaxis: { automargin: true }, yaxis: { tickprefix: '$', tickformat: ',', automargin: true } }, plotConfig);

    if (!topMajorRows.length) {
      document.getElementById('earn-major-bars').innerHTML = `<div class="no-data">No majors with at least ${MIN_EARNINGS_MAJOR_N} alumni in this slice.</div>`;
      return;
    }

    Plotly.newPlot('earn-major-bars', [{
      type: 'bar', orientation: 'h',
      y: topMajorRows.map(r => wrapLabel(r.title, 22, 3)), x: topMajorRows.map(r => r.median),
      marker: { color: COLORS[1] },
      hovertemplate: '%{y}<br>Median %{x:$,.0f}<br>Alumni %{customdata:,}<extra></extra>',
      customdata: topMajorRows.map(r => r.n)
    }], horizontalBarLayout(topMajorRows.map(r => wrapLabel(r.title, 22, 3)), { height: 430, lMin: 240, r: 20, t: 10, b: 56, bargap: 0.24, xaxis: { tickprefix: '$', tickformat: ',' } }), plotConfig);
    return;
  }

  panel.innerHTML = `
    <div class="row-2">
      <div class="card"><h3>Salary by ${timeLabel}</h3><div id="earn-trend"></div></div>
      <div class="card"><h3>Top Majors by Median Salary</h3><div class="subtle" style="margin-top:-6px;margin-bottom:10px;">Filtered to majors with at least ${MIN_EARNINGS_MAJOR_N} alumni in the current slice.</div><div id="earn-major-bars"></div></div>
    </div>`;

  Plotly.newPlot('earn-trend', [
    { type: 'scatter', mode: 'lines+markers', x: pctRows.map(r => r.period), y: pctRows.map(r => r.p25), name: 'P25', line: { color: COLORS[4] } },
    { type: 'scatter', mode: 'lines+markers', x: pctRows.map(r => r.period), y: pctRows.map(r => r.median), name: 'Median', line: { color: COLORS[0], width: 3 } },
    { type: 'scatter', mode: 'lines+markers', x: pctRows.map(r => r.period), y: pctRows.map(r => r.p75), name: 'P75', line: { color: COLORS[1] } },
  ], { ...plotLayout, height: 360, xaxis: { title: timeLabel, automargin: true }, yaxis: { tickprefix: '$', tickformat: ',', automargin: true }, legend: { orientation: 'h', y: 1.1 } }, plotConfig);

  Plotly.newPlot('earn-major-bars', [{
    type: 'bar', orientation: 'h',
    y: topMajorRows.map(r => wrapLabel(r.title, 22, 3)), x: topMajorRows.map(r => r.median),
    marker: { color: COLORS[1] },
    hovertemplate: '%{y}<br>Median %{x:$,.0f}<br>Alumni %{customdata:,}<extra></extra>',
    customdata: topMajorRows.map(r => r.n)
  }], horizontalBarLayout(topMajorRows.map(r => wrapLabel(r.title, 22, 3)), { height: 430, lMin: 240, r: 20, t: 10, b: 56, bargap: 0.24, xaxis: { tickprefix: '$', tickformat: ',' } }), plotConfig);
}

async function renderRoles() {
  const rows = getFactMajorRows((await loadFact('roles')).filter(r => !isCorruptAllMajorRow(r)));
  const panel = document.getElementById('panel-roles');
  if (!rows.length) { panel.innerHTML = '<div class="no-data">No role data for current filters.</div>'; return; }
  if (isCompareActive()) {
    const selectedUnitids = getSelectedUnitids();
    const rowsBySchool = schoolRowsByUnitid(rows);
    const roleLeaders = topRowsBySchool(selectedUnitids, Object.fromEntries(selectedUnitids.map(unitid => [String(unitid), (rowsBySchool[String(unitid)] || []).filter(r => !isNoiseLabel(r.role_k50_v3))])), 'role_k50_v3', { weightedFields: ['median_salary'] });
    const industryLeaders = topRowsBySchool(selectedUnitids, Object.fromEntries(selectedUnitids.map(unitid => [String(unitid), (rowsBySchool[String(unitid)] || []).filter(r => !isNoiseLabel(r.industry_k200))])), 'industry_k200');
    if (state.viewMode === 'overtime') {
      const timeField = getTimeField();
      const timeLabel = getTimeLabel();
      const timeValues = getTimeValues(rows);
      const leaderRows = selectedUnitids.flatMap(unitid => {
        const schoolRows = rowsBySchool[String(unitid)] || [];
        return timeValues.map(t => {
          const slice = schoolRows.filter(r => String(r[timeField]) === String(t));
          const roleLeader = topItemForSchool(slice.filter(r => !isNoiseLabel(r.role_k50_v3)), 'role_k50_v3', { weightedFields: ['median_salary'] });
          const industryLeader = topItemForSchool(slice.filter(r => !isNoiseLabel(r.industry_k200)), 'industry_k200');
          if (isNoiseLabel(roleLeader.label) && isNoiseLabel(industryLeader.label)) return null;
          return { school: getSchoolLabel(unitid), period: t, role: roleLeader.label, roleShare: roleLeader.share_pct, industry: industryLeader.label, industryShare: industryLeader.share_pct };
        }).filter(Boolean);
      });
      panel.innerHTML = `<div class="card"><h3>Role and Industry Leaders by School and ${timeLabel}</h3>${renderSchoolSummaryTable([
        { label: 'School' },
        { label: timeLabel },
        { label: 'Top Role' },
        { label: 'Role Share', className: 'num' },
        { label: 'Top Industry' },
        { label: 'Industry Share', className: 'num' },
      ], leaderRows.map(r => `<tr><td>${r.school}</td><td>${r.period}</td><td>${r.role}</td><td class="num">${fmtPct(r.roleShare)}</td><td>${r.industry}</td><td class="num">${fmtPct(r.industryShare)}</td></tr>`))}</div>`;
      return;
    }
    panel.innerHTML = `<div class="card"><h3>Role and Industry Leaders</h3><div class="subtle" style="margin-bottom:12px;">Compare mode is simplified here to avoid unreadable multi-school role mix charts.</div>${renderSchoolSummaryTable([
      { label: 'School' },
      { label: 'Top Role' },
      { label: 'Role Share', className: 'num' },
      { label: 'Top Industry' },
      { label: 'Industry Share', className: 'num' },
    ], selectedUnitids.map(unitid => {
      const role = roleLeaders.find(r => String(r.unitid) === String(unitid));
      const industry = industryLeaders.find(r => String(r.unitid) === String(unitid));
      return `<tr><td>${getSchoolLabel(unitid)}</td><td>${role?.label || 'N/A'}</td><td class="num">${fmtPct(role?.share_pct ?? null)}</td><td>${industry?.label || 'N/A'}</td><td class="num">${fmtPct(industry?.share_pct ?? null)}</td></tr>`;
    }))}</div>`;
    return;
  }
  if (state.viewMode === 'overtime') {
    const timeField = getTimeField();
    const timeLabel = getTimeLabel();
    const timeValues = getTimeValues(rows);
    const roleBreakout = buildTimeBreakout(rows.filter(r => !isNoiseLabel(r.role_k50_v3)), 'role_k50_v3', timeField, timeValues, { weightedFields: ['median_salary'], limit: 4 });
    const industryBreakout = buildTimeBreakout(rows.filter(r => !isNoiseLabel(r.industry_k200)), 'industry_k200', timeField, timeValues, { limit: 4 });
    panel.innerHTML = `<div class="row-2">
      <div class="card"><h3>Role Share Trends</h3><div id="role-mix"></div></div>
      <div class="card"><h3>Industry Share Trends</h3><div id="industry-mix"></div></div>
    </div>
    <div class="row-2">
      <div class="card"><h3>Role Leaders by ${timeLabel}</h3><div class="table-wrap"><table>
        <thead><tr><th>${timeLabel}</th><th>Role</th><th class="num">Share %</th><th class="num">Alumni</th></tr></thead>
        <tbody>${roleBreakout.leaders.map(r => `<tr><td>${r.period}</td><td>${r.role_k50_v3}</td><td class="num">${fmtPct(r.share_pct)}</td><td class="num">${fmtNum(r.n)}</td></tr>`).join('')}</tbody>
      </table></div></div>
      <div class="card"><h3>Industry Leaders by ${timeLabel}</h3><div class="table-wrap"><table>
        <thead><tr><th>${timeLabel}</th><th>Industry</th><th class="num">Share %</th><th class="num">Alumni</th></tr></thead>
        <tbody>${industryBreakout.leaders.map(r => `<tr><td>${r.period}</td><td>${r.industry_k200}</td><td class="num">${fmtPct(r.share_pct)}</td><td class="num">${fmtNum(r.n)}</td></tr>`).join('')}</tbody>
      </table></div></div>
    </div>`;
    Plotly.newPlot('role-mix', roleBreakout.series.map(s => ({
      ...s,
      type: 'scatter',
      mode: 'lines+markers',
      name: shortLabel(s.name, 22),
      hovertemplate: `${s.name}<br>${timeLabel} %{x}<br>Share %{y:.1f}%<extra></extra>`
    })), { ...plotLayout, height: 420, xaxis: { title: timeLabel, automargin: true }, yaxis: { title: 'Share of alumni %', ticksuffix: '%', automargin: true }, legend: { orientation: 'h', y: 1.15 } }, plotConfig);
    Plotly.newPlot('industry-mix', industryBreakout.series.map(s => ({
      ...s,
      type: 'scatter',
      mode: 'lines+markers',
      name: shortLabel(s.name, 22),
      hovertemplate: `${s.name}<br>${timeLabel} %{x}<br>Share %{y:.1f}%<extra></extra>`
    })), { ...plotLayout, height: 420, xaxis: { title: timeLabel, automargin: true }, yaxis: { title: 'Share of alumni %', ticksuffix: '%', automargin: true }, legend: { orientation: 'h', y: 1.15 } }, plotConfig);
    return;
  }
  const roleLevels = ['role_k50_v3', 'role_k150_v3'];
  const industryLevels = ['industry_k200'];
  let changed = true;
  while (changed) {
    changed = false;
    const roleContextRows = filterRowsByHierarchyPath(rows.filter(r => !isNoiseLabel(r.role_k50_v3)), industryLevels, DRILL_STATE.industries);
    const nextRolePath = ensureVisibleHierarchyPath(roleContextRows, roleLevels, DRILL_STATE.roles);
    if (!samePath(nextRolePath, DRILL_STATE.roles)) {
      DRILL_STATE.roles = nextRolePath;
      changed = true;
    }
    const industryContextRows = filterRowsByHierarchyPath(rows.filter(r => !isNoiseLabel(r.industry_k200)), roleLevels, DRILL_STATE.roles);
    const nextIndustryPath = ensureVisibleHierarchyPath(industryContextRows, industryLevels, DRILL_STATE.industries);
    if (!samePath(nextIndustryPath, DRILL_STATE.industries)) {
      DRILL_STATE.industries = nextIndustryPath;
      changed = true;
    }
  }
  const roleContextRows = filterRowsByHierarchyPath(rows.filter(r => !isNoiseLabel(r.role_k50_v3)), industryLevels, DRILL_STATE.industries);
  const industryContextRows = filterRowsByHierarchyPath(rows.filter(r => !isNoiseLabel(r.industry_k200)), roleLevels, DRILL_STATE.roles);
  const roleFilterText = DRILL_STATE.industries.length ? `Filtered by industry: ${hierarchyTrail(DRILL_STATE.industries)}` : 'Showing all industries in the current slice';
  const industryFilterText = DRILL_STATE.roles.length ? `Filtered by role: ${hierarchyTrail(DRILL_STATE.roles)}` : 'Showing all roles in the current slice';
  panel.innerHTML = `<div class="row-2">
    <div class="card treemap-card">
      <div class="card-head">
        <div class="card-top">
          <div>
            <h3>Role Treemap</h3>
            <p>${hierarchyTrail(DRILL_STATE.roles)}. ${roleFilterText}</p>
          </div>
          <button class="card-back ${DRILL_STATE.roles.length ? '' : 'is-hidden'}" type="button" onclick="drillBack('roles')">Back</button>
        </div>
      </div>
      <div class="treemap-body">
        <div id="role-tree" class="treemap-plot"></div>
        <div class="legend-wrap is-hidden" id="role-tree-legend">
          <div class="legend-bar" aria-hidden="true"></div>
          <div class="legend-scale"><span id="role-tree-legend-min"></span><span id="role-tree-legend-max"></span></div>
          <div class="legend-caption" id="role-tree-legend-caption"></div>
        </div>
      </div>
    </div>
    <div class="card treemap-card">
      <div class="card-head">
        <div class="card-top">
          <div>
            <h3>Industry Treemap</h3>
            <p>${hierarchyTrail(DRILL_STATE.industries)}. ${industryFilterText}</p>
          </div>
          <button class="card-back ${DRILL_STATE.industries.length ? '' : 'is-hidden'}" type="button" onclick="drillBack('industries')">Back</button>
        </div>
      </div>
      <div class="treemap-body">
        <div id="industry-tree" class="treemap-plot"></div>
        <div class="legend-wrap is-hidden" id="industry-tree-legend">
          <div class="legend-bar" aria-hidden="true"></div>
          <div class="legend-scale"><span id="industry-tree-legend-min"></span><span id="industry-tree-legend-max"></span></div>
          <div class="legend-caption" id="industry-tree-legend-caption"></div>
        </div>
      </div>
    </div>
  </div>`;
  const roleNodes = await renderHierarchyTreemap('role-tree', roleContextRows, roleLevels, DRILL_STATE.roles, {});
  const industryNodes = await renderHierarchyTreemap('industry-tree', industryContextRows, industryLevels, DRILL_STATE.industries, {});
  document.getElementById('role-tree').on('plotly_click', ev => {
    const node = roleNodes[ev.points?.[0]?.pointNumber];
    if (node?.drillable) {
      DRILL_STATE.roles = [...DRILL_STATE.roles, node.label];
      renderRoles();
    }
  });
  document.getElementById('industry-tree').on('plotly_click', ev => {
    const node = industryNodes[ev.points?.[0]?.pointNumber];
    if (node?.drillable) {
      DRILL_STATE.industries = [...DRILL_STATE.industries, node.label];
      renderRoles();
    }
  });
}

async function renderPostgrad() {
  const [summary, flows, destinations] = await Promise.all([
    loadFact('postgrad'),
    loadOptionalFact('postgrad_flows'),
    loadOptionalFact('postgrad_destinations'),
  ]);
  const undergradMajorField = getActiveMajorField('undergrad_');
  const summaryRows = summary.filter(r => baseFilter(r, { allowNoDegree: true, allowNoHorizon: true, majorField: undergradMajorField }));
  const flowRows = (flows || []).filter(r => baseFilter(r, { allowNoDegree: true, allowNoHorizon: true, majorField: undergradMajorField }));
  const destRows = normalizePostgradDestinations((destinations || []).filter(r => baseFilter(r, { allowNoDegree: true, allowNoHorizon: true, majorField: undergradMajorField })));
  const panel = document.getElementById('panel-postgrad');
  if (!summaryRows.length && !flowRows.length) { panel.innerHTML = '<div class="no-data">No postgrad data for current filters.</div>'; return; }

  if (isCompareActive()) {
    const selectedUnitids = getSelectedUnitids();
    const summaryBySchool = schoolRowsByUnitid(summaryRows);
    const flowBySchool = schoolRowsByUnitid(flowRows);
    const schoolMetrics = selectedUnitids.map(unitid => {
      const schoolSummary = summaryBySchool[String(unitid)] || [];
      const schoolFlows = flowBySchool[String(unitid)] || [];
      const totalBachelors = sum(schoolSummary, 'total_bachelors');
      const later = sum(schoolSummary, 'has_later_degree');
      const topFlow = buildPostgradDegreeSummary(schoolFlows, totalBachelors)[0] || null;
      return {
        unitid,
        school: getSchoolLabel(unitid),
        totalBachelors,
        later,
        laterRate: totalBachelors ? later / totalBachelors * 100 : null,
        topFlow: topFlow?.degree || 'N/A',
        topFlowShare: topFlow?.flow_pct ?? null,
      };
    }).filter(r => r.totalBachelors > 0);
    panel.innerHTML = `
      <div class="row-2">
        <div class="card"><h3>Later Degree Rate by School</h3><div id="postgrad-compare"></div></div>
        <div class="card"><h3>Further Education Comparison</h3>${renderSchoolSummaryTable([
          { label: 'School' },
          { label: 'Bachelor Alumni', className: 'num' },
          { label: 'With Later Degree', className: 'num' },
          { label: 'Later Degree Rate', className: 'num' },
          { label: 'Top Flow' },
        ], schoolMetrics.map(r => `<tr><td>${r.school}</td><td class="num">${fmtNum(r.totalBachelors)}</td><td class="num">${fmtNum(r.later)}</td><td class="num">${fmtPct(r.laterRate)}</td><td>${r.topFlow === 'N/A' ? 'N/A' : `${r.topFlow} (${fmtPct(r.topFlowShare)})`}</td></tr>`))}</div></div>
      </div>`;
    Plotly.newPlot('postgrad-compare', [{
      type: 'bar',
      x: schoolMetrics.map(r => r.school),
      y: schoolMetrics.map(r => r.laterRate),
      marker: { color: schoolMetrics.map((_, idx) => COLORS[idx % COLORS.length]) },
      hovertemplate: '%{x}<br>Later degree rate %{y:.1f}%<extra></extra>'
    }], { ...plotLayout, height: 360, xaxis: { automargin: true }, yaxis: { title: 'Later degree rate %', ticksuffix: '%', automargin: true } }, plotConfig);
    return;
  }

  const totalBachelors = sum(summaryRows, 'total_bachelors');
  const later = sum(summaryRows, 'has_later_degree');
  const laterRate = totalBachelors ? later / totalBachelors * 100 : null;
  const noFurtherRate = laterRate == null ? null : Math.max(0, 100 - laterRate);

  if (state.viewMode === 'overtime') {
    const timeField = getTimeField();
    const timeLabel = getTimeLabel();
    const timeValues = getTimeValues(summaryRows);
    const totalByPeriod = Object.fromEntries(timeValues.map(t => {
      const total = sum(summaryRows.filter(r => String(r[timeField]) === String(t)), 'total_bachelors');
      return [String(t), total];
    }));
    const degreeFlows = buildPostgradDegreeSummary(flowRows, totalBachelors);
    const topDegrees = degreeFlows.slice(0, 3).map(r => r.degree);
    const degreeSeries = topDegrees.map((degree, idx) => ({
      type: 'scatter',
      mode: 'lines+markers',
      name: degree,
      x: timeValues,
      y: timeValues.map(t => {
        const slice = flowRows.filter(r => String(r[timeField]) === String(t) && r.postgrad_degree === degree);
        const users = sum(slice, 'n_users');
        const total = totalByPeriod[String(t)] || 0;
        return total ? users / total * 100 : null;
      }),
      line: { color: postgradDegreeColor(degree), width: idx === 0 ? 3 : 2 },
      marker: { size: 7 },
      hovertemplate: `${degree}<br>${timeLabel} %{x}<br>Flow %{y:.1f}%<extra></extra>`
    }));
    const yearlyTable = timeValues.map(t => {
      const slice = flowRows.filter(r => String(r[timeField]) === String(t));
      const top = buildPostgradDegreeSummary(slice, totalByPeriod[String(t)] || 0)[0];
      return top ? `<tr><td>${t}</td><td>${top.degree}</td><td class="num">${fmtNum(top.users)}</td><td class="num">${fmtPct(top.flow_pct)}</td></tr>` : '';
    }).join('');
    panel.innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="value">${fmtNum(totalBachelors)}</div><div class="label">Bachelor Alumni in Slice</div></div>
        <div class="kpi"><div class="value">${fmtNum(later)}</div><div class="label">With Later Degree</div></div>
        <div class="kpi"><div class="value">${fmtPct(totalBachelors ? later / totalBachelors * 100 : null)}</div><div class="label">Later Degree Rate</div></div>
      </div>
      <div class="row-2">
        <div class="card"><h3>Secondary Degrees Over Time</h3><div id="postgrad-trend"></div></div>
        <div class="card"><h3>Leading Secondary Degree by ${timeLabel}</h3><div class="table-wrap"><table>
          <thead><tr><th>${timeLabel}</th><th>Degree</th><th class="num">Users</th><th class="num">Flow %</th></tr></thead>
          <tbody>${yearlyTable || `<tr><td colspan="4" class="subtle">No yearly flow rows for current slice.</td></tr>`}</tbody>
        </table></div></div>
      </div>`;
    Plotly.newPlot('postgrad-trend', degreeSeries, { ...plotLayout, height: 360, xaxis: { title: timeLabel, automargin: true }, yaxis: { title: 'Flow rate %', ticksuffix: '%', automargin: true }, legend: { orientation: 'h', y: 1.12 } }, plotConfig);
    return;
  }

  if (!flowRows.length) {
    panel.innerHTML = `
      <div class="kpis">
        <div class="kpi"><div class="value">${fmtNum(totalBachelors)}</div><div class="label">Bachelor Alumni in Slice</div></div>
        <div class="kpi"><div class="value">${fmtNum(later)}</div><div class="label">With Later Degree</div></div>
        <div class="kpi"><div class="value">${fmtPct(totalBachelors ? later / totalBachelors * 100 : null)}</div><div class="label">Later Degree Rate</div></div>
      </div>
      <div class="no-data">Detailed degree-flow rows are missing for this slice, so the Further Education sankey cannot be rendered.</div>`;
    return;
  }

  const sankey = buildPostgradSankey(flowRows, totalBachelors);
  if (DRILL_STATE.postgradFocus && !sankey.focusable.has(String(DRILL_STATE.postgradFocus))) {
    DRILL_STATE.postgradFocus = null;
  }
  const focusDegree = DRILL_STATE.postgradFocus ? String(DRILL_STATE.postgradFocus) : null;
  const topDegree = sankey.summary.top[0];
  const topShare = topDegree?.flow_pct ?? null;
  const otherShare = sankey.summary.total ? ((sankey.summary.total - sankey.displayedTotal) / sankey.summary.total) * 100 : null;
  const sliceLabel = currentSliceLabel();

  panel.innerHTML = `
    <div class="flow-shell">
      <div class="flow-header">
        <div>
          <h2>Further Education</h2>
        </div>
      </div>
      <div class="row-2">
        <div class="card flow-card">
          <div class="card-topline">
            <div>
              <h3>Flows into later degree types</h3>
            </div>
            <button class="btn" type="button" onclick="clearPostgradFocus()" ${focusDegree ? '' : 'style="visibility:hidden;"'}>Clear focus</button>
          </div>
          <div class="postgrad-gap">
            <div class="postgrad-gap-head">
              <div class="postgrad-gap-title">No Further Education</div>
              <div class="postgrad-gap-value">${fmtPct(noFurtherRate)}</div>
            </div>
            <div class="postgrad-gap-bar" aria-hidden="true"><span class="postgrad-gap-fill" style="width:${Math.max(0, Math.min(100, noFurtherRate || 0))}%;"></span></div>
          </div>
          <div id="postgrad-sankey" class="flow-plot"></div>
        </div>
        <div class="card flow-card">
          <div class="card-topline">
            <div>
              <h3>${focusDegree ? `${focusDegree} destinations` : 'Select a degree path'}</h3>
            </div>
            <button class="btn" type="button" onclick="clearPostgradFocus()" ${focusDegree ? '' : 'style="visibility:hidden;"'}>Reset</button>
          </div>
          <div id="postgrad-detail"></div>
        </div>
      </div>
    </div>`;

  const sankeyData = [{
    type: 'sankey',
    orientation: 'h',
    arrangement: 'snap',
    node: {
      pad: 18,
      thickness: 16,
      line: { color: '#FFFFFF', width: 1.2 },
      label: sankey.labels,
      color: sankey.nodeColors,
      customdata: sankey.customdata,
      hovertemplate: '%{customdata[0]}<br>Observed enrollments %{customdata[1]:,}<br>Share of bachelor slice %{customdata[2]:.1f}%<br>Rate vs bachelor slice %{customdata[3]}<br>Avg years to postgrad %{customdata[4]}<extra></extra>'
    },
    link: {
      source: sankey.sources,
      target: sankey.targets,
      value: sankey.values,
      color: sankey.linkColors,
      hovertemplate: '%{source.label} → %{target.label}<br>Observed enrollments %{value:,}<extra></extra>'
    }
  }];
  const sankeyLayout = {
    ...plotLayout,
    height: 540,
    margin: { l: 12, r: 12, t: 10, b: 10 },
    paper_bgcolor: '#FFFFFF',
    plot_bgcolor: '#FFFFFF',
    font: { family: 'Source Sans 3', color: '#2D426A' },
  };
  await Plotly.newPlot('postgrad-sankey', sankeyData, sankeyLayout, plotConfig);
  const sankeyEl = document.getElementById('postgrad-sankey');
  if (sankeyEl?.removeAllListeners) sankeyEl.removeAllListeners('plotly_click');
  sankeyEl.on('plotly_click', ev => {
    const point = ev.points?.[0] || {};
    const rawClicked = point?.customdata?.[0]
      || point?.label
      || point?.target?.label
      || point?.target?.customdata?.[0]
      || point?.targetLabel
      || '';
    const clicked = String(rawClicked).replace(/\s+\([^)]*\)$/, '').trim();
    if (!clicked || clicked === 'Current bachelor slice') return;
    if (!sankey.focusable.has(String(clicked))) return;
    DRILL_STATE.postgradFocus = String(clicked);
    renderPostgrad();
  });

  const detail = document.getElementById('postgrad-detail');
  if (!focusDegree) {
    const previewRows = sankey.summary.top.slice(0, 8);
    detail.innerHTML = `
      <div class="flow-empty">
        Choose a degree path.
      </div>
      <div class="table-wrap" style="margin-top:14px;"><table>
        <thead><tr><th>Later Degree</th><th class="num">Observed Enrollments</th><th class="num">Flow %</th><th class="num">Avg Years</th></tr></thead>

      </table></div>`;
    return;
  }

  const focusFlow = sankey.summary.all.find(r => String(r.degree) === String(focusDegree)) || null;
  const focusDestRows = destRows.filter(r => String(r.postgrad_degree) === String(focusDegree));
  const schoolRows = aggregateCountRows(focusDestRows, 'postgrad_school', { countField: 'n', weightedFields: ['avg_years_to_postgrad'] }).slice(0, 8);
  const programRows = aggregateCountRows(focusDestRows, 'postgrad_cip_title', { countField: 'n', weightedFields: ['avg_years_to_postgrad'] }).slice(0, 8);
  const pairRows = aggregateCountRows(focusDestRows, ['postgrad_school', 'postgrad_cip_title'], { countField: 'n', weightedFields: ['avg_years_to_postgrad'] }).slice(0, 12);
  const observedEnrollments = sum(focusDestRows, 'n');
  const avgYears = weightedAvg(focusDestRows, 'avg_years_to_postgrad', 'n');
  const sameSchoolEnrollments = focusDestRows.filter(r => String(r.postgrad_school) === String(getSchoolLabel(getSelectedUnitid()))).reduce((acc, r) => acc + (r.n || 0), 0);
  const sameSchoolShare = observedEnrollments ? (sameSchoolEnrollments / observedEnrollments) * 100 : null;
  const schoolOnlyView = ['LAW', 'MBA'].includes(String(focusDegree));

  if (!focusDestRows.length) {
    detail.innerHTML = `
      <div class="flow-selected">
        <div class="title">${focusDegree}</div>
        <div class="meta">${focusFlow?.flow_pct == null ? 'N/A' : fmtPct(focusFlow.flow_pct)} of bachelor alumni in this slice</div>
      </div>
      <div class="flow-empty">No destination school or major detail was exported for <strong>${focusDegree}</strong> in this slice.</div>`;
    return;
  }

  if (schoolOnlyView) {
    detail.innerHTML = `
      <div class="flow-selected">
        <div class="title">${focusDegree}</div>
        <div class="meta">${focusFlow?.flow_pct == null ? 'N/A' : fmtPct(focusFlow.flow_pct)} of bachelor alumni · ${fmtNum(observedEnrollments)} observed postgrad enrollments</div>
      </div>
      <div class="table-wrap" style="margin-top:14px;"><table>
        <thead><tr><th>School</th><th class="num">Observed Enrollments</th><th class="num">Share %</th></tr></thead>
        <tbody>${schoolRows.map(r => `<tr><td>${r.postgrad_school}</td><td class="num">${fmtNum(r.n)}</td><td class="num">${fmtPct(r.share_pct)}</td></tr>`).join('')}</tbody>
      </table></div>`;
    return;
  }

  detail.innerHTML = `
    <div class="flow-selected">
      <div class="title">${focusDegree}</div>
      <div class="meta">${focusFlow?.flow_pct == null ? 'N/A' : fmtPct(focusFlow.flow_pct)} of bachelor alumni · ${fmtNum(observedEnrollments)} observed postgrad enrollments</div>
    </div>
    <div class="mini-metrics" style="margin-top:0;">
      <div class="mini-metric"><div class="value">${fmtNum(observedEnrollments)}</div><div class="label">Observed enrollments</div></div>
      <div class="mini-metric"><div class="value">${fmtNum(new Set(focusDestRows.map(r => r.postgrad_school)).size)}</div><div class="label">Destination schools</div></div>
      <div class="mini-metric"><div class="value">${fmtNum(new Set(focusDestRows.map(r => r.postgrad_cip_title)).size)}</div><div class="label">Destination majors</div></div>
      <div class="mini-metric"><div class="value">${avgYears == null ? 'N/A' : `${avgYears.toFixed(1)} yrs`}</div><div class="label">Avg years to postgrad</div></div>
      <div class="mini-metric"><div class="value">${sameSchoolShare == null ? 'N/A' : fmtPct(sameSchoolShare)}</div><div class="label">Same-school share</div></div>
    </div>
    <div class="row-2" style="margin-top:14px;">
      <div>
        <h3 style="margin-bottom:10px;">Top Schools</h3>
        <div id="postgrad-school-bars"></div>
      </div>
      <div>
        <h3 style="margin-bottom:10px;">Top Majors</h3>
        <div id="postgrad-program-bars"></div>
      </div>
    </div>
    <div class="table-wrap" style="margin-top:14px;"><table>
      <thead><tr><th>School</th><th>Major</th><th class="num">Observed Enrollments</th><th class="num">Share %</th><th class="num">Avg Years</th></tr></thead>
      <tbody>${pairRows.map(r => `<tr><td>${r.postgrad_school}</td><td>${r.postgrad_cip_title}</td><td class="num">${fmtNum(r.n)}</td><td class="num">${fmtPct(r.share_pct)}</td><td class="num">${r.avg_years_to_postgrad == null ? 'N/A' : r.avg_years_to_postgrad.toFixed(1)}</td></tr>`).join('')}</tbody>
    </table></div>`;

  if (schoolRows.length) {
    Plotly.newPlot('postgrad-school-bars', [{
      type: 'bar',
      orientation: 'h',
      y: [...schoolRows].reverse().map(r => wrapLabel(r.postgrad_school, 22, 3)),
      x: [...schoolRows].reverse().map(r => r.n),
      marker: { color: postgradDegreeColor(focusDegree), opacity: 0.88 },
      customdata: [...schoolRows].reverse().map(r => [r.postgrad_school, r.share_pct, r.avg_years_to_postgrad == null ? 'N/A' : `${r.avg_years_to_postgrad.toFixed(1)} yrs`]),
      hovertemplate: '%{customdata[0]}<br>Observed enrollments %{x:,}<br>Share %{customdata[1]:.1f}%<br>Avg years %{customdata[2]}<extra></extra>'
    }], horizontalBarLayout([...schoolRows].reverse().map(r => wrapLabel(r.postgrad_school, 22, 3)), { height: 320, lMin: 220, lMax: 320, r: 18, t: 6, b: 28, xaxis: { visible: false } }), plotConfig);
  } else {
    document.getElementById('postgrad-school-bars').innerHTML = '<div class="no-data">No school detail for this path.</div>';
  }

  if (programRows.length) {
    Plotly.newPlot('postgrad-program-bars', [{
      type: 'bar',

      hovertemplate: '%{customdata[0]}<br>Observed enrollments %{x:,}<br>Share %{customdata[1]:.1f}%<br>Avg years %{customdata[2]}<extra></extra>'
    }], horizontalBarLayout([...programRows].reverse().map(r => wrapLabel(r.postgrad_cip_title, 22, 3)), { height: 320, lMin: 220, lMax: 320, r: 18, t: 6, b: 28, xaxis: { visible: false } }), plotConfig);
