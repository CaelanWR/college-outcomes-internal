<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>College Outcomes Explorer</title>
  <link rel="preconnect" href="https://cdn.plot.ly" />
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    :root {
      --ink: #172a3a;
      --muted: #66788f;
      --line: #d9e3ee;
      --panel: rgba(255, 255, 255, 0.92);
      --paper: #f3f7fb;
      --blue: #225ea8;
      --blue-2: #3f7fca;
      --green: #22a06b;
      --orange: #f97316;
      --red: #df4d5f;
      --violet: #7c5fd6;
      --shadow: 0 24px 70px rgba(23, 42, 58, 0.13);
      --radius: 24px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(34, 94, 168, 0.16), transparent 32rem),
        radial-gradient(circle at 90% 8%, rgba(34, 160, 107, 0.14), transparent 30rem),
        linear-gradient(180deg, #f8fbff 0%, #eef5fa 100%);
      min-height: 100vh;
    }

    header {
      padding: 28px 4vw 18px;
      border-bottom: 1px solid rgba(217, 227, 238, 0.8);
      background: rgba(255, 255, 255, 0.74);
      backdrop-filter: blur(16px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topline {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 54px);
      letter-spacing: -0.055em;
      line-height: 0.95;
    }

    .status {
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-weight: 800;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #b8c6d6;
      box-shadow: 0 0 0 5px rgba(184, 198, 214, 0.18);
    }

    .dot.ok { background: var(--green); box-shadow: 0 0 0 5px rgba(34, 160, 107, 0.16); }
    .dot.bad { background: var(--red); box-shadow: 0 0 0 5px rgba(223, 77, 95, 0.16); }

    .connection, .filters {
      display: grid;
      grid-template-columns: minmax(260px, 1.5fr) minmax(220px, 1fr) auto auto;
      gap: 12px;
      align-items: end;
    }

    .filters {
      grid-template-columns: minmax(260px, 1.2fr) repeat(5, minmax(130px, 0.55fr)) minmax(230px, 1fr) auto;
      margin-top: 12px;
      align-items: end;
    }

    .advanced {
      display: none;
      grid-template-columns: repeat(6, minmax(130px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .advanced.open { display: grid; }

    label {
      display: grid;
      gap: 7px;
      color: #63748b;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink);
      padding: 10px 14px;
      outline: none;
      font-weight: 750;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    select[multiple] {
      min-height: 118px;
      padding: 10px;
    }

    input:focus, select:focus {
      border-color: var(--blue-2);
      box-shadow: 0 0 0 4px rgba(63, 127, 202, 0.13);
    }

    .btn {
      min-height: 48px;
      border: 0;
      border-radius: 16px;
      padding: 0 18px;
      color: white;
      background: linear-gradient(135deg, var(--blue), #143a69);
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(34, 94, 168, 0.22);
      white-space: nowrap;
    }

    .btn.secondary {
      background: rgba(255, 255, 255, 0.82);
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .btn.active {
      background: linear-gradient(135deg, var(--green), #167450);
      color: white;
    }

    main {
      width: min(1840px, 96vw);
      margin: 24px auto 64px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 18px;
    }

    .tab {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.8);
      border-radius: 999px;
      padding: 12px 18px;
      color: #52667e;
      font-weight: 950;
      cursor: pointer;
    }

    .tab.active {
      color: white;
      border-color: transparent;
      background: linear-gradient(135deg, var(--blue), #173f70);
      box-shadow: 0 14px 34px rgba(34, 94, 168, 0.18);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 18px;
    }

    .card, .metric {
      background: var(--panel);
      border: 1px solid rgba(217, 227, 238, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .metric {
      padding: 24px;
      min-height: 116px;
      display: grid;
      align-content: center;
      gap: 8px;
    }

    .metric strong {
      display: block;
      font-size: clamp(30px, 3vw, 48px);
      letter-spacing: -0.055em;
      line-height: 1;
    }

    .metric span {
      color: #6a7b91;
      font-size: 12px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }

    .card {
      padding: 24px;
      min-height: 360px;
      overflow: hidden;
    }

    .card.compact { min-height: 260px; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; }
    .span-6 { grid-column: span 6; }
    .span-7 { grid-column: span 7; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }

    h2, h3 {
      margin: 0 0 12px;
      letter-spacing: -0.035em;
      line-height: 1.02;
    }

    h2 { font-size: clamp(26px, 3vw, 42px); }
    h3 { font-size: 24px; }

    .subtle {
      color: var(--muted);
      font-weight: 700;
      line-height: 1.45;
    }

    .chart {
      width: 100%;
      min-height: 320px;
    }

    .chart.tall { min-height: 460px; }

    .table-wrap {
      overflow: auto;
      border-radius: 18px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.7);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      text-align: left;
      padding: 13px 14px;
      border-bottom: 1px solid rgba(217, 227, 238, 0.84);
      vertical-align: top;
    }

    th {
      color: #61738a;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(243, 247, 251, 0.84);
      position: sticky;
      top: 0;
    }

    td {
      font-weight: 750;
    }

    .empty, .error {
      padding: 34px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 800;
    }

    .error {
      color: #9d2433;
      border-color: rgba(223, 77, 95, 0.32);
      background: rgba(255, 245, 247, 0.86);
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    @media (max-width: 1180px) {
      header { position: static; }
      .connection, .filters, .advanced { grid-template-columns: 1fr 1fr; }
      .span-3, .span-4, .span-5, .span-6, .span-7, .span-8, .span-12 { grid-column: span 12; }
    }

    @media (max-width: 720px) {
      .topline, .connection, .filters, .advanced { grid-template-columns: 1fr; display: grid; }
      main { width: 94vw; }
      .metric, .card { padding: 18px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topline">
      <div>
        <h1>College Outcomes Explorer</h1>
      </div>
      <div class="status"><span id="status-dot" class="dot"></span><span id="status-text">Not connected</span></div>
    </div>

    <div class="connection">
      <label>Protected API URL
        <input id="api-url" placeholder="https://your-protected-api.example.com" />
      </label>
      <label>API Password
        <input id="api-password" type="password" placeholder="Required if API password is enabled" />
      </label>
      <button id="connect-btn" class="btn">Connect</button>
      <button id="advanced-btn" class="btn secondary" type="button">Show Advanced</button>
    </div>

    <div class="filters" id="filters">
      <label>Schools
        <select id="school-select" multiple></select>
      </label>
      <label>Degree
        <select id="degree-select"></select>
      </label>
      <label>Horizon
        <select id="horizon-select"></select>
      </label>
      <label>CIP Level
        <select id="cip-level-select">
          <option value="cip4">4-digit CIP</option>
          <option value="cip2">2-digit CIP</option>
          <option value="cip6">6-digit CIP</option>
        </select>
      </label>
      <label>From
        <select id="from-year-select"></select>
      </label>
      <label>To
        <select id="to-year-select"></select>
      </label>
      <label>Major
        <select id="major-select"></select>
      </label>
      <button id="refresh-btn" class="btn" type="button">Refresh</button>
    </div>

    <div id="advanced-panel" class="advanced">
      <label>Gender
        <select id="gender-select"><option value="">All</option></select>
      </label>
      <label>Race/Ethnicity
        <select id="race-select"><option value="">All</option></select>
      </label>
      <label>Further Education
        <select id="later-degree-filter"><option value="">All</option></select>
      </label>
      <label>No Further Ed
        <select id="no-further-select">
          <option value="">All</option>
          <option value="true">Only no later degree</option>
          <option value="false">Only with later degree</option>
        </select>
      </label>
      <label>Current Students
        <select id="current-select">
          <option value="false">Hide current students</option>
          <option value="true">Show current students</option>
        </select>
      </label>
      <label>Top N
        <select id="top-n-select">
          <option>8</option>
          <option selected>12</option>
          <option>16</option>
          <option>20</option>
        </select>
      </label>
    </div>
  </header>

  <main id="main">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="overview">Overview</button>
      <button class="tab" data-tab="earnings">Earnings</button>
      <button class="tab" data-tab="employers">Employers</button>
      <button class="tab" data-tab="geography">Geography</button>
      <button class="tab" data-tab="roles">Roles</button>
      <button class="tab" data-tab="demographics">Demographics</button>
      <button class="tab" data-tab="postgrad">Further Education</button>
      <button class="tab" data-tab="coverage">Coverage</button>
    </nav>
    <div id="message" class="empty">Enter the protected API URL and password, then connect.</div>
    <section id="content" class="grid" style="display:none;"></section>
  </main>

  <script src="./config.js"></script>
  <script>
    const COLORS = ['#225ea8', '#22a06b', '#f97316', '#7c5fd6', '#df4d5f', '#0891b2', '#a16207', '#475569'];
    const storage = window.localStorage;
    const state = {
      apiUrl: '',
      password: '',
      options: null,
      data: null,
      tab: 'overview',
      selectedEmployer: null,
      selectedPostgradDegree: null,
      loading: false,
    };

    const $ = id => document.getElementById(id);
    const fmt = new Intl.NumberFormat('en-US');
    const money = value => value === null || value === undefined ? 'No data' : `$${fmt.format(Math.round(value / 1000))}k`;
    const num = value => value === null || value === undefined ? 'No data' : fmt.format(Math.round(value));
    const pct = value => value === null || value === undefined ? 'No data' : `${Number(value).toFixed(1)}%`;

    const layoutBase = {
      font: { family: 'ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif', color: '#172a3a', size: 14 },
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      margin: { l: 72, r: 28, t: 24, b: 70 },
      hoverlabel: { bgcolor: '#172a3a', bordercolor: '#172a3a', font: { color: '#fff' } },
    };
    const plotConfig = { responsive: true, displayModeBar: false };

    function setStatus(kind, text) {
      $('status-dot').className = `dot ${kind || ''}`;
      $('status-text').textContent = text;
    }

    function setMessage(html, isError = false) {
      $('message').style.display = 'block';
      $('message').className = isError ? 'error' : 'empty';
      $('message').innerHTML = html;
      $('content').style.display = 'none';
    }

    function showContent() {
      $('message').style.display = 'none';
      $('content').style.display = 'grid';
    }

    function normalizeApiUrl(value) {
      return String(value || '').trim().replace(/\/+$/, '');
    }

    function defaultApiUrl() {
      if (window.OUTCOMES_API_URL) return window.OUTCOMES_API_URL;
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return 'http://localhost:8000';
      return '';
    }

    async function apiFetch(path, body) {
      if (!state.apiUrl) throw new Error('Missing API URL.');
      const headers = { 'Content-Type': 'application/json' };
      if (state.password) headers['X-Outcomes-Password'] = state.password;
      const response = await fetch(`${state.apiUrl}${path}`, {
        method: 'POST',
        headers,
        body: JSON.stringify(body || currentFilters()),
      });
      if (!response.ok) {
        const text = await response.text();
        throw new Error(`${response.status} ${response.statusText}: ${text.slice(0, 240)}`);
      }
      return response.json();
    }

    function selectedValues(select) {
      return Array.from(select.selectedOptions || []).map(option => option.value).filter(Boolean);
    }

    function yearRange() {
      const all = state.options?.grad_years || [];
      const from = Number($('from-year-select').value || all[0]);
      const to = Number($('to-year-select').value || all[all.length - 1]);
      return all.filter(year => year >= from && year <= to);
    }

    function currentFilters(extra = {}) {
      const noFurtherValue = $('no-further-select').value;
      return {
        schools: selectedValues($('school-select')),
        degree: $('degree-select').value || 'Bachelors',
        cip_level: $('cip-level-select').value || 'cip4',
        majors: $('major-select').value ? [$('major-select').value] : [],
        grad_years: yearRange(),
        horizon: $('horizon-select').value || '1yr',
        demographics: {
          gender: $('gender-select').value || null,
          race_ethnicity: $('race-select').value || null,
        },
        postgrad: {
          later_degree_type: $('later-degree-filter').value || null,
          no_further_education: noFurtherValue === '' ? null : noFurtherValue === 'true',
        },
        include_current_students: $('current-select').value === 'true',
        selected_employer: state.selectedEmployer,
        selected_postgrad_degree: state.selectedPostgradDegree,
        top_n: Number($('top-n-select').value || 12),
        ...extra,
      };
    }

    function option(label, value, selected = false) {
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      opt.selected = selected;
      return opt;
    }

    function populateSelect(select, rows, getLabel, getValue, selectedValuesSet = new Set()) {
      select.innerHTML = '';
      rows.forEach(row => select.appendChild(option(getLabel(row), getValue(row), selectedValuesSet.has(String(getValue(row))))));
    }

    function populateStaticControls(options) {
      const defaultSchool = options.schools.find(s => /Columbia University in the City of New York/i.test(s.name)) || options.schools[0];
      const existingSchools = new Set(selectedValues($('school-select')));
      const selectedSchools = existingSchools.size ? existingSchools : new Set(defaultSchool ? [defaultSchool.unitid] : []);
      populateSelect($('school-select'), options.schools, s => s.name, s => s.unitid, selectedSchools);

      const existingDegree = $('degree-select').value || 'Bachelors';
      populateSelect($('degree-select'), options.degrees, d => d.label, d => d.degree, new Set([existingDegree]));
      if (!$('degree-select').value) $('degree-select').value = 'Bachelors';

      populateSelect($('horizon-select'), options.horizons, h => h.label, h => h.value, new Set([$('horizon-select').value || '1yr']));
      if (!$('horizon-select').value) $('horizon-select').value = '1yr';

      const years = options.grad_years || [];
      populateSelect($('from-year-select'), years, y => y, y => y, new Set([$('from-year-select').value || years[0]]));
      populateSelect($('to-year-select'), years, y => y, y => y, new Set([$('to-year-select').value || years[years.length - 1]]));
      if (!$('from-year-select').value && years.length) $('from-year-select').value = years[0];
      if (!$('to-year-select').value && years.length) $('to-year-select').value = years[years.length - 1];

      const genders = options.demographics?.gender || [];
      const races = options.demographics?.race_ethnicity || [];
      const laterDegrees = options.later_degrees || [];
      const oldGender = $('gender-select').value;
      const oldRace = $('race-select').value;
      const oldLater = $('later-degree-filter').value;
      $('gender-select').innerHTML = '<option value="">All</option>';
      genders.forEach(value => $('gender-select').appendChild(option(value, value, value === oldGender)));
      $('race-select').innerHTML = '<option value="">All</option>';
      races.forEach(value => $('race-select').appendChild(option(value, value, value === oldRace)));
      $('later-degree-filter').innerHTML = '<option value="">All</option>';
      laterDegrees.forEach(value => $('later-degree-filter').appendChild(option(value, value, value === oldLater)));
    }

    function populateMajorOptions(options, preserve = true) {
      const previous = preserve ? $('major-select').value : '';
      $('major-select').innerHTML = '<option value="">All majors</option>';
      (options.major_options || []).forEach(row => {
        const label = `${row.title} (${row.code})`;
        $('major-select').appendChild(option(label, row.code, previous === row.code));
      });
      if (previous && !$('major-select').value) {
        $('major-select').appendChild(option(previous, previous, true));
      }
    }

    async function loadOptions(preserveMajor = true) {
      const filters = currentFilters({ majors: [] });
      const options = await apiFetch('/api/options', filters);
      state.options = options;
      populateStaticControls(options);
      populateMajorOptions(options, preserveMajor);
      setStatus('ok', `${options.meta?.data_version || 'Connected'} | cells suppressed below ${options.meta?.suppression_threshold || 25}`);
    }

    async function connect() {
      state.apiUrl = normalizeApiUrl($('api-url').value || defaultApiUrl());
      state.password = $('api-password').value || '';
      if (!state.apiUrl) {
        setMessage('Enter the protected API URL first.', true);
        return;
      }
      storage.setItem('outcomes.apiUrl', state.apiUrl);
      storage.setItem('outcomes.apiPassword', state.password);
      $('api-url').value = state.apiUrl;
      setStatus('', 'Connecting');
      await loadOptions(true);
      await refresh();
    }

    async function refresh({ reloadOptions = false, resetDrill = false } = {}) {
      if (!state.apiUrl) {
        setMessage('Enter the protected API URL and password, then connect.');
        return;
      }
      if (state.loading) return;
      state.loading = true;
      document.body.classList.add('loading');
      try {
        if (resetDrill) {
          state.selectedEmployer = null;
          state.selectedPostgradDegree = null;
        }
        if (reloadOptions || !state.options) await loadOptions(true);
        state.data = await apiFetch('/api/dashboard', currentFilters());
        showContent();
        render();
        setStatus('ok', `${state.data.meta?.data_version || 'Connected'} | ${state.data.meta?.partial_horizon ? 'partial 2025 horizon' : 'complete horizon'}`);
      } catch (error) {
        setStatus('bad', 'Connection failed');
        setMessage(`<strong>Could not load data.</strong><br>${escapeHtml(error.message)}`, true);
      } finally {
        state.loading = false;
        document.body.classList.remove('loading');
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function card(title, id, span = 6, tall = false) {
      return `<div class="card span-${span}"><h3>${title}</h3><div id="${id}" class="chart ${tall ? 'tall' : ''}"></div></div>`;
    }

    function metric(label, value) {
      return `<div class="metric span-3"><strong>${value}</strong><span>${label}</span></div>`;
    }

    function render() {
      if (!state.data) return;
      const tab = state.tab;
      if (tab === 'overview') renderOverview();
      if (tab === 'earnings') renderEarnings();
      if (tab === 'employers') renderEmployers();
      if (tab === 'geography') renderGeography();
      if (tab === 'roles') renderRoles();
      if (tab === 'demographics') renderDemographics();
      if (tab === 'postgrad') renderPostgrad();
      if (tab === 'coverage') renderCoverage();
    }

    function renderOverview() {
      const o = state.data.overview || {};
      $('content').innerHTML = [
        metric('Median salary', money(o.median_salary)),
        metric('Alumni in slice', num(o.alumni)),
        metric('Salary observations', num(o.salary_weight)),
        metric('Later degree rate', pct(o.later_degree_pct)),
        card('Salary Trend by Graduation Year', 'salary-trend', 6),
        card('Top Majors Over Time', 'major-trend', 6),
        card('School Comparison', 'school-compare', 6),
        card('Top Career Employers', 'employer-bars', 6),
      ].join('');
      drawSalaryTrend('salary-trend');
      drawMajorTrend('major-trend');
      drawSchoolComparison('school-compare');
      drawEmployerBars('employer-bars');
    }

    function renderEarnings() {
      $('content').innerHTML = [
        card('Salary Trend by Graduation Year', 'earn-salary-trend', 7, true),
        card('Top Majors by Salary', 'top-major-salary', 5, true),
        card('Cohort Salary Table', 'salary-table', 12),
      ].join('');
      drawSalaryTrend('earn-salary-trend', true);
      drawMajorSalary('top-major-salary');
      $('salary-table').innerHTML = table(['Year', 'Alumni', 'Salary observations', 'Median salary', 'Mean salary'], state.data.salary_trend || [], row => [
        row.grad_year, num(row.alumni), num(row.salary_weight), money(row.median_salary), money(row.weighted_mean_salary)
      ]);
    }

    function renderEmployers() {
      $('content').innerHTML = [
        card('Top Career Employers', 'emp-top', 6, true),
        card(`Top Roles at ${escapeHtml(state.data.employers?.selected_employer || 'Selected Employer')}`, 'emp-roles', 6, true),
      ].join('');
      drawEmployerBars('emp-top', true);
      drawEmployerRoles('emp-roles');
    }

    function renderGeography() {
      $('content').innerHTML = [
        card('Median Earnings by City', 'geo-salary', 7, true),
        card('Top Cities by Alumni', 'geo-volume', 5, true),
      ].join('');
      drawGeo('geo-salary', 'median_salary');
      drawGeo('geo-volume', 'n');
    }

    function renderRoles() {
      $('content').innerHTML = [
        card('Top Roles', 'role-bars', 6, true),
        card('Top Industries', 'industry-bars', 6, true),
      ].join('');
      drawRoleBars('role-bars', state.data.roles?.roles || [], 'Roles');
      drawRoleBars('industry-bars', state.data.roles?.industries || [], 'Industries');
    }

    function renderDemographics() {
      $('content').innerHTML = [
        card('Gender Mix', 'gender-bars', 6, true),
        card('Race/Ethnicity Mix', 'race-bars', 6, true),
        card('Demographics Table', 'demo-table', 12),
      ].join('');
      drawDemoBars('gender-bars', state.data.demographics?.gender || []);
      drawDemoBars('race-bars', state.data.demographics?.race_ethnicity || []);
      const rows = [...(state.data.demographics?.gender || []), ...(state.data.demographics?.race_ethnicity || [])];
      $('demo-table').innerHTML = table(['Group', 'Alumni', 'Share', 'Mean salary'], rows, row => [
        row.label, num(row.n), pct(row.share_pct), money(row.weighted_mean_salary)
      ]);
    }

    function renderPostgrad() {
      const selected = state.data.postgrad?.selected_degree || 'Selected path';
      $('content').innerHTML = [
        card('Further Education Paths', 'postgrad-flow', 5, true),
        card(`Top Schools for ${escapeHtml(selected)}`, 'postgrad-schools', 4, true),
        card(`Top Programs for ${escapeHtml(selected)}`, 'postgrad-programs', 3, true),
      ].join('');
      drawPostgradFlows('postgrad-flow');
      drawSimpleBars('postgrad-schools', state.data.postgrad?.schools || [], 'n', '#225ea8');
      drawSimpleBars('postgrad-programs', state.data.postgrad?.programs || [], 'n', '#22a06b');
    }

    function renderCoverage() {
      $('content').innerHTML = [
        card('Alumni and Salary Observations by Year', 'coverage-volume', 7, true),
        card('Current Slice Sample', 'coverage-cards', 5),
      ].join('');
      const rows = state.data.salary_trend || [];
      Plotly.newPlot('coverage-volume', [
        { type: 'bar', x: rows.map(r => r.grad_year), y: rows.map(r => r.alumni), name: 'Alumni', marker: { color: 'rgba(34, 94, 168, 0.35)' } },
        { type: 'bar', x: rows.map(r => r.grad_year), y: rows.map(r => r.salary_weight), name: 'Salary observations', marker: { color: 'rgba(34, 160, 107, 0.72)' } },
      ], { ...layoutBase, barmode: 'overlay', xaxis: { title: 'Graduation year' }, yaxis: { title: 'Count' }, legend: { orientation: 'h' } }, plotConfig);
      const o = state.data.overview || {};
      $('coverage-cards').innerHTML = table(['Metric', 'Value'], [
        ['Alumni in slice', num(o.alumni)],
        ['Raw rows', num(o.raw_rows)],
        ['Salary observations', num(o.salary_weight)],
        ['Unique employers', num(o.unique_employers)],
        ['Unique locations', num(o.unique_locations)],
      ], row => row);
    }

    function drawSalaryTrend(id, forceSchool = false) {
      const selectedSchools = selectedValues($('school-select'));
      const bySchool = forceSchool || selectedSchools.length > 1;
      const rows = bySchool ? (state.data.salary_trend_by_school || []) : (state.data.salary_trend || []);
      if (!rows.length) return noData(id);
      let traces;
      if (bySchool) {
        const schools = [...new Set(rows.map(r => r.school_name))];
        traces = schools.map((school, i) => {
          const slice = rows.filter(r => r.school_name === school);
          return {
            type: 'scatter',
            mode: 'lines+markers',
            name: shortSchool(school),
            x: slice.map(r => r.grad_year),
            y: slice.map(r => r.median_salary),
            line: { color: COLORS[i % COLORS.length], width: 3 },
            marker: { size: 7 },
            hovertemplate: `${school}<br>%{x}<br>%{y:$,.0f}<extra></extra>`,
          };
        });
      } else {
        traces = [{
          type: 'scatter',
          mode: 'lines+markers',
          name: 'Median salary',
          x: rows.map(r => r.grad_year),
          y: rows.map(r => r.median_salary),
          line: { color: COLORS[0], width: 4 },
          marker: { size: 9 },
          hovertemplate: 'Class of %{x}<br>%{y:$,.0f}<extra></extra>',
        }];
      }
      Plotly.newPlot(id, traces, {
        ...layoutBase,
        yaxis: { tickprefix: '$', tickformat: ',', automargin: true },
        xaxis: { title: 'Graduation year', automargin: true },
        legend: { orientation: 'h', y: 1.12 },
      }, plotConfig);
    }

    function drawMajorTrend(id) {
      const trend = state.data.major_trend || {};
      const rows = [...(trend.series || []), ...(trend.current_series || [])];
      if (!rows.length) return noData(id);
      const codes = [...new Set(rows.map(r => r.code))];
      const traces = codes.map((code, i) => {
        const historic = (trend.series || []).filter(r => r.code === code);
        const current = (trend.current_series || []).filter(r => r.code === code);
        const title = (historic[0] || current[0] || {}).title || code;
        return [
          {
            type: 'scatter',
            mode: 'lines+markers',
            name: title,
            x: historic.map(r => r.grad_year),
            y: historic.map(r => r.share_pct),
            line: { color: COLORS[i % COLORS.length], width: 3 },
            marker: { size: 7 },
            hovertemplate: `${title}<br>%{x}<br>%{y:.1f}%<extra></extra>`,
          },
          current.length ? {
            type: 'scatter',
            mode: 'lines+markers',
            name: `${title} current`,
            x: current.map(r => r.grad_year),
            y: current.map(r => r.share_pct),
            line: { color: COLORS[i % COLORS.length], width: 3, dash: 'dot' },
            marker: { size: 9, symbol: 'diamond' },
            showlegend: false,
            hovertemplate: `${title} current<br>%{x}<br>%{y:.1f}%<extra></extra>`,
          } : null
        ].filter(Boolean);
      }).flat();
      const shapes = trend.current_series?.length ? [{
        type: 'line', x0: 2025.5, x1: 2025.5, y0: 0, y1: 1, xref: 'x', yref: 'paper',
        line: { color: '#8091a7', dash: 'dot', width: 2 },
      }] : [];
      const annotations = trend.current_series?.length ? [{
        x: 2026.1, y: 1.04, xref: 'x', yref: 'paper', text: 'Current students', showarrow: false,
        font: { color: '#40556e', size: 14 },
      }] : [];
      Plotly.newPlot(id, traces, {
        ...layoutBase,
        margin: { ...layoutBase.margin, r: 90 },
        yaxis: { title: 'Share of grads %', ticksuffix: '%', automargin: true },
        xaxis: { title: 'Graduation year', automargin: true, dtick: trend.current_series?.length ? 2 : 5 },
        legend: { orientation: 'h', y: 1.16 },
        shapes,
        annotations,
      }, plotConfig);
    }

    function drawSchoolComparison(id) {
      const rows = state.data.school_comparison || [];
      if (!rows.length) return noData(id);
      Plotly.newPlot(id, [{
        type: 'bar',
        orientation: 'h',
        y: rows.slice().reverse().map(r => shortSchool(r.school_name)),
        x: rows.slice().reverse().map(r => r.median_salary),
        text: rows.slice().reverse().map(r => money(r.median_salary)),
        textposition: 'outside',
        cliponaxis: false,
        marker: { color: COLORS[0] },
        hovertemplate: '%{y}<br>%{x:$,.0f}<extra></extra>',
      }], horizontalLayout(rows, '$'), plotConfig);
    }

    function drawMajorSalary(id) {
      const rows = (state.data.top_majors || []).filter(r => r.median_salary).sort((a, b) => a.median_salary - b.median_salary);
      if (!rows.length) return noData(id);
      Plotly.newPlot(id, [{
        type: 'bar',
        orientation: 'h',
        y: rows.map(r => r.title),
        x: rows.map(r => r.median_salary),
        text: rows.map(r => money(r.median_salary)),
        textposition: 'outside',
        cliponaxis: false,
        marker: { color: COLORS[1] },
        hovertemplate: '%{y}<br>%{x:$,.0f}<extra></extra>',
      }], horizontalLayout(rows, '$'), plotConfig);
    }

    function drawEmployerBars(id, clickable = false) {
      const rows = (state.data.employers?.top || []).slice().reverse();
      if (!rows.length) return noData(id);
      Plotly.newPlot(id, [{
        type: 'bar',
        orientation: 'h',
        y: rows.map(r => r.employer),
        x: rows.map(r => r.n),
        text: rows.map(r => `${num(r.n)} (${pct(r.share_pct)})`),
        textposition: 'outside',
        cliponaxis: false,
        marker: { color: COLORS[0] },
        hovertemplate: '%{y}<br>%{x:,.0f} alumni<extra></extra>',
      }], horizontalLayout(rows), plotConfig).then(plot => {
        if (!clickable) return;
        plot.on('plotly_click', event => {
          const point = event.points?.[0];
          if (!point) return;
          state.selectedEmployer = point.y;
          refresh();
        });
      });
    }

    function drawEmployerRoles(id) {
      const rows = (state.data.employers?.roles || []).slice().reverse();
      drawSimpleBars(id, rows.map(r => ({ label: r.role, n: r.n })), 'n', COLORS[2]);
    }

    function drawGeo(id, metric) {
      const rows = (state.data.geography || []).filter(r => metric !== 'median_salary' || r.median_salary).slice().reverse();
      if (!rows.length) return noData(id);
      Plotly.newPlot(id, [{
        type: 'bar',
        orientation: 'h',
        y: rows.map(r => titleCase(r.location)),
        x: rows.map(r => r[metric]),
        text: rows.map(r => metric === 'median_salary' ? money(r[metric]) : num(r[metric])),
        textposition: 'outside',
        cliponaxis: false,
        marker: { color: metric === 'median_salary' ? COLORS[1] : COLORS[0] },
        hovertemplate: metric === 'median_salary' ? '%{y}<br>%{x:$,.0f}<extra></extra>' : '%{y}<br>%{x:,.0f}<extra></extra>',
      }], horizontalLayout(rows, metric === 'median_salary' ? '$' : ''), plotConfig);
    }

    function drawRoleBars(id, rows, title) {
      drawSimpleBars(id, rows.slice().reverse().map(r => ({ label: r.label, n: r.n })), 'n', title === 'Roles' ? COLORS[3] : COLORS[1]);
    }

    function drawDemoBars(id, rows) {
      if (!rows.length) return noData(id);
      Plotly.newPlot(id, [{
        type: 'bar',
        x: rows.map(r => r.label),
        y: rows.map(r => r.share_pct),
        text: rows.map(r => pct(r.share_pct)),
        textposition: 'outside',
        cliponaxis: false,
        marker: { color: COLORS.slice(0, rows.length) },
        hovertemplate: '%{x}<br>%{y:.1f}%<extra></extra>',
      }], { ...layoutBase, yaxis: { ticksuffix: '%', rangemode: 'tozero' }, xaxis: { automargin: true } }, plotConfig);
    }

    function drawPostgradFlows(id) {
      const rows = (state.data.postgrad?.flows || []).filter(r => r.degree_type).slice().reverse();
      if (!rows.length) return noData(id);
      Plotly.newPlot(id, [{
        type: 'bar',
        orientation: 'h',
        y: rows.map(r => r.degree_type),
        x: rows.map(r => r.share_pct),
        text: rows.map(r => `${pct(r.share_pct)}`),
        textposition: 'outside',
        cliponaxis: false,
        marker: { color: rows.map(r => r.degree_type === 'No further education' ? '#94a3b8' : COLORS[0]) },
        hovertemplate: '%{y}<br>%{x:.1f}%<extra></extra>',
      }], horizontalLayout(rows, '%'), plotConfig).then(plot => {
        plot.on('plotly_click', event => {
          const point = event.points?.[0];
          if (!point || point.y === 'No further education') return;
          state.selectedPostgradDegree = point.y;
          refresh();
        });
      });
    }

    function drawSimpleBars(id, rows, metric = 'n', color = COLORS[0]) {
      if (!rows.length) return noData(id);
      const cleanRows = rows.filter(r => r.label).slice();
      Plotly.newPlot(id, [{
        type: 'bar',
        orientation: 'h',
        y: cleanRows.map(r => r.label),
        x: cleanRows.map(r => r[metric]),
        text: cleanRows.map(r => num(r[metric])),
        textposition: 'outside',
        cliponaxis: false,
        marker: { color },
        hovertemplate: '%{y}<br>%{x:,.0f}<extra></extra>',
      }], horizontalLayout(cleanRows), plotConfig);
    }

    function horizontalLayout(rows, prefix = '') {
      const longest = Math.max(12, ...rows.map(r => String(r.label || r.title || r.employer || r.location || r.school_name || '').length));
      return {
        ...layoutBase,
        margin: { l: Math.min(360, Math.max(140, longest * 7)), r: 92, t: 20, b: 56 },
        xaxis: { tickprefix: prefix === '$' ? '$' : '', ticksuffix: prefix === '%' ? '%' : '', automargin: true, rangemode: 'tozero' },
        yaxis: { automargin: true },
      };
    }

    function noData(id) {
      $(id).innerHTML = '<div class="empty">No data for the current filters. Try a broader major, school set, year range, or horizon.</div>';
    }

    function table(headers, rows, mapper) {
      if (!rows.length) return '<div class="empty">No rows for the current filters.</div>';
      const head = headers.map(h => `<th>${escapeHtml(h)}</th>`).join('');
      const body = rows.map(row => `<tr>${mapper(row).map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('');
      return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function shortSchool(name) {
      return String(name || '')
        .replace('University of California-', 'UC ')
        .replace('Columbia University in the City of New York', 'Columbia')
        .replace('University of Michigan-Ann Arbor', 'Michigan')
        .replace('Massachusetts Institute of Technology', 'MIT')
        .replace('Georgia Institute of Technology-Main Campus', 'Georgia Tech')
        .replace('University of California-Los Angeles', 'UCLA')
        .replace('University of Washington-Seattle Campus', 'Washington')
        .replace('University of Virginia-Main Campus', 'Virginia')
        .replace('University of North Carolina at Chapel Hill', 'UNC Chapel Hill');
    }

    function titleCase(value) {
      return String(value || '').replace(/\w\S*/g, word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase());
    }

    function bindEvents() {
      $('connect-btn').addEventListener('click', () => connect());
      $('refresh-btn').addEventListener('click', () => refresh({ resetDrill: true }));
      $('advanced-btn').addEventListener('click', () => {
        $('advanced-panel').classList.toggle('open');
        $('advanced-btn').textContent = $('advanced-panel').classList.contains('open') ? 'Hide Advanced' : 'Show Advanced';
      });
      $('tabs').addEventListener('click', event => {
        const tab = event.target.closest('.tab');
        if (!tab) return;
        state.tab = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(node => node.classList.toggle('active', node === tab));
        render();
      });

      ['school-select', 'degree-select', 'cip-level-select'].forEach(id => {
        $(id).addEventListener('change', () => refresh({ reloadOptions: true, resetDrill: true }));
      });
      ['horizon-select', 'from-year-select', 'to-year-select', 'major-select', 'gender-select', 'race-select', 'later-degree-filter', 'no-further-select', 'current-select', 'top-n-select'].forEach(id => {
        $(id).addEventListener('change', () => refresh({ resetDrill: true }));
      });
    }

    function init() {
      $('api-url').value = storage.getItem('outcomes.apiUrl') || defaultApiUrl();
      $('api-password').value = storage.getItem('outcomes.apiPassword') || '';
      bindEvents();
      if ($('api-url').value) connect();
    }

    init();
  </script>
</body>
</html>
