<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>College Outcomes Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.plot.ly" />
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    :root {
      --ink: #243b53;
      --muted: #6b7c93;
      --line: #dde6ef;
      --panel: #ffffff;
      --panel-soft: #f7fafc;
      --bg: #f3f7fb;
      --blue: #2f80ed;
      --blue-2: #2e74d7;
      --green: #2bb673;
      --gold: #f4b740;
      --rose: #e55b7a;
      --violet: #8b6fd6;
      --tm-ink: #2D426A;
      --tm-muted: #899499;
      --tm-line: #E6EBF2;
      --tm-low: #D9ECFB;
      --tm-mid: #48AFF4;
      --tm-high: #2D426A;
      --tm-gray: #B9C4D3;
      --tm-shadow: 0 8px 24px rgba(45, 66, 106, 0.08);
      --shadow: 0 10px 30px rgba(36, 59, 83, 0.08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    @supports not (zoom: 1) {
      html { font-size: 86%; }
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: 'Source Sans 3', ui-sans-serif, system-ui, sans-serif;
      background: radial-gradient(circle at top left, rgba(46,116,215,0.08), transparent 28%),
        radial-gradient(circle at top right, rgba(33,166,117,0.08), transparent 24%),
        linear-gradient(180deg, #f4f8fb 0%, #edf3f8 100%);
      min-height: 100vh;
      overflow-x: hidden;
      zoom: 0.86;
    }

    header {
      padding: 0 22px 16px;
      border-bottom: 1px solid rgba(22,50,74,0.08);
      background: rgba(255,255,255,0.86);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 12px 32px rgba(20,44,65,0.08);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 -22px 14px;
      padding: 22px 22px 20px;
      color: white;
      background:
        radial-gradient(circle at 82% 18%, rgba(122, 195, 230, 0.28), transparent 26%),
        linear-gradient(135deg, #112f47 0%, #245a7c 56%, #346f9a 100%);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.16);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 2.2vw, 36px);
      letter-spacing: -0.02em;
      line-height: 1;
      font-weight: 900;
    }

    .status {
      display: flex;
      gap: 10px;
      align-items: center;
      color: rgba(255,255,255,0.82);
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #b8c6d6;
      box-shadow: 0 0 0 5px rgba(184, 198, 214, 0.18);
    }

    .dot.ok { background: var(--green); box-shadow: 0 0 0 5px rgba(34, 160, 107, 0.16); }
    .dot.bad { background: var(--rose); box-shadow: 0 0 0 5px rgba(223, 77, 95, 0.16); }

    .connection, .filters {
      display: grid;
      grid-template-columns: minmax(300px, 1.1fr) minmax(220px, 0.8fr) auto;
      gap: 10px 12px;
      align-items: end;
    }

    .connection.connected {
      display: none;
    }

    .filters {
      grid-template-columns: minmax(310px, 1.5fr) minmax(180px, 0.72fr) max-content minmax(320px, 1.25fr) max-content auto;
      margin-top: 0;
      align-items: end;
      padding: 0 2px;
    }

    .advanced {
      display: none;
      grid-template-columns: minmax(240px, 1.4fr) repeat(7, minmax(130px, 1fr));
      gap: 12px 18px;
      margin-top: 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel-soft);
    }

    .advanced.open { display: grid; }

    .segmented {
      display: inline-flex;
      gap: 6px;
      flex-wrap: nowrap;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(245,248,252,0.96);
      min-height: 40px;
      align-items: center;
    }

    .segmented .btn {
      min-height: 34px;
      border-radius: 999px;
      padding: 6px 12px;
      border-color: transparent;
      background: transparent;
      box-shadow: none;
    }

    .segmented .btn.active {
      background: linear-gradient(135deg, #16324a 0%, #2e74d7 100%);
      color: #fff;
      box-shadow: 0 8px 18px rgba(22,50,74,0.16);
    }

    .refresh-state {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 40;
      display: none;
      padding: 10px 14px;
      border-radius: 999px;
      background: #16324a;
      color: #fff;
      font-weight: 900;
      box-shadow: 0 12px 28px rgba(20,44,65,0.18);
    }

    .refresh-state.is-visible { display: block; }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .control-field {
      display: grid;
      gap: 6px;
      align-content: end;
    }

    .control-label {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(245,248,252,0.96);
      color: var(--ink);
      padding: 8px 12px;
      outline: none;
      font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
    }

    select[multiple] {
      min-height: 72px;
      padding: 6px 10px;
    }

    input:focus, select:focus {
      border-color: rgba(39,76,119,0.28);
      box-shadow: 0 8px 18px rgba(20,44,65,0.08), inset 0 1px 0 rgba(255,255,255,0.92);
    }

    .btn {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 12px;
      color: var(--ink);
      background: rgba(245,248,252,0.96);
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
      white-space: nowrap;
    }

    .btn:hover, select:hover, input:hover {
      border-color: rgba(39,76,119,0.24);
      box-shadow: 0 8px 18px rgba(20,44,65,0.08), inset 0 1px 0 rgba(255,255,255,0.92);
    }

    .btn.secondary {
      background: rgba(255,255,255,0.9);
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .btn.active, #connect-btn {
      background: linear-gradient(135deg, #16324a 0%, #2e74d7 100%);
      color: white;
      border-color: transparent;
      box-shadow: 0 10px 20px rgba(22,50,74,0.16);
    }

    .tabs {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      width: min(1680px, calc(100vw - 44px));
      margin: 14px auto 10px;
      padding: 2px 2px 8px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 0 0 auto;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.78);
      border-radius: 999px;
      padding: 11px 18px;
      color: var(--muted);
      font-weight: 900;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
    }

    .tab.active {
      color: white;
      border-color: transparent;
      background: linear-gradient(135deg, #16324a 0%, #2e74d7 100%);
      box-shadow: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: clamp(14px, 1.25vw, 22px);
    }

    .card, .metric {
      background: linear-gradient(180deg, rgba(255,255,255,0.99), rgba(248,251,253,0.96));
      border: 1px solid rgba(22,50,74,0.08);
      border-radius: var(--radius);
      box-shadow: 0 16px 34px rgba(20,44,65,0.07);
    }

    .metric {
      padding: 18px;
      min-height: 94px;
      display: grid;
      align-content: center;
      gap: 4px;
    }

    .metric strong {
      display: block;
      font-size: clamp(1.45rem, 2.6vw, 2rem);
      letter-spacing: -0.03em;
      line-height: 1;
      font-weight: 900;
    }

    .metric span {
      color: #6a7b91;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card {
      padding: 22px;
      min-height: 340px;
      overflow: hidden;
      margin-bottom: 0;
    }

    .card.compact { min-height: 260px; }
    .treemap-card {
      padding: 0;
      overflow: hidden;
      border-color: var(--tm-line);
      box-shadow: var(--tm-shadow);
    }
    .treemap-card .card-head {
      padding: 18px 18px 0;
    }
    .treemap-card .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .treemap-card .card-head h3 {
      margin: 0 0 5px;
      font-size: 22px;
      font-weight: 800;
      color: var(--tm-ink);
    }
    .treemap-card .card-head p {
      margin: 0;
      font-size: 14px;
      color: var(--tm-muted);
      line-height: 1.35;
      font-weight: 700;
    }
    .treemap-card .card-back {
      border: 1px solid var(--tm-line);
      background: white;
      color: var(--tm-ink);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }
    .treemap-card .card-back.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }
    .treemap-body {
      padding: 0 12px 14px;
    }
    .treemap-plot {
      height: clamp(430px, 54vh, 650px);
    }
    .legend-wrap {
      margin: 6px 6px 0;
      display: grid;
      gap: 8px;
    }
    .legend-wrap.is-hidden { display: none; }
    .legend-bar {
      height: 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--tm-low) 0%, var(--tm-mid) 50%, var(--tm-high) 100%);
      border: 1px solid var(--tm-line);
    }
    .legend-scale {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--tm-muted);
      font-weight: 800;
    }
    .legend-caption {
      font-size: 12px;
      color: var(--tm-muted);
      line-height: 1.35;
      font-weight: 700;
    }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; }
    .span-6 { grid-column: span 6; }
    .span-7 { grid-column: span 7; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }

    h2, h3 {
      margin: 0 0 12px;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    h2 { font-size: clamp(26px, 3vw, 42px); }
    h3 { font-size: 1.08rem; }

    .subtle {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.45;
    }

    .chart {
      width: 100%;
      min-height: 318px;
    }

    .chart.tall { min-height: 460px; }

    .chart .svg-container,
    .treemap-plot .svg-container {
      max-width: 100% !important;
    }

    .table-wrap {
      overflow: auto;
      border-radius: 18px;
      border: 1px solid rgba(22,50,74,0.06);
      background: rgba(255,255,255,0.72);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    th, td {
      text-align: left;
      padding: 11px 12px;
      border-bottom: 1px solid rgba(22,50,74,0.08);
      vertical-align: top;
    }

    th {
      color: #61738a;
      font-size: 0.74rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(245,248,252,0.92);
      position: sticky;
      top: 0;
    }

    td {
      font-weight: 600;
    }

    .empty, .error {
      padding: 42px 18px;
      text-align: center;
      border-radius: 18px;
      background: rgba(245,248,252,0.72);
      border: 1px dashed rgba(22,50,74,0.12);
      color: var(--muted);
      font-weight: 700;
    }

    .error {
      color: #9d2433;
      border-color: rgba(223, 77, 95, 0.32);
      background: rgba(255, 245, 247, 0.86);
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #12344a 0%, #1e5677 58%, #3a7ca5 100%);
      color: white;
      padding: 44px 28px 30px;
      border-bottom: 1px solid rgba(255,255,255,0.14);
    }

    .hero h1 {
      position: relative;
      z-index: 1;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.03em;
      margin: 0;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(255,255,255,0.22), transparent 32%),
        radial-gradient(circle at bottom left, rgba(255,255,255,0.12), transparent 26%);
      pointer-events: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 22px;
      background: rgba(255,255,255,0.86);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(22,50,74,0.08);
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 12px 32px rgba(20,44,65,0.08);
      align-items: flex-start;
    }

    .controls-main {
      display: grid;
      grid-template-columns: minmax(300px, 1.45fr) max-content minmax(170px, 0.7fr) max-content minmax(280px, 1.15fr) max-content max-content;
      gap: 14px 16px;
      width: 100%;
      align-items: end;
    }

    .control {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .control label,
    .control-label {
      min-height: 16px;
      line-height: 1;
      font-size: 0.76rem;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .control-grow { flex: 1 1 320px; min-width: 280px; }
    .control-major { min-width: 280px; }
    .control-degree { min-width: 180px; }
    .control-mode .btn { white-space: nowrap; }
    .control > select { width: 100%; }
    .control > .segmented { width: auto; }
    .control-years .segmented, .control-view .segmented { flex-wrap: nowrap; }
    .control-years .btn, .control-view .btn { white-space: nowrap; }

    .advanced-toggle { margin-left: auto; }
    .advanced-panel {
      display: none;
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel-soft);
    }
    .advanced-panel.is-open,
    .advanced-panel.open { display: block; }
    .advanced-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      align-items: flex-start;
    }
    .advanced-grid .control { min-width: 160px; }
    .advanced-grid .control-wide { min-width: 260px; flex: 1 1 280px; }
    .compare-only { display: none; }
    body.compare-mode .compare-only { display: flex; }

    .content {
      width: auto;
      max-width: 1680px;
      margin: 0 auto;
      padding: 18px 22px 44px;
    }

    .api-connection.connected { display: none; }

    .content .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: clamp(14px, 1.25vw, 22px);
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(247,250,252,0.94));
      border: 1px solid rgba(22,50,74,0.08);
      border-radius: 22px;
      box-shadow: 0 12px 28px rgba(20,44,65,0.06);
      padding: clamp(18px, 1.6vw, 24px);
      margin-bottom: 0;
      min-height: 0;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    .card:hover,
    .metric:hover {
      border-color: rgba(34, 94, 168, 0.16);
      box-shadow: 0 18px 38px rgba(20,44,65,0.08);
    }

    .card h3 {
      margin-bottom: 12px;
      font-size: 1.08rem;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .metric {
      background: linear-gradient(180deg, #ffffff, #f5f9fd);
      border: 1px solid rgba(22,50,74,0.08);
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 12px 24px rgba(20,44,65,0.05);
      min-height: 108px;
      display: grid;
      align-content: center;
      gap: 4px;
    }

    .metric strong {
      font-size: clamp(1.45rem, 2.6vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .metric.current-students {
      border-color: rgba(34, 160, 107, 0.22);
      background: linear-gradient(180deg, rgba(239, 252, 246, 0.98), rgba(224, 246, 236, 0.9));
    }

    .metric.current-students strong {
      color: #178056;
    }

    .metric span {
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .no-data,
    .empty,
    .error {
      padding: 42px 18px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(22,50,74,0.12);
      border-radius: 18px;
      background: rgba(245,248,252,0.72);
    }

    .api-status {
      position: absolute;
      right: 24px;
      top: 18px;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255,255,255,0.86);
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    @media (max-width: 1180px) {
      header { position: static; }
      .controls { position: relative; top: auto; }
      .connection, .filters, .advanced { grid-template-columns: repeat(2, minmax(260px, 1fr)); }
      .controls-main { grid-template-columns: repeat(2, minmax(280px, 1fr)); }
      .span-3, .span-4, .span-5, .span-6, .span-7, .span-8, .span-12 { grid-column: span 12; }
      .metric.span-3 { grid-column: span 6; }
      .metric.span-4 { grid-column: span 4; }
    }

    @media (max-width: 720px) {
      .topline, .connection, .filters { grid-template-columns: 1fr; display: grid; }
      .advanced.open { grid-template-columns: 1fr; display: grid; }
      .controls { padding: 10px 12px; }
      .controls-main { display: flex; flex-wrap: wrap; gap: 10px; }
      .advanced-toggle { margin-left: 0; }
      .tabs { width: calc(100vw - 20px); margin-top: 10px; }
      .tab { padding: 10px 15px; }
      .content { padding: 14px 10px 34px; }
      .metric, .card { padding: 18px; }
      select[multiple] { min-height: 92px; }
    }

    @media (max-width: 520px) {
      .metric.span-3, .metric.span-4 { grid-column: span 12; }
      .hero { padding: 34px 18px 24px; }
      .api-status {
        position: static;
        margin-top: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>College Outcomes Explorer</h1>
    <div class="api-status"><span id="status-dot" class="dot"></span><span id="status-text">Not connected</span></div>
  </div>

  <div class="controls">
    <div class="controls-main" id="filters">
      <div class="control control-grow">
        <label>School</label>
        <select id="school-select"></select>
      </div>
      <div class="control control-mode">
        <span class="control-label">Mode</span>
        <span class="segmented" id="selection-toggle">
          <button class="btn active" type="button" data-selection-mode="single">Single</button>
          <button class="btn" type="button" data-selection-mode="compare">Compare</button>
        </span>
      </div>
      <div class="control control-degree">
        <label>Degree</label>
        <select id="degree-select"></select>
      </div>
      <div class="control control-years">
        <span class="control-label">Years Out</span>
        <span class="segmented" id="horizon-toggle">
          <button class="btn active" type="button" data-horizon="1yr">1yr</button>
          <button class="btn" type="button" data-horizon="5yr">5yr</button>
          <button class="btn" type="button" data-horizon="10yr">10yr</button>
        </span>
      </div>
      <div class="control control-major">
        <label>Major</label>
        <select id="major-select"></select>
      </div>
      <div class="control control-view">
        <span class="control-label">View</span>
        <span class="segmented" id="view-toggle">
          <button class="btn" type="button" data-view-mode="snapshot">Snapshot</button>
          <button class="btn active" type="button" data-view-mode="overtime">Over Time</button>
        </span>
      </div>
      <div class="control advanced-toggle">
        <label>Options</label>
        <button id="advanced-btn" class="btn" type="button">Advanced Options</button>
      </div>

    <div id="advanced-panel" class="advanced-panel">
      <div class="advanced-grid">
        <div class="control control-wide api-connection">

        <div class="control api-connection">
          <label>API</label>

          <label>Comparison Schools</label>
          <select id="compare-school-select" multiple></select>

        <div class="control">
          <label>CIP Level</label>
          <select id="cip-level-select">
            <option value="cip4">4-digit CIP</option>
            <option value="cip2">2-digit CIP</option>
            <option value="cip6">6-digit CIP</option>
          </select>
        </div>
        <div class="control">
          <label>From</label>
          <select id="from-year-select"></select>
        </div>
        <div class="control">
          <label>To</label>
          <select id="to-year-select"></select>
        </div>

          <label>Horizon Mode</label>
          <select id="horizon-select"></select>
        </div>
        <div class="control">
          <label>Gender</label>
          <select id="gender-select"><option value="">All</option></select>
        </div>
        <div class="control">
          <label>Race/Ethnicity</label>
          <select id="race-select"><option value="">All</option></select>
        </div>
        <div class="control">
          <label>Further Education</label>
          <select id="later-degree-filter"><option value="">All</option></select>
        </div>
        <div class="control">
          <label>No Further Ed</label>
          <select id="no-further-select">
            <option value="">All</option>
            <option value="true">Only no later degree</option>
            <option value="false">Only with later degree</option>
          </select>
        </div>
        <div class="control">
          <label>Current Students</label>
          <select id="current-select">
            <option value="false">Hide current students</option>
            <option value="true">Show current students</option>
          </select>
        </div>
        <div class="control">
          <label>School Employer</label>
          <select id="school-employer-select">
            <option value="false">Exclude school itself</option>
            <option value="true">Include school itself</option>
          </select>
        </div>
        <div class="control">
          <label>Top N</label>
          <select id="top-n-select">
            <option selected>8</option>
            <option>12</option>
            <option>16</option>
            <option>20</option>
            <option>30</option>
            <option>50</option>
          </select>
        </div>
      </div>

  </div>
  <div id="refresh-state" class="refresh-state">Refreshing...</div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="earnings">Earnings</button>
    <button class="tab" data-tab="employers">Employers</button>
    <button class="tab" data-tab="geography">Geography</button>
    <button class="tab" data-tab="roles">Roles</button>
    <button class="tab" data-tab="demographics">Demographics</button>
    <button class="tab" data-tab="postgrad">Further Education</button>
    <button class="tab" data-tab="coverage">Coverage</button>
  </nav>

  <main id="main" class="content">
    <div id="message" class="empty">Connecting to the protected API...</div>
    <section id="content" class="grid" style="display:none;"></section>
  </main>

  <script src="./config.js"></script>
  <script>
    const COLORS = ['#225ea8', '#22a06b', '#f97316', '#7c5fd6', '#df4d5f', '#0891b2', '#a16207', '#475569'];
    const storage = window.localStorage;
    const state = {
      apiUrl: '',
      password: '',
      options: null,
      data: null,
      tab: 'overview',
      viewMode: storage.getItem('outcomes.viewMode') || 'overtime',
      selectionMode: storage.getItem('outcomes.selectionMode') || 'single',
      selectedEmployer: null,
      selectedEmployerRole: null,
      selectedPostgradDegree: null,
      selectedPostgradSchool: null,
      selectedPostgradProgram: null,
      roleTreePath: [],
      industryTreePath: [],
      loading: false,
      pendingRefresh: null,
    };

    const $ = id => document.getElementById(id);
    const fmt = new Intl.NumberFormat('en-US');
    const money = value => value === null || value === undefined ? 'No data' : `$${fmt.format(Math.round(value / 1000))}k`;
    const num = value => {
      if (value === null || value === undefined) return 'No data';
      const n = Number(value);
      if (!Number.isFinite(n)) return 'No data';
      if (n > 0 && n < 1) return '<1';
      if (Math.abs(n) < 10 && !Number.isInteger(n)) return n.toFixed(1).replace(/\.0$/, '');
      return fmt.format(Math.round(n));
    };
    const pct = value => value === null || value === undefined ? 'No data' : `${Number(value).toFixed(1)}%`;
    let resizeTimer = null;

    const layoutBase = {
      font: { family: '"Source Sans 3", ui-sans-serif, system-ui, sans-serif', color: '#243b53', size: 13 },
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      margin: { l: 72, r: 28, t: 20, b: 62 },
      hoverlabel: { bgcolor: '#102a43', bordercolor: '#102a43', font: { family: '"Source Sans 3", ui-sans-serif, system-ui, sans-serif', color: '#fff', size: 13 } },
    };
    const plotConfig = { responsive: true, displayModeBar: false };

    function compactWindow() {
      return window.innerWidth < 820;
    }

    function labelText(row) {
      return String(row?.label || row?.title || row?.employer || row?.location || row?.school_name || row?.degree_type || row?.degree || row || '');
    }

    function wrapAxisLabel(value, maxChars = compactWindow() ? 20 : 28, maxLines = compactWindow() ? 3 : 2) {
      const text = String(value ?? '').trim();
      if (text.length <= maxChars) return escapeHtml(text);
      const words = text.split(/\s+/);
      const lines = [];
      let line = '';
      words.forEach(word => {
        if (!line) {
          line = word;
          return;
        }
        if ((line + ' ' + word).length <= maxChars) {
          line += ' ' + word;
        } else {
          lines.push(line);
          line = word;
        }
      });
      if (line) lines.push(line);
      const visible = lines.slice(0, maxLines);
      if (lines.length > maxLines) {
        visible[visible.length - 1] = `${visible[visible.length - 1].replace(/[,.]$/, '')}...`;
      }
      return visible.map(escapeHtml).join('<br>');
    }

    function wrappedLabels(rows, key) {
      return (rows || []).map(row => wrapAxisLabel(key ? row[key] : labelText(row)));
    }

    function queuePlotResize() {
      window.requestAnimationFrame(() => {
        document.querySelectorAll('.js-plotly-plot').forEach(plot => Plotly.Plots.resize(plot));
      });
    }

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(queuePlotResize, 140);
    });

    function setStatus(kind, text) {
      $('status-dot').className = `dot ${kind || ''}`;
      $('status-text').textContent = text;
    }

    function setMessage(html, isError = false) {
      $('message').style.display = 'block';
      $('message').className = isError ? 'error' : 'empty';
      $('message').innerHTML = html;
      $('content').style.display = 'none';
    }

    function showContent() {
      $('message').style.display = 'none';
      $('content').style.display = 'grid';
    }

    function normalizeApiUrl(value) {
      return String(value || '')
        .trim()
        .replace(/\/+$/, '')
        .replace(/\/api\/(health|options|dashboard)$/i, '')
        .replace(/\/+$/, '');
    }

    function defaultApiUrl() {
      if (window.OUTCOMES_API_URL) return window.OUTCOMES_API_URL;
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return 'http://localhost:8000';
      return '';
    }

    async function apiFetch(path, body) {
      if (!state.apiUrl) throw new Error('Missing API URL.');
      const headers = { 'Content-Type': 'application/json' };
      if (state.password) headers['X-Outcomes-Password'] = state.password;
      let response;
      try {
        response = await fetch(`${state.apiUrl}${path}`, {
          method: 'POST',
          headers,
          body: JSON.stringify(body || currentFilters()),
        });
      } catch (error) {
        throw new Error(`Network/CORS error reaching ${state.apiUrl}. Confirm the URL starts with https:// and Render is live.`);
      }
      if (!response.ok) {
        const text = await response.text();
        const hint = response.status === 404
          ? ' Use the base API URL only, for example https://college-outcomes-api.onrender.com, not /api/health.'
          : '';
        throw new Error(`${response.status} ${response.statusText}: ${text.slice(0, 240)}${hint}`);
      }
      return response.json();
    }

    function selectedValues(select) {
      return Array.from(select.selectedOptions || []).map(option => option.value).filter(Boolean);
    }

    function setAdvancedOpen(open) {
      $('advanced-panel').classList.toggle('open', open);
      $('advanced-btn').textContent = open ? 'Hide Advanced Options' : 'Advanced Options';
    }

    function getSelectedSchools() {
      const primary = $('school-select').value ? [$('school-select').value] : [];
      if (state.selectionMode !== 'compare') return primary;
      const compare = selectedValues($('compare-school-select'));
      return [...new Set([...primary, ...compare])].filter(Boolean);
    }

    function yearRange() {
      const all = state.options?.grad_years || [];
      const from = Number($('from-year-select').value || all[0]);
      const to = Number($('to-year-select').value || all[all.length - 1]);
      return all.filter(year => year >= from && year <= to);
    }

    function currentFilters(extra = {}) {
      const noFurtherValue = $('no-further-select').value;
      return {
        schools: getSelectedSchools(),
        degree: $('degree-select').value || 'Bachelors',
        cip_level: $('cip-level-select').value || 'cip4',
        majors: $('major-select').value ? [$('major-select').value] : [],
        grad_years: yearRange(),
        horizon: $('horizon-select').value || '1yr',
        demographics: {
          gender: $('gender-select').value || null,
          race_ethnicity: $('race-select').value || null,
        },
        postgrad: {
          later_degree_type: $('later-degree-filter').value || null,
          no_further_education: noFurtherValue === '' ? null : noFurtherValue === 'true',
        },
        include_current_students: $('current-select').value === 'true',
        include_school_employers: $('school-employer-select').value === 'true',
        compare_mode: state.selectionMode === 'compare',
        active_tab: state.selectionMode === 'compare' ? 'compare' : 'all',
        view_mode: state.selectionMode === 'compare' ? state.viewMode : 'all',
        selected_employer: state.selectedEmployer,
        selected_employer_role: state.selectedEmployerRole,
        selected_postgrad_degree: state.selectedPostgradDegree,
        selected_postgrad_school: state.selectedPostgradSchool,
        selected_postgrad_program: state.selectedPostgradProgram,
        top_n: Number($('top-n-select').value || 8),
        ...extra,
      };
    }

    function option(label, value, selected = false) {
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      opt.selected = selected;
      return opt;
    }

    function populateSelect(select, rows, getLabel, getValue, selectedValuesSet = new Set()) {
      select.innerHTML = '';
      rows.forEach(row => select.appendChild(option(getLabel(row), getValue(row), selectedValuesSet.has(String(getValue(row))))));
    }

    function populateStaticControls(options) {
      const defaultSchool = options.schools.find(s => /Columbia University in the City of New York/i.test(s.name)) || options.schools[0];
      const existingPrimary = $('school-select').value || defaultSchool?.unitid || '';
      let savedCompare = [];
      try {
        savedCompare = JSON.parse(storage.getItem('outcomes.compareSchools') || '[]');
      } catch {
        savedCompare = [];
      }
      const currentCompare = selectedValues($('compare-school-select')).map(String);
      const existingCompare = new Set((currentCompare.length ? currentCompare : savedCompare).map(String));
      populateSelect($('school-select'), options.schools, s => s.name, s => s.unitid, new Set([String(existingPrimary)]));
      populateSelect($('compare-school-select'), options.schools, s => s.name, s => s.unitid, existingCompare);

      const existingDegree = $('degree-select').value || 'Bachelors';
      populateSelect($('degree-select'), options.degrees, d => d.label, d => d.degree, new Set([existingDegree]));
      if (!$('degree-select').value) $('degree-select').value = 'Bachelors';

      populateSelect($('horizon-select'), options.horizons, h => h.label, h => h.value, new Set([$('horizon-select').value || '1yr']));
      if (!$('horizon-select').value) $('horizon-select').value = '1yr';
      syncHorizonToggle();

      const years = options.grad_years || [];
      populateSelect($('from-year-select'), years, y => y, y => y, new Set([String($('from-year-select').value || years[0] || '')]));
      populateSelect($('to-year-select'), years, y => y, y => y, new Set([String($('to-year-select').value || years[years.length - 1] || '')]));
      if (!$('from-year-select').value && years.length) $('from-year-select').value = years[0];
      if (!$('to-year-select').value && years.length) $('to-year-select').value = years[years.length - 1];

      const genders = options.demographics?.gender || [];
      const races = options.demographics?.race_ethnicity || [];
      const laterDegrees = options.later_degrees || [];
      const oldGender = $('gender-select').value;
      const oldRace = $('race-select').value;
      const oldLater = $('later-degree-filter').value;
      $('gender-select').innerHTML = '<option value="">All</option>';
      genders.forEach(value => $('gender-select').appendChild(option(value, value, value === oldGender)));
      $('race-select').innerHTML = '<option value="">All</option>';
      races.forEach(value => $('race-select').appendChild(option(value, value, value === oldRace)));
      $('later-degree-filter').innerHTML = '<option value="">All</option>';
      laterDegrees.forEach(value => $('later-degree-filter').appendChild(option(value, value, value === oldLater)));
    }

    function populateMajorOptions(options, preserve = true) {
      const previous = preserve ? $('major-select').value : '';
      const validCodes = new Set((options.major_options || []).map(row => String(row.code)));
      const keepPrevious = previous && validCodes.has(String(previous));
      $('major-select').innerHTML = '<option value="">All majors</option>';
      (options.major_options || []).forEach(row => {
        const label = `${row.title} (${row.code})`;
        $('major-select').appendChild(option(label, row.code, keepPrevious && previous === row.code));
      });
    }

    async function loadOptions(preserveMajor = true) {
      const filters = currentFilters({ majors: [] });
      const options = await apiFetch('/api/options', filters);
      state.options = options;
      populateStaticControls(options);
      populateMajorOptions(options, preserveMajor);
      if (state.selectionMode === 'compare') {
        setAdvancedOpen(!selectedValues($('compare-school-select')).length);
      }
      setStatus('ok', `${options.meta?.data_version || 'Connected'} | positive-weight cells visible`);
    }

    async function connect() {
      state.apiUrl = normalizeApiUrl($('api-url').value || defaultApiUrl());
      state.password = $('api-password').value || '';
      if (!state.apiUrl) {
        setMessage('Enter the protected API URL first.', true);
        return;
      }
      storage.setItem('outcomes.apiUrl', state.apiUrl);
      storage.setItem('outcomes.apiPassword', state.password);
      $('api-url').value = state.apiUrl;
      setStatus('', 'Connecting');
      setMessage('Connecting to the protected API...');
      try {
        await loadOptions(true);
        document.querySelectorAll('.api-connection').forEach(node => node.classList.add('connected'));
        await refresh();
      } catch (error) {
        setStatus('bad', 'Connection failed');
        setMessage(escapeHtml(error.message || 'Could not connect to the protected API.'), true);
      }
    }

    async function refresh({ reloadOptions = false, resetDrill = false } = {}) {
      if (!state.apiUrl) {
        setMessage('Enter the protected API URL and password, then connect.');
        return;
      }
      if (state.loading) {
        state.pendingRefresh = {
          reloadOptions: Boolean(state.pendingRefresh?.reloadOptions || reloadOptions),
          resetDrill: Boolean(state.pendingRefresh?.resetDrill || resetDrill),
        };
        return;
      }
      state.loading = true;
      document.body.classList.add('loading');
      $('refresh-state')?.classList.add('is-visible');
      setStatus('', 'Refreshing');
      try {
        if (resetDrill) {
          state.selectedEmployer = null;
          state.selectedEmployerRole = null;
          state.selectedPostgradDegree = null;
          state.selectedPostgradSchool = null;
          state.selectedPostgradProgram = null;
          state.roleTreePath = [];
          state.industryTreePath = [];
        }
        if (reloadOptions || !state.options) await loadOptions(true);
        state.data = await apiFetch('/api/dashboard', currentFilters());
        showContent();
        render();
        setStatus('ok', `${state.data.meta?.data_version || 'Connected'} | loaded ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`);
      } catch (error) {
        setStatus('bad', 'Connection failed');
        setMessage(`<strong>Could not load data.</strong><br>${escapeHtml(error.message)}`, true);
      } finally {
        state.loading = false;
        document.body.classList.remove('loading');
        $('refresh-state')?.classList.remove('is-visible');
        if (state.pendingRefresh) {
          const pending = state.pendingRefresh;
          state.pendingRefresh = null;
          refresh(pending);
        }
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function card(title, id, span = 6, tall = false) {
      return `<div class="card span-${span}"><h3>${title}</h3><div id="${id}" class="chart ${tall ? 'tall' : ''}"></div></div>`;
    }

    function treemapCard(title, id, subtitle, path, kind, span = 6) {
      return `<div class="card treemap-card span-${span}">
        <div class="card-head">
          <div class="card-top">
            <div>
              <h3>${escapeHtml(title)}</h3>
              <p>${escapeHtml(subtitle)}</p>
            </div>
            <button class="card-back ${(path || []).length ? '' : 'is-hidden'}" type="button" onclick="drillBack('${kind}')">Back</button>
          </div>
        </div>
        <div class="treemap-body">
          <div id="${id}" class="treemap-plot"></div>
          <div class="legend-wrap is-hidden" id="${id}-legend">
            <div class="legend-bar" aria-hidden="true"></div>
            <div class="legend-scale"><span id="${id}-legend-min"></span><span id="${id}-legend-max"></span></div>
            <div class="legend-caption" id="${id}-legend-caption"></div>
          </div>
        </div>
      </div>`;
    }

    function isNoiseLabel(value) {
      if (value === null || value === undefined) return true;
      const text = String(value).trim().toLowerCase();
      return !text || text === 'unknown' || text === 'other' || text === 'empty';
    }

    function sumRows(rows, field) {
      return (rows || []).reduce((total, row) => total + Number(row[field] || 0), 0);
    }

    function samePath(a = [], b = []) {
      return a.length === b.length && a.every((value, idx) => String(value) === String(b[idx]));
    }

    function hierarchyTrail(path) {
      return (path || []).length ? path.join(' > ') : 'Top level';
    }

    function drillBack(kind) {
      if (kind === 'roleTree') state.roleTreePath = state.roleTreePath.slice(0, -1);
      if (kind === 'industryTree') state.industryTreePath = state.industryTreePath.slice(0, -1);
      renderRoles();
    }

    function hexToRgb(hex) {
      const normalized = String(hex || '').replace('#', '').trim();
      if (normalized.length !== 6) return [185, 196, 211];
      return [
        parseInt(normalized.slice(0, 2), 16),
        parseInt(normalized.slice(2, 4), 16),
        parseInt(normalized.slice(4, 6), 16),
      ];
    }

    function rgbToHex(rgb) {
      return `#${rgb.map(value => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0')).join('')}`;
    }

    function mixHex(a, b, t) {
      const rgbA = hexToRgb(a);
      const rgbB = hexToRgb(b);
      return rgbToHex(rgbA.map((value, idx) => value + ((rgbB[idx] - value) * t)));
    }

    function payColor(avgPay, domain) {
      if (!Array.isArray(domain) || domain.length !== 2 || !Number.isFinite(avgPay)) return '#B9C4D3';
      const [minPay, maxPay] = domain;
      if (!Number.isFinite(minPay) || !Number.isFinite(maxPay) || maxPay <= minPay) return '#48AFF4';
      const scaled = Math.max(0, Math.min(1, (avgPay - minPay) / (maxPay - minPay)));
      if (scaled <= 0.5) return mixHex('#D9ECFB', '#48AFF4', scaled / 0.5);
      return mixHex('#48AFF4', '#2D426A', (scaled - 0.5) / 0.5);
    }

    function updateTreemapLegend(id, domain) {
      const wrap = $(`${id}-legend`);
      const minEl = $(`${id}-legend-min`);
      const maxEl = $(`${id}-legend-max`);
      const captionEl = $(`${id}-legend-caption`);
      if (!wrap || !minEl || !maxEl || !captionEl) return;
      if (!Array.isArray(domain) || domain.length !== 2 || !Number.isFinite(domain[0]) || !Number.isFinite(domain[1]) || domain[1] <= domain[0]) {
        wrap.classList.add('is-hidden');
        return;
      }
      wrap.classList.remove('is-hidden');
      minEl.textContent = money(domain[0]);
      maxEl.textContent = money(domain[1]);
      captionEl.textContent = 'Color encodes mean pay for the visible tiles.';
    }

    function treemapPayDomain(nodes) {
      const salaryValues = (nodes || [])
        .map(row => row.median_salary)
        .filter(value => value !== null && value !== undefined && Number.isFinite(Number(value)))
        .map(Number);
      if (salaryValues.length < 2) return null;
      const cmin = Math.min(...salaryValues);
      const cmax = Math.max(...salaryValues);
      return cmax > cmin ? [cmin, cmax] : null;
    }

    function filterRowsByHierarchyPath(rows, levels, path) {
      return (rows || []).filter(row => (path || []).every((value, idx) => String(row[levels[idx]] || '') === String(value)));
    }

    function visibleHierarchyRows(rows, levels, path) {
      const filtered = filterRowsByHierarchyPath(rows, levels, path);
      const levelField = levels[(path || []).length];
      const nextField = levels[(path || []).length + 1];
      const groups = new Map();
      filtered.forEach(row => {
        const label = row[levelField];
        if (isNoiseLabel(label)) return;
        if (!groups.has(label)) {
          groups.set(label, { label, value: 0, salaryWeight: 0, salarySum: 0, drillable: false });
        }
        const group = groups.get(label);
        group.value += Number(row.n || 0);
        group.salaryWeight += Number(row.salary_weight || 0);
        group.salarySum += Number(row.salary_sum || 0);
        if (nextField && !isNoiseLabel(row[nextField]) && String(row[nextField]) !== String(label)) {
          group.drillable = true;
        }
      });
      const limit = Number($('top-n-select')?.value || 8);
      return [...groups.values()]
        .map(row => ({
          ...row,
          median_salary: row.salaryWeight > 0 ? row.salarySum / row.salaryWeight : null,
        }))
        .sort((a, b) => b.value - a.value)
        .slice(0, limit);
    }

    function ensureVisibleHierarchyPath(rows, levels, path) {
      const next = [...(path || [])];
      while (next.length && !visibleHierarchyRows(rows, levels, next).length) next.pop();
      return next;
    }

    function metric(label, value, span = 3, extraClass = '') {
      return `<div class="metric span-${span} ${extraClass}"><strong>${value}</strong><span>${label}</span></div>`;
    }

    function currentStudentTotal() {
      return (state.data.current_student_trend || []).reduce((total, row) => total + Number(row.current_students || 0), 0);
    }

    function renderRoles() {
      if (state.viewMode === 'snapshot') {
        const rows = state.data.roles?.hierarchy || [];
        const roleLevels = ['role_k50_v3', 'role_k150_v3'];
        const industryLevels = ['industry_k200', 'industry_k400'];
        let changed = true;
        while (changed) {
          changed = false;
          const roleContext = filterRowsByHierarchyPath(rows, industryLevels, state.industryTreePath);
          const nextRolePath = ensureVisibleHierarchyPath(roleContext, roleLevels, state.roleTreePath);
          if (!samePath(nextRolePath, state.roleTreePath)) {
            state.roleTreePath = nextRolePath;
            changed = true;
          }
          const industryContext = filterRowsByHierarchyPath(rows, roleLevels, state.roleTreePath);
          const nextIndustryPath = ensureVisibleHierarchyPath(industryContext, industryLevels, state.industryTreePath);
          if (!samePath(nextIndustryPath, state.industryTreePath)) {
            state.industryTreePath = nextIndustryPath;
            changed = true;
          }
        }
        const roleContextRows = filterRowsByHierarchyPath(rows, industryLevels, state.industryTreePath);
        const industryContextRows = filterRowsByHierarchyPath(rows, roleLevels, state.roleTreePath);
        const roleNodes = visibleHierarchyRows(roleContextRows, roleLevels, state.roleTreePath);
        const industryNodes = visibleHierarchyRows(industryContextRows, industryLevels, state.industryTreePath);
        const sharedPayDomain = treemapPayDomain([...roleNodes, ...industryNodes]);
        const roleSubtitle = state.industryTreePath.length
          ? `${hierarchyTrail(state.roleTreePath)}. Filtered by industry: ${hierarchyTrail(state.industryTreePath)}`
          : `${hierarchyTrail(state.roleTreePath)}. Click a role to zoom into K150 roles.`;
        const industrySubtitle = state.roleTreePath.length
          ? `${hierarchyTrail(state.industryTreePath)}. Filtered by role: ${hierarchyTrail(state.roleTreePath)}`
          : `${hierarchyTrail(state.industryTreePath)}. Click an industry to zoom.`;
        $('content').innerHTML = [
          treemapCard('Role Treemap', 'role-tree', roleSubtitle, state.roleTreePath, 'roleTree', 6),
          treemapCard('Industry Treemap', 'industry-tree', industrySubtitle, state.industryTreePath, 'industryTree', 6),
        ].join('');
        drawHierarchyTreemap('role-tree', roleContextRows, roleLevels, state.roleTreePath, node => {
          if (!node.drillable) return;
          state.roleTreePath = [...state.roleTreePath, node.label];
          renderRoles();
        }, { payDomain: sharedPayDomain });
        drawHierarchyTreemap('industry-tree', industryContextRows, industryLevels, state.industryTreePath, node => {
          if (!node.drillable) return;
          state.industryTreePath = [...state.industryTreePath, node.label];
          renderRoles();
        }, { payDomain: sharedPayDomain });
      } else {
        $('content').innerHTML = [
          card('Roles Over Time', 'role-trend', 6, true),
          card('Industries Over Time', 'industry-trend', 6, true),
        ].join('');
        drawTrendLines('role-trend', state.data.role_trend?.roles || [], 'label', 'share_pct', {
          yTitle: 'Share of alumni %',
          suffix: '%',
          hover: '%{y:.1f}%',
        });
        drawTrendLines('industry-trend', state.data.role_trend?.industries || [], 'label', 'share_pct', {
          yTitle: 'Share of alumni %',
          suffix: '%',
          hover: '%{y:.1f}%',
        });
      }
    }

      const cleanRows = (rows || []).filter(row => (row.revelio_completions || row.ipeds_completions)).slice(0, limit);

        num(row.ipeds_completions),
        pct(row.coverage_pct),

    function drawCoverageOverlayBars(id, rows, labelKey, limit = 14) {
      const cleanRows = (rows || [])
        .filter(row => (row.revelio_completions || row.ipeds_completions) && row[labelKey])
        .slice(0, limit)
        .reverse();
      if (!cleanRows.length) return noData(id);
      const labels = wrappedLabels(cleanRows, labelKey);
      Plotly.newPlot(id, [
        {
          type: 'bar',
          orientation: 'h',
          name: 'IPEDS',
          y: labels,
          x: cleanRows.map(row => row.ipeds_completions),
          marker: { color: 'rgba(148, 163, 184, 0.50)' },
          customdata: cleanRows.map(row => row[labelKey]),
          hovertemplate: '%{customdata}<br>IPEDS %{x:,.0f}<extra></extra>',
        },
        {
          type: 'bar',
          orientation: 'h',
          name: 'Revelio',
          y: labels,
          x: cleanRows.map(row => row.revelio_completions),
          customdata: cleanRows.map(row => [row[labelKey], row.coverage_pct]),
          marker: { color: 'rgba(47, 128, 237, 0.72)' },
          hovertemplate: '%{customdata[0]}<br>Revelio %{x:,.0f}<br>Grad coverage %{customdata[1]:.1f}%<extra></extra>',
        },
      ], {
        ...horizontalLayout(cleanRows.map(row => ({ label: row[labelKey] }))),
        barmode: 'overlay',
        xaxis: { title: 'Completions', automargin: true, rangemode: 'tozero' },
        legend: { orientation: 'h', y: 1.14, x: 0 },
      }, plotConfig);
    }

    function drawSalaryTrend(id, forceSchool = false) {
      const schools = getSelectedSchools();
      const bySchool = forceSchool || schools.length > 1;
      const rows = (bySchool ? (state.data.salary_trend_by_school || []) : (state.data.salary_trend || []))
        .filter(row => row.median_salary !== null && row.median_salary !== undefined);
      if (!rows.length) return noData(id);
      let traces;
      if (bySchool) {
        const schools = [...new Set(rows.map(r => r.school_name))];
        traces = schools.map((school, i) => {
          const slice = rows.filter(r => r.school_name === school);
          const color = COLORS[i % COLORS.length];
          return {
            type: 'scatter',
            mode: 'lines+markers',
            name: shortSchool(school),
            x: slice.map(r => r.grad_year),
            y: slice.map(r => r.median_salary),
            text: slice.map(r => r.partial_horizon ? `${school}<br>2025 early earnings` : school),
            line: { color, width: 3 },
            marker: {
              size: slice.map(r => r.partial_horizon ? 12 : 7),
              color: slice.map(r => r.partial_horizon ? COLORS[2] : color),
              symbol: slice.map(r => r.partial_horizon ? 'diamond' : 'circle'),
            },
            hovertemplate: '%{text}<br>Class of %{x}<br>%{y:$,.0f}<extra></extra>',
          };
        });
      } else {
        traces = [{
          type: 'scatter',
          mode: 'lines+markers',
          name: 'Median salary',
          x: rows.map(r => r.grad_year),
          y: rows.map(r => r.median_salary),
          text: rows.map(r => r.partial_horizon ? '2025 early earnings' : 'Median salary'),
          line: { color: COLORS[0], width: 4 },
          marker: {
            size: rows.map(r => r.partial_horizon ? 13 : 9),
            color: rows.map(r => r.partial_horizon ? COLORS[2] : COLORS[0]),
            symbol: rows.map(r => r.partial_horizon ? 'diamond' : 'circle'),
          },
          hovertemplate: '%{text}<br>Class of %{x}<br>%{y:$,.0f}<extra></extra>',
        }];
      }
      Plotly.newPlot(id, traces, {
        ...layoutBase,
        yaxis: { tickprefix: '$', tickformat: ',', automargin: true },
        xaxis: { title: 'Graduation year', automargin: true },
        legend: { orientation: 'h', y: 1.12 },
      }, plotConfig);
    }

        return [

    function horizontalLayout(rows, prefix = '', options = {}) {
      const rowCount = Math.max(1, (rows || []).length);
      const longest = Math.max(12, ...(rows || []).map(r => labelText(r).length));
      const narrow = compactWindow();
      const leftMargin = narrow
        ? Math.min(230, Math.max(112, longest * 4.8))
        : Math.min(360, Math.max(148, longest * 7));
      const rightMargin = narrow ? 42 : 96;
      const dynamicHeight = Math.max(narrow ? 360 : 330, Math.min(760, 142 + rowCount * (narrow ? 42 : 34)));
      return {
        ...layoutBase,
        height: options.height || dynamicHeight,
        margin: { l: leftMargin, r: rightMargin, t: 14, b: 52 },
        xaxis: { tickprefix: prefix === '$' ? '$' : '', ticksuffix: prefix === '%' ? '%' : '', automargin: true, rangemode: 'tozero' },
        yaxis: { automargin: true, tickfont: { size: narrow ? 12 : 13 } },
      };
    }

    function noData(id) {
      $(id).innerHTML = '<div class="empty">No data for the current filters. Try a broader major, school set, year range, or horizon.</div>';
    }

    function table(headers, rows, mapper) {
      if (!rows.length) return '<div class="empty">No rows for the current filters.</div>';
      const head = headers.map(h => `<th>${escapeHtml(h)}</th>`).join('');
      const body = rows.map(row => `<tr>${mapper(row).map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('');
      return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function shortSchool(name) {
      return String(name || '')
        .replace('University of California-', 'UC ')
        .replace('Columbia University in the City of New York', 'Columbia')
        .replace('University of Michigan-Ann Arbor', 'Michigan')
        .replace('Massachusetts Institute of Technology', 'MIT')
        .replace('Georgia Institute of Technology-Main Campus', 'Georgia Tech')
        .replace('University of California-Los Angeles', 'UCLA')
        .replace('University of Washington-Seattle Campus', 'Washington')
        .replace('University of Virginia-Main Campus', 'Virginia')
        .replace('University of North Carolina at Chapel Hill', 'UNC Chapel Hill');
    }

    function titleCase(value) {
      return String(value || '').replace(/\w\S*/g, word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase());
    }

    function bindEvents() {
      $('connect-btn').addEventListener('click', () => connect());
      $('advanced-btn').addEventListener('click', () => {
        setAdvancedOpen(!$('advanced-panel').classList.contains('open'));
      });
      $('tabs').addEventListener('click', event => {
        const tab = event.target.closest('.tab');
        if (!tab) return;
        state.tab = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(node => node.classList.toggle('active', node === tab));
        applyDefaultViewForTab(state.tab);
        syncViewToggle();
        render();
      });

      $('view-toggle').addEventListener('click', event => {
        const button = event.target.closest('[data-view-mode]');
        if (!button) return;
        state.viewMode = button.dataset.viewMode;
        storage.setItem('outcomes.viewMode', state.viewMode);
        syncViewToggle();
        render();
      });

      $('selection-toggle').addEventListener('click', event => {
        const button = event.target.closest('[data-selection-mode]');
        if (!button) return;
        state.selectionMode = button.dataset.selectionMode;
        storage.setItem('outcomes.selectionMode', state.selectionMode);
        const hasComparisonSchools = selectedValues($('compare-school-select')).length > 0;
        setAdvancedOpen(state.selectionMode === 'compare' && !hasComparisonSchools);
        syncSelectionMode();
        if (state.selectionMode === 'compare' && !hasComparisonSchools) {
          render();
          return;
        }
        refresh({ resetDrill: true });
      });

      $('horizon-toggle').addEventListener('click', event => {
        const button = event.target.closest('[data-horizon]');
        if (!button) return;
        $('horizon-select').value = button.dataset.horizon;
        syncHorizonToggle();
        refresh({ resetDrill: true });
      });

      ['school-select', 'compare-school-select', 'degree-select', 'cip-level-select'].forEach(id => {
        $(id).addEventListener('change', () => {
          if (id === 'compare-school-select') {
            storage.setItem('outcomes.compareSchools', JSON.stringify(selectedValues($('compare-school-select'))));
            if (state.selectionMode === 'compare' && selectedValues($('compare-school-select')).length) {
              setAdvancedOpen(false);
            }
          }
          refresh({ reloadOptions: true, resetDrill: true });
        });
      });
      ['horizon-select', 'from-year-select', 'to-year-select', 'major-select', 'gender-select', 'race-select', 'later-degree-filter', 'no-further-select', 'current-select', 'school-employer-select', 'top-n-select'].forEach(id => {
        $(id).addEventListener('change', () => {
          if (id === 'horizon-select') syncHorizonToggle();
          if (id === 'later-degree-filter' && $('later-degree-filter').value) $('no-further-select').value = 'false';
          if (id === 'no-further-select' && $('no-further-select').value === 'true') $('later-degree-filter').value = '';
          refresh({ resetDrill: true });
        });
      });
    }

    function applyDefaultViewForTab(tab) {
      const overTimeTabs = new Set(['overview', 'earnings', 'geography', 'demographics']);
      const nextMode = overTimeTabs.has(tab) ? 'overtime' : 'snapshot';
      if (state.viewMode !== nextMode) {
        state.viewMode = nextMode;
        storage.setItem('outcomes.viewMode', state.viewMode);
      }
    }

    function syncViewToggle() {
      document.querySelectorAll('[data-view-mode]').forEach(button => {
        button.classList.toggle('active', button.dataset.viewMode === state.viewMode);
      });
    }

    function syncSelectionMode() {
      document.body.classList.toggle('compare-mode', state.selectionMode === 'compare');
      document.querySelectorAll('[data-selection-mode]').forEach(button => {
        button.classList.toggle('active', button.dataset.selectionMode === state.selectionMode);
      });
    }

    function syncHorizonToggle() {
      const horizon = $('horizon-select').value || '1yr';
      document.querySelectorAll('[data-horizon]').forEach(button => {
        button.classList.toggle('active', button.dataset.horizon === horizon);
      });
    }

    function init() {
      const configuredApiUrl = normalizeApiUrl(defaultApiUrl());
      const savedApiUrl = normalizeApiUrl(storage.getItem('outcomes.apiUrl'));
      $('api-url').value = configuredApiUrl || savedApiUrl;
      $('api-password').value = storage.getItem('outcomes.apiPassword') || '';
      applyDefaultViewForTab(state.tab);
      syncViewToggle();
      syncSelectionMode();
      setAdvancedOpen(state.selectionMode === 'compare' && !selectedValues($('compare-school-select')).length);
      syncHorizonToggle();
      bindEvents();
      if ($('api-url').value) connect();
    }

    init();
  </script>
</body>
</html>
