          x: years,
          y: years.map(year => byYear.get(year)?.share_pct || 0),
          marker: { color: COLORS[i % COLORS.length] },
          customdata: years.map(year => {
            const row = byYear.get(year) || {};
            return [label, row.n || 0, row.weighted_mean_salary || null];
          }),
          hovertemplate: '%{customdata[0]}<br>Class of %{x}<br>%{y:.1f}%<extra></extra>',
        };
      });
      Plotly.newPlot(id, traces, {
        ...layoutBase,
        height,
        barmode: 'stack',
        margin: { ...layoutBase.margin, l: 70, r: 24, t: 18, b: 58 },
        yaxis: { title: yTitle, range: [0, 100], ticksuffix: '%', automargin: true },
        xaxis: { title: 'Graduation year', automargin: true, dtick: 5 },
        legend: { orientation: 'h', y: 1.14 },
        uniformtext: { mode: 'hide', minsize: 10 },
      }, plotConfig);
    }

    function drawPostgradFlows(id) {
      const rows = (state.data.postgrad?.flows || []).filter(r => r.degree_type).slice(0, topNFor(id)).reverse();
      if (!rows.length) return noData(id);
      Plotly.newPlot(id, [{
        type: 'bar',
        orientation: 'h',
        y: wrappedLabels(rows, 'degree_type'),
        x: rows.map(r => r.share_pct),
        text: rows.map(r => `${pct(r.share_pct)}`),
        textposition: 'outside',
        cliponaxis: false,
        customdata: rows.map(r => r.degree_type),
        marker: { color: rows.map(r => r.degree_type === 'No further education' ? '#94a3b8' : COLORS[0]) },
        hovertemplate: '%{customdata}<br>%{x:.1f}%<extra></extra>',
      }], horizontalBarLayout(id, rows, '%'), plotConfig).then(plot => {
        plot.on('plotly_click', event => {
          const point = event.points?.[0];
          const label = point?.customdata || point?.y;
          if (!label || label === 'No further education') return;
          state.selectedPostgradDegree = label;
          state.selectedPostgradSchool = null;
          state.selectedPostgradProgram = null;
          refresh();
        });
      });
    }

    function drawSimpleBars(id, rows, metric = 'n', color = COLORS[0], options = {}) {
      if (!rows.length) return noData(id);
      const cleanRows = rows.filter(r => r.label).slice(0, topNFor(id));
      const displayLabels = cleanRows.map(row => options.labelTransform ? options.labelTransform(row.label) : row.label);
      const rawValues = cleanRows.map(r => Number(r[metric] || 0));
      const xValues = options.compressed
        ? rawValues.map(value => Math.sqrt(Math.max(0, value)))
        : rawValues;
      const layout = horizontalBarLayout(id, cleanRows, '', options.layoutOptions || {});
      const xaxis = options.compressed
        ? { ...layout.xaxis, showticklabels: false, showgrid: false, title: '', zeroline: false }
        : layout.xaxis;
      Plotly.newPlot(id, [{
        type: 'bar',
        orientation: 'h',
        y: displayLabels.map(label => options.noWrap ? escapeHtml(label) : wrapAxisLabel(label, options.maxLabelChars)),
        x: xValues,
        text: rawValues.map(value => num(value)),
        textposition: 'outside',
        cliponaxis: false,
        customdata: cleanRows.map((r, index) => [r.label, rawValues[index]]),
        marker: {
          color: options.activeLabel
            ? cleanRows.map(row => row.label === options.activeLabel ? '#f97316' : color)
            : color,
        },
        hovertemplate: '%{customdata[0]}<br>%{customdata[1]:,.0f}<extra></extra>',
      }], { ...layout, xaxis }, plotConfig).then(plot => {
        if (!options.onClick) return;
        plot.on('plotly_click', event => {
          const label = event.points?.[0]?.customdata?.[0] || event.points?.[0]?.y;
          if (label) options.onClick(label);
        });
      });
    }

    function horizontalBarLayout(id, rows, prefix = '', options = {}) {
      return horizontalLayout(rows, prefix, { ...options, tall: options.tall ?? chartIsTall(id) });
    }

    function horizontalLayout(rows, prefix = '', options = {}) {
      const rowCount = Math.max(1, (rows || []).length);
      const longest = Math.max(12, ...(rows || []).map(r => labelText(r).length));
      const narrow = compactWindow();
      const leftMargin = options.leftMargin ?? (narrow
        ? Math.min(230, Math.max(112, longest * 4.8))
        : Math.min(360, Math.max(148, longest * 7)));
      const rightMargin = options.rightMargin ?? (narrow ? 42 : 96);
      const minHeight = options.tall ? (narrow ? 430 : 410) : (narrow ? 360 : 330);
      const dynamicHeight = Math.max(minHeight, Math.min(760, 142 + rowCount * (narrow ? 42 : 34)));
      return {
        ...layoutBase,
        height: options.height || dynamicHeight,
        margin: { l: leftMargin, r: rightMargin, t: 14, b: 52 },
        xaxis: { tickprefix: prefix === '$' ? '$' : '', ticksuffix: prefix === '%' ? '%' : '', automargin: true, rangemode: 'tozero' },
        yaxis: { automargin: options.yAutoMargin ?? true, tickfont: { size: narrow ? 12 : 13 } },
      };
    }

    function noData(id) {
      $(id).innerHTML = '<div class="empty">No data for the current filters. Try a broader major, school set, year range, or horizon.</div>';
    }

    function table(headers, rows, mapper) {
      if (!rows.length) return '<div class="empty">No rows for the current filters.</div>';
      const head = headers.map(h => `<th>${escapeHtml(h)}</th>`).join('');
      const body = rows.map(row => `<tr>${mapper(row).map(cell => `<td>${escapeHtml(cell)}</td>`).join('')}</tr>`).join('');
      return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    function shortSchool(name) {
      return String(name || '')
        .replace('University of California-', 'UC ')
        .replace('Columbia University in the City of New York', 'Columbia')
        .replace('University of Michigan-Ann Arbor', 'Michigan')
        .replace('Massachusetts Institute of Technology', 'MIT')
        .replace('Georgia Institute of Technology-Main Campus', 'Georgia Tech')
        .replace('University of California-Los Angeles', 'UCLA')
        .replace('University of Washington-Seattle Campus', 'Washington')
        .replace('University of Virginia-Main Campus', 'Virginia')
        .replace('University of North Carolina at Chapel Hill', 'UNC Chapel Hill');
    }

    function shortPostgradSchool(name) {
      return legendLabel(shortSchool(name)
        .replace('Columbia University in the City of New York', 'Columbia')
        .replace('Teachers College at Columbia University', 'Teachers College')
        .replace('University of Pennsylvania', 'Penn')
        .replace('Johns Hopkins University', 'Johns Hopkins')
        .replace('New York University', 'NYU')
        .replace('University of Southern California', 'USC')
        .replace('University of California-San Francisco', 'UCSF')
        .replace('University of California-Berkeley', 'UC Berkeley')
        .replace('University of California-Los Angeles', 'UCLA'), 28);
    }

    function shortPostgradProgram(name) {
      return legendLabel(String(name || '')
        .replace('Registered Nursing/Registered Nurse', 'Registered Nursing')
        .replace('Business Administration and Management, General', 'Business Admin.')
        .replace('International Relations and Affairs', "Int'l Relations")
        .replace('Electrical and Electronics Engineering', 'Electrical Eng.')
        .replace('Public Health, General', 'Public Health')
        .replace('Economics, General', 'Economics')
        .replace('English Language and Literature, General', 'English Lit.')
        .replace('Political Science and Government, General', 'Political Science')
        .replace(', General', ''), 28);
    }

    function shortLocationLabel(value) {
      return legendLabel(titleCase(value)
        .replace(/\s+Metropolitan Area\b/g, '')
        .replace(/\s+\(United States\)$/g, '')
        .replace(/\s+\(United Kingdom\)$/g, '')
        .replace(/\s+\(Canada\)$/g, '')
        .replace(/\s+\(France\)$/g, '')
        .replace(/\s+\(Germany\)$/g, '')
        .replace('New York City', 'New York')
        .replace('Washington, D.c.', 'Washington DC'), 24);
    }

    function setHiddenSelectValue(selectId, value, selected) {
      const select = $(selectId);
      const optionNode = Array.from(select.options).find(opt => String(opt.value) === String(value));
      if (optionNode) optionNode.selected = selected;
    }

    function refreshCompareSchoolPicker() {
      const primary = String($('school-select')?.value || '');
      const values = trimCompareSchools(selectedValues($('compare-school-select')), primary);
      Array.from($('compare-school-select').options).forEach(opt => {
        opt.selected = values.includes(String(opt.value));
      });
      storage.setItem('outcomes.compareSchools', JSON.stringify(values));
      renderCompareSchoolPicker(state.options?.schools || [], new Set(values));
      setAdvancedOpen(true);
      scheduleCompareSchoolWarmup();
    }

    function refreshCompareMajorPicker() {
      const values = selectedValues($('compare-major-select')).map(String);
      storage.setItem('outcomes.compareMajors', JSON.stringify(values));
      renderCompareMajorPicker(state.options?.major_options || [], new Set(values));
      setAdvancedOpen(true);
    }

    function titleCase(value) {
      return String(value || '')
        .replace(/\w\S*/g, word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
        .replace(/\bNon-metro\b/g, 'Non-Metro');
    }

    function bindEvents() {
      $('connect-btn').addEventListener('click', () => connect());
      $('auth-connect-btn').addEventListener('click', () => connect({ fromAuth: true }));
      ['auth-api-url', 'auth-api-password'].forEach(id => {
        $(id).addEventListener('keydown', event => {
          if (event.key === 'Enter') connect({ fromAuth: true });
        });
      });
      $('advanced-btn').addEventListener('click', () => {
        setAdvancedOpen(!$('advanced-panel').classList.contains('open'));
      });
      $('advanced-apply-btn').addEventListener('click', () => applyAdvancedOptions());
      $('download-visible-btn').addEventListener('click', () => downloadVisibleCharts());
      $('print-page-btn').addEventListener('click', () => window.print());
      $('tabs').addEventListener('click', event => {
        const tab = event.target.closest('.tab');
        if (!tab) return;
        state.tab = tab.dataset.tab;
        document.querySelectorAll('.tab').forEach(node => node.classList.toggle('active', node === tab));
        applyDefaultViewForTab(state.tab);
        syncViewToggle();
        if (state.selectionMode === 'compare' || state.selectionMode === 'major_compare') {
          refresh({ resetDrill: true });
          return;
        }
        render();
      });

      $('view-toggle').addEventListener('click', event => {
        const button = event.target.closest('[data-view-mode]');
        if (!button) return;
        state.viewMode = button.dataset.viewMode;
        storage.setItem('outcomes.viewMode', state.viewMode);
        syncViewToggle();
        if (state.selectionMode === 'compare' || state.selectionMode === 'major_compare') {
          refresh({ resetDrill: true });
          return;
        }
        render();
      });

      $('selection-toggle').addEventListener('click', event => {
        const button = event.target.closest('[data-selection-mode]');
        if (!button) return;
        syncSelectionMode(button.dataset.selectionMode);
        setAdvancedOpen(true);
      });

      $('horizon-toggle').addEventListener('click', event => {
        const button = event.target.closest('[data-horizon]');
        if (!button) return;
        $('horizon-select').value = button.dataset.horizon;
        state.appliedAdvanced = { ...activeAdvancedControls(), horizon: button.dataset.horizon };
        syncHorizonToggle();
        refresh({ resetDrill: true });
      });

      ['school-select', 'degree-select'].forEach(id => {
        $(id).addEventListener('change', () => {
          refresh({ reloadOptions: true, resetDrill: true });
        });
      });
      $('major-select').addEventListener('change', () => refresh({ resetDrill: true }));
      ['compare-school-select', 'compare-major-select', 'cip-level-select'].forEach(id => {
        $(id).addEventListener('change', () => {
          if (id === 'compare-school-select') {
            refreshCompareSchoolPicker();
          }
          if (id === 'compare-major-select') {
            refreshCompareMajorPicker();
          }
          setAdvancedOpen(true);
        });
      });
      $('compare-school-picker').addEventListener('click', event => {
        const add = event.target.closest('[data-add-compare-school]');
        const remove = event.target.closest('[data-remove-compare-school]');
        const clear = event.target.closest('[data-clear-compare-schools]');
        if (!add && !remove && !clear) return;
        event.preventDefault();
        if (clear) {
          Array.from($('compare-school-select').options).forEach(opt => { opt.selected = false; });
        } else {
          const value = add?.dataset.addCompareSchool || remove?.dataset.removeCompareSchool;
          setHiddenSelectValue('compare-school-select', value, Boolean(add));
        }
        refreshCompareSchoolPicker();
      });
      $('compare-major-picker').addEventListener('click', event => {
        const add = event.target.closest('[data-add-compare-major]');
        const remove = event.target.closest('[data-remove-compare-major]');
        const clear = event.target.closest('[data-clear-compare-majors]');
        if (!add && !remove && !clear) return;
        event.preventDefault();
        if (clear) {
          Array.from($('compare-major-select').options).forEach(opt => { opt.selected = false; });
        } else {
          const value = add?.dataset.addCompareMajor || remove?.dataset.removeCompareMajor;
          setHiddenSelectValue('compare-major-select', value, Boolean(add));
        }
        refreshCompareMajorPicker();
      });
      ['horizon-select', 'from-year-select', 'to-year-select', 'gender-select', 'race-select', 'later-degree-filter', 'no-further-select', 'current-select', 'school-employer-select'].forEach(id => {
        $(id).addEventListener('change', () => {
          if (id === 'later-degree-filter' && $('later-degree-filter').value) $('no-further-select').value = 'false';
          if (id === 'no-further-select' && $('no-further-select').value === 'true') $('later-degree-filter').value = '';
          setAdvancedOpen(true);
        });
      });
      $('content').addEventListener('change', event => {
        const select = event.target.closest('[data-top-n-control]');
        if (!select) return;
        const value = validTopN(select.value);
        if (!value) return;
        const chartId = select.dataset.chartId || chartIdFromTopControl(select.id);
        state.topNByChart = { ...(state.topNByChart || {}), [chartId]: value };
        storage.setItem('outcomes.topNByChart', JSON.stringify(state.topNByChart));
        refresh();
      });
      $('content').addEventListener('click', event => {
        const button = event.target.closest('[data-download-chart]');
        if (!button || button.hidden) return;
        event.preventDefault();
        downloadChart(button.dataset.downloadChart);
      });
      $('export-tray').addEventListener('click', event => {
        const close = event.target.closest('.export-tray-close');
        if (!close) return;
        $('export-tray').hidden = true;
      });
    }

    function applyDefaultViewForTab(tab) {
      const overTimeTabs = new Set(['overview', 'earnings', 'geography', 'demographics']);
      const nextMode = overTimeTabs.has(tab) ? 'overtime' : 'snapshot';
      if (state.viewMode !== nextMode) {
        state.viewMode = nextMode;
        storage.setItem('outcomes.viewMode', state.viewMode);
      }
    }

    function syncViewToggle() {
      document.querySelectorAll('[data-view-mode]').forEach(button => {
        button.classList.toggle('active', button.dataset.viewMode === state.viewMode);
      });
    }

    function syncSelectionMode(mode = state.selectionMode) {
      const selectedMode = mode || 'single';
      document.body.classList.toggle('school-compare-mode', selectedMode === 'compare');
      document.body.classList.toggle('major-compare-mode', selectedMode === 'major_compare');
      document.querySelectorAll('[data-selection-mode]').forEach(button => {
        button.classList.toggle('active', button.dataset.selectionMode === selectedMode);
      });
    }

    function syncHorizonToggle() {
      const horizon = $('horizon-select').value || '1yr';
      document.querySelectorAll('[data-horizon]').forEach(button => {
        button.classList.toggle('active', button.dataset.horizon === horizon);
      });
    }

    function init() {
      const configuredApiUrl = normalizeApiUrl(defaultApiUrl());
      const savedApiUrl = normalizeApiUrl(storage.getItem('outcomes.apiUrl'));
      const savedTopN = Number(storage.getItem('outcomes.topN'));
      $('api-url').value = configuredApiUrl || savedApiUrl;
      $('api-password').value = storage.getItem('outcomes.apiPassword') || '';
      syncAuthFieldsFromControls();
      if (TOP_N_OPTIONS.includes(savedTopN)) $('top-n-select').value = String(savedTopN);
      state.topNByChart = loadStoredTopNByChart();
      applyDefaultViewForTab(state.tab);
      syncViewToggle();
      syncSelectionMode();
      setAdvancedOpen(state.selectionMode === 'compare' || state.selectionMode === 'major_compare');
      syncHorizonToggle();
      bindEvents();
      showAuthModal($('api-password').value ? 'Connecting with saved credentials...' : '');
      if ($('api-url').value && $('api-password').value) connect();
      else setMessage('Enter the protected API URL and password to connect.');
    }

    init();
  </script>
</body>
</html>
