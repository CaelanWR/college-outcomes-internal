<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>College Outcomes Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.plot.ly" />
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    :root {
      --ink: #243b53;
      --muted: #6b7c93;
      --line: #dde6ef;
      --panel: #ffffff;
      --panel-soft: #f7fafc;
      --bg: #f3f7fb;
      --blue: #2f80ed;
      --blue-2: #2e74d7;
      --green: #2bb673;
      --gold: #f4b740;
      --rose: #e55b7a;
      --violet: #8b6fd6;
      --tm-ink: #2D426A;
      --tm-muted: #899499;
      --tm-line: #E6EBF2;
      --tm-low: #D9ECFB;
      --tm-mid: #48AFF4;
      --tm-high: #2D426A;
      --tm-gray: #B9C4D3;
      --tm-shadow: 0 8px 24px rgba(45, 66, 106, 0.08);
      --shadow: 0 10px 30px rgba(36, 59, 83, 0.08);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      font-size: 86%;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: 'Source Sans 3', ui-sans-serif, system-ui, sans-serif;
      background: radial-gradient(circle at top left, rgba(46,116,215,0.08), transparent 28%),
        radial-gradient(circle at top right, rgba(33,166,117,0.08), transparent 24%),
        linear-gradient(180deg, #f4f8fb 0%, #edf3f8 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }

    header {
      padding: 0 22px 16px;
      border-bottom: 1px solid rgba(22,50,74,0.08);
      background: rgba(255,255,255,0.86);
      backdrop-filter: blur(18px);
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 12px 32px rgba(20,44,65,0.08);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 0 -22px 14px;
      padding: 22px 22px 20px;
      color: white;
      background:
        radial-gradient(circle at 82% 18%, rgba(122, 195, 230, 0.28), transparent 26%),
        linear-gradient(135deg, #112f47 0%, #245a7c 56%, #346f9a 100%);
      box-shadow: inset 0 -1px 0 rgba(255,255,255,0.16);
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 2.2vw, 36px);
      letter-spacing: -0.02em;
      line-height: 1;
      font-weight: 900;
    }

    .status {
      display: flex;
      gap: 10px;
      align-items: center;
      color: rgba(255,255,255,0.82);
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #b8c6d6;
      box-shadow: 0 0 0 5px rgba(184, 198, 214, 0.18);
    }

    .dot.ok { background: var(--green); box-shadow: 0 0 0 5px rgba(34, 160, 107, 0.16); }
    .dot.bad { background: var(--rose); box-shadow: 0 0 0 5px rgba(223, 77, 95, 0.16); }

    .connection, .filters {
      display: grid;
      grid-template-columns: minmax(300px, 1.1fr) minmax(220px, 0.8fr) auto;
      gap: 10px 12px;
      align-items: end;
    }

    .connection.connected {
      display: none;
    }

    .filters {
      grid-template-columns: minmax(310px, 1.5fr) minmax(180px, 0.72fr) max-content minmax(320px, 1.25fr) max-content auto;
      margin-top: 0;
      align-items: end;
      padding: 0 2px;
    }

    .advanced {
      display: none;
      grid-template-columns: minmax(240px, 1.4fr) repeat(7, minmax(130px, 1fr));
      gap: 12px 18px;
      margin-top: 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel-soft);
    }

    .advanced.open { display: grid; }

    .segmented {
      display: inline-flex;
      gap: 6px;
      flex-wrap: nowrap;
      padding: 2px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(245,248,252,0.96);
      min-height: 40px;
      align-items: center;
    }

    .segmented .btn {
      min-height: 34px;
      border-radius: 999px;
      padding: 6px 12px;
      border-color: transparent;
      background: transparent;
      box-shadow: none;
    }

    .segmented .btn.active {
      background: linear-gradient(135deg, #16324a 0%, #2e74d7 100%);
      color: #fff;
      box-shadow: 0 8px 18px rgba(22,50,74,0.16);
    }

    .refresh-state {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 40;
      display: none;
      padding: 10px 14px;
      border-radius: 999px;
      background: #16324a;
      color: #fff;
      font-weight: 900;
      box-shadow: 0 12px 28px rgba(20,44,65,0.18);
    }

    .refresh-state.is-visible { display: block; }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .control-field {
      display: grid;
      gap: 6px;
      align-content: end;
    }

    .control-label {
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    input, select, button {
      font: inherit;
    }

    input, select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(245,248,252,0.96);
      color: var(--ink);
      padding: 8px 12px;
      outline: none;
      font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
    }

    select[multiple] {
      min-height: 72px;
      padding: 6px 10px;
    }

    input:focus, select:focus {
      border-color: rgba(39,76,119,0.28);
      box-shadow: 0 8px 18px rgba(20,44,65,0.08), inset 0 1px 0 rgba(255,255,255,0.92);
    }

    .btn {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 12px;
      color: var(--ink);
      background: rgba(245,248,252,0.96);
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
      white-space: nowrap;
    }

    .btn:hover, select:hover, input:hover {
      border-color: rgba(39,76,119,0.24);
      box-shadow: 0 8px 18px rgba(20,44,65,0.08), inset 0 1px 0 rgba(255,255,255,0.92);
    }

    .btn.secondary {
      background: rgba(255,255,255,0.9);
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .btn.active, #connect-btn {
      background: linear-gradient(135deg, #16324a 0%, #2e74d7 100%);
      color: white;
      border-color: transparent;
      box-shadow: 0 10px 20px rgba(22,50,74,0.16);
    }

    .tabs {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      width: min(1680px, calc(100vw - 44px));
      margin: 14px auto 10px;
      padding: 2px 2px 8px;
      overflow-x: auto;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      flex: 0 0 auto;
      border: 1px solid transparent;
      background: rgba(255,255,255,0.78);
      border-radius: 999px;
      padding: 11px 18px;
      color: var(--muted);
      font-weight: 900;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
    }

    .tab.active {
      color: white;
      border-color: transparent;
      background: linear-gradient(135deg, #16324a 0%, #2e74d7 100%);
      box-shadow: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: clamp(14px, 1.25vw, 22px);
    }

    .card, .metric {
      background: linear-gradient(180deg, rgba(255,255,255,0.99), rgba(248,251,253,0.96));
      border: 1px solid rgba(22,50,74,0.08);
      border-radius: var(--radius);
      box-shadow: 0 16px 34px rgba(20,44,65,0.07);
    }

    .metric {
      padding: 18px;
      min-height: 94px;
      display: grid;
      align-content: center;
      gap: 4px;
    }

    .metric strong {
      display: block;
      font-size: clamp(1.45rem, 2.6vw, 2rem);
      letter-spacing: -0.03em;
      line-height: 1;
      font-weight: 900;
    }

    .metric span {
      color: #6a7b91;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card {
      padding: 22px;
      min-height: 340px;
      overflow: hidden;
      margin-bottom: 0;
    }

    .card.compact { min-height: 260px; }
    .treemap-card {
      padding: 0;
      overflow: hidden;
      min-width: 0;
      border-color: var(--tm-line);
      box-shadow: var(--tm-shadow);
    }
    .treemap-card .card-head {
      padding: 18px 20px 8px;
      min-width: 0;
    }
    .treemap-card .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }
    .treemap-card .card-top > div:first-child {
      min-width: 0;
    }
    .treemap-card .card-head h3 {
      margin: 0 0 5px;
      font-size: 22px;
      font-weight: 800;
      color: var(--tm-ink);
    }
    .treemap-card .card-head p {
      margin: 0;
      font-size: 14px;
      color: var(--tm-muted);
      line-height: 1.35;
      font-weight: 700;
    }
    .treemap-card .card-back {
      border: 1px solid var(--tm-line);
      background: white;
      color: var(--tm-ink);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      white-space: nowrap;
    }
    .treemap-card .card-back.is-hidden {
      display: none;
    }
    .treemap-body {
      padding: 0 18px 18px;
      min-width: 0;
      overflow: hidden;
    }
    .treemap-plot {
      width: 100%;
      min-width: 0;
      height: clamp(380px, 48vh, 540px);
      overflow: hidden;
    }
    .legend-wrap {
      margin: 6px 6px 0;
      display: grid;
      gap: 8px;
    }
    .legend-wrap.is-hidden { display: none; }
    .legend-bar {
      height: 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--tm-low) 0%, var(--tm-mid) 50%, var(--tm-high) 100%);
      border: 1px solid var(--tm-line);
    }
    .legend-scale {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--tm-muted);
      font-weight: 800;
    }
    .legend-caption {
      font-size: 12px;
      color: var(--tm-muted);
      line-height: 1.35;
      font-weight: 700;
    }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
    .span-5 { grid-column: span 5; }
    .span-6 { grid-column: span 6; }
    .span-7 { grid-column: span 7; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }

    h2, h3 {
      margin: 0 0 12px;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    h2 { font-size: clamp(26px, 3vw, 42px); }
    h3 { font-size: 1.08rem; }

    .subtle {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.45;
    }

    .chart {
      width: 100%;
      min-height: 318px;
    }

    .chart.tall { min-height: 430px; }

    .salary-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 2px 0 12px;
    }

    .salary-stat {
      border: 1px solid rgba(22,50,74,0.08);
      border-radius: 16px;
      padding: 12px 14px;
      background: rgba(245,249,253,0.78);
    }

    .salary-stat strong {
      display: block;
      font-size: clamp(1.1rem, 1.7vw, 1.45rem);
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .salary-stat span {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .distribution-curve {
      min-height: 300px;
    }

    .postgrad-detail-stack {
      display: grid;
      gap: 18px;
    }

    .postgrad-detail-panel {
      min-width: 0;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(22,50,74,0.08);
    }

    .postgrad-detail-panel:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .postgrad-detail-panel .chart {
      min-height: 270px;
    }

    .drill-toolbar {
      display: flex;
      justify-content: flex-end;
      margin: -4px 0 4px;
    }

    .drill-toolbar .btn {
      min-height: 30px;
      padding: 5px 10px;
      font-size: 0.86rem;
    }

    .chart .svg-container,
    .treemap-plot .plot-container,
    .treemap-plot .svg-container,
    .treemap-plot .main-svg {
      width: 100% !important;
      max-width: 100% !important;
    }

    .table-wrap {
      overflow: auto;
      border-radius: 18px;
      border: 1px solid rgba(22,50,74,0.06);
      background: rgba(255,255,255,0.72);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }

    th, td {
      text-align: left;
      padding: 11px 12px;
      border-bottom: 1px solid rgba(22,50,74,0.08);
      vertical-align: top;
    }

    th {
      color: #61738a;
      font-size: 0.74rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(245,248,252,0.92);
      position: sticky;
      top: 0;
    }

    td {
      font-weight: 600;
    }

    .empty, .error {
      padding: 42px 18px;
      text-align: center;
      border-radius: 18px;
      background: rgba(245,248,252,0.72);
      border: 1px dashed rgba(22,50,74,0.12);
      color: var(--muted);
      font-weight: 700;
    }

    .error {
      color: #9d2433;
      border-color: rgba(223, 77, 95, 0.32);
      background: rgba(255, 245, 247, 0.86);
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #12344a 0%, #1e5677 58%, #3a7ca5 100%);
      color: white;
      padding: 44px 28px 30px;
      border-bottom: 1px solid rgba(255,255,255,0.14);
    }

    .hero h1 {
      position: relative;
      z-index: 1;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.03em;
      margin: 0;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(255,255,255,0.22), transparent 32%),
        radial-gradient(circle at bottom left, rgba(255,255,255,0.12), transparent 26%);
      pointer-events: none;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 22px;
      background: rgba(255,255,255,0.86);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(22,50,74,0.08);
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 12px 32px rgba(20,44,65,0.08);
      align-items: flex-start;
    }

    .controls-main {
      display: grid;
      grid-template-columns: minmax(300px, 1.45fr) minmax(170px, 0.7fr) max-content minmax(280px, 1.15fr) max-content max-content;
      gap: 14px 16px;
      width: 100%;
      align-items: end;
    }

    .control {
      display: flex;
      min-width: 0;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .control label,
    .control-label {
      min-height: 16px;
      line-height: 1;
      font-size: 0.76rem;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .control-grow { flex: 1 1 320px; min-width: 280px; }
    .control-major { min-width: 280px; }
    .control-degree { min-width: 180px; }
    .control-mode .btn { white-space: nowrap; }
    .control > select { width: 100%; }
    .control > .segmented { width: auto; }
    .control-years .segmented, .control-view .segmented { flex-wrap: nowrap; }
    .control-years .btn, .control-view .btn { white-space: nowrap; }

    .advanced-toggle { margin-left: auto; }
    .advanced-panel {
      display: none;
      width: 100%;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel-soft);
    }
    .advanced-panel.is-open,
    .advanced-panel.open { display: block; }
    .advanced-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      align-items: flex-start;
    }
    .advanced-grid .control { min-width: 160px; }
    .advanced-grid .control-wide { min-width: 260px; flex: 1 1 280px; }
    .advanced-actions {
      flex: 1 1 100%;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 4px;
    }
    .compare-only { display: none; }
    body.school-compare-mode .school-compare-only,
    body.major-compare-mode .major-compare-only { display: flex; }

    .content {
      width: auto;
      max-width: 1680px;
      margin: 0 auto;
      padding: 18px 22px 44px;
    }

    .api-connection.connected { display: none; }

    .auth-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(8, 24, 38, 0.68);
      backdrop-filter: blur(16px);
    }

    .auth-modal.open { display: grid; }

    .auth-card {
      width: min(560px, calc(100vw - 32px));
      border: 1px solid rgba(255,255,255,0.28);
      border-radius: 28px;
      background: linear-gradient(180deg, #ffffff, #f4f8fc);
      box-shadow: 0 30px 80px rgba(8,24,38,0.28);
      padding: clamp(24px, 3vw, 34px);
    }

    .auth-card h2 {
      margin-bottom: 8px;
      font-size: clamp(1.7rem, 3vw, 2.35rem);
      letter-spacing: -0.04em;
    }

    .auth-card p {
      margin: 0 0 20px;
      color: var(--muted);
      font-weight: 700;
      line-height: 1.45;
    }

    .auth-notice {
      margin: 0 0 14px;
      border: 1px solid rgba(157, 36, 51, 0.20);
      border-radius: 16px;
      padding: 10px 12px;
      background: rgba(255, 245, 247, 0.92);
      color: #8d1f2e;
      font-size: 0.9rem;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .auth-fields {
      display: grid;
      gap: 14px;
    }

    .auth-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .auth-message {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(34,94,168,0.08);
      color: #24445f;
      font-weight: 800;
    }

    .auth-message.error {
      display: block;
      color: #9d2433;
      border: 1px solid rgba(223, 77, 95, 0.28);
      background: rgba(255, 245, 247, 0.92);
    }

    .auth-message.info { display: block; }

    .content .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: clamp(14px, 1.25vw, 22px);
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(247,250,252,0.94));
      border: 1px solid rgba(22,50,74,0.08);
      border-radius: 22px;
      box-shadow: 0 12px 28px rgba(20,44,65,0.06);
      padding: clamp(18px, 1.6vw, 24px);
      margin-bottom: 0;
      min-height: 0;
      transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
    }

    .card:hover,
    .metric:hover {
      border-color: rgba(34, 94, 168, 0.16);
      box-shadow: 0 18px 38px rgba(20,44,65,0.08);
    }

    .card h3 {
      margin-bottom: 12px;
      font-size: 1.08rem;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }

    .card-title-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .card-title-row h3 {
      margin-bottom: 0;
      min-width: 0;
    }

    .card-controls,
    .card-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex: 0 0 auto;
    }

    .chart-top-control {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      color: var(--muted);
      font-size: 0.78rem;

    .export-actions {

      .span-3, .span-4, .span-5, .span-6, .span-7, .span-8, .span-12 { grid-column: span 12; }

      .api-status {

        margin-top: 14px;
      }
    }
  </style>
</head>
<body>

  <script>
    const COLORS = ['#225ea8', '#22a06b', '#f97316', '#7c5fd6', '#df4d5f', '#0891b2', '#a16207', '#475569'];
    const storage = window.localStorage;
    const state = {
      apiUrl: '',
      password: '',
      options: null,
      data: null,
      tab: 'overview',
      viewMode: storage.getItem('outcomes.viewMode') || 'overtime',
      selectionMode: storage.getItem('outcomes.selectionMode') || 'single',
      selectedEmployer: null,
      selectedEmployerRole: null,
      selectedPostgradDegree: null,
      selectedPostgradSchool: null,
      selectedPostgradProgram: null,
      roleTreePath: [],
      industryTreePath: [],
      topNByChart: {},
      appliedAdvanced: null,
      loading: false,
      pendingRefresh: null,
    };

    const $ = id => document.getElementById(id);
    const fmt = new Intl.NumberFormat('en-US');
    const money = value => value === null || value === undefined ? 'No data' : `$${fmt.format(Math.round(value / 1000))}k`;
    const wholePeople = value => {
      if (value === null || value === undefined) return null;
      const n = Number(value);
      return Number.isFinite(n) ? Math.round(n) : null;
    };
    const people = value => {
      const n = wholePeople(value);
      return n === null ? 'No data' : fmt.format(n);
    };
    const num = value => {
      if (value === null || value === undefined) return 'No data';
      const n = Number(value);
      if (!Number.isFinite(n)) return 'No data';
      if (n > 0 && n < 1) return '<1';
      if (Math.abs(n) < 10 && !Number.isInteger(n)) return n.toFixed(1).replace(/\.0$/, '');
      return fmt.format(Math.round(n));
    };
    const pct = value => value === null || value === undefined ? 'No data' : `${Number(value).toFixed(1)}%`;
    const TOP_N_OPTIONS = [5, 8, 12, 16, 20, 30, 50];
    const MAX_COMPARE_SCHOOLS = 3;
    let resizeTimer = null;
    let compareWarmupTimer = null;
    const exportLinks = [];

    const layoutBase = {
      font: { family: '"Source Sans 3", ui-sans-serif, system-ui, sans-serif', color: '#243b53', size: 13 },
      paper_bgcolor: 'rgba(0,0,0,0)',
      plot_bgcolor: 'rgba(0,0,0,0)',
      margin: { l: 72, r: 28, t: 20, b: 62 },
      hoverlabel: { bgcolor: '#102a43', bordercolor: '#102a43', font: { family: '"Source Sans 3", ui-sans-serif, system-ui, sans-serif', color: '#fff', size: 13 } },
    };
    const plotConfig = { responsive: true, displayModeBar: false };

    const nativePlotlyNewPlot = Plotly.newPlot.bind(Plotly);
    Plotly.newPlot = function patchedNewPlot(id, ...args) {
      const chartId = typeof id === 'string' ? id : id?.id;
      return Promise.resolve(nativePlotlyNewPlot(id, ...args)).then(plot => {
        markChartExportable(chartId || plot?.id);
        return plot;
      });
    };

    function compactWindow() {
      return window.innerWidth < 820;
    }

    function labelText(row) {
      return String(row?.label || row?.title || row?.employer || row?.location || row?.school_name || row?.degree_type || row?.degree || row || '');
    }

    function wrapAxisLabel(value, maxChars = compactWindow() ? 20 : 28, maxLines = compactWindow() ? 3 : 2) {
      const text = String(value ?? '').trim();
      if (text.length <= maxChars) return escapeHtml(text);
      const words = text.split(/\s+/);
      const lines = [];
      let line = '';
      words.forEach(word => {
        if (!line) {
          line = word;
          return;
        }
        if ((line + ' ' + word).length <= maxChars) {
          line += ' ' + word;
        } else {
          lines.push(line);
          line = word;
        }
      });
      if (line) lines.push(line);
      const visible = lines.slice(0, maxLines);
      if (lines.length > maxLines) {
        visible[visible.length - 1] = `${visible[visible.length - 1].replace(/[,.]$/, '')}...`;
      }
      return visible.map(escapeHtml).join('<br>');
    }

    function wrappedLabels(rows, key) {
      return (rows || []).map(row => wrapAxisLabel(key ? row[key] : labelText(row)));
    }

    function queuePlotResize() {
      window.requestAnimationFrame(() => {
        document.querySelectorAll('.js-plotly-plot').forEach(plot => Plotly.Plots.resize(plot));
      });
    }

    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(queuePlotResize, 140);
    });

    function setStatus(kind, text) {
      $('status-dot').className = `dot ${kind || ''}`;
      $('status-text').textContent = text;
    }

    function setMessage(html, isError = false) {
      $('message').style.display = 'block';
      $('message').className = isError ? 'error' : 'empty';
      $('message').innerHTML = html;
      $('content').style.display = 'none';
    }

    function showContent() {
      $('message').style.display = 'none';
      $('content').style.display = 'grid';
    }

    function setAuthMessage(html = '', isError = false) {
      const node = $('auth-message');
      node.className = `auth-message ${html ? (isError ? 'error' : 'info') : ''}`;
      node.innerHTML = html;
    }

    function syncAuthFieldsFromControls() {
      $('auth-api-url').value = $('api-url').value || normalizeApiUrl(defaultApiUrl());
      $('auth-api-password').value = $('api-password').value || '';
    }

    function syncControlsFromAuthFields() {
      $('api-url').value = normalizeApiUrl($('auth-api-url').value || $('api-url').value || defaultApiUrl());
      $('api-password').value = $('auth-api-password').value || '';
    }

    function showAuthModal(message = '', isError = false) {
      syncAuthFieldsFromControls();
      setAuthMessage(message, isError);
      $('auth-modal').classList.add('open');
      window.setTimeout(() => {
        ($('auth-api-password').value ? $('auth-connect-btn') : $('auth-api-password')).focus();
      }, 0);
    }

    function hideAuthModal() {
      $('auth-modal').classList.remove('open');
      setAuthMessage('');
    }

    function normalizeApiUrl(value) {
      return String(value || '')
        .trim()
        .replace(/\/+$/, '')
        .replace(/\/api\/(health|options|dashboard)$/i, '')
        .replace(/\/+$/, '');
    }

    function defaultApiUrl() {
      if (window.OUTCOMES_API_URL) return window.OUTCOMES_API_URL;
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return 'http://localhost:8000';
      return '';
    }

    async function apiFetch(path, body) {
      if (!state.apiUrl) throw new Error('Missing API URL.');
      const headers = { 'Content-Type': 'application/json' };
      if (state.password) headers['X-Outcomes-Password'] = state.password;
      let response;
      try {
        response = await fetch(`${state.apiUrl}${path}`, {
          method: 'POST',
          headers,
          body: JSON.stringify(body || currentFilters()),
        });
      } catch (error) {
        throw new Error(`Network/CORS error reaching ${state.apiUrl}. Confirm the URL starts with https:// and Render is live.`);
      }
      if (!response.ok) {
        const text = await response.text();
        const hint = response.status === 404
          ? ' Use the base API URL only, for example https://college-outcomes-api.onrender.com, not /api/health.'
          : '';
        throw new Error(`${response.status} ${response.statusText}: ${text.slice(0, 240)}${hint}`);
      }
      return response.json();
    }

    function selectedValues(select) {
      return Array.from(select.selectedOptions || []).map(option => option.value).filter(Boolean);
    }

    function draftSelectionMode() {
      return document.querySelector('#selection-toggle [data-selection-mode].active')?.dataset.selectionMode
        || state.selectionMode
        || 'single';
    }

    function setAdvancedOpen(open) {
      $('advanced-panel').classList.toggle('open', open);
      $('advanced-btn').textContent = open ? 'Hide Advanced Options' : 'Advanced Options';
    }

    function normalizeAdvancedControls() {
      if ($('later-degree-filter')?.value) $('no-further-select').value = 'false';
      if ($('no-further-select')?.value === 'true') $('later-degree-filter').value = '';
      const from = Number($('from-year-select')?.value || 0);
      const to = Number($('to-year-select')?.value || 0);
      if (from && to && from > to) {
        $('to-year-select').value = String(from);
      }
      syncHorizonToggle();
    }

    function readAdvancedControls() {
      return {
        selectionMode: draftSelectionMode(),
        compareSchools: selectedValues($('compare-school-select')).map(String),
        compareMajors: selectedValues($('compare-major-select')).map(String),
        cipLevel: $('cip-level-select')?.value || 'cip4',
        fromYear: $('from-year-select')?.value || '',
        toYear: $('to-year-select')?.value || '',
        horizon: $('horizon-select')?.value || '1yr',
        gender: $('gender-select')?.value || '',
        race: $('race-select')?.value || '',
        laterDegree: $('later-degree-filter')?.value || '',
        noFurther: $('no-further-select')?.value || '',
        currentStudents: $('current-select')?.value || 'true',
        schoolEmployer: $('school-employer-select')?.value || 'false',
      };
    }

    function activeAdvancedControls() {
      return state.appliedAdvanced || readAdvancedControls();
    }

    function initializeAppliedAdvancedControls() {
      if (state.appliedAdvanced) return;
      normalizeAdvancedControls();
      state.appliedAdvanced = readAdvancedControls();
      state.selectionMode = state.appliedAdvanced.selectionMode;
      syncSelectionMode(state.selectionMode);
    }

    function persistAdvancedControls(advanced) {
      storage.setItem('outcomes.selectionMode', advanced.selectionMode);
      storage.setItem('outcomes.compareSchools', JSON.stringify(advanced.compareSchools || []));
      storage.setItem('outcomes.compareMajors', JSON.stringify(advanced.compareMajors || []));
    }

    function applyAdvancedOptions() {
      normalizeAdvancedControls();
      const advanced = readAdvancedControls();
      if (advanced.selectionMode === 'compare') {
        advanced.compareSchools = trimCompareSchools(advanced.compareSchools);
        Array.from($('compare-school-select').options).forEach(opt => {
          opt.selected = advanced.compareSchools.includes(String(opt.value));
        });
        renderCompareSchoolPicker(state.options?.schools || [], new Set(advanced.compareSchools));
      }
      state.appliedAdvanced = advanced;
      state.selectionMode = advanced.selectionMode;
      persistAdvancedControls(advanced);
      syncSelectionMode(advanced.selectionMode);
      if (compareNeedsSelections(advanced)) {
        setAdvancedOpen(true);
        state.data = {
          overview: {},
          school_comparison: [],
          major_comparison: [],
          meta: state.options?.meta || {},
        };
        showContent();
        render();
        setStatus('ok', `${state.options?.meta?.data_version || 'Connected'} | pick comparison items`);
        return;
      }
      setAdvancedOpen(false);
      refresh({ reloadOptions: true, resetDrill: true });
    }

    function getSelectedSchools(advanced = activeAdvancedControls()) {
      const primary = $('school-select').value ? [$('school-select').value] : [];
      if (advanced.selectionMode !== 'compare') return primary;
      const compare = trimCompareSchools(advanced.compareSchools || [], primary[0] || '');
      return [...new Set([...primary, ...compare])].filter(Boolean);
    }

    function trimCompareSchools(values, primary = String($('school-select')?.value || '')) {
      const maxComparisonSchools = Math.max(0, MAX_COMPARE_SCHOOLS - (primary ? 1 : 0));
      return [...new Set((values || []).map(String))]
        .filter(value => value && value !== primary)
        .slice(0, maxComparisonSchools);
    }

    function getSelectedMajors(advanced = activeAdvancedControls()) {
      if (advanced.selectionMode === 'major_compare') return advanced.compareMajors || [];
      return $('major-select').value ? [$('major-select').value] : [];
    }

    function compareNeedsSelections(advanced = activeAdvancedControls()) {
      if (advanced.selectionMode === 'compare') return (advanced.compareSchools || []).length < 1;
      if (advanced.selectionMode === 'major_compare') return (advanced.compareMajors || []).length < 2;
      return false;
    }

    function yearRange(advanced = activeAdvancedControls()) {
      const all = state.options?.grad_years || [];
      const from = Number(advanced.fromYear || all[0]);
      const to = Number(advanced.toYear || all[all.length - 1]);
      return all.filter(year => year >= from && year <= to);
    }

    function activeHorizonLabel(compact = false) {
      const horizon = (state.appliedAdvanced?.horizon || $('horizon-select')?.value || '1yr');
      const labels = {
        '1yr': compact ? '1 yr out' : '1 year after graduation',
        '5yr': compact ? '5 yrs out' : '5 years after graduation',
        '10yr': compact ? '10 yrs out' : '10 years after graduation',
        'early_2025': compact ? '2025 early' : '2025 early earnings',
      };
      return labels[horizon] || horizon;
    }

    function currentFilters(extra = {}) {
      const advanced = activeAdvancedControls();
      const noFurtherValue = advanced.noFurther;
      return {
        schools: getSelectedSchools(advanced),
        degree: $('degree-select').value || 'Bachelors',
        cip_level: advanced.cipLevel || 'cip4',
        majors: getSelectedMajors(advanced),
        grad_years: yearRange(advanced),
        horizon: advanced.horizon || '1yr',
        demographics: {
          gender: advanced.gender || null,
          race_ethnicity: advanced.race || null,
        },
        postgrad: {
          later_degree_type: advanced.laterDegree || null,
          no_further_education: noFurtherValue === '' ? null : noFurtherValue === 'true',
        },
        include_current_students: advanced.currentStudents === 'true',
        include_school_employers: advanced.schoolEmployer === 'true',
        compare_mode: advanced.selectionMode === 'compare' || advanced.selectionMode === 'major_compare',
        compare_dimension: advanced.selectionMode === 'major_compare' ? 'major' : 'school',
        active_tab: advanced.selectionMode === 'compare' || advanced.selectionMode === 'major_compare' ? state.tab : 'all',
        view_mode: advanced.selectionMode === 'compare' || advanced.selectionMode === 'major_compare' ? state.viewMode : 'all',
        selected_employer: state.selectedEmployer,
        selected_employer_role: state.selectedEmployerRole,
        selected_postgrad_degree: state.selectedPostgradDegree,
        selected_postgrad_school: state.selectedPostgradSchool,
        selected_postgrad_program: state.selectedPostgradProgram,
        top_n: maxRequestedTopN(),
        ...extra,
      };
    }

    function scheduleCompareSchoolWarmup(delay = 350) {
      clearTimeout(compareWarmupTimer);
      const primary = String($('school-select')?.value || '');
      const compare = trimCompareSchools(selectedValues($('compare-school-select')), primary);
      const schools = [...new Set([primary, ...compare])].filter(Boolean);
      if (!state.apiUrl || schools.length < 2 || schools.length > MAX_COMPARE_SCHOOLS) return;
      compareWarmupTimer = window.setTimeout(async () => {
        const key = JSON.stringify({ apiUrl: state.apiUrl, schools });
        if (state.lastCompareWarmupKey === key) return;
        try {
          state.lastCompareWarmupKey = key;
          setStatus('', 'Preparing selected schools');
          await apiFetch('/api/warm-cache', currentFilters({
            schools,
            compare_mode: true,
            compare_dimension: 'school',
            active_tab: 'overview',
            view_mode: 'overtime',
          }));
          if (!state.loading) setStatus('ok', 'Selected schools ready');
        } catch (error) {
          state.lastCompareWarmupKey = '';
          if (!state.loading) setStatus('bad', 'School cache prep failed');
        }
      }, delay);
    }

    function option(label, value, selected = false) {
      const opt = document.createElement('option');
      opt.value = value;
      opt.textContent = label;
      opt.selected = selected;
      return opt;
    }

    function populateSelect(select, rows, getLabel, getValue, selectedValuesSet = new Set()) {
      select.innerHTML = '';
      rows.forEach(row => select.appendChild(option(getLabel(row), getValue(row), selectedValuesSet.has(String(getValue(row))))));
    }

    function comparePickerLabel(label, maxLength = 44) {
      return legendLabel(String(label || ''), maxLength);
    }

    function renderComparePicker({
      pickerId,
      selectId,
      rows,
      selectedSet = new Set(),
      getValue,
      getLabel,
      addAttr,
      removeAttr,
      clearAttr,
      selectedTitle = 'Selected',
      emptyText = 'Click items on the left to add them here.',
      baseLabel = '',
      maxSelections = Infinity,
      selectedCountLabel = '',
    }) {
      const picker = $(pickerId);
      if (!picker) return;
      const safeRows = rows || [];
      const selectedRows = safeRows.filter(row => selectedSet.has(String(getValue(row))));
      const availableRows = safeRows.filter(row => !selectedSet.has(String(getValue(row))));
      const count = selectedValues($(selectId)).length;
      const maxReached = Number.isFinite(maxSelections) && count >= maxSelections;
      const baseMarkup = baseLabel
        ? `<span class="compare-bead is-base"><span>Base: ${escapeHtml(comparePickerLabel(baseLabel, 34))}</span></span>`
        : '';
      const selectedMarkup = selectedRows.length
        ? selectedRows.map(row => {
          const value = String(getValue(row));
          const label = getLabel(row);
          return `
            <span class="compare-bead" title="${escapeHtml(label)}">
              <span>${escapeHtml(comparePickerLabel(label, 38))}</span>
              <button type="button" ${removeAttr}="${escapeHtml(value)}" aria-label="Remove ${escapeHtml(label)}">x</button>
            </span>
          `;
        }).join('')
        : `<div class="compare-empty">${escapeHtml(emptyText)}</div>`;
      picker.innerHTML = `
        <div class="compare-picker-head">
          <span>${escapeHtml(selectedCountLabel || `${num(count)} selected`)}</span>
          <button type="button" class="compare-picker-clear" ${clearAttr}>Clear</button>
        </div>
        <div class="compare-picker-body">
          <div class="compare-options">
            ${availableRows.length ? availableRows.map(row => {
              const value = String(getValue(row));
              const label = getLabel(row);
              return `
                <button type="button" class="compare-option" ${addAttr}="${escapeHtml(value)}" title="${escapeHtml(label)}" ${maxReached ? 'disabled' : ''}>
                  <span>${escapeHtml(comparePickerLabel(label, 58))}</span>
                </button>
              `;
            }).join('') : '<div class="compare-empty">Everything available is selected.</div>'}
          </div>
          <div class="compare-selected">
            <div class="compare-selected-title">${escapeHtml(selectedTitle)}</div>
            <div class="compare-beads">${baseMarkup}${selectedMarkup}</div>
          </div>
        </div>
      `;
    }

    function renderCompareSchoolPicker(rows, selectedSet = new Set()) {
      const currentSchool = state.options?.schools?.find(s => String(s.unitid) === String($('school-select')?.value));
      const currentUnitid = String(currentSchool?.unitid || $('school-select')?.value || '');
      const selectedValuesSet = new Set(trimCompareSchools([...selectedSet], currentUnitid));
      const totalSelected = (currentUnitid ? 1 : 0) + selectedValuesSet.size;
      renderComparePicker({
        pickerId: 'compare-school-picker',
        selectId: 'compare-school-select',
        rows: (rows || []).filter(row => String(row.unitid) !== currentUnitid),
        selectedSet: selectedValuesSet,
        getValue: row => row.unitid,
        getLabel: row => row.name,
        addAttr: 'data-add-compare-school',
        removeAttr: 'data-remove-compare-school',
        clearAttr: 'data-clear-compare-schools',
        selectedTitle: 'Comparison set',
        emptyText: 'Click schools to add them to the comparison.',
        baseLabel: currentSchool?.name || '',
        maxSelections: Math.max(0, MAX_COMPARE_SCHOOLS - (currentUnitid ? 1 : 0)),
        selectedCountLabel: `${num(totalSelected)} of ${MAX_COMPARE_SCHOOLS} schools selected`,
      });
    }

    function renderCompareMajorPicker(rows, selectedSet = new Set()) {
      renderComparePicker({
        pickerId: 'compare-major-picker',
        selectId: 'compare-major-select',
        rows,
        selectedSet,
        getValue: row => row.code,
        getLabel: row => `${row.title} (${row.code})`,
        addAttr: 'data-add-compare-major',
        removeAttr: 'data-remove-compare-major',
        clearAttr: 'data-clear-compare-majors',
        selectedTitle: 'Selected majors',
        emptyText: 'Click majors to build the comparison set.',
      });
    }

    function populateStaticControls(options) {
      const defaultSchool = options.schools.find(s => /Columbia University in the City of New York/i.test(s.name)) || options.schools[0];
      const existingPrimary = $('school-select').value || defaultSchool?.unitid || '';
      let savedCompare = [];
      try {
        savedCompare = JSON.parse(storage.getItem('outcomes.compareSchools') || '[]');
      } catch {
        savedCompare = [];
      }
      const currentCompare = selectedValues($('compare-school-select')).map(String);
      const existingCompare = new Set(trimCompareSchools(currentCompare.length ? currentCompare : savedCompare, String(existingPrimary)));
      populateSelect($('school-select'), options.schools, s => s.name, s => s.unitid, new Set([String(existingPrimary)]));
      populateSelect($('compare-school-select'), options.schools, s => s.name, s => s.unitid, existingCompare);
      renderCompareSchoolPicker(options.schools || [], existingCompare);

      const existingDegree = $('degree-select').value || 'Bachelors';
      populateSelect($('degree-select'), options.degrees, d => d.label, d => d.degree, new Set([existingDegree]));
      if (!$('degree-select').value) $('degree-select').value = 'Bachelors';

      populateSelect($('horizon-select'), options.horizons, h => h.label, h => h.value, new Set([$('horizon-select').value || '1yr']));
      if (!$('horizon-select').value) $('horizon-select').value = '1yr';
      syncHorizonToggle();

      const years = options.grad_years || [];
      populateSelect($('from-year-select'), years, y => y, y => y, new Set([String($('from-year-select').value || years[0] || '')]));
      populateSelect($('to-year-select'), years, y => y, y => y, new Set([String($('to-year-select').value || years[years.length - 1] || '')]));
      if (!$('from-year-select').value && years.length) $('from-year-select').value = years[0];
      if (!$('to-year-select').value && years.length) $('to-year-select').value = years[years.length - 1];

      const genders = options.demographics?.gender || [];
      const races = options.demographics?.race_ethnicity || [];
      const laterDegrees = options.later_degrees || [];
      const oldGender = $('gender-select').value;
      const oldRace = $('race-select').value;
      const oldLater = $('later-degree-filter').value;
      $('gender-select').innerHTML = '<option value="">All</option>';
      genders.forEach(value => $('gender-select').appendChild(option(value, value, value === oldGender)));
      $('race-select').innerHTML = '<option value="">All</option>';
      races.forEach(value => $('race-select').appendChild(option(value, value, value === oldRace)));
      $('later-degree-filter').innerHTML = '<option value="">All</option>';
      laterDegrees.forEach(value => $('later-degree-filter').appendChild(option(value, value, value === oldLater)));
    }

    function populateMajorOptions(options, preserve = true) {
      const previous = preserve ? $('major-select').value : '';
      const validCodes = new Set((options.major_options || []).map(row => String(row.code)));
      const keepPrevious = previous && validCodes.has(String(previous));
      let savedCompareMajors = [];
      try {
        savedCompareMajors = JSON.parse(storage.getItem('outcomes.compareMajors') || '[]');
      } catch {
        savedCompareMajors = [];
      }
      const currentCompareMajors = selectedValues($('compare-major-select')).map(String);
      const compareMajorValues = (currentCompareMajors.length ? currentCompareMajors : savedCompareMajors)
        .map(String)
        .filter(code => validCodes.has(code));
      const existingCompareMajors = new Set(compareMajorValues);
      $('major-select').innerHTML = '<option value="">All majors</option>';
      (options.major_options || []).forEach(row => {
        const label = `${row.title} (${row.code})`;
        $('major-select').appendChild(option(label, row.code, keepPrevious && previous === row.code));
      });
      populateSelect($('compare-major-select'), options.major_options || [], row => `${row.title} (${row.code})`, row => row.code, existingCompareMajors);
      renderCompareMajorPicker(options.major_options || [], existingCompareMajors);
    }

    async function loadOptions(preserveMajor = true) {
      const filters = currentFilters({ majors: [] });
      const options = await apiFetch('/api/options', filters);
      state.options = options;
      populateStaticControls(options);
      populateMajorOptions(options, preserveMajor);
      initializeAppliedAdvancedControls();
      if (state.selectionMode === 'compare' || state.selectionMode === 'major_compare') {
        setAdvancedOpen(compareNeedsSelections());
      }
      setStatus('ok', `${options.meta?.data_version || 'Connected'} | positive-weight cells visible`);
    }

    async function connect({ fromAuth = false } = {}) {
      if (fromAuth) syncControlsFromAuthFields();
      state.apiUrl = normalizeApiUrl($('api-url').value || defaultApiUrl());
      state.password = $('api-password').value || '';
      if (!state.apiUrl) {
        setMessage('Enter the protected API URL first.', true);
        showAuthModal('Enter the protected API URL first.', true);
        return;
      }
      storage.setItem('outcomes.apiUrl', state.apiUrl);
      storage.setItem('outcomes.apiPassword', state.password);
      $('api-url').value = state.apiUrl;
      $('auth-api-url').value = state.apiUrl;
      $('auth-api-password').value = state.password;
      setStatus('', 'Connecting');
      setAuthMessage('Connecting...', false);
      setMessage('Connecting to the protected API...');
      try {
        await loadOptions(true);
        document.querySelectorAll('.api-connection').forEach(node => node.classList.add('connected'));
        hideAuthModal();
        await refresh();
      } catch (error) {
        setStatus('bad', 'Connection failed');
        const message = escapeHtml(error.message || 'Could not connect to the protected API.');
        setMessage(message, true);
        showAuthModal(message, true);
      }
    }

    async function refresh({ reloadOptions = false, resetDrill = false } = {}) {
      if (!state.apiUrl) {
        setMessage('Enter the protected API URL and password, then connect.');
        return;
      }
      if (state.loading) {
        state.pendingRefresh = {
          reloadOptions: Boolean(state.pendingRefresh?.reloadOptions || reloadOptions),
          resetDrill: Boolean(state.pendingRefresh?.resetDrill || resetDrill),
        };
        return;
      }
      state.loading = true;
      document.body.classList.add('loading');
      $('refresh-state')?.classList.add('is-visible');
      setStatus('', 'Refreshing');
      try {
        if (resetDrill) {
          state.selectedEmployer = null;
          state.selectedEmployerRole = null;
          state.selectedPostgradDegree = null;
          state.selectedPostgradSchool = null;
          state.selectedPostgradProgram = null;
          state.roleTreePath = [];
          state.industryTreePath = [];
        }
        if (reloadOptions || !state.options) await loadOptions(true);
        if (compareNeedsSelections()) {
          state.data = {
            overview: {},
            school_comparison: [],
            major_comparison: [],
            meta: state.options?.meta || {},
          };
          showContent();
          render();
          setStatus('ok', `${state.options?.meta?.data_version || 'Connected'} | pick comparison items`);
          return;
        }
        state.data = await apiFetch('/api/dashboard', currentFilters());
        showContent();
        render();
        setStatus('ok', `${state.data.meta?.data_version || 'Connected'} | loaded ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' })}`);
      } catch (error) {
        setStatus('bad', 'Connection failed');
        setMessage(`<strong>Could not load data.</strong><br>${escapeHtml(error.message)}`, true);
      } finally {
        state.loading = false;
        document.body.classList.remove('loading');
        $('refresh-state')?.classList.remove('is-visible');
        if (state.pendingRefresh) {
          const pending = state.pendingRefresh;
          state.pendingRefresh = null;
          refresh(pending);
        }
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
    }

    function slug(value) {
      return String(value || '')
        .toLowerCase()
        .replace(/&/g, 'and')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 72) || 'chart';
    }

    function markChartExportable(chartId) {
      if (!chartId) return;
      const button = Array.from(document.querySelectorAll('[data-download-chart]'))
        .find(node => node.dataset.downloadChart === chartId);
      if (button) button.hidden = false;
    }

    function chartExportTitle(chartId) {
      const cardEl = $(chartId)?.closest('.card');
      return cardEl?.querySelector('h3')?.textContent || chartId;
    }

    function chartExportFilename(chartId) {
      const school = $('school-select')?.selectedOptions?.[0]?.textContent || 'outcomes';
      const parts = [
        'college-outcomes',
        school,
        state.tab,
        state.viewMode,
        chartExportTitle(chartId),
      ].filter(Boolean).map(slug);
      return `${parts.join('-')}.png`;
    }

    async function dataUrlToBlob(dataUrl) {
      const response = await fetch(dataUrl);
      return response.blob();
    }

    function showExportTray(item) {
      if (item) {
        exportLinks.unshift(item);
        while (exportLinks.length > 12) {
          const stale = exportLinks.pop();
          if (stale?.url) URL.revokeObjectURL(stale.url);
        }
      }
      const tray = $('export-tray');
      if (!tray) return;
      if (!exportLinks.length) {
        tray.hidden = true;
        return;
      }
      tray.hidden = false;
      tray.innerHTML = `
        <div class="export-tray-head">
          <h3>PNG export ready</h3>
          <button type="button" class="export-tray-close" aria-label="Close export links">x</button>
        </div>
        <p>If your browser blocked the automatic save, use these direct file links.</p>
        <div class="export-link-list">
          ${exportLinks.map(link => `
            <div class="export-link-row">
              <span title="${escapeHtml(link.title)}">${escapeHtml(link.title)}</span>
              <a href="${link.url}" download="${escapeHtml(link.filename)}">Save</a>
              <a href="${link.url}" target="_blank" rel="noopener">Open</a>
            </div>
          `).join('')}
        </div>
      `;
    }

    function downloadBlob(blob, filename, title) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      showExportTray({ url, filename, title });

    async function downloadChart(chartId) {
      const plot = $(chartId);
      if (!plot || !plot._fullLayout) {
        setStatus('bad', 'No chart available to export');
        return;
      }
      const button = Array.from(document.querySelectorAll('[data-download-chart]'))
        .find(node => node.dataset.downloadChart === chartId);
      const title = chartExportTitle(chartId);
      const filename = chartExportFilename(chartId);
      try {
        if (button) {
          button.disabled = true;
          button.textContent = 'Preparing';
        }
        const rect = plot.getBoundingClientRect();
        const dataUrl = await Plotly.toImage(plot, {
          format: 'png',
          width: Math.max(900, Math.round(rect.width || 900)),
          height: Math.max(520, Math.round(rect.height || 520)),
          scale: 2,
        });
        const blob = await dataUrlToBlob(dataUrl);
        downloadBlob(blob, filename, title);
        setStatus('ok', `PNG ready: ${title}`);
      } catch (error) {
        console.error('PNG export failed', error);
        setStatus('bad', `PNG export failed for ${title}`);
      } finally {
        if (button) {
          button.disabled = false;
          button.textContent = 'PNG';
        }
      }
    }

    async function downloadVisibleCharts() {
      const chartIds = Array.from(document.querySelectorAll('[data-download-chart]:not([hidden])'))
        .map(button => button.dataset.downloadChart)
        .filter((value, index, list) => value && list.indexOf(value) === index && $(value)?._fullLayout);
      if (!chartIds.length) {
        setStatus('bad', 'No visible charts to export');
        return;
      }
      setStatus('ok', `Preparing ${chartIds.length} PNGs...`);
      for (const chartId of chartIds) {
        await downloadChart(chartId);
        await new Promise(resolve => setTimeout(resolve, 180));
      }
      setStatus('ok', `Prepared ${chartIds.length} PNGs`);
    }

    function chartIdFromTopControl(id) {

    function validTopN(value) {
      const numeric = Number(value);
      return TOP_N_OPTIONS.includes(numeric) ? numeric : null;
    }

    function topNFor(chartId) {
      return validTopN(state.topNByChart?.[chartId]) || selectedTopN();

    function maxRequestedTopN() {
      const values = Object.values(state.topNByChart || {}).map(validTopN).filter(Boolean);
      return Math.max(selectedTopN(), ...values);

    function loadStoredTopNByChart() {
      try {

      } catch {

    function topNControl(id) {
      const chartId = chartIdFromTopControl(id);
      const current = topNFor(chartId);
      const options = TOP_N_OPTIONS.map(value => `<option value="${value}" ${value === current ? 'selected' : ''}>${value}</option>`).join('');

    function treemapCard(title, id, subtitle, path, kind, span = 6) {

    function isNoiseLabel(value) {
      if (value === null || value === undefined) return true;
      const text = String(value).trim().toLowerCase();
      return !text || text === 'unknown' || text === 'other' || text === 'empty';
    }

    function sumRows(rows, field) {
      return (rows || []).reduce((total, row) => total + Number(row[field] || 0), 0);
    }

    function samePath(a = [], b = []) {
      return a.length === b.length && a.every((value, idx) => String(value) === String(b[idx]));
    }

    function hierarchyTrail(path) {
      return (path || []).length ? path.join(' > ') : 'Top level';

      if (kind === 'roleTree') state.roleTreePath = state.roleTreePath.slice(0, -1);

    function hexToRgb(hex) {
      const normalized = String(hex || '').replace('#', '').trim();
      if (normalized.length !== 6) return [185, 196, 211];
      return [
        parseInt(normalized.slice(0, 2), 16),
        parseInt(normalized.slice(2, 4), 16),
        parseInt(normalized.slice(4, 6), 16),
      ];
    }

    function rgbToHex(rgb) {
      return `#${rgb.map(value => Math.max(0, Math.min(255, Math.round(value))).toString(16).padStart(2, '0')).join('')}`;
    }

    function mixHex(a, b, t) {
      const rgbA = hexToRgb(a);
      const rgbB = hexToRgb(b);
      return rgbToHex(rgbA.map((value, idx) => value + ((rgbB[idx] - value) * t)));
    }

    function payColor(avgPay, domain) {
      if (!Array.isArray(domain) || domain.length !== 2 || !Number.isFinite(avgPay)) return '#B9C4D3';
      const [minPay, maxPay] = domain;
      if (!Number.isFinite(minPay) || !Number.isFinite(maxPay) || maxPay <= minPay) return '#48AFF4';
      const scaled = Math.max(0, Math.min(1, (avgPay - minPay) / (maxPay - minPay)));
      if (scaled <= 0.5) return mixHex('#D9ECFB', '#48AFF4', scaled / 0.5);
      return mixHex('#48AFF4', '#2D426A', (scaled - 0.5) / 0.5);
    }

    function updateTreemapLegend(id, domain) {
      const wrap = $(`${id}-legend`);
      const minEl = $(`${id}-legend-min`);
      const maxEl = $(`${id}-legend-max`);
      const captionEl = $(`${id}-legend-caption`);
      if (!wrap || !minEl || !maxEl || !captionEl) return;
      if (!Array.isArray(domain) || domain.length !== 2 || !Number.isFinite(domain[0]) || !Number.isFinite(domain[1]) || domain[1] <= domain[0]) {
        wrap.classList.add('is-hidden');
        return;
      }
      wrap.classList.remove('is-hidden');
      minEl.textContent = money(domain[0]);
      maxEl.textContent = money(domain[1]);
      captionEl.textContent = 'Color encodes mean pay for the visible tiles.';
    }

    function treemapPayDomain(nodes) {
      const salaryValues = (nodes || [])
        .map(row => row.median_salary)
        .filter(value => value !== null && value !== undefined && Number.isFinite(Number(value)))
        .map(Number);
      if (salaryValues.length < 2) return null;
      const cmin = Math.min(...salaryValues);
      const cmax = Math.max(...salaryValues);
      return cmax > cmin ? [cmin, cmax] : null;
    }

    function filterRowsByHierarchyPath(rows, levels, path) {
      return (rows || []).filter(row => (path || []).every((value, idx) => String(row[levels[idx]] || '') === String(value)));
    }

    function visibleHierarchyRows(rows, levels, path, chartId = null) {
      const filtered = filterRowsByHierarchyPath(rows, levels, path);
      const levelField = levels[(path || []).length];
      const nextField = levels[(path || []).length + 1];
      const groups = new Map();
      filtered.forEach(row => {
        const label = row[levelField];
        if (isNoiseLabel(label)) return;
        if (!groups.has(label)) {
          groups.set(label, { label, value: 0, salaryWeight: 0, salarySum: 0, drillable: false });
        }
        const group = groups.get(label);
        group.value += Number(row.n || 0);
        group.salaryWeight += Number(row.salary_weight || 0);
        group.salarySum += Number(row.salary_sum || 0);
        if (nextField && !isNoiseLabel(row[nextField]) && String(row[nextField]) !== String(label)) {
          group.drillable = true;
        }
      });
      const limit = topNFor(chartId);
      return [...groups.values()]
        .map(row => ({
          ...row,
          median_salary: row.salaryWeight > 0 ? row.salarySum / row.salaryWeight : null,
        }))
        .sort((a, b) => b.value - a.value)
        .slice(0, limit);
    }

    function ensureVisibleHierarchyPath(rows, levels, path, chartId = null) {
      const next = [...(path || [])];
      while (next.length && !visibleHierarchyRows(rows, levels, next, chartId).length) next.pop();
      return next;
    }

    function renderRoles() {
      if (state.viewMode === 'snapshot') {
        const rows = state.data.roles?.hierarchy || [];
        const roleLevels = ['role_k50_v3', 'role_k150_v3'];
        const industryLevels = ['industry_k200', 'industry_k400'];
        let changed = true;
        while (changed) {
          changed = false;
          const roleContext = filterRowsByHierarchyPath(rows, industryLevels, state.industryTreePath);
          const nextRolePath = ensureVisibleHierarchyPath(roleContext, roleLevels, state.roleTreePath, 'role-tree');
          if (!samePath(nextRolePath, state.roleTreePath)) {
            state.roleTreePath = nextRolePath;
            changed = true;
          }
          const industryContext = filterRowsByHierarchyPath(rows, roleLevels, state.roleTreePath);
          const nextIndustryPath = ensureVisibleHierarchyPath(industryContext, industryLevels, state.industryTreePath, 'industry-tree');
          if (!samePath(nextIndustryPath, state.industryTreePath)) {
            state.industryTreePath = nextIndustryPath;
            changed = true;
          }
        }
        const roleContextRows = filterRowsByHierarchyPath(rows, industryLevels, state.industryTreePath);
        const industryContextRows = filterRowsByHierarchyPath(rows, roleLevels, state.roleTreePath);
        const roleNodes = visibleHierarchyRows(roleContextRows, roleLevels, state.roleTreePath, 'role-tree');
        const industryNodes = visibleHierarchyRows(industryContextRows, industryLevels, state.industryTreePath, 'industry-tree');
        const sharedPayDomain = treemapPayDomain([...roleNodes, ...industryNodes]);
        const roleSubtitle = state.industryTreePath.length
          ? `${hierarchyTrail(state.roleTreePath)}. Filtered by industry: ${hierarchyTrail(state.industryTreePath)}`
          : `${hierarchyTrail(state.roleTreePath)}. Click a role to zoom into K150 roles.`;
        const industrySubtitle = state.roleTreePath.length
          ? `${hierarchyTrail(state.industryTreePath)}. Filtered by role: ${hierarchyTrail(state.roleTreePath)}`
          : `${hierarchyTrail(state.industryTreePath)}. Click an industry to zoom.`;
        $('content').innerHTML = [
          treemapCard('Role Treemap', 'role-tree', roleSubtitle, state.roleTreePath, 'roleTree', 6),
          treemapCard('Industry Treemap', 'industry-tree', industrySubtitle, state.industryTreePath, 'industryTree', 6),
        ].join('');
        drawHierarchyTreemap('role-tree', roleContextRows, roleLevels, state.roleTreePath, node => {
          if (!node.drillable) return;
          state.roleTreePath = [...state.roleTreePath, node.label];
          renderRoles();
        }, { payDomain: sharedPayDomain });
        drawHierarchyTreemap('industry-tree', industryContextRows, industryLevels, state.industryTreePath, node => {
          if (!node.drillable) return;
          state.industryTreePath = [...state.industryTreePath, node.label];
          renderRoles();
        }, { payDomain: sharedPayDomain });

          card('Roles Over Time', 'role-trend', 6, true, { topControl: true }),
          card('Industries Over Time', 'industry-trend', 6, true, { topControl: true }),

    function legendLabel(name, maxLength = 26) {
      const cleaned = String(name || '')
        .replace(', General', '')
        .replace('Political Science and Government', 'Political Science & Gov.')
        .replace('English Language and Literature', 'English Lang. & Lit.')
        .replace('Business Administration, Management and Operations', 'Business Admin.')
        .replace('Computer and Information Sciences', 'Computer & Info Sci.')
        .replace('Communication, Journalism, and Related Programs', 'Communications')
        .replace('Mathematics and Statistics', 'Math & Statistics')
        .replace('Economics, General', 'Economics')
        .replace(/\s+and\s+/g, ' & ')
        .replace(/\s+/g, ' ')
        .trim();
      return cleaned.length > maxLength ? `${cleaned.slice(0, maxLength - 3).trim()}...` : cleaned;
    }

    function legendDotTrace(name, color, legendgroup = null) {
      return {
        type: 'scatter',
        mode: 'markers',
        name: legendLabel(name),
        legendgroup,
        x: [null],
        y: [null],
        marker: { color, size: 9 },
        hoverinfo: 'skip',
        showlegend: true,
      };
    }

    function bindLegendGroupToggles(plot) {
      plot.on('plotly_legendclick', event => {
        const clicked = plot.data?.[event.curveNumber];
        const group = clicked?.legendgroup;
        if (!group) return true;
        const indices = plot.data
          .map((trace, idx) => trace.legendgroup === group ? idx : -1)
          .filter(idx => idx >= 0);
        const visible = indices.some(idx => plot.data[idx].visible !== 'legendonly');
        Plotly.restyle(plot, { visible: visible ? 'legendonly' : true }, indices);
        return false;
      });
    }

    function topSeriesLabels(rows, labelKey, limit) {
      return [...new Set((rows || []).map(row => row[labelKey]).filter(Boolean))]
        .sort((a, b) => {
          const totalA = rows.filter(row => row[labelKey] === a).reduce((sum, row) => sum + Number(row.n || row.alumni || row.salary_weight || 0), 0);
          const totalB = rows.filter(row => row[labelKey] === b).reduce((sum, row) => sum + Number(row.n || row.alumni || row.salary_weight || 0), 0);
          return totalB - totalA;
        })
        .slice(0, limit);
    }

    function drawTrendLines(id, rows, labelKey, valueKey, options = {}) {
      const cleanRows = (rows || []).filter(row => row.grad_year !== null && row.grad_year !== undefined && row[valueKey] !== null && row[valueKey] !== undefined);
      if (!cleanRows.length) return noData(id);
      const labels = options.fixedLabel
        ? [options.fixedLabel]
        : (options.limitSeries === false ? [...new Set(cleanRows.map(row => row[labelKey]).filter(Boolean))] : topSeriesLabels(cleanRows, labelKey, topNFor(id)));

    function drawMajorTrend(id) {
      const trend = state.data.major_trend || {};
      const rows = [...(trend.series || []), ...(trend.current_series || [])];
      if (!rows.length) return noData(id);
      const codes = [...new Set(rows.map(r => r.code))]
        .sort((a, b) => {
          const totalA = rows.filter(row => row.code === a).reduce((sum, row) => sum + Number(row.n || 0), 0);
          const totalB = rows.filter(row => row.code === b).reduce((sum, row) => sum + Number(row.n || 0), 0);
          return totalB - totalA;
        })
        .slice(0, topNFor(id));
      const traces = codes.map((code, i) => {
        const historic = (trend.series || []).filter(r => r.code === code);
        const current = (trend.current_series || []).filter(r => r.code === code);
        const currentBridge = historic.length && current.length ? [historic[historic.length - 1], ...current] : current;
        const title = (historic[0] || current[0] || {}).title || code;
        const legendgroup = `${id}-major-${i}`;
        return [
          {
            type: 'scatter',
            mode: 'lines+markers',
            name: title,
            legendgroup,
            x: historic.map(r => r.grad_year),
            y: historic.map(r => r.share_pct),
            line: { color: COLORS[i % COLORS.length], width: 3 },
            marker: { size: 7 },
            showlegend: false,
            customdata: historic.map(r => [r.n, r.total_n]),
            hovertemplate: `${title}<br>Class of %{x}<br>%{y:.1f}%<extra></extra>`,
          },
          current.length ? {
            type: 'scatter',
            mode: 'lines+markers',
            name: `${title} current`,
            legendgroup,
            x: currentBridge.map(r => r.grad_year),
            y: currentBridge.map(r => r.share_pct),
            line: { color: COLORS[i % COLORS.length], width: 3, dash: 'dot' },
            marker: {
              size: currentBridge.map((_, idx) => historic.length && idx === 0 ? 0 : 9),
              symbol: 'diamond',
            },
            customdata: currentBridge.map(r => [r.n, r.total_n]),
            showlegend: false,
            hovertemplate: `${title}<br>Class of %{x}<br>%{y:.1f}%<extra></extra>`,
          } : null
        ].filter(Boolean);
      }).flat();
      const legendTraces = codes.map((code, i) => {
        const row = rows.find(r => r.code === code) || {};
        return legendDotTrace(row.title || code, COLORS[i % COLORS.length], `${id}-major-${i}`);
      });
      const shapes = trend.current_series?.length ? [{
        type: 'line', x0: 2025.5, x1: 2025.5, y0: 0, y1: 1, xref: 'x', yref: 'paper',
        line: { color: '#8091a7', dash: 'dot', width: 2 },
      }] : [];
      const annotations = trend.current_series?.length ? [{
        x: 2026.1, y: 1.04, xref: 'x', yref: 'paper', text: 'Current students', showarrow: false,
        font: { color: '#40556e', size: 14 },
      }] : [];
      Plotly.newPlot(id, [...traces, ...legendTraces], {
        ...layoutBase,
        margin: { ...layoutBase.margin, r: 90 },
        yaxis: { title: trend.current_series?.length ? 'Share of total class %' : 'Share of total grads %', ticksuffix: '%', automargin: true },
        xaxis: { title: 'Graduation year', automargin: true, dtick: trend.current_series?.length ? 2 : 5 },
        legend: { orientation: 'h', y: 1.16, itemwidth: 30 },
        shapes,
        annotations,
      }, plotConfig).then(plot => bindLegendGroupToggles(plot));
    }

        labelTotals.set(row.label, (labelTotals.get(row.label) || 0) + Number(row.n || 0));

      const labels = [...labelTotals.entries()]
        .sort((a, b) => b[1] - a[1])
        .slice(0, topNFor(id))
        .map(([label]) => label);
      if (!labels.length) return noData(id);
      const lookup = new Map(cleanRows.map(row => [`${row.code}||${row.label}`, row]));

    function medianNumber(values) {
      const clean = values.map(Number).filter(Number.isFinite).sort((a, b) => a - b);
      if (!clean.length) return null;
      const mid = Math.floor(clean.length / 2);
      return clean.length % 2 ? clean[mid] : (clean[mid - 1] + clean[mid]) / 2;
    }

    function salaryBinSpec(rows) {
      const clean = (rows || [])
        .map(row => ({
          start: Number(row.bin_start),
          end: Number(row.bin_end),
        }))
        .filter(row => Number.isFinite(row.start) && Number.isFinite(row.end) && row.end > row.start)
        .sort((a, b) => a.start - b.start);
      if (!clean.length) return null;
      const widths = clean.map(row => row.end - row.start).filter(width => width > 0);
      const startGaps = clean.slice(1).map((row, i) => row.start - clean[i].start).filter(width => width > 0);
      const width = medianNumber(widths) || medianNumber(startGaps) || 25000;
      const start = Math.min(...clean.map(row => row.start));
      const end = Math.max(...clean.map(row => row.end));
      return { start, end, width };
    }

    function smoothDistribution(values, radius = 4, sigma = 2.1) {
      const clean = values.map(value => Math.max(0, Number(value) || 0));
      const kernel = [];
      for (let offset = -radius; offset <= radius; offset += 1) {
        kernel.push(Math.exp(-(offset * offset) / (2 * sigma * sigma)));
      }
      const kernelTotal = kernel.reduce((sum, value) => sum + value, 0) || 1;
      const smoothed = clean.map((_, index) => {
        let total = 0;
        for (let offset = -radius; offset <= radius; offset += 1) {
          const sourceIndex = index + offset;
          if (sourceIndex >= 0 && sourceIndex < clean.length) {
            total += clean[sourceIndex] * kernel[offset + radius];
          }
        }
        return total / kernelTotal;
      });
      const rawTotal = clean.reduce((sum, value) => sum + value, 0);
      const smoothTotal = smoothed.reduce((sum, value) => sum + value, 0);
      const scale = rawTotal > 0 && smoothTotal > 0 ? rawTotal / smoothTotal : 1;
      return smoothed.map(value => value * scale);
    }

    function salaryDistributionPoints(rows, valueKey, spec = null) {
      const binSpec = spec || salaryBinSpec(rows);
      if (!binSpec) return [];
      const count = Math.max(1, Math.min(80, Math.ceil((binSpec.end - binSpec.start) / binSpec.width)));
      const bins = Array.from({ length: count }, (_, index) => {
        const start = binSpec.start + index * binSpec.width;
        const end = index === count - 1 ? binSpec.end : start + binSpec.width;
        return { start, end, x: (start + end) / 2, rawY: 0, rawN: 0 };
      });
      (rows || []).forEach(row => {
        const start = Number(row.bin_start);
        const end = Number(row.bin_end);
        if (!Number.isFinite(start) || !Number.isFinite(end) || !Number.isFinite(binSpec.width) || binSpec.width <= 0) return;
        const index = Math.max(0, Math.min(count - 1, Math.round((start - binSpec.start) / binSpec.width)));
        bins[index].rawY += Number(row[valueKey] || 0);
        bins[index].rawN += Number(row.n || 0);
      });
      const smoothed = smoothDistribution(bins.map(row => row.rawY));
      return bins.map((row, index) => ({ ...row, y: smoothed[index] || 0 }));
    }

    function salaryDistributionRange(points) {
      const starts = points.map(row => Number(row.start)).filter(Number.isFinite);
      const ends = points.map(row => Number(row.end)).filter(Number.isFinite);
      if (!starts.length || !ends.length) return undefined;
      const min = Math.min(...starts);
      const max = Math.max(...ends);
      if (!Number.isFinite(min) || !Number.isFinite(max)) return undefined;
      if (max <= min) return [Math.max(0, min - 1000), max + 1000];
      return [min, max];
    }
